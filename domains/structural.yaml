  de: Tragwerksplanung
  fr: Ingénierie structurelle
  it: Ingegneria strutturale
  en: Structural engineering
definition:
  de: Liefergegenstände der Tragwerksplanung. Das Fachmodell beschreibt das tragende Bauwerk — Fundamente, Stützen, Träger, Decken, Treppen und Rampen — aus Sicht der Tragwerksplanerin oder des Tragwerksplaners.
  fr: Livrables de l'ingénierie structurelle. La maquette décrit l'ouvrage porteur — fondations, poteaux, poutres, dalles, escaliers et rampes — du point de vue de l'ingénieur structure.
  it: Consegne dell'ingegneria strutturale. Il modello descrive l'opera portante — fondazioni, colonne, travi, solette, scale e rampe — dal punto di vista dell'ingegnere strutturista.
  en: Deliverables from structural engineering. The model describes the load-bearing built asset — foundations, columns, beams, slabs, stairs, and ramps — from the structural engineer's point of view.
