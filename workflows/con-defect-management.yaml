comment: Construction-phase workflow, typically SIA phases 51–53. Reuses the physical A4 room labels from CON-ROOM-LABEL. Name is the stable technical room number and LongName is the room use; the QR target
  and defect records remain in the agreed defect-management system rather than in IFC.
