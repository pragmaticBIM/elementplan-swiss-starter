comment: 'Draft ID COM-STAKEHOLDER-DIALOG kept as public code; parent is QAS (risk / quality for client and project management). Uses DES-PARCELS and ARC-UMG-NEIGHBOR (Umgebungsbauten in UMG) to identify
  and prioritise affected neighbours; project massing via SPACE-GROSS in GVM for shadow / sight-line argumentation; may also draw on QAS-URBAN-AR. Neighbour volumes stay gross (footprint × height) – same
  volume/height/location rule as QAS-URBAN-AR. Deliverables are analysis, minutes, and argumentarium. Typical containers: ARC-GEB, UMG, GVM, BGD.'
