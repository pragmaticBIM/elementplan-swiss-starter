comment: Planning workflow before concrete placement. Embed requirements may originate from specialist designers or contractors. Cast-in channels and other components cast into the concrete remain the architect's
  responsibility and are in scope even when they are not labelled as embeds. The approved geometry is coordinated against formwork and reinforcement and incorporated into the structural formwork and reinforcement
  model. A dedicated IFC element definition for embeds is still required.
