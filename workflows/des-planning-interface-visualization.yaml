comment: 'Custom property PlanningInterface in ePset_Cost (same pset as CostInterface and AwardInterface). Allowed values: three-digit BKP honoraria for the design discipline (091–096 and chapter codes
  191–196, 291–296, …). Contractor packages stay on AwardInterface. Typical phases 32–41. Visualization to catch forgotten parts at design-discipline interfaces.'
