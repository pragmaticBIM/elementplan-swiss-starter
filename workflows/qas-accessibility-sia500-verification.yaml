comment: SIA 500 proof uses rectangular wheelchair clearances rather than the circular turning-radius logic common in German DIN workflows. HandicapAccessible on spaces marks the accessible room sequence
  for plan colouring. Thresholds, handrails, control heights, floor surfaces, and signage remain manual plan and specification checks.
