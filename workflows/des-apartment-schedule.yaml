comment: Use one gross-volume space per apartment. In later phases, assign interior spaces to apartments by geometric containment or intersection and report missing or ambiguous assignments. IfcZone can
  represent the apartment grouping, but is optional because authoring and viewer support are often difficult for planning teams.
