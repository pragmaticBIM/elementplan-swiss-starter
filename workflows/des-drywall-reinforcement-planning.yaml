comment: Tender preparation and construction planning, typically SIA phases 41 and 51. Model the required reinforcement extent, not the contractor's detailed board, rail, or stud solution. Reinforcement
  zones may be generated from wall-mounted furniture and fixtures using project-specific clearance and load rules. Keep a stable relationship to both the triggering object and the host wall; the responsible
  contractor confirms the final construction and fixing capacity.
