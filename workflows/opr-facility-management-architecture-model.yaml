comment: The organisation must define the authoritative overall IFC model and the controlled extraction, replacement, validation, and archiving process. Extract complete elements by spatial selection; do
  not create clipped element fragments at the perimeter boundary. Preserve the shared spatial reference and stable identifiers for unchanged elements. Apply the same process to architectural and MEP (HLKS)
  models. If models stay separate, agree a viewer strategy that shows the current overall state.
