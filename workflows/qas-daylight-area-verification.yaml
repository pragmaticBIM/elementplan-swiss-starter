comment: Classic IFC postprocessing workflow. For each exterior window, derive ePset_Daylight.DaylightSpaceReference from the Name of the geometrically adjacent interior space; use the nearest interior-space
  volume only when no adjacency can be resolved. Calculate ePset_Daylight.GlazingArea as the projected net area of transparent glazing, excluding frames and opaque infill. Report missing or ambiguous assignments
  instead of guessing. For each space, evaluate sum(GlazingArea) / Qto_SpaceBaseQuantities.NetFloorArea. The threshold is cantonal or project-specific configuration and is not fixed in the catalogue. Interior
  windows and borrowed-light chains are out of scope.
