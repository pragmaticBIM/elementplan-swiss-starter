id: pragmaticbim:workflow/des-building-physics-concept
code: DES-PHYSICS
sort_order: 64
name:
  de: Bauphysik-Anforderungsmodell erstellen
  fr: Établir le modèle d'exigences de physique du bâtiment
  it: Elaborare il modello dei requisiti di fisica della costruzione
  en: Create the building physics requirements model
description:
  de: 'Das freigegebene Bauphysikkonzept in ein räumlich zugeordnetes Anforderungsmodell übersetzen, damit Schall- und Wärmeschutz im Architekturmodell eindeutig und laufend geprüft werden können.


    **Ausgangslage**

    - Schall- und Wärmeschutzanforderungen stehen oft in separaten Berichten, Nachweisen und Bauteilkatalogen; ihr Bezug zu Räumen und Bauteilen ist nicht durchgängig.

    - Bei der manuellen Übernahme in das Architekturmodell entstehen Mehrfachpflege, Auslegungsspielräume und spät erkannte Abweichungen.


    **Ziel & Nutzen**

    - Die Bauphysik übersetzt das freigegebene Konzept in nachvollziehbare Regeln und ein verbindliches fachliches Sollmodell.

    - Anforderungen anhand von Raumnutzungen, Nachbarschaften und Gebäudehülle eindeutig räumlich zuordnen.

    - Den Bauphysik-Bauteilkatalog als abgestimmte Grundlage für Sollwerte, Varianten und Nachweise führen.


    **Ablauf**

    1. Architekturmodell mit eindeutig begrenzten Räumen und vollständiger Hülle sowie das freigegebene Bauphysikkonzept bereitstellen.

    2. Schall- und Wärmeschutzanforderungen in Regeln übersetzen, räumlich zuordnen und mit den Sollwerten des Bauphysik-Bauteilkatalogs verknüpfen.

    3. Anforderungsmodell mit Nachweisen und aktuellem Planstand abstimmen, als Prüfreferenz freigeben und bei fachlichen Änderungen nachführen.


    **Lieferergebnis**

    - Freigegebenes Bauphysik-Anforderungsmodell mit nachvollziehbaren Regeln, räumlich zugeordneten Sollanforderungen und Bezug zum Planstand

    - Abgestimmter Bauphysik-Bauteilkatalog mit den erforderlichen Schall- und Wärmeschutzwerten'
  fr: 'Traduire le concept de physique du bâtiment approuvé en un modèle d''exigences attribuées spatialement, afin de contrôler de manière univoque et continue l''isolation phonique et thermique dans la
    maquette d''architecture.


    **Situation de départ**

    - Les exigences d''isolation phonique et thermique figurent souvent dans des rapports, justificatifs et catalogues d''éléments séparés ; leur lien avec les locaux et les éléments n''est pas continu.

    - Leur report manuel dans la maquette d''architecture entraîne des saisies multiples, des marges d''interprétation et des écarts détectés tardivement.


    **Objectif et bénéfice**

    - Le spécialiste en physique du bâtiment traduit le concept approuvé en règles traçables et en un modèle de référence contraignant.

    - Attribuer spatialement les exigences à partir des usages des locaux, des relations de voisinage et de l''enveloppe du bâtiment.

    - Tenir le catalogue des éléments de physique du bâtiment comme base coordonnée pour les valeurs de référence, les variantes et les justificatifs.


    **Déroulement**

    1. Fournir la maquette d''architecture avec des locaux clairement délimités et une enveloppe complète ainsi que le concept de physique du bâtiment approuvé.

    2. Traduire les exigences d''isolation phonique et thermique en règles, les attribuer spatialement et les relier aux valeurs de référence du catalogue des éléments.

    3. Coordonner le modèle d''exigences avec les justificatifs et l''état actuel du projet, l''approuver comme référence de contrôle et le mettre à jour lors de modifications spécialisées.


    **Livrable**

    - Modèle d''exigences de physique du bâtiment approuvé, comprenant des règles traçables, des exigences de référence attribuées spatialement et la référence à l''état du projet

    - Catalogue coordonné des éléments de physique du bâtiment avec les valeurs d''isolation phonique et thermique requises'
  it: 'Tradurre il concetto di fisica della costruzione approvato in un modello dei requisiti attribuiti spazialmente, affinché l''isolamento acustico e termico possa essere verificato nel modello di architettura
    in modo univoco e continuo.


    **Situazione di partenza**

    - I requisiti di isolamento acustico e termico figurano spesso in rapporti, verifiche e cataloghi degli elementi separati; il loro riferimento a locali ed elementi non è continuo.

    - Il trasferimento manuale nel modello di architettura causa inserimenti multipli, margini d''interpretazione e scostamenti individuati tardivamente.


    **Obiettivo e beneficio**

    - Lo specialista in fisica della costruzione traduce il concetto approvato in regole tracciabili e in un modello di riferimento vincolante.

    - Attribuire spazialmente i requisiti in base agli usi dei locali, alle relazioni di adiacenza e all''involucro dell''edificio.

    - Gestire il catalogo degli elementi di fisica della costruzione come base coordinata per valori di riferimento, varianti e verifiche.


    **Svolgimento**

    1. Fornire il modello di architettura con locali chiaramente delimitati e involucro completo, nonché il concetto di fisica della costruzione approvato.

    2. Tradurre in regole i requisiti di isolamento acustico e termico, attribuirli spazialmente e collegarli ai valori di riferimento del catalogo degli elementi.

    3. Coordinare il modello dei requisiti con le verifiche e lo stato attuale del progetto, approvarlo come riferimento di controllo e aggiornarlo in caso di modifiche specialistiche.


    **Risultato della fornitura**

    - Modello dei requisiti di fisica della costruzione approvato con regole tracciabili, requisiti di riferimento attribuiti spazialmente e riferimento allo stato del progetto

    - Catalogo coordinato degli elementi di fisica della costruzione con i valori di isolamento acustico e termico richiesti'
  en: 'Translate the approved building physics concept into a spatially assigned requirements model so sound and thermal insulation can be checked unambiguously and continuously in the architecture model.


    **Starting point**

    - Sound and thermal insulation requirements often appear in separate reports, verification documents, and component catalogues; their relationship to spaces and components is not continuous.

    - Manually transferring them to the architecture model creates duplicate maintenance, room for interpretation, and deviations that are detected late.


    **Goal & benefit**

    - The building physics specialist translates the approved concept into traceable rules and a binding discipline requirements model.

    - Spatially assign requirements based on space uses, adjacency, and the building envelope.

    - Maintain the building physics component catalogue as the coordinated basis for target values, options, and verification.


    **Process**

    1. Provide the architecture model with clearly bounded spaces and a complete envelope together with the approved building physics concept.

    2. Translate sound and thermal insulation requirements into rules, assign them spatially, and link them to the target values in the component catalogue.

    3. Coordinate the requirements model with verification documents and the current design status, approve it as the check reference, and update it when discipline requirements change.


    **Deliverable**

    - Approved building physics requirements model with traceable rules, spatially assigned target requirements, and a reference to the design status

    - Coordinated building physics component catalogue with the required sound and thermal insulation values'
