comment: 'Construction phases SIA 51–53. Layout file (typically DXF) is derived from the IFC/architecture model – not authored in parallel 2D. Print content: non-load-bearing wall lines (IsExternal=FALSE,
  LoadBearing=FALSE), openings, short wall Reference (not full CalculatedType), space Name (room number), door Name (door number). Control points and known obstacles (columns, shafts) belong in the derived
  layout file. Distinct from des-drawing-derivation (paper/PDF completeness check).'
