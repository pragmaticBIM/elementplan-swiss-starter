comment: 'Comparison set is the abstractBIM stock of more than 3000 models. About 250 indicators can be calculated; the exact list is not pinned here. Minimum model: interior and exterior spaces (LongName,
  IsExternal), windows, and doors. Distinct from DES-KV, which only derives construction volume.'
