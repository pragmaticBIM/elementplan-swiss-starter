comment: Trees as IfcGeographicElement; PredefinedType VEGETATION (IFC4.3) or USERDEFINED (IFC4). ObjectType is language-specific (Baum / Arbre / Albero / Tree). IFC2x3 uses IfcBuildingElementProxy. Status
  EXISTING marks trees to preserve; DEMOLISH marks felling. Species uses Latin binomials from the tree-species value list.
