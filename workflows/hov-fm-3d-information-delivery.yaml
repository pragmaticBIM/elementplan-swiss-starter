comment: FM handover. No fixed MEP element attribute pack – scope agreed with operator. WarrantyEndDate in Pset_Warranty applies only to IfcElement/IfcElementType, not IfcSpace. For the space-based elevator
  approach, warranty end and contractor belong in the linked maintenance contract or its metadata. If a physical IfcTransportElement with PredefinedType=ELEVATOR is delivered, Pset_Warranty may be used
  there; this workflow does not require creating that physical element. Phases typically 51–62.
