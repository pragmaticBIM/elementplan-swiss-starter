id: pragmaticbim:workflow/con
code: CON
sort_order: 40
name:
  de: Ausführung
  fr: Réalisation
  it: Costruzione
  en: Construction
description:
  de: 'Verlässliche, einfach verständliche und nachvollziehbare Grundlagen für Fertigung, Bestellung, Montage und Baustellenlogistik. Die bewährte Qualität gewerkespezifischer, vollständig lesbarer Ausführungspläne
    muss auch im digitalen Prozess erhalten bleiben. Modelle allein ersetzen diese Aufbereitung nicht: Gebäudestruktur, Bauteilklassifikation und Änderungen müssen eindeutig erkennbar sein. Wo möglich,
    sollen geeignete Ansichten bereitgestellt oder gewerkespezifische Pläne aus dem Modell abgeleitet werden. Die blosse Bereitstellung regelmässig überschriebener Modelle genügt nicht als Ausführungs-
    oder Änderungsdokumentation.'
  fr: 'Exécution physique, fabrication et pose sur chantier ou dans la chaîne d''approvisionnement. Exemples: plans d''atelier, modèles conformes à l''exécution, logistique chantier, fiches de pose.'
  it: 'Esecuzione fisica, produzione e installazione in cantiere o nella supply chain. Esempi: disegni di officina, modelli as-built, logistica cantiere, registri di posa.'
  en: 'Reliable, easy-to-understand, and traceable information for fabrication, ordering, installation, and site logistics. The proven quality of trade-specific, fully legible construction drawings must
    also be maintained in the digital process. Models alone do not replace this preparation: building structure, component classification, and changes must be clearly identifiable. Where possible, suitable
    views should be provided or trade-specific drawings derived from the model. Merely providing models that are regularly overwritten is not sufficient as construction or change documentation.'
