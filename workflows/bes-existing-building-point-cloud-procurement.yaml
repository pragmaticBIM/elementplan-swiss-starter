comment: 'Zweites Beschaffungspaket für Bestandsgrundlagen. Erfasst das Gebäude vor dem Konzeptentscheid als Punktwolke. Die konzeptbezogene Nachmodellierung ist ein nachgelagertes Beschaffungspaket. Aufnahmeverfahren,
  HDR, Bereinigung und Registrierung bleiben bei der Vermessung. Nicht verbindliche Orientierung für die Bestellung: Fassaden 5-10 mm / LOA30; Innenräume und Tragwerk 3-6 mm / LOA30; Haustechnik und Anschlussdetails
  2-3 mm / LOA30-40.'
