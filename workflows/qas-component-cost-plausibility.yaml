comment: 'Three-way EP check keyed by ePset_Cost.ProductClass (and CalculatedType where useful). Project rate: ePset_Cost.UnitPrice. Quantity pointer: ePset_Cost.ReferenceQuantity. Component cost = referenced
  model quantity × project unit price. Compare against (a) versioned schema.pragmaticbim.ch product EP / ranges and (b) office Kostendatenbank fed by BES-UNIT-PRICE. Align currency, price date, quality
  standard, and included scope before comparing. Schema and office rates are external benchmarks, not IFC attributes. ProductClass and CalculatedType are derived in BES-PRODUCT-TENDER (logic in book Anhang
  D, Bauteiltypisierung); office EPs come from BES-UNIT-PRICE.'
