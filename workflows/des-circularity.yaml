comment: 'Material passport / circularity (e.g. Madaster). Minimal IFC basis: GUID, IfcMaterial, eBKP-H (IfcClassification or ePset_Cost.eBKP), BaseQuantities, Status (NEW/EXISTING/DEMOLISH). IFC4+: Pset_ManufacturerTypeInformation.GlobalTradeItemNumber
  identifies the product type. Circularity data without a semantically equivalent IFC4.3 property remains in the neutral ePset_Circularity: Connection, Accessibility, Reuse, MaterialOrProductId, WasteCodes.
  Enum tokens follow Madaster detachability methodology (DGBC). WasteCodes: Madaster format code:percentage[:nature[:cw-outcome[:oo-outcome]]]; VeVA (CH) / EAK-AVV (EU) codes in the code field. Complements
  DES-LCA; does not replace it.'
