id: pragmaticbim:workflow/bes-door-tender-basis
code: BES-DOOR-TENDER
sort_order: 17
name:
  de: Grundlage für die Türausschreibung liefern
  fr: Fournir la base pour l'appel d'offres des portes
  it: Fornire la base per la gara delle porte
  en: Provide the basis for the door tender
description:
  de: 'Türangaben im Architekturmodell als prüfbare Grundlage für Mengen und Ausschreibung bereitstellen.


    **Ausgangslage**

    - Türtypen, Öffnungsmasse, Öffnungsarten, Feuerwiderstand und Schalldämmung werden für die Ausschreibung oft manuell aus Plänen und Türlisten zusammengetragen.

    - Fehlende oder uneinheitliche Türangaben führen zu Rückfragen, falschen Mengen und Nachträgen.


    **Ziel & Nutzen**

    - Türtypen und Öffnungsmasse im Architekturmodell führen; zusätzliche Fachangaben wie Öffnungsart, Feuerwiderstand und Schalldämmung können alternativ in einer über die Türnummer verknüpften Liste nachgeführt
    werden.

    - Eine nachvollziehbare Türliste als Grundlage für Mengen und Ausschreibungsunterlagen ableiten.


    **Ablauf**

    1. Türen mit eindeutiger Türnummer und räumlicher Zuordnung bereitstellen.

    2. Türtyp, Aussenbezug, Öffnungsmasse, Öffnungsart, Feuerwiderstand und Schalldämmung im Modell oder in einer verknüpften Liste erfassen.

    3. Im Team festlegen, wo die Angaben führend gepflegt und wie sie synchronisiert und geprüft werden. Pragmatisch kann dies beispielsweise eine gemeinsam bearbeitete Excel-Datei in SharePoint oder Teams
    sein.

    4. Türliste nach berechnetem Bauteiltyp und Abmessungen ableiten und mit den Ausschreibungsplänen abstimmen.


    **Lieferergebnis**

    - Architekturmodell und über die Türnummer verknüpfte Türliste mit den erforderlichen Grund- und Fachangaben.'
  fr: 'Mettre à disposition les données des portes dans la maquette d''architecture comme base vérifiable pour les quantités et l''appel d''offres.


    **Situation de départ**

    - Les types, dimensions d''ouverture, modes d''ouverture, résistances au feu et performances acoustiques sont souvent rassemblés manuellement depuis les plans et listes de portes.

    - Des données manquantes ou incohérentes entraînent des questions, des quantités erronées et des avenants.


    **Objectif et bénéfice**

    - Saisir les types et dimensions d''ouverture dans la maquette d''architecture ; les données techniques complémentaires telles que le mode d''ouverture, la résistance au feu et la performance acoustique
    peuvent aussi être tenues dans une liste reliée par le numéro de porte.

    - Déduire une liste de portes traçable comme base pour les quantités et le dossier d''appel d''offres.


    **Déroulement**

    1. Fournir les portes avec un numéro univoque et leur rattachement spatial.

    2. Saisir le type, le rapport à l''extérieur, les dimensions, le mode d''ouverture, la résistance au feu et la performance acoustique dans la maquette ou dans une liste reliée.

    3. Définir en équipe où les données de référence sont tenues ainsi que leur synchronisation et leur contrôle. Une solution pragmatique peut être un fichier Excel collaboratif dans SharePoint ou Teams.

    4. Déduire la liste par type calculé et dimensions et l''accorder avec les plans d''appel d''offres.


    **Livrable**

    - Maquette d''architecture et liste de portes reliée par le numéro de porte avec les données de base et techniques requises.'
  it: 'Mettere a disposizione i dati delle porte nel modello di architettura come base verificabile per quantità e gara.


    **Situazione di partenza**

    - Tipi, dimensioni, modalità di apertura, resistenza al fuoco e prestazioni acustiche vengono spesso raccolti manualmente da piani ed elenchi porte per la gara.

    - Dati mancanti o incoerenti causano domande, quantità errate e varianti.


    **Obiettivo e beneficio**

    - Gestire tipi e dimensioni nel modello di architettura; i dati specialistici aggiuntivi, come modalità di apertura, resistenza al fuoco e prestazione acustica, possono essere mantenuti anche in un
    elenco collegato tramite il numero della porta.

    - Ricavare un elenco porte tracciabile come base per quantità e documenti di gara.


    **Svolgimento**

    1. Fornire le porte con numero univoco e assegnazione spaziale.

    2. Registrare tipo, rapporto con l''esterno, dimensioni, modalità di apertura, resistenza al fuoco e prestazione acustica nel modello o in un elenco collegato.

    3. Definire nel team dove vengono gestiti i dati di riferimento e come vengono sincronizzati e verificati. Una soluzione pragmatica può essere un file Excel collaborativo in SharePoint o Teams.

    4. Ricavare l''elenco per tipo calcolato e dimensioni e coordinarlo con i piani di gara.


    **Risultato della fornitura**

    - Modello di architettura ed elenco porte collegato tramite il numero della porta con i dati di base e specialistici necessari.'
  en: 'Provide door information in the architecture model as a verifiable basis for quantities and tendering.


    **Starting point**

    - Door types, opening dimensions, operation types, fire resistance, and acoustic ratings are often compiled manually from drawings and door schedules.

    - Missing or inconsistent door information leads to queries, incorrect quantities, and variations.


    **Goal & benefit**

    - Maintain door types and opening dimensions in the architecture model; additional specialist information such as operation type, fire resistance, and acoustic rating may instead be maintained in a
    schedule linked by the door number.

    - Derive a traceable door schedule as the basis for quantities and tender documents.


    **Process**

    1. Provide doors with a unique door number and spatial assignment.

    2. Capture door type, exterior relationship, opening dimensions, operation type, fire resistance, and acoustic rating in the model or in a linked schedule.

    3. Agree within the team where the authoritative information is maintained and how it is synchronized and checked. A pragmatic solution can be a collaboratively edited Excel file in SharePoint or Teams.

    4. Derive the schedule by calculated component type and dimensions and coordinate it with the tender drawings.


    **Deliverable**

    - Architecture model and door schedule linked by the door number with the required basic and specialist information.'
