id: pragmaticbim:workflow/qas-coordination
code: QAS-COORD
sort_order: 71
name:
  de: Koordination
  fr: Coordination
  it: Coordinamento
  en: Coordination
description:
  de: |
    Klassifikation und Status der Modellelemente für Koordination und Modellprüfung.

    Jedes relevante Element trägt IFC-Entität, PredefinedType und die zugehörigen Pset_*Common-Eigenschaften (Reference, IsExternal). Fenster und Türen tragen zusätzlich Status (NEW, EXISTING, DEMOLISH, TEMPORARY), womit Bestands- und Neubauanteile in der Koordination unterschieden werden. Pset_SpaceCommon kennt keine Status-Eigenschaft.

    **Lieferobjekte**
    - Klassifizierte Fachmodelle Architektur und Gebäudetechnik
    - Koordinationsergebnisse und Modellprüfungen
  fr: |
    Classification et statut des éléments de modèle pour la coordination et le contrôle.

    Chaque élément pertinent porte l'entité IFC, PredefinedType et les propriétés Pset_*Common (Reference, IsExternal). Les fenêtres et les portes portent en plus Status (NEW, EXISTING, DEMOLISH, TEMPORARY), ce qui permet de distinguer existant et neuf dans la coordination. Pset_SpaceCommon ne comporte pas de propriété Status.

    **Livrables**
    - Maquettes spécialisées architecture et CVC classifiées
    - Résultats de coordination et contrôles de modèle
  it: |
    Classificazione e stato degli elementi di modello per coordinamento e verifica.

    Ogni elemento pertinente porta entità IFC, PredefinedType e le proprietà Pset_*Common (Reference, IsExternal). Finestre e porte portano inoltre Status (NEW, EXISTING, DEMOLISH, TEMPORARY), con cui si distinguono esistente e nuovo nel coordinamento. Pset_SpaceCommon non prevede una proprietà Status.

    **Oggetti della fornitura**
    - Modelli specialistici di architettura e impianti classificati
    - Risultati di coordinamento e verifiche di modello
  en: |
    Classification and status of model elements for coordination and model checking.

    Each relevant element carries its IFC entity, PredefinedType, and the matching Pset_*Common properties (Reference, IsExternal). Windows and doors additionally carry Status (NEW, EXISTING, DEMOLISH, TEMPORARY), which lets coordination separate existing from new work. Pset_SpaceCommon has no Status property.

    **Deliverables**
    - Classified architecture and MEP models
    - Coordination results and model checks
