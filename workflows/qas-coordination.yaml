id: pragmaticbim:workflow/qas-coordination
code: QAS-COORD
sort_order: 71
name:
  de: Koordination
  fr: Coordination
  it: Coordinamento
  en: Coordination
description:
  de: |
    Klassifikation und Status der Modellelemente für Koordination und Modellprüfung.

    Jedes relevante Element trägt IFC-Entität, PredefinedType und die zugehörigen Pset_*Common-Eigenschaften (Reference, IsExternal, Status). Über Status (NEW, EXISTING, DEMOLISH, TEMPORARY) lassen sich Bestands- und Neubauanteile in der Koordination unterscheiden.

    **Lieferobjekte**
    - Klassifizierte Fachmodelle Architektur und Gebäudetechnik
    - Koordinationsergebnisse und Modellprüfungen
  fr: |
    Classification et statut des éléments de modèle pour la coordination et le contrôle.

    Chaque élément pertinent porte l'entité IFC, PredefinedType et les propriétés Pset_*Common (Reference, IsExternal, Status). Le Status (NEW, EXISTING, DEMOLISH, TEMPORARY) permet de distinguer existant et neuf dans la coordination.

    **Livrables**
    - Maquettes spécialisées architecture et CVC classifiées
    - Résultats de coordination et contrôles de modèle
  it: |
    Classificazione e stato degli elementi di modello per coordinamento e verifica.

    Ogni elemento pertinente porta entità IFC, PredefinedType e le proprietà Pset_*Common (Reference, IsExternal, Status). Tramite Status (NEW, EXISTING, DEMOLISH, TEMPORARY) si distinguono esistente e nuovo nel coordinamento.

    **Oggetti della fornitura**
    - Modelli specialistici di architettura e impianti classificati
    - Risultati di coordinamento e verifiche di modello
  en: |
    Classification and status of model elements for coordination and model checking.

    Each relevant element carries its IFC entity, PredefinedType, and the matching Pset_*Common properties (Reference, IsExternal, Status). Status (NEW, EXISTING, DEMOLISH, TEMPORARY) lets coordination separate existing from new work.

    **Deliverables**
    - Classified architecture and MEP models
    - Coordination results and model checks
