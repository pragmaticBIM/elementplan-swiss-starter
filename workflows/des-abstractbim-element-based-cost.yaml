id: pragmaticbim:workflow/des-abstractbim-element-based-cost
code: DES-ABSTRACTBIM-COST
sort_order: 42
name:
  de: Kosten elementbasiert mit abstractBIM ermitteln
  fr: Déterminer les coûts par élément avec abstractBIM
  it: Determinare i costi per elemento con abstractBIM
  en: Determine element-based costs with abstractBIM
description:
  de: 'Mengen früh im Entwurf ermitteln und Kosten iterativ mit dem Modell mitentwickeln.


    **Ausgangslage**

    - Architekturmodelle sind auf Pläne und Darstellung optimiert, nicht auf Mengenermittlung.

    - Die Aufbereitung für Kostenauswertungen ist aufwendig und erfolgt oft zu spät – wenn wesentliche Entscheide bereits gefallen sind.


    **Ziel & Nutzen**

    - Quantitäten bereits in frühen Entwurfsphasen extrahieren.

    - Iteratives «Design to Cost»: Varianten vergleichen, bevor Kosten feststehen.


    **Ablauf**

    1. Architekturmodell mit den Mindestanforderungen bereitstellen (IfcProject, IfcSite, IfcBuilding, IfcBuildingStorey, IfcSpace, IfcWindow und IfcDoor).

    2. Bei abstractBIM.com hochladen – daraus entsteht ein konsistentes Mengenmodell.

    3. Modell herunterladen und für Mengenberechnung und damit verknüpft die Kostenberechnung nutzen.


    **Lieferergebnis**

    - Architekturmodell mit den erforderlichen Raum- und Öffnungsinformationen für die Mengenermittlung

    - Mengenauszug aus abstractBIM für Kostenschätzung und Variantenvergleich'
  fr: 'Déterminer les quantités tôt en conception et faire évoluer les coûts de manière itérative avec le modèle.


    **Situation de départ**

    - Les maquettes architecture sont optimisées pour les plans et la présentation, pas pour le métré.

    - La préparation pour l''évaluation des coûts est laborieuse et intervient souvent trop tard – lorsque les décisions majeures sont déjà prises.


    **Objectif et bénéfice**

    - Extraire les quantités dès les phases initiales de conception.

    - Conception orientée coûts itérative : comparer les variantes avant que les coûts ne soient figés.


    **Déroulement**

    1. Fournir une maquette architecture répondant aux exigences minimales.

    2. Téléverser sur abstractBIM.com – un modèle de quantités cohérent en résulte.

    3. Télécharger le modèle et l''utiliser pour le métré automatisé.


    **Livrable**

    - Maquette architecture avec les informations requises sur les locaux et les ouvertures pour le métré

    - Métré issu d''abstractBIM pour l''estimation des coûts et la comparaison de variantes'
  it: 'Determinare le quantità in fase di progettazione iniziale e sviluppare i costi in modo iterativo con il modello.


    **Situazione di partenza**

    - I modelli architettonici sono ottimizzati per planimetrie e presentazione, non per il computo metrico.

    - La preparazione per la valutazione dei costi è onerosa e avviene spesso troppo tardi – quando le decisioni principali sono già state prese.


    **Obiettivo e beneficio**

    - Estrarre le quantità già nelle fasi iniziali di progettazione.

    - Design to cost iterativo: confrontare le varianti prima che i costi siano definitivi.


    **Svolgimento**

    1. Fornire un modello architettonico che soddisfi i requisiti minimi.

    2. Caricare su abstractBIM.com – ne deriva un modello di quantità coerente.

    3. Scaricare il modello e utilizzarlo per il computo metrico automatizzato.


    **Risultato della fornitura**

    - Modello di architettura con le informazioni necessarie su locali e aperture per il computo metrico

    - Computo metrico da abstractBIM per la stima dei costi e il confronto delle varianti'
  en: 'Extract quantities early in design and iterate cost alongside the model.


    **Starting point**

    - Architecture models are optimized for drawings and presentation, not quantity take-off.

    - Preparing them for cost evaluation is labor-intensive and often happens too late – after major decisions are fixed.


    **Goal & benefit**

    - Extract quantities in early design phases.

    - Iterative design to cost: compare options before costs are locked in.


    **Process**

    1. Provide an architecture model with the minimum requirements (IfcProject, IfcSite, IfcBuilding, IfcBuildingStorey, IfcSpace, IfcWindow, and IfcDoor).

    2. Upload to abstractBIM.com to build a consistent quantity model.

    3. Download the model and use it for quantity calculation and the associated cost calculation.


    **Deliverable**

    - Architecture model with the required space and opening information for quantity take-off

    - Quantity take-off from abstractBIM for cost estimates and option comparison'
