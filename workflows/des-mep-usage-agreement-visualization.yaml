comment: Raumbezogene Sollwerte der Nutzungsvereinbarung Gebäudetechnik. Die versionsübergreifend stabilen Eigenschaften werden im benutzerdefinierten ePset_SpaceRequirement geführt. Nachgewiesene Werte
  werden getrennt in ePset_Space geführt und durch QAS-USAGE-AGREEMENT verglichen. Die Eigenschaften entsprechen inhaltlich insbesondere Pset_SpaceThermalRequirements (IFC4), Pset_SpaceHVACDesign (IFC4.3),
  Pset_SpaceOccupancyRequirements und Pset_SpaceLightingDesign. Berechnete Heiz- und Kühllasten sowie Bauteil- oder Apparateinventare sind nicht Bestandteil dieses AWF.
