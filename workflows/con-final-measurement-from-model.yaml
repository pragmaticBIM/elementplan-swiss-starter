comment: Construction close-out workflow, typically SIA phase 53. The model is an agreed measurement basis, not an automatic replacement for contractual NPK provisions. Tender and works contract must define
  any differing effective measurement rules, model precedence, scope, tolerances, cut-off, approval, and treatment of unmodelled work and change orders.
