id: pragmaticbim:workflow/qas-acoustic-building-physics
code: QAS-ACOUSTIC
sort_order: 79
name:
  de: Schall- und Wärmeschutz an Bauteilen prüfen
  fr: Contrôler l'isolation phonique et thermique des éléments
  it: Verificare l'isolamento acustico e termico dei componenti
  en: Check sound and thermal insulation on components
description:
  de: 'Architekturmodell automatisiert gegen das freigegebene Bauphysik-Anforderungsmodell prüfen, damit Abweichungen bei Schall- und Wärmeschutz nach jeder relevanten Planungsänderung sichtbar werden.


    **Ausgangslage**

    - Bei der manuellen Übernahme bauphysikalischer Anforderungen in das Architekturmodell entstehen Lücken, widersprüchliche Kennwerte und hoher Abstimmungsaufwand.

    - Punktuelle Prüfungen erkennen Abweichungen zwischen Fachplanung, Bauteilkatalog und Architekturmodell häufig erst spät.


    **Ziel & Nutzen**

    - Sollwerte anhand der räumlichen Beziehungen automatisiert den Hüll- und Trennbauteilen des Architekturmodells gegenüberstellen.

    - Fehlende, abweichende oder nicht eindeutig zuordenbare Angaben früh ausweisen und deren Bereinigung nachvollziehbar dokumentieren.


    **Ablauf**

    1. Freigegebenes Bauphysik-Anforderungsmodell und aktuelles Architekturmodell bereitstellen.

    2. Räumliche Zuordnung sowie Schall- und Wärmeschutzwerte der Bauteile automatisiert mit den Sollanforderungen vergleichen.

    3. Abweichungen dokumentieren, fachlich beurteilen und durch die zuständige Planung im Anforderungs- oder Architekturmodell bereinigen.


    **Lieferergebnis**

    - Geprüftes Architekturmodell mit abgestimmten Schall- und Wärmeschutzinformationen

    - Nachvollziehbarer Prüfbericht mit offenen, akzeptierten und bereinigten Abweichungen'
  fr: 'Contrôler automatiquement la maquette d''architecture par rapport au modèle d''exigences de physique du bâtiment approuvé, afin de rendre visibles les écarts d''isolation phonique et thermique après
    chaque modification déterminante du projet.


    **Situation de départ**

    - Le report manuel des exigences de physique du bâtiment dans la maquette d''architecture entraîne des lacunes, des valeurs contradictoires et un important travail de coordination.

    - Les contrôles ponctuels détectent souvent trop tard les écarts entre la planification spécialisée, le catalogue des éléments et la maquette d''architecture.


    **Objectif et bénéfice**

    - Comparer automatiquement les valeurs de référence aux éléments d''enveloppe et de séparation de la maquette d''architecture à partir des relations spatiales.

    - Signaler rapidement les indications manquantes, divergentes ou non attribuables sans ambiguïté et documenter leur traitement de manière traçable.


    **Déroulement**

    1. Fournir le modèle d''exigences de physique du bâtiment approuvé et la maquette d''architecture actuelle.

    2. Comparer automatiquement l''attribution spatiale ainsi que les valeurs d''isolation phonique et thermique des éléments avec les exigences de référence.

    3. Documenter les écarts, les évaluer du point de vue spécialisé et les faire corriger par le mandataire responsable dans le modèle d''exigences ou la maquette d''architecture.


    **Livrable**

    - Maquette d''architecture contrôlée avec des informations coordonnées sur l''isolation phonique et thermique

    - Rapport de contrôle traçable indiquant les écarts ouverts, acceptés et corrigés'
  it: 'Verificare automaticamente il modello di architettura rispetto al modello dei requisiti di fisica della costruzione approvato, affinché gli scostamenti nell''isolamento acustico e termico siano visibili
    dopo ogni modifica rilevante del progetto.


    **Situazione di partenza**

    - Il trasferimento manuale dei requisiti di fisica della costruzione nel modello di architettura causa lacune, valori contraddittori e un notevole onere di coordinamento.

    - Le verifiche puntuali individuano spesso troppo tardi gli scostamenti tra progettazione specialistica, catalogo degli elementi e modello di architettura.


    **Obiettivo e beneficio**

    - Confrontare automaticamente i valori di riferimento con gli elementi di involucro e di separazione del modello di architettura in base alle relazioni spaziali.

    - Evidenziare tempestivamente le informazioni mancanti, divergenti o non attribuibili in modo univoco e documentarne la risoluzione in modo tracciabile.


    **Svolgimento**

    1. Fornire il modello dei requisiti di fisica della costruzione approvato e il modello di architettura aggiornato.

    2. Confrontare automaticamente l''attribuzione spaziale e i valori di isolamento acustico e termico degli elementi con i requisiti di riferimento.

    3. Documentare gli scostamenti, valutarli dal punto di vista specialistico e farli correggere dal progettista responsabile nel modello dei requisiti o nel modello di architettura.


    **Risultato della fornitura**

    - Modello di architettura verificato con informazioni coordinate sull''isolamento acustico e termico

    - Rapporto di verifica tracciabile con gli scostamenti aperti, accettati e risolti'
  en: 'Automatically check the architecture model against the approved building physics requirements model so sound and thermal insulation deviations become visible after every relevant design change.


    **Starting point**

    - Manually transferring building physics requirements to the architecture model creates gaps, conflicting values, and substantial coordination effort.

    - Spot checks often detect deviations between discipline planning, the component catalogue, and the architecture model too late.


    **Goal & benefit**

    - Automatically compare target values with envelope and separating components in the architecture model based on their spatial relationships.

    - Identify missing, divergent, or ambiguous information early and document its resolution traceably.


    **Process**

    1. Provide the approved building physics requirements model and the current architecture model.

    2. Automatically compare component location and sound and thermal insulation values with the target requirements.

    3. Document deviations, get a specialist assessment, and have the responsible designer resolve them in the requirements or architecture model.


    **Deliverable**

    - Checked architecture model with coordinated sound and thermal insulation information

    - Traceable check report showing open, accepted, and resolved deviations'
