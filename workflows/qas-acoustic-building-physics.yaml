comment: DES-PHYSICS produces the requirements model and its component catalogue. QAS-ACOUSTIC compares the spatially assigned targets with AcousticRating as bare Rw number (dB), ThermalTransmittance as
  U [W/(m²·K)], Status, and PredefinedType in the architecture model. Columns/beams are out of scope. Not R'w.
