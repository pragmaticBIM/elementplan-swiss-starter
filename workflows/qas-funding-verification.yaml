comment: 'FundingApplication in ePset_Cost is the filter key: one or more application numbers, comma-separated. Empty means the component is not assigned. Programme rules, decisions, deadlines, invoices,
  payments, signatures, and evidence remain in the funding report. Eligibility against the documented programme version is a check result in that report, not a boolean on the object. Inputs include the
  building-physics component catalogue and cost calculation; quantities and technical values come from the current discipline models.'
