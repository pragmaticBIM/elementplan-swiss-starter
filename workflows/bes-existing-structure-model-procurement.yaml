comment: 'Drittes Beschaffungspaket für Bestandsgrundlagen. Baut auf Lagebezug, Gelände und Gebäude-Punktwolke auf. Nachmodellierung erst nach Klärung der Konzeptrichtung und vorzugsweise durch das beauftragte
  Projektteam. Attribute pack on Rohbau/Gebäudekörper elements: Status/ElementStatus, PredefinedType, LoadBearing (where defined), ProductClass (where defined), and the element reference BaseQuantity (or
  all Qto_ attrs when no ReferenceQuantity is defined).'
