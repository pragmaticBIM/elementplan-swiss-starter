id: pragmaticbim:workflow/bes-existing-structure-model-procurement
code: BES-EXISTING-STRUCTURE
sort_order: 8
name:
  de: Gebäudekörper und Rohbau nachmodellieren
  fr: Modéliser le bâtiment et le gros œuvre selon le concept
  it: Modellare l’edificio e la struttura grezza in funzione del concetto
  en: Model the building and structural shell for the chosen concept
description:
  de: 'Gebäudekörper und Rohbau erst nach Klärung der Konzeptrichtung gezielt nachmodellieren, damit nur die für Umbau, Rückbau oder Erweiterung benötigten Bestandsinformationen erarbeitet werden.


    **Ausgangslage**

    - Bestandspläne fehlen häufig, sind unvollständig oder bilden nachträgliche Umbauten nicht ab.

    - Eine vollständige Nachmodellierung vor dem Konzeptentscheid erzeugt ungeprüfte Annahmen und erfasst Bereiche, die für die gewählte Lösung möglicherweise nicht benötigt werden.


    **Ziel & Nutzen**

    - Auf Grundlage der georeferenzierten Punktwolke nur die konzeptrelevanten Bereiche und Bauteile mit zweckgerechter Tiefe nachmodellieren.

    - Möglichst das beauftragte Projektteam mit der Nachmodellierung betrauen, damit Aufnahmeumfang und Planung unmittelbar aufeinander abgestimmt sind.


    **Ablauf**

    1. Nach Klärung der Konzeptrichtung die georeferenzierte Punktwolke und vorhandenen Bestandspläne bereitstellen sowie die relevanten Bereiche und Bauteile festlegen.

    2. Sichtbare Geometrie anhand der Punktwolke nachmodellieren, Bestandspläne damit plausibilisieren und Abweichungen, nicht sichtbare Konstruktionen sowie Annahmen kennzeichnen.

    3. Kritische Stellen punktuell nachmessen und, wenn möglich, sondieren; bestätigte und weiterhin angenommene Angaben dokumentieren und das Modell für die Planung freigeben.


    **Lieferergebnis**

    - Konzeptbezogenes, georeferenziertes Bestandsmodell der relevanten Bereiche von Gebäudekörper und Rohbau.

    - Dokumentierter Abgleich von Punktwolke und Bestandsplänen mit erkennbaren Abweichungen, Sondierungsbefunden und verbleibenden Annahmen.

    - Vereinbarte Erfassungstiefe, geprüfte kritische Stellen und Modellfreigabe als nachvollziehbare Planungsgrundlage.'
  fr: 'Ne modéliser de manière ciblée le bâtiment et le gros œuvre qu’une fois l’orientation du concept arrêtée, afin de produire uniquement les informations sur l’existant nécessaires à la transformation,
    à la déconstruction ou à l’extension.


    **Situation de départ**

    - Les plans de l’existant manquent souvent, sont incomplets ou ne tiennent pas compte de transformations ultérieures.

    - Une modélisation complète avant le choix du concept génère des hypothèses non vérifiées et saisit des zones qui ne seront peut-être pas utiles à la solution retenue.


    **Objectif et bénéfice**

    - À partir du nuage de points géoréférencé, ne modéliser que les zones et éléments déterminants pour le concept, avec une profondeur adaptée à l’usage.

    - Confier si possible la modélisation à l’équipe de projet mandatée afin de coordonner directement le périmètre du relevé et les besoins des études.


    **Déroulement**

    1. Une fois l’orientation du concept arrêtée, fournir le nuage de points géoréférencé et les plans disponibles, puis définir les zones et éléments déterminants.

    2. Modéliser la géométrie visible d’après le nuage de points, vérifier la plausibilité des plans et signaler les écarts, les constructions non visibles et les hypothèses.

    3. Effectuer des mesures ponctuelles et, si possible, des sondages aux endroits critiques; documenter les données confirmées et celles qui restent supposées, puis valider la maquette pour les études.


    **Livrable**

    - Maquette géoréférencée de l’existant, limitée aux zones du bâtiment et du gros œuvre déterminantes pour le concept.

    - Comparaison documentée du nuage de points et des plans, avec les écarts, résultats des sondages et hypothèses restantes clairement identifiables.

    - Profondeur de saisie convenue, endroits critiques contrôlés et validation de la maquette comme base traçable des études.'
  it: 'Modellare in modo mirato l’edificio e la struttura grezza solo dopo aver chiarito l’indirizzo del concetto, così da elaborare unicamente le informazioni dello stato di fatto necessarie per trasformazione,
    smantellamento o ampliamento.


    **Situazione di partenza**

    - I piani dello stato di fatto spesso mancano, sono incompleti o non riportano trasformazioni successive.

    - Una modellazione completa prima della scelta del concetto genera ipotesi non verificate e rileva aree che potrebbero non servire alla soluzione scelta.


    **Obiettivo e beneficio**

    - Sulla base della nuvola di punti georiferita, modellare soltanto le aree e i componenti rilevanti per il concetto, con una profondità adeguata allo scopo.

    - Affidare se possibile la modellazione al gruppo di progettazione incaricato, affinché il perimetro del rilievo e le esigenze della progettazione siano coordinati direttamente.


    **Svolgimento**

    1. Dopo aver chiarito l’indirizzo del concetto, fornire la nuvola di punti georiferita e i piani disponibili e definire le aree e i componenti rilevanti.

    2. Modellare la geometria visibile in base alla nuvola di punti, verificare la plausibilità dei piani e contrassegnare scostamenti, costruzioni non visibili e ipotesi.

    3. Eseguire misurazioni puntuali e, se possibile, sondaggi nei punti critici; documentare i dati confermati e quelli ancora ipotizzati e approvare il modello per la progettazione.


    **Risultato della fornitura**

    - Modello georiferito dello stato di fatto limitato alle aree dell’edificio e della struttura grezza rilevanti per il concetto.

    - Confronto documentato tra nuvola di punti e piani, con scostamenti, risultati dei sondaggi e ipotesi rimanenti chiaramente riconoscibili.

    - Profondità di acquisizione concordata, punti critici verificati e approvazione del modello come base tracciabile per la progettazione.'
  en: 'Model the building and structural shell selectively once the concept direction is clear, so that only the existing-condition information required for conversion, deconstruction, or extension is produced.


    **Starting point**

    - Existing drawings are often missing, incomplete, or do not include later alterations.

    - Complete modelling before the concept decision creates unchecked assumptions and captures areas that may not be needed for the chosen solution.


    **Goal & benefit**

    - Use the georeferenced point cloud to model only the areas and components relevant to the concept, at a depth suited to the intended use.

    - Where possible, commission the appointed project team to create the model so that survey scope and design needs are coordinated directly.


    **Process**

    1. Once the concept direction is clear, provide the georeferenced point cloud and available existing drawings and define the relevant areas and components.

    2. Model visible geometry from the point cloud, check the plausibility of the drawings, and identify deviations, concealed construction, and assumptions.

    3. Take local check measurements and, where possible, open up critical locations; document confirmed and remaining assumed information and approve the model for design.


    **Deliverable**

    - Concept-specific georeferenced existing-condition model of the relevant building and structural-shell areas.

    - Documented comparison of point cloud and existing drawings, with deviations, investigation findings, and remaining assumptions clearly identifiable.

    - Agreed capture depth, checked critical locations, and model approval as a traceable basis for design.'
