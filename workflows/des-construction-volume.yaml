comment: 'Construction volume = gross volume − net-room volume − air-space volume (Qto_SpaceBaseQuantities.GrossVolume on spaces-gross-volume and spaces-luftraum, NetVolume on spaces-interior). Comparable
  across projects that follow the same modelling guideline; not a formal SIA 416 verification, because gross volume extends to the outer facade edge rather than the insulation edge. Elevator shafts and
  parking bays are not deducted: elevator volume is only required from phase 51, and parking bays from Bauprojekt would otherwise double-count interior spaces.'
