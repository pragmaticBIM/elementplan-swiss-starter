id: pragmaticbim:workflow/des-ebkp-h-classification
code: DES-EBKP-H
sort_order: 61
name:
  de: eBKP-H-Klassifizierung berechnen
  fr: Calculer la classification eBKP-H
  it: Calcolare la classificazione eBKP-H
  en: Calculate the eBKP-H classification
description:
  de: 'eBKP-H-Codes für die wesentlichen Architektur- und TGA-Positionen aus wenigen Modelleigenschaften ableiten – statt die Klassifizierung manuell zu setzen.


    **Ausgangslage**

    - eBKP-H-Zuordnung an Wänden, Decken, Unterzügen, Treppen, Fenstern, Türen, Bekleidungen und TGA-Geräten wird oft manuell gepflegt und weicht zwischen Modell und Kostenplan ab.

    - Die drei Ebenen von eBKP-H sind für eine elementbasierte Kostenberechnung zu grob. Es braucht Bauteiltypen mit eigenen Einheitspreisen, nicht Durchschnittswerte. z.B.für Aussenwände – etwa der Unterschied
    zwischen Holzbau und Mauerwerk mit Wärmedämmverbund.

    - Elementtyp, Medium, Innen/Aussen, tragend/nichttragend, Terrainkontakt und geometrische Lage stecken schon in den Bauteileigenschaften oder der Geometrie – sie werden aber nicht durchgängig für die
    Klassifizierung genutzt.


    **Ziel & Nutzen**

    - Wesentliche Positionen einheitlich nach SN 506 511 klassifizieren.

    - Wenige eindeutige Eingaben; eBKP-H-Code automatisch berechnen.


    **Ablauf**

    1. Architektur- und TGA-Bauteile mit IsExternal, LoadBearing, Medium und BelowTerrain sowie Terrainkontakt und geometrischer Lage der Treppen bereitstellen.

    2. eBKP automatisiert ableiten (z. B. Unterzug → `C04.01`; Innentreppe → `C04.02`, Aussentreppe → `C04.06`, bei Terrainkontakt und entsprechender Lage → `C01.04`; Aussen-/Innenfenster → `E03.01`/`G01.04`;
    Aussen-/Innentür → `E03.02`/`G01.05`).

    3. Klassifizierte Mengen prüfen und für die Kostenermittlung nutzen.


    **Lieferergebnis**

    - Architektur- und TGA-Fachmodelle mit den für die Klassifikation erforderlichen Bauteilinformationen

    - Klassifikationsauszug mit rückverfolgbarer eBKP-H-Zuordnung nach SN 506 511'
  fr: 'Déduire les codes eBKP-H des postes principaux architecture et CVC à partir de quelques propriétés du modèle – au lieu de classer manuellement.


    **Situation de départ**

    - L''affectation eBKP-H sur murs, dalles, poutres, escaliers, fenêtres, portes, revêtements et appareils CVC est souvent tenue manuellement et diverge entre modèle et plan de coûts.

    - Les trois niveaux de l''eBKP-H sont trop grossiers pour un calcul des coûts par élément. Il faut des types d''éléments avec des prix unitaires propres, pas des valeurs moyennes pour les murs extérieurs
    – par exemple la différence entre construction bois et maçonnerie avec isolation thermique extérieure.

    - Type d''élément, fluide, intérieur/extérieur, porteur/non porteur, contact avec le terrain et situation géométrique figurent déjà dans les propriétés ou la géométrie – mais ne sont pas utilisés de
    façon systématique pour la classification.


    **Objectif et bénéfice**

    - Classer les postes principaux de façon uniforme selon SN 506 511.

    - Peu de saisies univoques ; calculer le code eBKP-H automatiquement.


    **Déroulement**

    1. Fournir les éléments d''architecture et CVC avec IsExternal, LoadBearing, fluide et BelowTerrain ainsi que le contact avec le terrain et la situation géométrique des escaliers.

    2. Déduire eBKP automatiquement (p. ex. poutre → `C04.01` ; escalier intérieur → `C04.02`, extérieur → `C04.06`, en contact avec le terrain et selon sa situation → `C01.04` ; fenêtre extérieure/intérieure
    → `E03.01`/`G01.04` ; porte extérieure/intérieure → `E03.02`/`G01.05`).

    3. Vérifier les quantités classées et les utiliser pour le calcul des coûts.


    **Livrable**

    - Maquettes architecture et CVC avec les informations requises sur les éléments à classer

    - Extrait de classification avec attribution eBKP-H traçable selon SN 506 511'
  it: 'Ricavare i codici eBKP-H delle voci principali di architettura e impianti da poche proprietà del modello – invece di classificare manualmente.


    **Situazione di partenza**

    - L''assegnazione eBKP-H su pareti, solai, travi, scale, finestre, porte, rivestimenti e apparecchi impianti è spesso gestita manualmente e diverge tra modello e piano dei costi.

    - I tre livelli dell''eBKP-H sono troppo grossolani per un calcolo dei costi per elemento. Servono tipi di componente con prezzi unitari propri, non valori medi per le pareti esterne – ad esempio la
    differenza tra costruzione in legno e muratura con isolamento a cappotto.

    - Tipo di elemento, fluido, interno/esterno, portante/non portante, contatto con il terreno e posizione geometrica sono già nelle proprietà o nella geometria – ma non sono usati in modo sistematico
    per la classificazione.


    **Obiettivo e beneficio**

    - Classificare le voci principali in modo uniforme secondo SN 506 511.

    - Pochi input univoci; calcolare il codice eBKP-H automaticamente.


    **Svolgimento**

    1. Fornire i componenti di architettura e impianti con IsExternal, LoadBearing, fluido e BelowTerrain, nonché il contatto con il terreno e la posizione geometrica delle scale.

    2. Ricavare eBKP automaticamente (es. trave → `C04.01`; scala interna → `C04.02`, esterna → `C04.06`, a contatto con il terreno e secondo la posizione → `C01.04`; finestra esterna/interna → `E03.01`/`G01.04`;
    porta esterna/interna → `E03.02`/`G01.05`).

    3. Verificare le quantità classificate e usarle per il calcolo dei costi.


    **Risultato della fornitura**

    - Modelli di architettura e impianti con le informazioni necessarie sui componenti da classificare

    - Estratto di classificazione con assegnazione eBKP-H tracciabile secondo SN 506 511'
  en: 'Derive eBKP-H codes for major architecture and MEP positions from a few model properties – instead of classifying by hand.


    **Starting point**

    - eBKP-H assignment on walls, slabs, beams, stairs, windows, doors, coverings, and MEP equipment is often maintained manually and drifts between model and cost plan.

    - The three eBKP-H levels are too coarse for element-based cost calculation. Component types need their own unit prices, not average values for exterior walls – for example the difference between timber
    and masonry with external thermal insulation.

    - Element type, medium, interior/exterior, load-bearing, terrain contact, and geometric location already sit in component properties or geometry – but they are not used consistently for classification.


    **Goal & benefit**

    - Classify major positions uniformly to SN 506 511.

    - Use a few unambiguous inputs; calculate the eBKP-H code automatically.


    **Process**

    1. Provide architecture and MEP components with IsExternal, LoadBearing, medium, and BelowTerrain, plus terrain contact and geometric location for stairs.

    2. Derive eBKP automatically (e.g. beam → `C04.01`; interior stair → `C04.02`, exterior stair → `C04.06`, with terrain contact and matching location → `C01.04`; exterior/interior window → `E03.01`/`G01.04`;
    exterior/interior door → `E03.02`/`G01.05`).

    3. Check classified quantities and use them for cost calculation.


    **Deliverable**

    - Architecture and MEP models with the required information on the components to classify

    - Classification extract with traceable eBKP-H assignments under SN 506 511'
