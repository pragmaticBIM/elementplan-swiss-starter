comment: 'Automated eBKP-H (SN 506 511) for major architecture and MEP positions. Allowed eBKP is per element (narrow lists). BelowTerrain and eBKP live in ePset_Cost. Architecture from IsExternal, LoadBearing,
  BelowTerrain: Wall+IsExternal → C02.01; Wall+not external+LoadBearing → C02.02 (architecture-wall-interior-loadbearing); Wall+not external+not LoadBearing → G01.01 (architecture-wall-interior); Column+IsExternal
  → C03.01 else C03.02; Footing → C01.02; Base slab → C01.03; Floor slab → C04.01; Beam → C04.01; Stair+terrain contact and matching geometric location → C01.04, else Stair+IsExternal → C04.06, else Stair
  → C04.02; Window+IsExternal → E03.01 else G01.04; Door+IsExternal → E03.02 else G01.05; Balcony (FLOOR+IsExternal) → C04.07; Flat roof → C04.04; Pitched roof → C04.05; Exterior cladding+BelowTerrain →
  E01 else E02; Interior cladding → G03.02; Floor covering → G02.02; Suspended ceiling → G04.02. MEP from element type, medium (Reference), PredefinedType, BelowTerrain: Generator → D01.01; Transformer
  → D01.02; UPS → D01.03; Tray → D01.04 (Starkstrom) or D01.10 (Schwachstrom); Outlet → D01.04 or D01.11; Switchboard/switching device → D01.04 or D02.06; Light → D01.05; Communications appliance → D01.11;
  Sensor/actuator → D02.03; Alarm → D03.01 or D04.01; Fire terminal → D04.03 / D04.04 / D04.05; Boiler / heat exchanger → D05.02; Space heater → D05.05; Pipe medium HZ/VL-H/RL-H → D05.04, KZ/VL-K/RL-K →
  D06.04, TW/FW → D08.04, AW/WW/ENT/FL → D09.01, gas → D10.04; Pump/tank follow the same system split (D05 / D06 / D08); Valve as distribution or terminal (D05.04, D06.04, D08.04, D08.05, D09.01, D10.05);
  Chiller/compressor → D06.02; Cooling tower → D06.01; Cooled beam → D06.05; Duct AU/FO → D07.01 else D07.04; Fan → D07.02 or D07.04; Air terminal → D07.05; Air terminal box / damper → D07.04; Unitary AIRHANDLER
  → D07.02, cooling types → D06.02, heat pump → D05.02; Sanitary terminal → D08.05; Waste terminal → D09.05; Downpipe → D09.01; Gas terminal → D10.05; Gas regulator → D10.02 or D10.04.'
