comment: Early/simple facades — model the full build-up as a multi-layer IfcWall when the authoring tool supports it. Use a separate IfcCovering layer when the tool does not support multi-layer components
  or when facade complexity requires independent layer modelling (e.g. substructure, insulation strips, multiple cladding types).
