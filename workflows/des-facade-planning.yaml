id: pragmaticbim:workflow/des-facade-planning
code: DES-FACADE
sort_order: 49
name:
  de: Fassadenplanung
  fr: Planification de façade
  it: Pianificazione della facciata
  en: Facade planning
description:
  de: 'Gebäudehülle im Modell führen — von der frühen Mehrschichtkonstruktion bis zur ausführungsreifen Fassadenschicht für Mengenauszug und Bauphysik.


    **Ausgangslage**

    - Fassaden werden oft erst spät detailliert; Mengen und Bauphysik basieren auf Schätzungen.

    - CAD-Tools unterstützen Mehrschichtbauteile unterschiedlich; komplexe Aufbauten lassen sich nicht immer in einer Wand abbilden.


    **Ziel & Nutzen**

    - Einfache Fassaden in frühen Phasen als mehrschichtiger Bauteil (Aussenwand) modellieren.

    - Bei Tool-Limitierung oder höherer Komplexität als separate Fassadenschicht führen.

    - Fassadenflächen und Öffnungen für Mengenauszug und Koordination aus dem Modell ableiten.


    **Ablauf**

    1. Aussenwände, Fenster und Türen bereitstellen.

    2. Fassadenaufbau als Mehrschichtbauteil oder als separate Schicht modellieren — je nach Phase und Komplexität.

    3. Fassadenflächen und Öffnungsanteile aus dem Modell für Mengenauszug und Bauphysik ableiten.


    **Ergebnis**

    - Koordinationsfähige Gebäudehülle von der frühen Phase bis zur ausschreibungsreifen Fassadenplanung.


    **Lieferobjekte**

    - Architekturmodell mit IfcProject, IfcSite, IfcBuilding und IfcBuildingStorey

    - IfcWall mit IsExternal=TRUE — Aussenwand als Mehrschichtbauteil (frühe Phasen, einfache Fassaden)

    - IfcCovering mit PredefinedType=CLADDING und IsExternal=TRUE — separate Fassadenschicht bei höherer Komplexität oder Tool-Limitierung

    - IfcWindow und IfcDoor — Öffnungen in der Fassade mit IsExternal=TRUE

    - IfcCovering mit PredefinedType=CEILING und IsExternal=TRUE — aussenliegende Abhangdecke als modellierte Schicht

    - Gelände als Oberflächengeometrie (IfcGeographicElement TERRAIN)'
  fr: 'Mener l''enveloppe du bâtiment dans le modèle — de la construction multicouche en phase initiale à la couche de façade prête à l''exécution pour le métré et la physique du bâtiment.


    **Situation de départ**

    - Les façades sont souvent détaillées tard ; métré et physique du bâtiment reposent sur des estimations.

    - Les outils CAO supportent les composants multicouches de manière inégale ; les complexes d''enveloppe ne tiennent pas toujours dans un seul mur.


    **Objectif et bénéfice**

    - Modéliser les façades simples en phases initiales comme composant multicouche (mur extérieur).

    - Mener une couche de façade séparée en cas de limite d''outil ou de complexité accrue.

    - Déduire surfaces de façade et ouvertures depuis le modèle pour métré et coordination.


    **Déroulement**

    1. Fournir murs extérieurs, fenêtres et portes.

    2. Modéliser l''ossature de façade comme composant multicouche ou couche séparée — selon la phase et la complexité.

    3. Déduire surfaces de façade et parts d''ouvertures depuis le modèle pour métré et physique du bâtiment.


    **Résultat**

    - Enveloppe coordonnable dans le modèle — de la phase initiale à la planification de façade prête pour l''appel d''offres.


    **Livrables**

    - Maquette architecture avec IfcProject, IfcSite, IfcBuilding et IfcBuildingStorey

    - IfcWall avec IsExternal=TRUE — mur extérieur comme composant multicouche (phases initiales, façades simples)

    - IfcCovering avec PredefinedType=CLADDING et IsExternal=TRUE — couche de façade séparée en cas de complexité accrue ou limite d''outil

    - IfcWindow et IfcDoor — ouvertures dans la façade avec IsExternal=TRUE

    - IfcCovering avec PredefinedType=CEILING et IsExternal=TRUE — plafond suspendu extérieur comme couche modélisée

    - Terrain comme géométrie de surface (IfcGeographicElement TERRAIN)'
  it: 'Gestire l''involucro nel modello — dalla costruzione multistrato nelle fasi iniziali alla stratigrafia di facciata esecutiva per computo metrico e fisica edilizia.


    **Situazione di partenza**

    - Le facciate sono spesso dettagliate tardi; computo metrico e fisica edilizia si basano su stime.

    - I CAD supportano i componenti multistrato in modo diverso; gli stratigrafici complessi non stanno sempre in un unico muro.


    **Obiettivo e beneficio**

    - Modellare facciate semplici nelle fasi iniziali come componente multistrato (parete esterna).

    - Gestire uno strato di facciata separato in caso di limiti dello strumento o maggiore complessità.

    - Ricavare superfici di facciata e aperture dal modello per computo metrico e coordinamento.


    **Svolgimento**

    1. Fornire pareti esterne, finestre e porte.

    2. Modellare la stratigrafia di facciata come componente multistrato o strato separato — a seconda della fase e della complessità.

    3. Ricavare superfici di facciata e quote di aperture dal modello per computo metrico e fisica edilizia.


    **Risultato**

    - Involucro coordinabile nel modello — dalle fasi iniziali alla pianificazione di facciata pronta per la gara.


    **Oggetti della fornitura**

    - Modello di architettura con IfcProject, IfcSite, IfcBuilding e IfcBuildingStorey

    - IfcWall con IsExternal=TRUE — parete esterna come componente multistrato (fasi iniziali, facciate semplici)

    - IfcCovering con PredefinedType=CLADDING e IsExternal=TRUE — strato di facciata separato in caso di maggiore complessità o limiti dello strumento

    - IfcWindow e IfcDoor — aperture nella facciata con IsExternal=TRUE

    - IfcCovering con PredefinedType=CEILING e IsExternal=TRUE — controsoffitto esterno come strato modellato

    - Terreno come geometria di superficie (IfcGeographicElement TERRAIN)'
  en: 'Maintain the building envelope in the model — from early multi-layer construction through execution-grade facade layers for quantity take-off and building physics.


    **Starting point**

    - Facades are often detailed late; quantities and building physics rely on estimates.

    - CAD tools support multi-layer components inconsistently; complex build-ups do not always fit in a single wall.


    **Goal & benefit**

    - Model simple facades in early phases as a multi-layer component (exterior wall).

    - Maintain a separate facade layer when tool limits apply or higher complexity is required.

    - Derive facade areas and openings from the model for quantity take-off and coordination.


    **Process**

    1. Provide exterior walls, windows, and doors.

    2. Model the facade build-up as a multi-layer component or separate layer — depending on phase and complexity.

    3. Derive facade areas and opening ratios from the model for quantity take-off and building physics.


    **Outcome**

    - Coordination-ready building envelope in the model — from early phase through tender-ready facade planning.


    **Deliverables**

    - Architecture model with IfcProject, IfcSite, IfcBuilding, and IfcBuildingStorey

    - IfcWall with IsExternal=TRUE — exterior wall as multi-layer component (early phases, simple facades)

    - IfcCovering with PredefinedType=CLADDING and IsExternal=TRUE — separate facade layer when complexity or tool limits require it

    - IfcWindow and IfcDoor — openings in the facade with IsExternal=TRUE

    - IfcCovering with PredefinedType=CEILING and IsExternal=TRUE — exterior suspended ceiling as a modelled layer

    - Terrain as surface geometry (IfcGeographicElement TERRAIN)'
