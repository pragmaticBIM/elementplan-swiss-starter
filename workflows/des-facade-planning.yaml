comment: Multi-layer IfcWall layer sets are graphics-driven in the authoring tools – fine for simple build-ups, but they do not carry reliable quantities or junction geometry. Model the relevant layers
  as separate elements (IfcCovering or own components) as soon as the build-up becomes constructively relevant (e.g. internal insulation strips, substructure, multiple cladding types).
