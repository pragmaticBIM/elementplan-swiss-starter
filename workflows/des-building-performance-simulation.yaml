id: pragmaticbim:workflow/des-building-performance-simulation
code: DES-BPS
sort_order: 42
name:
  de: Gebäudesimulation auf Basis von abstractBIM
  fr: Simulation de performance du bâtiment à partir d'abstractBIM
  it: Simulazione delle prestazioni dell'edificio da abstractBIM
  en: Building performance simulation based on abstractBIM
description:
  de: |-
    Geometrie und Raumdaten für energetische und raumklimatische Simulation.

    www.abstractBIM.com vereinfacht das Architekturmodell zu einem konsistenten Raum- und Öffnungsmodell. Innenräume, Aussenräume, Fenster und Türen sind die Eingabe; LongName trägt die Raumnutzung.

    **Lieferobjekte**
    - Architekturmodell mit IfcProject, IfcSite, IfcBuilding, IfcBuildingStorey, IfcSpace, IfcWindow und IfcDoor
    - Raumname in LongName, optionale Raumnummer in Name
    - Vereinfachtes Simulationsmodell (z. B. gbXML) aus abstractBIM
  fr: |
    Géométrie et données de locaux pour la simulation énergétique et climatique.

    abstractBIM simplifie la maquette architecture en un modèle cohérent d'espaces et d'ouvertures. Les espaces intérieurs et extérieurs, fenêtres et portes sont l'entrée; LongName porte l'usage du local.

    **Livrables**
    - Maquette architecture avec IfcProject, IfcSite, IfcBuilding, IfcBuildingStorey, IfcSpace, IfcWindow et IfcDoor
    - Nom du local dans LongName, numéro de local facultatif dans Name
    - Modèle de simulation simplifié (p. ex. gbXML) issu d'abstractBIM
  it: |
    Geometria e dati dei locali per la simulazione energetica e climatica.

    abstractBIM semplifica il modello architettonico in un modello coerente di spazi e aperture. Spazi interni ed esterni, finestre e porte sono l'ingresso; LongName indica l'uso del locale.

    **Oggetti della fornitura**
    - Modello di architettura con IfcProject, IfcSite, IfcBuilding, IfcBuildingStorey, IfcSpace, IfcWindow e IfcDoor
    - Nome del locale in LongName, numero locale facoltativo in Name
    - Modello di simulazione semplificato (p. es. gbXML) da abstractBIM
  en: |
    Geometry and space data for energy and indoor-climate simulation.

    abstractBIM simplifies the architecture model into a consistent space and opening model. Interior spaces, exterior spaces, windows, and doors are the input; LongName carries the room use.

    **Deliverables**
    - Architecture model with IfcProject, IfcSite, IfcBuilding, IfcBuildingStorey, IfcSpace, IfcWindow, and IfcDoor
    - Room name in LongName, optional room number in Name
    - Simplified simulation model (for example gbXML) from abstractBIM
