id: pragmaticbim:workflow/des-abstractbim-building-performance-simulation
code: DES-ABSTRACTBIM-BPS
sort_order: 43
name:
  de: Grundlagen für den Heizwärmenachweis nach SIA 380/1 aus dem Modell ableiten
  fr: Déduire de la maquette les données de base du justificatif des besoins de chaleur selon SIA 380/1
  it: Ricavare dal modello le basi per la verifica del fabbisogno termico secondo SIA 380/1
  en: Derive the basis for heating demand verification to SIA 380/1 from the model
description:
  de: 'Die Grundlagen für den Heizwärmenachweis nach SIA 380/1 aus dem Architekturmodell ableiten, ohne die thermische Gebäudehülle manuell nachzumodellieren.


    **Ausgangslage**

    - Flächen und Bauteilmengen für den Heizwärmenachweis werden häufig separat ermittelt und stimmen nach Planungsänderungen nicht mehr mit dem Modell überein.

    - Die Energiebezugsfläche ist nicht identisch mit der Summe aller Raumflächen: Entscheidend sind Nutzung und Lage innerhalb der thermischen Gebäudehülle; unter Schrägdächern zählen Flächenteile mit
    weniger als 1,0 m lichter Höhe nicht dazu.


    **Ziel & Nutzen**

    - Energiebezugsfläche und Gebäudehüllflächen nachvollziehbar aus demselben Planungsstand ermitteln.

    - Geometrie- und Mengendaten für die Weiterberechnung in einer geeigneten Nachweis- oder Simulationssoftware bereitstellen.


    **Ablauf**

    1. Architekturmodell mit derselben geometrischen Mindestgrundlage wie für Kosten und Wettbewerb bereitstellen – Räume, Fenster und Türen – und die thermische Gebäudehülle abstimmen.

    2. Energiebezugsfläche und Hüllflächen nach SIA 416/1 aus dem Modell ermitteln und als Grundlage für den Heizwärmenachweis nach SIA 380/1 prüfen.

    3. Geometrie- oder Mengendaten ausgeben und damit den Heizwärmenachweis in der gewählten Software erstellen.


    **Lieferergebnis**

    - Nachvollziehbar abgegrenzte Energiebezugsfläche und Gebäudehüllflächen

    - Austauschmodell oder Mengenaufstellung als Berechnungsgrundlage für den Heizwärmenachweis


    **Hinweis:** Mit abstractBIM kann aus Räumen, Fenstern und Türen eine gbXML-Datei für die energetische Simulation erzeugt werden. Sonnenschutz und Umgebungsbauten sind in diesem Export nicht enthalten;
    sie werden wie zusätzlicher Kontext von Hand ins Simulationsmodell übernommen. Die Art des Sonnenschutzes bleibt am Aussenfenster unter `SunProtection` geführt, damit Ausschreibung und Simulation übereinstimmen,
    wenn die Geometrie separat ergänzt wird.'
  fr: 'Obtenir à partir de la maquette d''architecture les données de base du justificatif des besoins de chaleur selon SIA 380/1, sans remodéliser manuellement l''enveloppe thermique.


    **Situation de départ**

    - Les surfaces et quantités nécessaires au justificatif des besoins de chaleur sont souvent calculées séparément et ne correspondent plus à la maquette après une modification du projet.

    - La surface de référence énergétique ne correspond pas à la somme de toutes les surfaces de locaux : l''affectation et la situation à l''intérieur de l''enveloppe thermique sont déterminantes ; sous
    une toiture inclinée, les parties dont la hauteur libre est inférieure à 1,0 m n''en font pas partie.


    **Objectif et bénéfice**

    - Calculer de manière traçable la surface de référence énergétique et les surfaces de l''enveloppe à partir du même état de planification.

    - Mettre à disposition les données géométriques et quantitatives nécessaires à la suite du calcul dans le logiciel de justification ou de simulation choisi.


    **Déroulement**

    1. Fournir la maquette d''architecture avec la même base géométrique minimale que pour les coûts et les concours – locaux, fenêtres et portes – et convenir de l''enveloppe thermique.

    2. Calculer à partir de la maquette la surface de référence énergétique et les surfaces de l''enveloppe selon SIA 416/1, puis les contrôler comme base du justificatif selon SIA 380/1.

    3. Exporter les données géométriques ou quantitatives et établir le justificatif des besoins de chaleur dans le logiciel choisi.


    **Livrable**

    - Surface de référence énergétique et surfaces de l''enveloppe délimitées de manière traçable

    - Maquette d''échange ou métré servant de base au justificatif des besoins de chaleur


    **Remarque :** abstractBIM permet de générer, à partir des locaux, fenêtres et portes, un fichier gbXML destiné à la simulation énergétique. La protection solaire et les constructions environnantes
    ne figurent pas dans cet export ; elles sont intégrées manuellement dans le modèle de simulation comme contexte supplémentaire. Le type de protection solaire reste saisi sur la fenêtre extérieure sous
    `SunProtection`, afin que l''appel d''offres et la simulation restent cohérents lorsque la géométrie est ajoutée séparément.'
  it: 'Ricavare dal modello di architettura le basi per la verifica del fabbisogno termico secondo SIA 380/1, senza rimodellare manualmente l''involucro termico.


    **Situazione di partenza**

    - Le superfici e le quantità necessarie per la verifica del fabbisogno termico sono spesso calcolate separatamente e, dopo una modifica del progetto, non corrispondono più al modello.

    - La superficie di riferimento energetico non corrisponde alla somma di tutte le superfici dei locali: sono determinanti l''uso e la posizione all''interno dell''involucro termico; sotto un tetto inclinato
    non si conteggiano le parti con altezza libera inferiore a 1,0 m.


    **Obiettivo e beneficio**

    - Calcolare in modo tracciabile la superficie di riferimento energetico e le superfici dell''involucro dallo stesso stato di progettazione.

    - Mettere a disposizione i dati geometrici e quantitativi per il calcolo nel software di verifica o simulazione scelto.


    **Svolgimento**

    1. Fornire il modello di architettura con la stessa base geometrica minima prevista per costi e concorsi – locali, finestre e porte – e concordare l''involucro termico.

    2. Calcolare dal modello la superficie di riferimento energetico e le superfici dell''involucro secondo SIA 416/1 e verificarle quale base per la verifica secondo SIA 380/1.

    3. Esportare i dati geometrici o quantitativi e redigere la verifica del fabbisogno termico nel software scelto.


    **Risultato della fornitura**

    - Superficie di riferimento energetico e superfici dell''involucro delimitate in modo tracciabile

    - Modello di scambio o computo quale base per la verifica del fabbisogno termico


    **Nota:** abstractBIM consente di generare dai locali, dalle finestre e dalle porte un file gbXML per la simulazione energetica. Protezione solare e costruzioni circostanti non sono comprese in questo
    export; vanno integrate a mano nel modello di simulazione come contesto aggiuntivo. Il tipo di protezione solare resta gestito sulla finestra esterna in `SunProtection`, così gara e simulazione restano
    allineate quando la geometria è aggiunta a parte.'
  en: 'Derive the basis for heating demand verification to SIA 380/1 from the architecture model without manually remodelling the thermal envelope.


    **Starting point**

    - Areas and quantities for heating demand verification are often calculated separately and no longer match the model after design changes.

    - The energy reference area is not the sum of all room areas: use and location within the thermal envelope determine inclusion; beneath pitched roofs, areas with less than 1.0 m clear height are excluded.


    **Goal & benefit**

    - Determine the energy reference area and thermal-envelope areas traceably from the same design state.

    - Provide geometry and quantity data for subsequent calculation in the selected verification or simulation software.


    **Process**

    1. Provide the architecture model with the same geometric minimum used for cost and competition workflows – spaces, windows, and doors – and agree the thermal envelope.

    2. Determine the energy reference area and envelope areas to SIA 416/1 from the model and check them as the basis for verification to SIA 380/1.

    3. Export the geometry or quantity data and prepare the heating demand verification in the selected software.


    **Deliverable**

    - Traceably delimited energy reference area and thermal-envelope areas

    - Exchange model or quantity schedule as the basis for heating demand verification


    **Note:** abstractBIM can generate a gbXML file for energy simulation from spaces, windows, and doors. Sun protection and surrounding buildings are not in that export; merge them by hand into the simulation
    model as additional context. The sun-protection type stays on the exterior window under `SunProtection` so the tender and simulation list remain consistent when geometry is merged separately.'
