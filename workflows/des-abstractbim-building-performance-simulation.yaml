comment: Tool-independent workflow. abstractBIM can generate a gbXML file for energy simulation from spaces, windows, and doors. Shading devices and surrounding buildings are not in that export; merge them
  by hand into the simulation model as additional context. Exterior windows keep SunProtection so the tender and simulation list stay consistent when geometry is merged separately. Same geometric minimum
  as BES-ABSTRACTBIM-COMP and DES-ABSTRACTBIM-COST. The energy-reference area is delimited according to SIA 416/1 and measured gross; floor-area portions below 1.0 m clear height are excluded beneath pitched
  roofs. Envelope ThermalTransmittance (walls, roofs, windows, doors) supports the subsequent SIA 380/1 calculation.
