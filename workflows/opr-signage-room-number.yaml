comment: IFC has no dedicated attribute for a signage/wayfinding room number distinct from the planning number. Do not use IfcSpace.Name for signage — Name remains the stable technical planning room number.
  Custom property SignageRoomNumber in ePset_SpaceSignage. Typical phases 61–62.
