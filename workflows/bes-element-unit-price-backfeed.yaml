comment: 'Produces office Kostendatenbank unit prices consumed by QAS-COST-PLAUS and early Bauteilkosten in BES-PRODUCT-TENDER. Keys: ePset_Cost.ProductClass, ePset_Cost.CalculatedType, ePset_Cost.ReferenceQuantity
  / price_unit (1 m², 1 m, 1 Stk). NPK line items are the calculation method – not new IFC attributes. Approved EPs live outside IFC; the project model still carries ePset_Cost.UnitPrice. Upstream typing/product
  mapping: BES-PRODUCT-TENDER. Distinct from QAS-COST-PLAUS (consumes office EPs; does not create them).'
