comment: 'Erstes Beschaffungspaket für Bestandsgrundlagen. Mindestumfang: Referenzpunkte, Lage- und Höhenbezug sowie Gelände. Danach folgen Gebäude-Punktwolke, konzeptbezogene Nachmodellierung sowie bei
  Bedarf Ausbau und TGA. Aufnahmeverfahren, Befliegung, LiDAR und terrestrische Ergänzung bleiben bei der Vermessung; zu klären ist, ob der Boden unter Vegetation für die Planung gebraucht wird. Nicht verbindliche
  Orientierung: LAS/LAZ 1.4, ASPRS mindestens Boden, Vegetation und Gebäude, 400 Punkte/m² oder 2-5 cm bei LOA20.'
