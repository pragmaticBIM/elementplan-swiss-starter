comment: Die Punktwolke ist die räumliche FM-Grundlage und ersetzt in diesem Workflow ein vollständig nachgeführtes Bestandsmodell. Klassifikationsumfang, stabile Kennzeichnungen, Datenbankschnittstelle,
  Prüfstichprobe, Verantwortlichkeiten und Aktualisierungsrhythmus sind projektspezifisch mit dem Betreiber festzulegen.
