comment: 'Binding basis is the building security concept. Spaces: SecurityZoneReference, SecurityLevel, ProtectionGoal (ePset_Space). Doors/windows: SecurityRating (Pset_DoorCommon / Pset_WindowCommon)
  per EN 1627 RC1–RC6. No separate DES requirements model in v1.'
