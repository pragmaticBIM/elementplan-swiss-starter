comment: Schlanke Wettbewerbsanforderung aus Gebäudestruktur und Raumvolumen ohne Türen und Fenster. Nur eine projektspezifische Schlüsselaufgabe wird so weit vertieft, dass Funktion und planerische Kompetenz
  beurteilt werden können.
