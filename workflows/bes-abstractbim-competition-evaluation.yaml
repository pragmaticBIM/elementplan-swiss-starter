id: pragmaticbim:workflow/bes-abstractbim-competition-evaluation
code: BES-ABSTRACTBIM-COMP
sort_order: 15
name:
  de: Wettbewerbsbeiträge mit Raummodell auswerten
  fr: Évaluer les projets de concours avec une maquette des locaux
  it: Valutare i progetti di concorso con un modello dei locali
  en: Evaluate competition entries with a room model
description:
  de: 'Wettbewerbsbeiträge mit möglichst geringem Modellierungsaufwand vergleichbar auswerten und die Vertiefung auf eine für die Aufgabe entscheidende Stelle konzentrieren.


    **Ausgangslage**

    - Manuell geführte Flächenlisten sind oft falsch und schwer zu prüfen.

    - Wettbewerbsentscheide werden wesentlich durch Städtebau, Volumetrie und die grundsätzliche Organisation geprägt.

    - Fassaden und innere Organisation werden im Vorprojekt häufig umfassend überarbeitet. Flächendeckend modellierte Türen, Fenster und Bauteile erzeugen deshalb hohen Aufwand und täuschen eine für den
    Wettbewerb unangemessene Planungsgenauigkeit vor.


    **Ziel & Nutzen**

    - Den Aufwand für Teilnehmende und Prüfung reduzieren, ohne die Beurteilung von Städtebau, Raumprogramm und grundsätzlicher Funktion einzuschränken.

    - An einer projektspezifischen Schlüsselaufgabe erkennen, ob der Beitrag funktioniert und das Team die anspruchsvolle Aufgabe planerisch bewältigen kann.


    **Ablauf**

    1. Für das Gesamtprojekt nur Gebäudestruktur und geschlossene, dem Raumprogramm zugeordnete Raumvolumen verlangen; Türen und Fenster sind nicht Bestandteil der Modellanforderung.

    2. Eine für die konkrete Aufgabe wichtige Stelle bestimmen, beispielsweise einen Wohnungstyp oder den Eingangsbereich, und deren vertiefte Ausarbeitung als Funktions- und Kompetenznachweis verlangen.

    3. Ist-Raumbuch mit Soll-Raumbuch abgleichen für die technische Vorprüfung.


    **Hinweis:** Sind weitere Bauteilmengen für Auswertungen notwendig, können diese mit abstractBIM berechnet werden.


    **Lieferergebnis**

    - Schlankes Raummodell jedes Beitrags mit Gebäudestruktur und zugeordneten Raumvolumen für das Gesamtprojekt.

    - Vertiefte Darstellung der vorgegebenen projektspezifischen Schlüsselaufgabe.

    - Abgleich von Ist- und Soll-Raumbuch als Grundlage der technischen Vorprüfung.'
  fr: 'Évaluer les projets de concours de manière comparable avec un effort de modélisation minimal et concentrer l''approfondissement sur un point déterminant pour la tâche.


    **Situation de départ**

    - Les listes de surfaces tenues manuellement sont souvent erronées et difficiles à vérifier.

    - Les décisions de concours reposent principalement sur l''urbanisme, la volumétrie et l''organisation générale.

    - Les façades et l''organisation intérieure sont souvent largement remaniées durant l''avant-projet. La modélisation généralisée des portes, fenêtres et éléments représente donc un travail important
    et suggère un degré de précision inadapté au concours.


    **Objectif et bénéfice**

    - Réduire le travail des participants et du contrôle sans limiter l''évaluation de l''urbanisme, du programme des locaux et du fonctionnement général.

    - Vérifier, au moyen d''un point clé propre au projet, si la proposition fonctionne et si l''équipe est capable de maîtriser la tâche exigeante.


    **Déroulement**

    1. Exiger pour l''ensemble du projet uniquement la structure du bâtiment et des volumes de locaux fermés rattachés au programme; les portes et fenêtres ne font pas partie des exigences de la maquette.

    2. Définir un point important pour la tâche concrète, par exemple un type de logement ou la zone d''entrée, et demander son approfondissement comme preuve de fonctionnement et de compétence.

    3. Comparer le carnet des locaux réel avec le carnet des locaux cible pour le contrôle technique préalable.


    **Remarque :** Si d''autres quantités d''éléments sont nécessaires pour les évaluations, elles peuvent être calculées avec abstractBIM.


    **Livrable**

    - Maquette légère de chaque projet comprenant la structure du bâtiment et les volumes de locaux attribués pour l''ensemble du projet.

    - Représentation approfondie du point clé propre au projet imposé par le programme du concours.

    - Comparaison du carnet des locaux réel et cible comme base du contrôle technique préalable.'
  it: 'Valutare i progetti di concorso in modo confrontabile con il minimo impegno di modellazione e concentrare l''approfondimento su un aspetto determinante per il compito.


    **Situazione di partenza**

    - Le liste delle superfici gestite manualmente sono spesso errate e difficili da verificare.

    - Le decisioni di concorso dipendono in misura rilevante dall''impianto urbanistico, dalla volumetria e dall''organizzazione generale.

    - Le facciate e l''organizzazione interna sono spesso ampiamente rielaborate nell''avamprogetto. La modellazione estesa di porte, finestre e componenti comporta quindi un onere elevato e suggerisce
    un grado di precisione inadeguato al concorso.


    **Obiettivo e beneficio**

    - Ridurre l''onere per i partecipanti e per la verifica senza limitare la valutazione dell''impianto urbanistico, del programma dei locali e del funzionamento generale.

    - Verificare, mediante un aspetto chiave specifico del progetto, se la proposta funziona e se il gruppo è in grado di affrontare il compito più impegnativo.


    **Svolgimento**

    1. Richiedere per l''intero progetto soltanto la struttura dell''edificio e volumi dei locali chiusi associati al programma; porte e finestre non fanno parte dei requisiti del modello.

    2. Definire un aspetto importante per il compito specifico, per esempio un tipo di appartamento o la zona d''ingresso, e richiederne l''approfondimento come prova di funzionalità e competenza.

    3. Confrontare il libro dei locali effettivo con il libro dei locali previsto per la verifica tecnica preliminare.


    **Nota:** Se sono necessarie ulteriori quantità di componenti per le valutazioni, queste possono essere calcolate con abstractBIM.


    **Risultato della fornitura**

    - Modello leggero di ogni progetto con struttura dell''edificio e volumi dei locali associati per l''intero progetto.

    - Rappresentazione approfondita dell''aspetto chiave specifico indicato nel programma di concorso.

    - Confronto tra libro dei locali effettivo e previsto come base della verifica tecnica preliminare.'
  en: 'Evaluate competition entries comparably with minimal modelling effort and focus detailed development on one aspect that is critical to the brief.


    **Starting point**

    - Manually maintained area schedules are often wrong and hard to verify.

    - Competition decisions are largely shaped by urban design, massing, and the overall organization.

    - Facades and internal organization are often substantially revised during preliminary design. Modelling doors, windows, and components throughout therefore creates excessive effort and suggests a level
    of precision that is inappropriate for a competition.


    **Goal & benefit**

    - Reduce the effort required from entrants and reviewers without limiting the assessment of urban design, the room programme, and basic functionality.

    - Use a project-specific key aspect to determine whether the proposal works and whether the team can resolve the demanding part of the brief.


    **Process**

    1. Require only the building structure and enclosed room volumes assigned to the room programme for the overall project; doors and windows are not part of the model requirement.

    2. Define one aspect that is important to the specific brief, such as an apartment type or entrance area, and require its detailed development as evidence of functionality and capability.

    3. Compare the as-built room book with the target room book for the technical pre-check.


    **Note:** If further component quantities are needed for evaluations, they can be calculated with abstractBIM.


    **Deliverable**

    - Lean room model for each entry with building structure and assigned room volumes for the overall project.

    - Detailed representation of the specified project-specific key aspect.

    - Comparison of as-built and target room books as the basis for the technical pre-check.'
