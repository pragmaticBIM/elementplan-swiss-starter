id: pragmaticbim:workflow/con-logistics-fit-out
code: CON-ROOM-LABEL
sort_order: 21
name:
  de: Räume auf der Baustelle kennzeichnen
  fr: Marquer les locaux sur le chantier
  it: Contrassegnare i locali in cantiere
  en: Label rooms on the construction site
description:
  de: 'Räume auf der Baustelle einheitlich aus dem Modell kennzeichnen, damit Orientierung, Lieferungen und Mängelmeldungen dieselbe Raumreferenz verwenden.


    **Ausgangslage**

    - Auf der Baustelle ist die räumliche Orientierung oft schwierig; Lieferungen und Mängelmeldungen fehlen ohne eindeutige Raumreferenz.

    - Papierlisten und mündliche Angaben veralten schnell und führen zu Fehlzuordnungen.


    **Ziel & Nutzen**

    - Einheitliche Raumkennzeichnung vor Ort (z. B. am Fenster) aus dem Modell ableiten.

    - QR-Scan für Orientierung sowie für Logistik- und Mängelerfassung an derselben, prüfbaren Raumreferenz.


    **Ablauf**

    1. Innenräume mit stabiler Planungsraumnummer (Name) und Raumnutzung (LongName) im Modell führen.

    2. Raumliste aus dem Modell ableiten und QR-Etiketten mit Raumname und Raumnummer drucken.

    3. Etiketten raumweise anbringen (z. B. am Fenster).


    **Lieferergebnis**

    - Raumdaten aus dem Architekturmodell mit eindeutiger Kennzeichnung und abgestimmter Ausbau-Checkliste.

    - QR-Etiketten je Raum mit dem Modell entsprechender Kennzeichnung.'
  fr: 'Imprimer un QR de local avec désignation et numéro et le poser dans chaque local – pour l''orientation, la logistique et la gestion des défauts en aménagement.


    **Situation de départ**

    - Sur chantier, l''orientation spatiale est souvent difficile ; livraisons et signalements de défauts manquent sans référence de local claire.

    - Listes papier et indications orales vieillissent vite et provoquent des affectations erronées.


    **Objectif et bénéfice**

    - Déduire du modèle un marquage de local uniforme sur place (p. ex. à la fenêtre).

    - Scan QR pour l''orientation ainsi que pour la saisie logistique et des défauts sur la même référence de local vérifiable.


    **Déroulement**

    1. Saisir dans le modèle les locaux intérieurs avec numéro technique stable (Name) et usage du local (LongName).

    2. Extraire la liste des locaux du modèle et imprimer des étiquettes QR avec désignation et numéro.

    3. Poser les étiquettes local par local (p. ex. à la fenêtre).


    **Livrable**

    - Données des locaux issues de la maquette architecture avec identification claire et liste de contrôle coordonnée.

    - Étiquettes QR par local avec identification conforme à la maquette.'
  it: 'Stampare un QR locale con denominazione e numero e affiggerlo in ogni locale – per orientamento, logistica e gestione dei difetti in finitura.


    **Situazione di partenza**

    - In cantiere l''orientamento spaziale è spesso difficile; consegne e segnalazioni di difetti mancano senza un riferimento di locale chiaro.

    - Elenchi cartacei e indicazioni orali invecchiano in fretta e portano ad assegnazioni errate.


    **Obiettivo e beneficio**

    - Ricavare dal modello una marcatura uniforme del locale in loco (es. sulla finestra).

    - Scansione QR per l''orientamento e per la rilevazione logistica e dei difetti sulla stessa referenza di locale verificabile.


    **Svolgimento**

    1. Gestire nel modello i locali interni con numero tecnico stabile (Name) e uso del locale (LongName).

    2. Estrarre l''elenco locali dal modello e stampare etichette QR con denominazione e numero.

    3. Affiggere le etichette locale per locale (es. sulla finestra).


    **Risultato della fornitura**

    - Dati dei locali dal modello di architettura con identificazione univoca e lista di controllo coordinata.

    - Etichette QR per ogni locale con identificazione corrispondente al modello.'
  en: 'Label rooms consistently on site from the model so that orientation, deliveries, and defect reports use the same room reference.


    **Starting point**

    - On site, spatial orientation is often difficult; deliveries and defect reports lack a clear room reference.

    - Paper lists and verbal notes go stale quickly and cause misassignment.


    **Goal & benefit**

    - Derive uniform on-site room labelling (e.g. on the window) from the model.

    - QR scan for orientation and for logistics and defect capture on the same verifiable room reference.


    **Process**

    1. Maintain interior spaces in the model with stable planning room number (Name) and room use (LongName).

    2. Extract the room list from the model and print QR labels with room name and number.

    3. Affix labels room by room (e.g. on the window).


    **Deliverable**

    - Space data from the architecture model with clear identification and a coordinated fit-out checklist.

    - QR labels for each space with identification matching the model.'
