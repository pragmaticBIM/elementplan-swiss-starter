comment: This workflow integrates requirements but does not author them. The approved fire protection and building physics reports remain authoritative. Spatial mapping uses normalized LongName values,
  UsageUnitReference / FireCompartmentReference of adjacent spaces, and exterior, terrain, and party-boundary topology. The combined profile may include FireRating, AcousticRating, and ThermalTransmittance;
  Reference identifies the proposed catalogue type.
