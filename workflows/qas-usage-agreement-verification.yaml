comment: Compare properties with identical names between the Requirements and Actual property sets. Structural capacity and available airflow, occupancy, operating duration, and illuminance must meet or
  exceed the requirement; verified temperature and humidity ranges must remain within the agreed limits. Vibration classes require an explicit ordered comparison. Missing actual values are reported as gaps,
  not treated as compliant.
