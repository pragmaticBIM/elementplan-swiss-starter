comment: 'Deliverable document: pragmaticbim:document/design-build-tender-basis (DBA). Die verbindliche Preiswirkung entsteht aus Angebot und Vertrag, nicht aus dem Modell allein. abstractBIM liefert aus
  dem schlanken Raummodell Anforderungen und Richtmengen für die funktionale Ausschreibung; die Lösung selbst bleibt Aufgabe der Design-Build-Anbietenden.'
