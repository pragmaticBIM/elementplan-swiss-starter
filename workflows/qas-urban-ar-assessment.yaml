comment: On-site AR review of urban massing. Minimum geometry is storey-wise gross volumes (same basis as DES-URBAN-MASS) plus simplified trees for planting, retention, and removal. Survey reference points
  place the model on site. Surroundings that stay unchanged remain real and are not modelled. Not a tree-preservation proof (QAS-TREE-PRESERVE) and not a quantity take-off.
