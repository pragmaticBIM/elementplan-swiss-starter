id: pragmaticbim:workflow/des-full-life-cycle-calculation
code: DES-LCA
sort_order: 55
name:
  de: Ökobilanz berechnen
  fr: Calculer l'écobilan
  it: Calcolare l'ecobilancio
  en: Calculate the life-cycle assessment
description:
  de: 'Bauteilmengen, Materialien und Produktklasse so führen, dass Ökobilanz und graue Energie über KBOB ohne parallele Mengenermittlung möglich werden.


    **Ausgangslage**

    - Lebenszyklusbewertungen brauchen belastbare Mengen und Materialangaben; diese werden oft separat manuell ermittelt.

    - Manuelle Nachpflege für SNBS, KBOB oder LCA-Tools ist fehleranfällig und verzögert Entscheide – der Produkt-zu-KBOB-Bezug fehlt oft im Modell.


    **Ziel & Nutzen**

    - Frühere, wiederholbare Lebenszyklus- und Graue-Energie-Berechnungen statt später Einmalaufwände.

    - KBOB-Kennwerte über die Produktklasse am Bauteil auflösen statt Materialien von Hand nachzuschlüsseln.


    **Ablauf**

    1. Massgebende Bauteile mit Geometrie, Materialangabe und Produktklasse im Modell führen.

    2. Mengen ausziehen und KBOB-Codes (inkl. verwandter Codes) über die Produktklasse aus dem Produktkatalog auflösen.

    3. Daten in die LCA-/KBOB-Werkzeuge übernehmen und Varianten (graue Energie, GWP) vergleichen.


    **Lieferergebnis**

    - Architektur- und Tragwerksmodell mit Material-, Mengen- und Produktklasseninformationen

    - Zum Modell rückverfolgbarer Datensatz für Ökobilanz, graue Energie und Variantenvergleich'
  fr: 'Tenir quantités, matériaux et classe de produit dans le modèle pour permettre ACV et énergie grise via KBOB sans métrés parallèles.


    **Situation de départ**

    - Les évaluations du cycle de vie exigent des quantités et matériaux fiables ; ils sont souvent établis manuellement à part.

    - La reprise manuelle pour SNBS, KBOB ou outils ACV est source d''erreurs et retarde les décisions – le lien produit→KBOB manque souvent dans la maquette.


    **Objectif et bénéfice**

    - Calculs de cycle de vie et d''énergie grise plus précoces et reproductibles plutôt que des reprises tardives.

    - Résoudre les indicateurs KBOB via la classe de produit sur l''élément au lieu de reclasser les matériaux à la main.


    **Déroulement**

    1. Tenir les éléments déterminants avec géométrie, matériau et classe de produit dans la maquette.

    2. Extraire les quantités et résoudre les codes KBOB (y compris codes liés) via la classe de produit du catalogue produits.

    3. Transférer les données dans les outils ACV/KBOB et comparer les variantes (énergie grise, GWP).


    **Livrable**

    - Maquettes architecture et structure avec informations matériaux, quantités et classe de produit

    - Jeu de données traçable jusqu''aux maquettes pour ACV, énergie grise et comparaison de variantes'
  it: 'Gestire quantità, materiali e classe di prodotto nel modello per consentire LCA ed energia grigia via KBOB senza computi paralleli.


    **Situazione di partenza**

    - Le valutazioni del ciclo di vita richiedono quantità e materiali affidabili; spesso vengono rilevati manualmente a parte.

    - Il ripristino manuale per SNBS, KBOB o strumenti LCA è soggetto a errori e ritarda le decisioni – il collegamento prodotto→KBOB spesso manca nel modello.


    **Obiettivo e beneficio**

    - Calcoli di ciclo di vita ed energia grigia più precoci e ripetibili invece di riprese tardive.

    - Risolvere gli indicatori KBOB tramite la classe di prodotto sul componente invece di riclassificare i materiali a mano.


    **Svolgimento**

    1. Gestire i componenti rilevanti con geometria, materiale e classe di prodotto nel modello.

    2. Estrarre le quantità e risolvere i codici KBOB (inclusi i codici correlati) tramite la classe di prodotto del catalogo prodotti.

    3. Trasferire i dati negli strumenti LCA/KBOB e confrontare le varianti (energia grigia, GWP).


    **Risultato della fornitura**

    - Modelli di architettura e struttura con informazioni su materiali, quantità e classe di prodotto

    - Set di dati tracciabile fino ai modelli per LCA, energia grigia e confronto delle varianti'
  en: 'Carry component quantities, materials, and product class so LCA and grey energy via KBOB are possible without parallel quantity lists.


    **Starting point**

    - Life-cycle assessments need reliable quantities and material data; these are often taken off manually in parallel.

    - Manual rework for SNBS, KBOB, or LCA tools is error-prone and delays decisions – the product→KBOB link is often missing in the model.


    **Goal & benefit**

    - Earlier, repeatable life-cycle and grey-energy calculations instead of late one-off rework.

    - Resolve KBOB indicators via the product class on the component instead of re-keying materials by hand.


    **Process**

    1. Carry governing components with geometry, material, and product class in the model.

    2. Extract quantities and resolve KBOB codes (including related codes) via the product class from the product catalogue.

    3. Transfer the data into LCA/KBOB tools and compare variants (grey energy, GWP).


    **Deliverable**

    - Architecture and structural models with material, quantity, and product-class information

    - Dataset traceable to the models for LCA, grey energy, and option comparison'
