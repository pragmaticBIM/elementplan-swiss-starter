comment: 'Environmental LCA (Ökobilanz), not lifecycle costing. Material attribute and ePset_Cost.ProductClass required on governing building elements. Resolve KBOB / kbob_related from the product catalogue
  bridge (book product- classifications.yaml / schema.pragmaticbim.ch), not as a separate IFC attribute. Distinct from DES-MATERIAL-PASS: ePset_Circularity.MaterialOrProductId is a Madaster/baubook ID space,
  not schema ProductClass. ProductClass assignment upstream: BES-PRODUCT-TENDER.'
