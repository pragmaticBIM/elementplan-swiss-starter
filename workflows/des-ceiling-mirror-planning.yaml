comment: FinishCeilingHeight on the space records clear height to the suspended ceiling (worst case / deepest underside if uneven). From design development onward, suspended ceilings are modelled as IfcCovering
  layers. Relevant MEP insertions for coordination include dampers, air terminals, light fixtures, sprinklers, and smoke detectors.
