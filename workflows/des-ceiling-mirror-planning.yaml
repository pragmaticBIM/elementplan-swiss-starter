id: pragmaticbim:workflow/des-ceiling-mirror-planning
code: DES-CEILING-MIRROR
sort_order: 48
name:
  de: Abhangdecken koordinieren
  fr: Coordonner les plafonds suspendus
  it: Coordinare i controsoffitti
  en: Coordinate suspended ceilings
description:
  de: 'Abhangdecken von der frühen Raumzuweisung bis zur ausführungsreifen Schichtmodellierung im Modell abbilden, damit Ausbau und TGA zuverlässig koordiniert werden können.


    **Ausgangslage**

    - Deckenspiegel geschehen oft in 2D; Koordination mit Gebäudetechnik entsteht spät.

    - Revisionsöffnungen in Abhangdecken fehlen im Modell häufig für die Ausschreibung und auf der Baustelle. Diese werden in Regie oder noch schlimmer im laufenden Betrieb ergänzt.


    **Ziel & Nutzen**

    - Frühzeitige Koordination bringt Planungs-, Kosten- und Ausführungssicherheit.


    **Ablauf**

    1. Innenräume bereitstellen.

    2. Abhangdecken als modellierte Schichten mit Bauteiltypen und Revisionsöffnungen modellieren.

    3. Deckenspiegel mit den relevanten GT-Einbauten abstimmen und Revisionsöffnungen nach den Erfordernissen der Gebäudetechnik einplanen.


    **Lieferergebnis**

    - Architekturmodell mit den erforderlichen Höhen-, Aufbau- und Revisionsinformationen der Abhangdecken'
  fr: 'Aménagement intérieur – mener les plafonds suspendus dans le modèle, de l''affectation initiale par local à la modélisation par couche prête à l''exécution pour la coordination CVC.


    **Situation de départ**

    - Le plan de plafond est souvent planifié en 2D ; la coordination avec le CVC arrive tard.

    - Les trappes de plafond suspendu manquent fréquemment dans le modèle pour l''appel d''offres.


    **Objectif et bénéfice**

    - Plafonds suspendus incluant trappes comme couche modélisée avec intrados défini pour la coordination CVC.


    **Déroulement**

    1. Fournir les locaux intérieurs.

    2. Modéliser les plafonds suspendus comme couches avec types de composants et trappes.

    3. Coordonner le plan de plafond avec les équipements CVC pertinents.


    **Livrable**

    - Maquette architecture avec les informations requises sur les hauteurs, la composition et les trappes des plafonds suspendus'
  it: 'Finiture interne – gestire i controsoffitti nel modello, dall''assegnazione in fase iniziale per locale alla modellazione a strati esecutiva per il coordinamento impianti.


    **Situazione di partenza**

    - Lo piano del soffitto è spesso pianificato in 2D; il coordinamento con gli impianti arriva tardi.

    - Le botole in controsoffitti mancano spesso nel modello per la gara.


    **Obiettivo e beneficio**

    - Controsoffitti incluse botole come strato modellato con intradosso definito per il coordinamento impianti.


    **Svolgimento**

    1. Fornire i locali interni.

    2. Modellare i controsoffitti come strati con tipi di componente e botole.

    3. Coordinare lo piano del soffitto con gli inserti impiantistici pertinenti.


    **Risultato della fornitura**

    - Modello di architettura con le informazioni necessarie su altezze, stratigrafia e botole dei controsoffitti'
  en: 'Represent suspended ceilings in the model from early room assignment through construction-ready layer modelling so that fit-out and MEP can be coordinated reliably.


    **Starting point**

    - Ceiling mirrors are often planned in 2D; MEP coordination comes late.

    - Access openings in suspended ceilings are often missing from the model for tendering and on site. They are then added as daywork or, worse, during operation.


    **Goal & benefit**

    - Early coordination provides certainty for design, cost, and construction.


    **Process**

    1. Provide interior spaces.

    2. Model suspended ceilings as layers with component types and access openings.

    3. Coordinate the reflected ceiling plan with the relevant MEP fixtures and plan access openings to meet building-services requirements.


    **Deliverable**

    - Architecture model with the required suspended-ceiling height, build-up and access information'
