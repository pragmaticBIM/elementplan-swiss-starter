comment: Optional international handover profile. COBie is an internationally agreed information-exchange schema for facility data. Software support must be verified against the selected COBie version and
  the operator's target system. Attribute scope follows the curated minimal and 3D FM handover requirements; ordinary construction elements are not included unless they are managed assets. An elevator-space
  object remains a space and must not be treated as the physical elevator asset. Phases typically 51–62.
