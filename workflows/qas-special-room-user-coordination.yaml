comment: Quick-and-dirty room type sketches for user meetings. Room volumes stay rough; equipment, outlets, switches etc. must be modelled at decision-relevant detail. Formal element modelling guidelines
  do not apply to spaces; replace with proper interior spaces in later design workflows.
