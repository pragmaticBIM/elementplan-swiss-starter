comment: DES-FIRE-CONCEPT produces the requirements model from the approved BSK. QAS-FIRE compares its spatially assigned targets with FireRating (VKF), Status, and PredefinedType in the architecture model.
  Non-load-bearing interior walls use EI; load-bearing interior walls use R/REI. The BSK and BSP remain the authoritative specialist documents.
