id: pragmaticbim:workflow/qas-fire-protection
code: QAS-FIRE
sort_order: 78
name:
  de: Feuerwiderstand an Bauteilen prüfen
  fr: Contrôler la résistance au feu des éléments
  it: Verificare la resistenza al fuoco dei componenti
  en: Check fire resistance on components
description:
  de: 'Architekturmodell automatisiert gegen das freigegebene Brandschutz-Anforderungsmodell prüfen, damit Abweichungen nach jeder relevanten Planungsänderung sichtbar werden.


    **Ausgangslage**

    - Bei der manuellen Übernahme von Brandschutzanforderungen in das Architekturmodell entstehen Lücken, widersprüchliche Kennwerte und hoher Abstimmungsaufwand.

    - Punktuelle Prüfungen bei Phasenabschlüssen oder auf Zuruf erkennen Abweichungen nach Planungsänderungen häufig erst spät.


    **Ziel & Nutzen**

    - Sollanforderungen anhand der räumlichen Beziehungen automatisiert den Bauteilen des Architekturmodells gegenüberstellen.

    - Fehlende, abweichende oder nicht eindeutig zuordenbare Angaben früh ausweisen und deren Bereinigung nachvollziehbar dokumentieren.


    **Ablauf**

    1. Freigegebenes Brandschutz-Anforderungsmodell und aktuelles Architekturmodell bereitstellen.

    2. Räumliche Zuordnung und Feuerwiderstand der Bauteile automatisiert mit den Sollanforderungen vergleichen.

    3. Abweichungen dokumentieren, fachlich beurteilen und durch die zuständige Planung im Anforderungs- oder Architekturmodell bereinigen.


    **Lieferergebnis**

    - Geprüftes Architekturmodell mit abgestimmten Brandschutzinformationen

    - Nachvollziehbarer Prüfbericht mit offenen, akzeptierten und bereinigten Abweichungen'
  fr: 'Contrôler automatiquement la maquette d''architecture par rapport au modèle d''exigences de protection incendie approuvé, afin de rendre visibles les écarts après chaque modification déterminante
    du projet.


    **Situation de départ**

    - Le report manuel des exigences incendie dans la maquette d''architecture entraîne des lacunes, des valeurs contradictoires et un important travail de coordination.

    - Les contrôles ponctuels en fin de phase ou sur demande détectent souvent trop tard les écarts dus aux modifications du projet.


    **Objectif et bénéfice**

    - Comparer automatiquement les exigences de référence aux éléments de la maquette d''architecture à partir des relations spatiales.

    - Signaler rapidement les indications manquantes, divergentes ou non attribuables sans ambiguïté et documenter leur traitement de manière traçable.


    **Déroulement**

    1. Fournir le modèle d''exigences de protection incendie approuvé et la maquette d''architecture actuelle.

    2. Comparer automatiquement l''attribution spatiale et la résistance au feu des éléments avec les exigences de référence.

    3. Documenter les écarts, les évaluer du point de vue spécialisé et les faire corriger par le mandataire responsable dans le modèle d''exigences ou la maquette d''architecture.


    **Livrable**

    - Maquette d''architecture contrôlée avec des informations de protection incendie coordonnées

    - Rapport de contrôle traçable indiquant les écarts ouverts, acceptés et corrigés'
  it: 'Verificare automaticamente il modello di architettura rispetto al modello dei requisiti antincendio approvato, affinché gli scostamenti siano visibili dopo ogni modifica rilevante del progetto.


    **Situazione di partenza**

    - Il trasferimento manuale dei requisiti antincendio nel modello di architettura causa lacune, valori contraddittori e un notevole onere di coordinamento.

    - Le verifiche puntuali alla fine delle fasi o su richiesta individuano spesso troppo tardi gli scostamenti dovuti alle modifiche del progetto.


    **Obiettivo e beneficio**

    - Confrontare automaticamente i requisiti di riferimento con gli elementi del modello di architettura in base alle relazioni spaziali.

    - Evidenziare tempestivamente le informazioni mancanti, divergenti o non attribuibili in modo univoco e documentarne la risoluzione in modo tracciabile.


    **Svolgimento**

    1. Fornire il modello dei requisiti antincendio approvato e il modello di architettura aggiornato.

    2. Confrontare automaticamente l''attribuzione spaziale e la resistenza al fuoco degli elementi con i requisiti di riferimento.

    3. Documentare gli scostamenti, valutarli dal punto di vista specialistico e farli correggere dal progettista responsabile nel modello dei requisiti o nel modello di architettura.


    **Risultato della fornitura**

    - Modello di architettura verificato con informazioni antincendio coordinate

    - Rapporto di verifica tracciabile con gli scostamenti aperti, accettati e risolti'
  en: 'Automatically check the architecture model against the approved fire protection requirements model so deviations become visible after every relevant design change.


    **Starting point**

    - Manually transferring fire protection requirements to the architecture model creates gaps, conflicting values, and substantial coordination effort.

    - Spot checks at phase completion or on request often detect deviations caused by design changes too late.


    **Goal & benefit**

    - Automatically compare target requirements with architecture components based on their spatial relationships.

    - Identify missing, divergent, or ambiguous information early and document its resolution traceably.


    **Process**

    1. Provide the approved fire protection requirements model and the current architecture model.

    2. Automatically compare component location and fire resistance with the target requirements.

    3. Document deviations, get a specialist assessment, and have the responsible designer resolve them in the requirements or architecture model.


    **Deliverable**

    - Checked architecture model with coordinated fire protection information

    - Traceable check report showing open, accepted, and resolved deviations'
