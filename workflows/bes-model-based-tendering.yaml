comment: 'ePset_Cost.ProductClass links the component to the descriptions published by schema.pragmaticbim.ch. ProductClass, ePset_Cost.CalculatedType, and the component''s performance attributes form the
  structured input for type-based NPK or functional specifications. Early Bauteilkosten = model quantity × ePset_Cost.UnitPrice (or office/schema EP for that ProductClass) – formal EP plausibility is QAS-COST-PLAUS;
  office EPs are produced by BES-UNIT-PRICE. CalculatedType remains the common reference between model, quantities, tender drawings, and specifications. The model supplements rather than replaces the written
  tender documents. Typing is derived here, not in a separate workflow. CalculatedType is the grouping token – not the schema product description. DMN/FEEL lives in book Anhang D (Bauteiltypisierung), not
  in this description or on attribute definitions. Attributes keep a short meaning, logic name, and example only (no Anhang pointer – must work in the webapp). Type tokens are German by design (Swiss LV/KVA).
  Do not store the result in occurrence Name. Logic names: FundamentTypisierung, WandTypisierung, PlattenTypisierung, StuetzeTypisierung, TraegerTypisierung, TreppeTypisierung, TuerTypisierung, FensterTypisierung.
  Inputs in metres; omit empty segments; separator _. Downstream: QAS-COST-PLAUS, BES-UNIT-PRICE, trade tender bases, DES-LCA.'
