comment: Construction-phase use case, typically SIA 51–53. Weekly 360° route compared with the schedule. Name the capture category (360° progress service) without product names. Interior spaces use Name
  as the stable technical room number and LongName as the room use. A4 QR room labels can reuse CON-ROOM-LABEL; this workflow adds the defined capture route, weekly recurrence, spatial assignment, schedule
  comparison, and gap follow-up.
