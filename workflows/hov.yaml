name:
  de: Übergabe
  fr: Réception
  it: Consegna
  en: Handover
description:
  de: 'Fertigstellung, Abnahme und Übergabe des Bauwerks und der Dokumentation an Eigentümer oder Betreiber. Beispiele: Inbetriebnahme, FM-Datenlieferung, Betriebs- und Wartungsunterlagen, Gewährleistungsübergabe,
    Betriebsübernahme.'
  fr: 'Achèvement, réception et transfert de l''ouvrage et de la documentation au maître d''ouvrage ou exploitant. Exemples: mise en service, livraison de données FM, manuels d''exploitation, réception
    avec garanties, reprise par l''exploitant.'
  it: 'Completamento, collaudo e consegna dell''opera e della documentazione al committente o gestore. Esempi: messa in servizio, consegna dati FM, manuali O&M, consegna in garanzia, presa in carico dell''impianto.'
  en: 'Completion, acceptance, and transfer of the asset and documentation to the owner or operator. Examples: commissioning, FM data delivery, O&M manuals, warranty handover, facility takeover.'
