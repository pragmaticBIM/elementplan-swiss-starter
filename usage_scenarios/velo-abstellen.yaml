description:
  de: Bewohnende verlassen die Wohnung, gehen über das Treppenhaus und stellen das Velo im Innenbereich ab.
  fr: Les occupants quittent le logement, empruntent la cage d'escalier et rangent le vélo à l'intérieur du bâtiment.
