  de: Bewohnende verlassen das Wohnzimmer über den Wohnungseingang und das Treppenhaus zur Strasse; der Fluchtbalkon ist der zweite Ausgang.
  fr: Les occupants quittent le séjour par l'entrée du logement et la cage d'escalier jusqu'à la rue ; le balcon de fuite est la seconde sortie.
  it: Chi abita lascia il soggiorno dall'ingresso dell'alloggio e dal vano scale fino alla strada; il balcone di fuga è la seconda uscita.
  en: Occupants leave the living room via the dwelling entry and stairwell to the street; the escape balcony is the second exit.
