name:
  de: Wohnalltag
  fr: Vie quotidienne
  it: Vita quotidiana
  en: Daily living
description:
  de: Bewohnende betreten die Wohnung, erreichen über den Gang Wohnzimmer, Küche, Schlafzimmer und Bad und essen vom Kochbereich aus im Esszimmer.
  fr: Les occupants entrent dans le logement, rejoignent séjour, cuisine, chambre et salle de bain par le couloir, et passent de la cuisine à la salle à manger.
  it: Chi abita entra nell'alloggio, raggiunge soggiorno, cucina, camera e bagno dal corridoio e dalla cucina accede alla sala da pranzo.
  en: Occupants enter the dwelling, reach living room, kitchen, bedroom, and bathroom from the hallway, and go from the kitchen to the dining room.
