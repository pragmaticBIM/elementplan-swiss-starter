name:
  de: Ankommen
  fr: Arriver
  it: Arrivare
  en: Arriving home
description:
  de: Bewohnende kommen von der Strasse in die Eingangshalle, treten in die Wohnung und legen im Entree ab, bevor der Gang die Wohnung erschliesst.
  fr: Les occupants arrivent de la rue dans le hall d'entrée, entrent dans le logement et déposent leurs affaires dans l'entrée, avant que le couloir desserve le logement.
  it: Chi abita arriva dalla strada nell'atrio, entra nell'alloggio e depone nell'entrata, prima che il corridoio distribuisca l'alloggio.
  en: Occupants arrive from the street into the lobby, enter the dwelling, and drop belongings in the entrance hall before the hallway serves the rooms.
