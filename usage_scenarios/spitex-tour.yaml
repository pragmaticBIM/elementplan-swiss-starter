  de: Spitex-Tour
  fr: Tournée de soins à domicile
  it: Giro di cure a domicilio
  en: Home-care visit
description:
  de: Die Spitex kommt über Eingangshalle und Aufzugszone in die Wohnung und erreicht Schlafzimmer und Bad auf kurzem Weg.
  fr: Les soins à domicile arrivent par le hall d'entrée et le palier d'ascenseur dans le logement, puis rejoignent chambre et salle de bain sur un court trajet.
  it: Le cure a domicilio arrivano dall'atrio e dalla zona ascensore nell'alloggio e raggiungono camera e bagno su un percorso breve.
  en: Home-care staff arrive via the lobby and elevator lobby at the dwelling, then reach bedroom and bathroom on a short path.
