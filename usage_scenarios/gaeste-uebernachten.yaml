name:
  de: Gäste übernachten
  fr: Hôtes qui restent la nuit
  it: Ospiti che pernottano
  en: Overnight guests
description:
  de: Gäste betreten die Wohnung, erreichen über den Gang das Gästezimmer und von dort das Bad.
  fr: Les hôtes entrent dans le logement, rejoignent la chambre d'amis par le couloir, puis la salle de bain.
  it: Gli ospiti entrano nell'alloggio, raggiungono la camera ospiti dal corridoio e da lì il bagno.
  en: Guests enter the dwelling, reach the guest room from the hallway, and from there the bathroom.
