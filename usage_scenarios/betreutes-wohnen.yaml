id: pragmaticbim:usage-scenario/betreutes-wohnen
code: US-WH-06
sort_order: 6
name:
  de: Betreutes Wohnen
  fr: Habitat accompagné
  it: Abitare assistito
  en: Assisted living
description:
  de: Bewohnende mit Unterstützungsbedarf kommen über die Eingangshalle und die Aufzugszone zur Wohnung und erreichen von dort Wohnzimmer und Bad auf kurzem Weg.
  fr: Les occupants qui ont besoin d'accompagnement arrivent par le hall d'entrée et le palier d'ascenseur au logement, puis rejoignent séjour et salle de bain sur un court trajet.
  it: Chi abita e necessita di accompagnamento arriva dall'atrio e dalla zona ascensore all'alloggio, poi raggiunge soggiorno e bagno su un percorso breve.
  en: Occupants who need support arrive via the lobby and elevator lobby at the dwelling, then reach living room and bathroom on a short path.
scenario_group: Wohnen
