description:
  de: Bewohnende verlassen die Wohnung, gehen über das Treppenhaus und geben den Abfall im Abfallraum ab.
  fr: Les occupants quittent le logement, empruntent la cage d'escalier et déposent les déchets au local déchets.
  it: Chi abita esce dall'alloggio, percorre il vano scale e conferisce i rifiuti nel locale rifiuti.
  en: Occupants leave the dwelling, use the stairwell, and drop waste in the waste room.
