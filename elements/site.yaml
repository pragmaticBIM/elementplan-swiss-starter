name:
  de: Areal
  fr: Site
  it: Sito
  en: Site
definition:
  de: |
    Planungsperimeter als Grundstück bzw. Areal (IfcSite). Dem Projekt zugeordnet.

    **Modellierung**
    - Genau ein IfcSite als Planungsperimeter.
    - Mehrere Parzellen können zu einem IfcSite zusammengefasst werden.
  fr: |
    Périmètre de planification comme terrain ou site (IfcSite). Rattaché au projet.

    **Modélisation**
    - Exactement un IfcSite comme périmètre de planification.
    - Plusieurs parcelles peuvent être regroupées en un IfcSite.
  it: |
    Perimetro di pianificazione come terreno o sito (IfcSite). Collegato al progetto.

    **Modellazione**
    - Esattamente un IfcSite come perimetro di pianificazione.
    - Più particelle possono essere riunite in un IfcSite.
  en: |
    Planning perimeter as the site (IfcSite). Assigned to the project.

    **Modelling**
    - Exactly one IfcSite as the planning perimeter.
    - Several parcels may be combined into one IfcSite.
