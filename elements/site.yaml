id: pragmaticbim:element/site
code: SITE
sort_order: 2
status: active
name:
  de: Planungsperimeter
  fr: Site
  it: Sito
  en: Site
definition:
  de: 'Grenzt den gemeinsamen Bearbeitungsbereich ab, damit Gebäude, Grundstücksbezüge und Umgebungsplanung räumlich konsistent koordiniert werden können.


    **Beschreibung**

    - Planungsperimeter des Projekts.

    - Dem Projekt zugeordnet.


    **Modellierungshinweis**

    - Genau ein Planungsperimeter.

    - Mehrere baurechtliche Parzellen können in einem Planungsperimeter abgebildet sein.'
  fr: 'Délimite le périmètre d''intervention commun afin de coordonner de manière cohérente les bâtiments, les références parcellaires et les aménagements extérieurs.


    **Description**

    - Périmètre de planification du projet.

    - Rattaché au projet.


    **Directives de modélisation**

    - Exactement un périmètre de planification.

    - Plusieurs parcelles au sens du droit de la construction peuvent être représentées dans un périmètre de planification.'
  it: 'Delimita il perimetro d''intervento comune per coordinare in modo coerente gli edifici, i riferimenti particellari e le sistemazioni esterne.


    **Descrizione**

    - Perimetro di pianificazione del progetto.

    - Collegato al progetto.


    **Direttive di modellazione**

    - Esattamente un perimetro di pianificazione.

    - Più particelle edilizie possono essere rappresentate in un perimetro di pianificazione.'
  en: 'Defines the shared project area so that buildings, property references, and external works can be coordinated consistently in space.


    **Description**

    - Planning perimeter of the project.

    - Assigned to the project.


    **Modelling guidelines**

    - Exactly one planning perimeter.

    - Several building-law parcels may be represented in one planning perimeter.'
