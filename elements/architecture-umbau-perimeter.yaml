name:
  de: Umbauperimeter
  fr: Périmètre de transformation
  it: Perimetro di trasformazione
  en: Alteration area
definition:
  de: 'Macht geplante und abgeschlossene Umbauten im Gesamtmodell räumlich und zeitlich nachvollziehbar.


    **Beschreibung**

    - Volumen, das den Bearbeitungsbereich eines eigenständigen Umbauprojekts abgrenzt.

    - Bleibt nach Abschluss als Historieneintrag im Gesamtmodell erhalten – kein Raumobjekt und kein Bauwerksteil.


    **Modellierungshinweis**

    - Als vereinfachten Proxy-Körper mit der tatsächlichen räumlichen Ausdehnung des Umbauprojekts modellieren.

    - Dem Planungsperimeter bzw. den betroffenen Geschossen zuweisen; ObjectType = Umbauperimeter.

    - Name = Projektnummer; StartDate und EndDate = geplanter Bearbeitungszeitraum.

    - Pro Umbauprojekt einen eigenen Körper mit stabiler GlobalId führen und nach Abschluss mit AlterationStatus = COMPLETED im Modell belassen.'
  fr: 'Rend les transformations prévues et achevées traçables dans la maquette globale, dans l''espace et dans le temps.


    **Description**

    - Volume délimitant le secteur traité par un projet de transformation autonome.

    - Reste dans la maquette globale après l''achèvement comme trace historique – ce n''est ni un local ni un élément de construction.


    **Directives de modélisation**

    - Modéliser comme corps proxy simplifié selon l''étendue spatiale réelle du projet de transformation.

    - Rattacher au périmètre de planification ou aux étages concernés ; ObjectType = Périmètre de transformation.

    - Name = numéro du projet ; StartDate et EndDate = période d''étude prévue.

    - Saisir un corps distinct avec un GlobalId stable par projet de transformation et le conserver dans la maquette après l''achèvement avec AlterationStatus = COMPLETED.'
  it: 'Rende tracciabili nel modello complessivo, nello spazio e nel tempo, le trasformazioni previste e completate.


    **Descrizione**

    - Volume che delimita l''area interessata da un progetto di trasformazione autonomo.

    - Rimane nel modello complessivo dopo il completamento come traccia storica – non è né un locale né un elemento costruttivo.


    **Direttive di modellazione**

    - Modellare come corpo proxy semplificato secondo l''estensione spaziale effettiva del progetto di trasformazione.

    - Assegnare al perimetro di pianificazione o ai piani interessati; ObjectType = Perimetro di trasformazione.

    - Name = numero del progetto; StartDate e EndDate = periodo di progettazione previsto.

    - Gestire un corpo separato con GlobalId stabile per ogni progetto di trasformazione e conservarlo nel modello dopo il completamento con AlterationStatus = COMPLETED.'
  en: 'Makes planned and completed alterations spatially and chronologically traceable in the overall model.


    **Description**

    - Volume defining the area covered by a separate alteration project.

    - Remains in the overall model as a historical record after completion – it is neither a space nor a building component.


    **Modelling guidelines**

    - Model as a simplified proxy body matching the actual spatial extent of the alteration project.

    - Assign to the planning perimeter or affected storeys; ObjectType = Alteration area.

    - Name = project number; StartDate and EndDate = planned design period.

    - Keep one separate body with a stable GlobalId for each alteration project and retain it in the model after completion with AlterationStatus = COMPLETED.'
