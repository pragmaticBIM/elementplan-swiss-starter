id: pragmaticbim:element/spaces-parking
code: SPACE-PARK
sort_order: 15
status: active
name:
  de: Parkplätze
  fr: Places de stationnement
  it: Posti auto
  en: Parking spaces
definition:
  de: 'Ermöglicht ab Bauprojekt einen nachvollziehbaren Parkplatznachweis sowie belastbare Flächen- und Verkehrsplanung.


    **Beschreibung**

    - Einzelne Parkplätze (innen oder aussen) als eigene Raumvolumen.

    - Dienen dem Parkplatznachweis und der Flächenauswertung aus dem Modell.


    **Modellierungshinweis**

    - Ab Bauprojekt jeden Parkplatz als eigenen Raum modellieren.

    - Name mit eindeutiger Parkplatznummer führen (z. B. P0016).

    - Dem zugehörigen Geschoss bzw. Aussenbereich zuweisen; keine Überlappungen.'
  fr: 'Permet dès le projet de l''ouvrage un justificatif traçable des places de stationnement ainsi qu''une planification fiable des surfaces et des circulations.


    **Description**

    - Places de stationnement individuelles (intérieures ou extérieures) comme volumes de local distincts.

    - Servent au justificatif de places et à l''évaluation des surfaces à partir du modèle.


    **Directives de modélisation**

    - Dès le projet de construction, modéliser chaque place comme local distinct.

    - Saisir Name avec un numéro de place unique (p. ex. P0016).

    - Rattacher à l''étage ou à l''espace extérieur concerné ; pas de chevauchement.'
  it: 'Consente dal progetto dell''opera una verifica tracciabile dei posti auto e una pianificazione affidabile delle superfici e della viabilità.


    **Descrizione**

    - Singoli posti auto (interni o esterni) come volumi di locale distinti.

    - Servono alla verifica dei posti e alla valutazione delle superfici dal modello.


    **Direttive di modellazione**

    - Dal progetto di costruzione modellare ogni posto come locale distinto.

    - Portare Name con un numero di posto univoco (p. es. P0016).

    - Assegnare al piano o all''area esterna corrispondente; nessuna sovrapposizione.'
  en: 'Enables traceable parking verification and reliable area and traffic planning from the building design phase onward.


    **Description**

    - Individual parking spaces (interior or exterior) as dedicated space volumes.

    - Used for parking verification and area evaluation from the model.


    **Modelling guidelines**

    - From building design onward, model each parking bay as its own space.

    - Carry Name with a unique parking number (e.g. P0016).

    - Assign to the matching storey or exterior area; no overlaps.'
