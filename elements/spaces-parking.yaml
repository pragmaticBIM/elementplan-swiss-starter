- name: ParkingUse
  pset: Pset_SpaceParking
  definition:
    de: 'Fahrzeugart, für welche der Parkplatz ausgelegt ist.


      **Zulässige Werte**

      - `CAR` — PKW

      - `BICYCLE` — Velo

      - `MOTORCYCLE` — Motorrad

      - `TRUCK` — LKW

      - `BUS` — Bus

      - `OTHER` — sonstige Fahrzeugart'
    fr: 'Type de véhicule pour lequel la place de stationnement est conçue.


      **Valeurs admises**

      - `CAR` — voiture

      - `BICYCLE` — vélo

      - `MOTORCYCLE` — moto

      - `TRUCK` — camion

      - `BUS` — autobus

      - `OTHER` — autre type de véhicule'
    it: 'Tipo di veicolo per il quale il posto è progettato.


      **Valori ammessi**

      - `CAR` — autovettura

      - `BICYCLE` — bicicletta

      - `MOTORCYCLE` — motocicletta

      - `TRUCK` — autocarro

      - `BUS` — autobus

      - `OTHER` — altro tipo di veicolo'
    en: 'Type of vehicle for which the parking space is designed.


      **Allowed values**

      - `CAR` — car

      - `BICYCLE` — bicycle

      - `MOTORCYCLE` — motorcycle

      - `TRUCK` — truck

      - `BUS` — bus

      - `OTHER` — other vehicle type'
