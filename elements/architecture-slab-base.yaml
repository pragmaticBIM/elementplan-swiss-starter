sort_order: 52
status: active
name:
  de: Bodenplatte (Grob)
  fr: Dalle de fondation (Approximatif)
  it: Soletta di fondazione (Indicativo)
  en: Base slab (Rough)
definition:
  de: 'Grobe Dimensionen gemäss Tragwerksplanung für Bodenplatten in Projektierung und Bewilligungsverfahren.


    **Beschreibung**

    - Grob dimensionierte Bodenplatte oder Fundamentplatte gemäss Tragwerkskonzept.

    - Dient der Koordination zwischen Architektur und Tragwerksplanung, nicht der Ausführungsplanung.


    **Modellierungsrichtlinie**

    - Als vereinfachtes Volumen modellieren; an Bauteilgrenzen teilen.

    - Keine Bewehrung, Gründungsdetails oder Schichtaufbauten modellieren.

    - Früh: Konzept über Skizzen als Tragwerksskizze im ARC-Modell; Sperrzonen vom Tragwerksplaner prüfen.

    - Später: Dieselben Bauteile mit Reference auch im Tragwerksmodell abstimmen.

    - IfcMaterial verwenden, das der tatsächlichen Materialklasse entspricht.'
  fr: 'Dimensions approximatives selon la conception structurale pour dalles de fondation en phases de projet et de procédure d''autorisation.


    **Description**

    - Dalle de fondation dimensionnée grossièrement selon le concept structurel.

    - Sert à la coordination entre architecture et ingénierie structurelle, pas à l''exécution.


    **Directives de modélisation**

    - Modéliser comme volume simplifié ; diviser aux limites de composants.

    - Ne pas modéliser armatures, détails de fondation ou stratification.

    - Tôt : concept par croquis comme esquisse porteuse dans le modèle d''architecture ; vérifier les zones d''exclusion de l''ingénieur structure.

    - Plus tard : harmoniser les mêmes éléments avec Reference dans le modèle structurel.

    - Utiliser un IfcMaterial correspondant à la classe de matériau réelle.'
  it: 'Dimensioni indicative secondo la progettazione strutturale per solette di fondazione nelle fasi di progettazione e procedura di autorizzazione.


    **Descrizione**

    - Soletta di fondazione dimensionata grossolanamente secondo il concept strutturale.

    - Serve per il coordinamento tra architettura e ingegneria strutturale, non per l''esecuzione.


    **Direttive di modellazione**

    - Modellare come volume semplificato; suddividere ai confini dei componenti.

    - Non modellare armature, dettagli di fondazione o stratigrafie.

    - Presto: concept tramite schizzi come schizzo strutturale nel modello di architettura; verificare le zone di esclusione dell''ingegnere strutturista.

    - Più tardi: allineare gli stessi elementi con Reference anche nel modello strutturale.

    - Usare un IfcMaterial corrispondente alla classe di materiale effettiva.'
  en: 'Rough dimensions according to structural engineering for base slabs in design development and permitting stages.


    **Description**

    - Coarsely dimensioned base or raft slab according to the structural concept.

    - Used for coordination between architecture and structural engineering, not for execution planning.


    **Modelling guidelines**

    - Model as a simplified volume; split at component boundaries.

    - Do not model reinforcement, foundation details, or layer build-ups.

    - Early: concept via sketches as structural sketch in the architecture model; verify exclusion zones from the structural engineer.

    - Later: align the same components with Reference in the structural model as well.

    - Use an IfcMaterial that corresponds to the actual material class.'
