attributes:
- name: PredefinedType
  pset: null
  definition:
    de: 'Art des Geräts bzw. Terminals.


      **Zulässige Werte**

      - `TOGGLESWITCH` — Taster / Wechselschalter

      - `DIMMERSWITCH` — Dimmer

      - `KEYPAD` — Tastenfeld

      - `SELECTORSWITCH` — Wahlschalter

      - `MOMENTARYSWITCH` — Taster momentan

      - `EMERGENCYSTOP` — Not-Aus

      - `CONTACTOR` — Schütz

      - `STARTER` — Starter

      - `SWITCHDISCONNECTOR` — Lasttrennschalter'
    fr: 'Type d''appareil ou de terminal.


      **Valeurs admises**

      - `TOGGLESWITCH` — interrupteur

      - `DIMMERSWITCH` — variateur

      - `KEYPAD` — clavier

      - `SELECTORSWITCH` — commutateur

      - `MOMENTARYSWITCH` — poussoir

      - `EMERGENCYSTOP` — arrêt d''urgence

      - `CONTACTOR` — contacteur

      - `STARTER` — démarreur

      - `SWITCHDISCONNECTOR` — interrupteur-sectionneur'
    it: 'Tipo di apparecchio o terminale.


      **Valori ammessi**

      - `TOGGLESWITCH` — interruttore

      - `DIMMERSWITCH` — dimmer

      - `KEYPAD` — tastierino

      - `SELECTORSWITCH` — selettore

      - `MOMENTARYSWITCH` — pulsante

      - `EMERGENCYSTOP` — arresto di emergenza

      - `CONTACTOR` — contattore

      - `STARTER` — avviatore

      - `SWITCHDISCONNECTOR` — sezionatore sotto carico'
    en: 'Kind of equipment or terminal.


      **Allowed values**

      - `TOGGLESWITCH` — toggle switch

      - `DIMMERSWITCH` — dimmer switch

      - `KEYPAD` — keypad

      - `SELECTORSWITCH` — selector switch

      - `MOMENTARYSWITCH` — momentary switch

      - `EMERGENCYSTOP` — emergency stop

      - `CONTACTOR` — contactor

      - `STARTER` — starter

      - `SWITCHDISCONNECTOR` — switch disconnector'
  datatype: IfcLabel
  allowed_values: pragmaticbim:value/predefinedtype-switching-device
