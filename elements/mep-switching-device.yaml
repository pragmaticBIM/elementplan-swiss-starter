id: pragmaticbim:element/mep-switching-device
code: MEP-SWITCH
sort_order: 101
status: active
name:
  de: Schalter
  fr: Interrupteur
  it: Interruttore
  en: Switch
definition:
  de: '**Beschreibung**

    - Schalter zum Ein- und Ausschalten elektrischer Stromkreise.

    - Elektrisches Schaltgerät.


    **Modellierungsrichtlinie**

    - Als Geräteobjekt mit Abmessungen und Lage modellieren.

    - Dem zugehörigen Geschoss und dem System zuweisen.'
  fr: '**Description**

    - Interrupteur pour la commande de circuits électriques.

    - Appareil de commutation.


    **Directives de modélisation**

    - Modéliser comme appareil avec dimensions et position.

    - Rattacher à l''étage et à la zone technique ou d''usage.'
  it: '**Descrizione**

    - Interruttore per l''inserimento e lo spegnimento di circuiti elettrici.

    - Dispositivo di commutazione.


    **Direttive di modellazione**

    - Modellare come apparecchio con dimensioni e posizione.

    - Assegnare al piano e alla zona tecnica o d''uso.'
  en: '**Description**

    - Switch for controlling electrical circuits.

    - Switching device.


    **Modelling guidelines**

    - Model as an equipment object with size and location.

    - Assign to the matching storey and technical or use zone.'
needed_in_domain:
- pragmaticbim:domain/mep
