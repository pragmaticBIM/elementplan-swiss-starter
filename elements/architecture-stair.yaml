      - `QUARTER_TURN_STAIR` — escalier avec palier quart tournant

      - `HALF_WINDING_STAIR` — escalier balancé à demi-tour

      - `HALF_TURN_STAIR` — escalier avec palier demi-tour

      - `TWO_QUARTER_WINDING_STAIR` — escalier balancé à deux quarts tournants

      - `TWO_QUARTER_TURN_STAIR` — escalier avec deux paliers quart tournant

      - `THREE_QUARTER_WINDING_STAIR` — escalier balancé à trois quarts tournants

      - `THREE_QUARTER_TURN_STAIR` — escalier avec trois paliers quart tournant

      - `SPIRAL_STAIR` — escalier en colimaçon

      - `DOUBLE_RETURN_STAIR` — escalier à plusieurs volées en retour

