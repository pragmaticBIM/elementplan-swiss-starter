- name: eBKP
  pset: ePset_Cost
  definition:
    de: 'eBKP-H-Klassifizierung nach SN 506 511 – aus IsExternal sowie Terrainkontakt und geometrischer Lage ableitbar. IsExternal allein reicht für `C01.04` nicht aus.


      **Zulässige Werte**

      - `C01.04` — erdverbundene Treppe / Rampe

      - `C04.02` — innen liegende Treppe / Rampe

      - `C04.06` — aussen liegende Treppe / Rampe'
    fr: 'Classification eBKP-H selon SN 506 511 – déductible à partir de IsExternal ainsi que du contact avec le terrain et de la situation géométrique. IsExternal seul ne suffit pas pour `C01.04`.


      **Valeurs admises**

      - `C01.04` — escalier / rampe en contact avec le terrain

      - `C04.02` — escalier / rampe intérieur

      - `C04.06` — escalier / rampe extérieur'
    it: 'Classificazione eBKP-H secondo SN 506 511 – ricavabile da IsExternal, dal contatto con il terreno e dalla posizione geometrica. IsExternal da solo non è sufficiente per `C01.04`.


      **Valori ammessi**

      - `C01.04` — scala / rampa a contatto con il terreno

      - `C04.02` — scala / rampa interna

      - `C04.06` — scala / rampa esterna'
    en: 'eBKP-H classification according to SN 506 511 – derivable from IsExternal together with terrain contact and geometric location. IsExternal alone is insufficient for `C01.04`.


      **Allowed values**

      - `C01.04` — ground-connected stair / ramp

      - `C04.02` — interior stair / ramp

      - `C04.06` — exterior stair / ramp'
