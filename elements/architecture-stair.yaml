      **Valori ammessi**

      - `STRAIGHT_RUN_STAIR` — scala retta a una rampa

      - `TWO_STRAIGHT_RUN_STAIR` — scala retta a due rampe

      - `QUARTER_WINDING_STAIR` — scala bilanciata a un quarto di giro

      - `QUARTER_TURN_STAIR` — scala con pianerottolo a un quarto di giro

      - `HALF_WINDING_STAIR` — scala bilanciata a mezzo giro

      - `HALF_TURN_STAIR` — scala con pianerottolo a mezzo giro

      - `TWO_QUARTER_WINDING_STAIR` — scala bilanciata a due quarti di giro

      - `TWO_QUARTER_TURN_STAIR` — scala con due pianerottoli a un quarto di giro

      - `THREE_QUARTER_WINDING_STAIR` — scala bilanciata a tre quarti di giro

      - `THREE_QUARTER_TURN_STAIR` — scala con tre pianerottoli a un quarto di giro

      - `SPIRAL_STAIR` — scala a chiocciola

      - `DOUBLE_RETURN_STAIR` — scala a più rampe contrapposte

      - `CURVED_RUN_STAIR` — scala curva

      - `TWO_CURVED_RUN_STAIR` — scala curva a due rampe

      - `USERDEFINED` — scala definita dall’utente'
    en: 'Form of the stair.


      **Allowed values**

      - `STRAIGHT_RUN_STAIR` — single straight flight

      - `TWO_STRAIGHT_RUN_STAIR` — two straight flights

      - `QUARTER_WINDING_STAIR` — quarter-turn winding stair

      - `QUARTER_TURN_STAIR` — stair with quarter-turn landing

      - `HALF_WINDING_STAIR` — half-turn winding stair

      - `HALF_TURN_STAIR` — stair with half-turn landing

      - `TWO_QUARTER_WINDING_STAIR` — two-quarter winding stair

      - `TWO_QUARTER_TURN_STAIR` — stair with two quarter-turn landings

      - `THREE_QUARTER_WINDING_STAIR` — three-quarter winding stair

      - `THREE_QUARTER_TURN_STAIR` — stair with three quarter-turn landings

      - `SPIRAL_STAIR` — spiral stair

      - `DOUBLE_RETURN_STAIR` — multi-flight return stair

      - `CURVED_RUN_STAIR` — curved stair

      - `TWO_CURVED_RUN_STAIR` — two-flight curved stair

      - `USERDEFINED` — user-defined stair'
