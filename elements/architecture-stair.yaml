id: pragmaticbim:element/architecture-stair
code: ARC-STAIR
sort_order: 31
status: active
name:
  de: Treppe (Grob)
  fr: Escalier (Approximatif)
  it: Scala (Indicativa)
  en: Stair (Rough)
definition:
  de: 'Grobe Treppengeometrie für Planung, Koordination und Mengenermittlung.


    **Beschreibung**

    - Treppenläufe und Podeste als getrennte Bauteile in der Architekturplanung.

    - Dient der Festlegung von Lage, Abmessungen und Erschliessung, nicht der Ausführungsplanung.


    **Modellierungshinweis**

    - Treppenläufe und Podeste als getrennte, vereinfachte Bauteile mit abgestimmter Laufbreite, Steigung und Podestlage modellieren.

    - Den unteren Treppenlauf dem unteren Geschoss, das Podest und den oberen Treppenlauf dem oberen Geschoss zuordnen.

    - Diese Geschosszuordnung ist keine gängige Modellierungspraxis, entspricht jedoch genau der Logik des Planzeichnens: Im Grundriss wird der obere Treppenlauf strichliert dargestellt, während Wand, Tür
    und Raum unter diesem Lauf im unteren Geschoss sichtbar bleiben.

    - Den Raum unter dem oberen Treppenlauf als eigenes Raumvolumen modellieren und Innen-/Aussenlage korrekt kennzeichnen.

    - Wenn das Treppenauge eine Fläche von mehr als 5 m² aufweist, darin einen zusätzlichen Luftraum modellieren.

    - Über dem obersten Treppenlauf zusätzlich ein Luftraumvolumen modellieren, sodass dieser Bereich mit einem Raum befüllt ist – als Referenz für Gebäudetechnik und Volumenauswertung.'
  fr: 'Géométrie approximative d''escalier pour la planification, la coordination et le métré.


    **Description**

    - Volées et paliers saisis comme des éléments distincts dans la planification architecturale.

    - Sert à définir l''emplacement, les dimensions et la desserte, pas à la planification de l''exécution.


    **Directives de modélisation**

    - Modéliser les volées et les paliers comme des éléments distincts et simplifiés avec largeur de volée, pente et position des paliers convenues.

    - Rattacher la volée inférieure à l''étage inférieur, et le palier ainsi que la volée supérieure à l''étage supérieur.

    - Cette attribution par étage n''est pas une pratique courante dans les maquettes, mais elle suit exactement la logique du dessin en plan : la volée supérieure y apparaît en traitillé, tandis que le
    mur, la porte et le local situés dessous restent visibles à l''étage inférieur.

    - Modéliser le local sous la volée supérieure comme un volume distinct et indiquer correctement la situation intérieure ou extérieure.

    - Si la trémie d''escalier présente une surface supérieure à 5 m², y modéliser un volume d''air supplémentaire.

    - Au-dessus de la dernière volée, modéliser en plus un volume d''air, de sorte que cette zone soit remplie d''un local – comme référence pour la technique du bâtiment et l''évaluation des volumes.'
  it: 'Geometria indicativa della scala per progettazione, coordinamento e computo delle quantità.


    **Descrizione**

    - Rampe e pianerottoli gestiti come componenti distinti nella progettazione architettonica.

    - Serve a definire posizione, dimensioni e collegamento verticale, non alla progettazione esecutiva.


    **Direttive di modellazione**

    - Modellare rampe e pianerottoli come componenti distinti e semplificati con larghezza della rampa, pendenza e posizione dei pianerottoli concordate.

    - Assegnare la rampa inferiore al piano inferiore e il pianerottolo con la rampa superiore al piano superiore.

    - Questa assegnazione ai piani non è una prassi di modellazione comune, ma segue esattamente la logica del disegno in pianta: la rampa superiore è rappresentata tratteggiata, mentre la parete, la porta
    e il locale sottostanti restano visibili al piano inferiore.

    - Modellare il locale sotto la rampa superiore come volume distinto e indicare correttamente la posizione interna o esterna.

    - Se il vano scala ha una superficie superiore a 5 m², modellare al suo interno un volume d''aria aggiuntivo.

    - Sopra l''ultima rampa modellare inoltre un volume d''aria, in modo che questa zona sia riempita con un locale – come riferimento per la tecnica dell''edificio e la valutazione dei volumi.'
  en: 'Rough stair geometry for design, coordination, and quantity take-off.


    **Description**

    - Flights and landings captured as separate components in architectural design.

    - Used to define location, dimensions, and vertical circulation, not for execution planning.


    **Modelling guidelines**

    - Model flights and landings as separate, simplified components with coordinated flight width, rise, and landing positions.

    - Assign the lower flight to the lower storey, and the landing and upper flight to the upper storey.

    - This storey assignment is not common modelling practice, but it follows plan-drawing logic exactly: the upper flight is shown dashed, while the wall, door, and space below it remain visible on the
    lower-storey plan.

    - Model the space below the upper flight as a separate space volume and mark the interior or exterior location correctly.

    - If the stairwell opening has an area greater than 5 m², model an additional air-space volume within it.

    - Above the uppermost stair flight, also model an air-space volume so that this area is filled with a space – as a reference for building services and volume evaluation.'
