name:
  de: Erzeugerplatz (schematisch)
  fr: Espace générateurs (schématique)
  it: Spazio generatori (schematico)
  en: Equipment space (schematic)
definition:
  de: 'Schematischer Platzbedarf für Erzeuger und Technikzentralen in der frühen Koordination.


    **Beschreibung**

    - Koordinationsvolumen für Technikzentralen, Hauszentralen und ähnliche Anlagen — kein Raumobjekt.

    - Dient der Machbarkeitsprüfung, nicht der Ausführungsplanung.


    **Modellierungsrichtlinie**

    - Als vereinfachten Proxy-Körper modellieren; Abmessungen gemäss Grobkonzept inklusive Wartungszone.

    - ObjectType = Erzeugerplatz; dem zugehörigen Geschoss zuweisen.

    - Keine einzelnen Geräte oder Anschlussdetails modellieren.'
  fr: 'Besoin d''espace schématique pour générateurs et locaux techniques en coordination en phase initiale.


    **Description**

    - Volume de coordination pour centrales et locaux techniques — pas un objet local.

    - Sert à la faisabilité, pas à l''exécution.


    **Directives de modélisation**

    - Modéliser comme corps proxy simplifié; dimensions selon le concept d''ensemble incluant la zone de maintenance.

    - ObjectType = Erzeugerplatz; rattacher à l''étage concerné.

    - Ne pas modéliser appareils individuels ni raccords de détail.'
  it: 'Fabbisogno schematico di spazio per generatori e centrali nel coordinamento in fase iniziale.


    **Descrizione**

    - Volume di coordinamento per centrali tecniche — non un oggetto locale.

    - Serve per la fattibilità, non per l''esecuzione.


    **Direttive di modellazione**

    - Modellare come corpo proxy semplificato; dimensioni secondo il concetto di massima inclusa la zona di manutenzione.

    - ObjectType = Erzeugerplatz; assegnare al piano corrispondente.

    - Non modellare singoli apparecchi o dettagli di collegamento.'
  en: 'Schematic space requirement for plant and technical rooms in early coordination.


    **Description**

    - Coordination volume for plant rooms and similar installations — not a space object.

    - Used for feasibility checking, not for execution planning.


    **Modelling guidelines**

    - Model as a simplified proxy body; dimensions according to the sketch concept including maintenance clearance.

    - ObjectType = Erzeugerplatz; assign to the matching storey.

    - Do not model individual appliances or connection details.'
