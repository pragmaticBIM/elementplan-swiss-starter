    en: 'Area class of the elevator space object according to SIA 416 or SIA D0165.


      **Allowed values**

      - See the [Space reference interior SIA 416 / D0165](https://schema.pragmaticbim.ch/classification/mapping-room-activity-to-sia416.html) value list, e.g. `VF` (SIA 416) or `VF-9` (D0165).'
