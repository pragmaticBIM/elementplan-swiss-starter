name:
  de: Aufzug / Lift
  fr: Ascenseur / Lift
  it: Ascensore / Lift
  en: Lift
definition:
  de: 'Ermöglicht die geschossweise Zuordnung der belegten Fläche, damit Flächennachweise korrekt geführt werden können.


    **Beschreibung**

    - Das Aufzugsraumobjekt beschreibt den vom Aufzug belegten Raum je Geschoss, nicht das physische Fördermittel.

    - Die geschossweise Trennung ermöglicht eine korrekte Klassifizierung der Flächen, z. B. nach SIA 416 oder DIN 277.


    **Modellierungshinweis**

    - Mit dem Raumwerkzeug je Geschoss als getrenntes Volumen modellieren; keine geschossübergreifenden Raumobjekte.

    - Name je Geschoss eindeutig vergeben, LongName = Aufzug setzen und Reference mit der Flächenklasse führen (z. B. `VF` bzw. `VF-9`).'
  fr: 'Permet d''attribuer la surface occupée à chaque étage afin de tenir correctement les justificatifs de surfaces.


    **Description**

    - L''objet local d''ascenseur décrit l''espace occupé par l''ascenseur à chaque étage, et non l''appareil élévateur physique.

    - La séparation par étage permet une classification correcte des surfaces, p. ex. selon SIA 416 ou DIN 277.


    **Directives de modélisation**

    - Modéliser un volume distinct avec l''outil local à chaque étage ; ne pas créer d''objet local traversant plusieurs étages.

    - Attribuer un Name univoque par étage, renseigner LongName = Ascenseur et indiquer la classe de surface dans Reference (p. ex. `VF` ou `VF-9`).'
  it: 'Consente di attribuire la superficie occupata a ogni piano per gestire correttamente le verifiche delle superfici.


    **Descrizione**

    - L''oggetto locale ascensore descrive lo spazio occupato dall''ascensore a ogni piano, non l''impianto elevatore fisico.

    - La separazione per piano consente una corretta classificazione delle superfici, ad es. secondo SIA 416 o DIN 277.


    **Direttive di modellazione**

    - Modellare con lo strumento locale un volume separato per ogni piano; non creare oggetti locali che attraversano più piani.

    - Assegnare un Name univoco per piano, impostare LongName = Ascensore e indicare la classe di superficie in Reference (p. es. `VF` o `VF-9`).'
  en: 'Enables the occupied area to be assigned by storey so that area verification can be maintained correctly.


    **Description**

    - The elevator space object describes the space occupied by the elevator on each storey, not the physical lifting equipment.

    - Storey-by-storey separation enables correct area classification, e.g. according to SIA 416 or DIN 277.


    **Modelling guidelines**

    - Model a separate volume with the space tool on each storey; do not create a space object spanning several storeys.

    - Assign a unique Name on each storey, set LongName = Elevator, and record the area class in Reference (e.g. `VF` or `VF-9`).'
