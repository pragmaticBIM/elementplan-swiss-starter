      **Zulässige Werte**

      - `INTERNAL` — Innenraum


      **Hinweis**

      - Zusätzliche IFC2x3-Klassifikation; die Innenkennzeichnung erfolgt versionsübergreifend über IsExternal.'
    fr: 'Identifie l''objet local d''ascenseur comme espace intérieur.


      **Valeurs admises**

      - `INTERNAL` — espace intérieur


      **Remarque**

      - Classification IFC2x3 complémentaire ; l''indication comme espace intérieur s''effectue pour toutes les versions au moyen de IsExternal.'
    it: 'Identifica l''oggetto locale ascensore come spazio interno.


      **Valori ammessi**

      - `INTERNAL` — spazio interno


      **Nota**

      - Classificazione IFC2x3 aggiuntiva; l''indicazione come spazio interno avviene per tutte le versioni mediante IsExternal.'
    en: 'Marks the elevator space object as an interior space.


      **Allowed values**

      - `INTERNAL` — interior space


      **Note**

      - Additional IFC2x3 classification; interior status is specified across all versions using IsExternal.'
