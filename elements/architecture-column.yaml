id: pragmaticbim:element/architecture-column
code: ARC-COLUMN
sort_order: 55
status: active
name:
  de: Stütze (Grob)
  fr: Poteau (Approximatif)
  it: Colonna (Indicativo)
  en: Column (Rough)
definition:
  de: 'Grobe Dimensionen gemäss Tragwerksplanung für Stützen in Projektierung und Bewilligungsverfahren.


    **Beschreibung**

    - Grob dimensionierte Stütze gemäss Tragwerkskonzept.

    - Dient der Koordination zwischen Architektur und Tragwerksplanung, nicht der Ausführungsplanung.


    **Modellierungsrichtlinie**

    - Geschossweise modellieren; Abmessungen gemäss Tragwerksentwurf.

    - LoadBearing=TRUE setzen; als vereinfachtes Volumen ohne Bewehrung oder Anschlussdetails modellieren.

    - Früh: Konzept über Skizzen als Tragwerksskizze im ARC-Modell; Sperrzonen vom Tragwerksplaner prüfen.

    - Später: Dieselben Bauteile mit Reference auch im Tragwerksmodell abstimmen.

    - IfcMaterial verwenden, das der tatsächlichen Materialklasse entspricht.'
  fr: 'Dimensions approximatives selon la conception structurale pour poteaux en phases de projet et de procédure d''autorisation.


    **Description**

    - Poteau dimensionné grossièrement selon le concept structurel.

    - Sert à la coordination entre architecture et ingénierie structurelle, pas à l''exécution.


    **Directives de modélisation**

    - Modéliser étage par étage ; dimensions selon l''esquisse structurelle.

    - Définir LoadBearing=TRUE ; modéliser comme volume simplifié sans armatures ni raccords de détail.

    - Tôt : concept par croquis comme esquisse porteuse dans le modèle d''architecture ; vérifier les zones d''exclusion de l''ingénieur structure.

    - Plus tard : harmoniser les mêmes éléments avec Reference dans le modèle structurel.

    - Utiliser un IfcMaterial correspondant à la classe de matériau réelle.'
  it: 'Dimensioni indicative secondo la progettazione strutturale per colonne nelle fasi di progettazione e procedura di autorizzazione.


    **Descrizione**

    - Colonna dimensionata grossolanamente secondo il concept strutturale.

    - Serve per il coordinamento tra architettura e ingegneria strutturale, non per l''esecuzione.


    **Direttive di modellazione**

    - Modellare piano per piano; dimensioni secondo lo schizzo strutturale.

    - Impostare LoadBearing=TRUE; modellare come volume semplificato senza armature o giunti di dettaglio.

    - Presto: concept tramite schizzi come schizzo strutturale nel modello di architettura; verificare le zone di esclusione dell''ingegnere strutturista.

    - Più tardi: allineare gli stessi elementi con Reference anche nel modello strutturale.

    - Usare un IfcMaterial corrispondente alla classe di materiale effettiva.'
  en: 'Rough dimensions according to structural engineering for columns in design development and permitting stages.


    **Description**

    - Coarsely dimensioned column according to the structural concept.

    - Used for coordination between architecture and structural engineering, not for execution planning.


    **Modelling guidelines**

    - Model storey by storey; dimensions according to the structural sketch.

    - Set LoadBearing=TRUE; model as a simplified volume without reinforcement or detail connections.

    - Early: concept via sketches as structural sketch in the architecture model; verify exclusion zones from the structural engineer.

    - Later: align the same components with Reference in the structural model as well.

    - Use an IfcMaterial that corresponds to the actual material class.'
