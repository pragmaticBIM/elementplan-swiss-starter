id: pragmaticbim:element/architecture-floor-covering
code: ARC-FLOOR-COV
sort_order: 51
status: active
name:
  de: Bodenaufbau Innen
  fr: Complexe de sol intérieur
  it: Stratigrafia di pavimento interna
  en: Interior floor build-up
definition:
  de: 'Schafft eine verlässliche Grundlage für Höhenkoordination, Fugenkonzept, Ausschreibung und Mengenermittlung im Innenausbau. Frühe Planung ohne modelliertes Covering: FloorCovering am Innenraum.


    **Beschreibung**

    - Bodenaufbau aus Unterlagsboden und Belag gemäss Bauteilkatalog – nur Innenräume.

    - Fugen sind im Modell enthalten, insbesondere bei Fussbodenheizung.


    **Modellierungshinweis**

    - Als eine Schicht modellieren – nicht nach Räumen, sondern nach Aufbautypen trennen; ein Aufbau kann mehrere Räume umfassen.

    - Fugen und Fugenausführung modellieren, insbesondere bei Fussbodenheizung.

    - Bodenbelagstyp über Finish, Unterlagsbodentyp über SubfloorType erfassen.

    - Geeignetes Material im Autorensystem verwenden und exportieren.

    - Aussenbodenflächen nicht hier modellieren – frühe Planung: FloorCovering (AOF) am Aussenraum; Detail: Bodenbelag Aussen (ARC-FLOOR-COV-EXT).'
  fr: 'Fournit une base fiable pour la coordination des niveaux, le concept de joints, l''appel d''offres et le métré des aménagements intérieurs. Planification précoce sans covering modélisé : FloorCovering
    sur le local intérieur.


    **Description**

    - Complexe de sol avec chape et revêtement selon le catalogue de composants – locaux intérieurs uniquement.

    - Joints inclus dans le modèle, notamment avec chauffage au sol.


    **Directives de modélisation**

    - Modéliser comme couche unique – diviser par type d''aufbau, pas par locaux ; un aufbau peut couvrir plusieurs locaux.

    - Modéliser joints et exécution des joints, notamment avec chauffage au sol.

    - Saisir le type de revêtement via Finish, le type de chape via SubfloorType.

    - Utiliser et exporter le matériau approprié depuis le logiciel auteur.

    - Ne pas modéliser ici les surfaces de sol extérieures – planification précoce : FloorCovering (AOF) sur l''espace extérieur ; détail : Revêtement de sol extérieur (ARC-FLOOR-COV-EXT).'
  it: 'Fornisce una base affidabile per il coordinamento delle quote, il concetto dei giunti, l’appalto e il computo metrico delle finiture interne. Pianificazione precoce senza covering modellato: FloorCovering
    sul locale interno.


    **Descrizione**

    - Stratigrafia di pavimento con sottofondo e rivestimento secondo il catalogo componenti – solo locali interni.

    - Fughe incluse nel modello, in particolare con riscaldamento a pavimento.


    **Direttive di modellazione**

    - Modellare come strato unico – dividere per tipo di stratigrafia, non per locali; una stratigrafia può coprire più locali.

    - Modellare fughe ed esecuzione delle fughe, in particolare con riscaldamento a pavimento.

    - Registrare il tipo di pavimentazione tramite Finish, il tipo di sottofondo tramite SubfloorType.

    - Usare ed esportare il materiale appropriato dal software di modellazione.

    - Non modellare qui le superfici di pavimento esterne – pianificazione precoce: FloorCovering (AOF) sullo spazio esterno; dettaglio: Pavimentazione esterna (ARC-FLOOR-COV-EXT).'
  en: 'Provides a reliable basis for level coordination, joint design, tendering, and quantity take-off for interior finishes. Early design without a modelled covering: FloorCovering on the interior space.


    **Description**

    - Floor build-up with subfloor and finish according to the component catalogue – interior spaces only.

    - Joints included in the model, especially with underfloor heating.


    **Modelling guidelines**

    - Model as one layer – split by build-up type, not by rooms; one build-up may span several rooms.

    - Model joints and joint execution, especially with underfloor heating.

    - Capture floor covering type via Finish, subfloor type via SubfloorType.

    - Use and export the appropriate material from the authoring system.

    - Do not model exterior floor surfaces here – early design: FloorCovering (AOF) on the exterior space; detail: Exterior floor covering (ARC-FLOOR-COV-EXT).'
