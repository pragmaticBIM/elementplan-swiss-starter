name:
  de: Bodenaufbau
  fr: Complexe de sol
  it: Stratigrafia di pavimento
  en: Floor build-up
definition:
  de: 'Unterlagsboden und Bodenbelag als modellierte Schicht für Ausführungsplanung und Mengenauszug.


    **Beschreibung**

    - Bodenaufbau aus Unterlagsboden und Belag gemäss Bauteilkatalog.

    - Fugen sind im Modell enthalten, insbesondere bei Fussbodenheizung.


    **Modellierungsrichtlinie**

    - Als eine Schicht modellieren — nicht nach Räumen, sondern nach Aufbautypen trennen; ein Aufbau kann mehrere Räume umfassen.

    - Fugen und Fugenausführung modellieren, insbesondere bei Fussbodenheizung.

    - Bodenbelagstyp über Finish, Unterlagsbodentyp über SubfloorType erfassen.

    - Material verwenden, das der tatsächlichen Materialklasse entspricht.'
  fr: 'Chape et revêtement de sol comme couche modélisée pour la planification d''exécution et le métré.


    **Description**

    - Complexe de sol avec chape et revêtement selon le catalogue de composants.

    - Joints inclus dans le modèle, notamment avec chauffage au sol.


    **Directives de modélisation**

    - Modéliser comme couche unique — diviser par type d''aufbau, pas par locaux ; un aufbau peut couvrir plusieurs locaux.

    - Modéliser joints et exécution des joints, notamment avec chauffage au sol.

    - Saisir le type de revêtement via Finish, le type de chape via SubfloorType.

    - Utiliser un matériau correspondant à la classe de matériau réelle.'
  it: 'Sottofondo e pavimentazione come strato modellato per la pianificazione esecutiva e il computo metrico.


    **Descrizione**

    - Stratigrafia di pavimento con sottofondo e rivestimento secondo il catalogo componenti.

    - Fughe incluse nel modello, in particolare con riscaldamento a pavimento.


    **Direttive di modellazione**

    - Modellare come strato unico — dividere per tipo di stratigrafia, non per locali; una stratigrafia può coprire più locali.

    - Modellare fughe ed esecuzione delle fughe, in particolare con riscaldamento a pavimento.

    - Registrare il tipo di pavimentazione tramite Finish, il tipo di sottofondo tramite SubfloorType.

    - Usare un materiale corrispondente alla classe di materiale effettiva.'
  en: 'Subfloor and floor covering as a modelled layer for execution planning and quantity take-off.


    **Description**

    - Floor build-up with subfloor and finish according to the component catalogue.

    - Joints included in the model, especially with underfloor heating.


    **Modelling guidelines**

    - Model as one layer — split by build-up type, not by rooms; one build-up may span several rooms.

    - Model joints and joint execution, especially with underfloor heating.

    - Capture floor covering type via Finish, subfloor type via SubfloorType.

    - Use a material that corresponds to the actual material class.'
