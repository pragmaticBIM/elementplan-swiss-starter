id: pragmaticbim:element/architecture-wall-cladding-interior
code: ARC-WALL-CLAD
sort_order: 42
status: active
name:
  de: Wandbekleidung
  fr: Revêtement mural
  it: Rivestimento murale
  en: Wall cladding
definition:
  de: 'Innenliegende Wandbekleidung als modellierte Oberfläche für Mengenauszug.


    **Beschreibung**

    - Wandoberfläche mit definierter Qualität gemäss Bauteilkatalog.

    - Eigenständige Schicht, getrennt von der tragenden Wand.


    **Modellierungsrichtlinie**

    - Als eigene Schicht modellieren; an Raum- und Bauteilgrenzen teilen.

    - Oberflächenqualität über Reference erfassen.

    - Keine Ausführungsdetails wie Anschlussprofile modellieren.

    - IfcMaterial verwenden, das der tatsächlichen Materialklasse entspricht.'
  fr: 'Revêtement mural intérieur comme surface modélisée pour le métré.


    **Description**

    - Surface murale avec qualité définie selon le catalogue de composants.

    - Couche distincte, séparée du mur porteur.


    **Directives de modélisation**

    - Modéliser comme couche distincte ; diviser aux limites de locaux et de composants.

    - Saisir la qualité de surface via Reference.

    - Ne pas modéliser les détails d''exécution comme profils de raccord.

    - Utiliser un IfcMaterial correspondant à la classe de matériau réelle.'
  it: 'Rivestimento murale interno come superficie modellata per il computo metrico.


    **Descrizione**

    - Superficie murale con qualità definita secondo il catalogo componenti.

    - Strato autonomo, separato dalla parete portante.


    **Direttive di modellazione**

    - Modellare come strato autonomo; suddividere ai confini di locali e componenti.

    - Registrare la qualità superficiale tramite Reference.

    - Non modellare dettagli esecutivi come profili di giunzione.

    - Usare un IfcMaterial corrispondente alla classe di materiale effettiva.'
  en: 'Interior wall cladding as a modelled surface for quantity take-off.


    **Description**

    - Wall surface with defined quality according to the component catalogue.

    - Separate layer, distinct from the load-bearing wall.


    **Modelling guidelines**

    - Model as a separate layer; split at room and component boundaries.

    - Capture surface quality via Reference.

    - Do not model execution details such as connection profiles.

    - Use an IfcMaterial that corresponds to the actual material class.'
