name:
  de: Aussenräume
  fr: Espaces extérieurs
  it: Spazi esterni
  en: Exterior spaces
definition:
  de: 'Aussenliegende, nutzbare Raumvolumen am Gebäude.


    **Beschreibung**

    - Aussenräume wie Balkone, Terrassen und bearbeitete Umgebung.

    - Raumnutzung wird über LongName geführt; Name kann die Raumnummer tragen.


    **Modellierungsrichtlinie**

    - Als Volumen ausserhalb des Gebäudes modellieren.

    - Balkone und Terrassen dem jeweiligen Geschoss zuweisen.

    - Empfehlung: Aussenräume nur 1 m hoch modellieren, um Innen- und Aussenräume in der Ansicht schnell zu unterscheiden.'
  fr: 'Volumes de locaux utilisables à l''extérieur du bâtiment.


    **Description**

    - Espaces extérieurs tels que balcons, terrasses et abords aménagés.

    - L''usage du local est porté par LongName; Name peut porter le numéro de local.


    **Directives de modélisation**

    - Modéliser comme volume à l''extérieur du bâtiment.

    - Attribuer balcons et terrasses à l''étage concerné.

    - Recommandation : modéliser les espaces extérieurs sur 1 m de hauteur seulement, pour les distinguer visuellement des espaces intérieurs.'
  it: 'Volumi di locali utilizzabili all''esterno dell''edificio.


    **Descrizione**

    - Spazi esterni come balconi, terrazze e aree esterne sistemate.

    - L''uso del locale è indicato in LongName; Name può riportare il numero del locale.


    **Direttive di modellazione**

    - Modellare come volume all''esterno dell''edificio.

    - Attribuire balconi e terrazze al piano corrispondente.

    - Raccomandazione: modellare gli spazi esterni con altezza di soli 1 m, per distinguerli visivamente dagli spazi interni.'
  en: 'Usable room volumes located outside the building.


    **Description**

    - Exterior spaces such as balconies, terraces, and treated surroundings.

    - Room use is carried in LongName; Name may carry the room number.


    **Modelling guidelines**

    - Model as a volume outside the building.

    - Assign balconies and terraces to the matching storey.

    - Best practice: model exterior spaces only 1 m high to visually distinguish them from interior spaces quickly.'
