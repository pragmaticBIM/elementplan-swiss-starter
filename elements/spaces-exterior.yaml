- name: Name
  pset: null
  definition:
    de: 'Eindeutige technische Raumnummer für die Planung. Sie soll gleichbleiben, solange:

      - der Raum die Grösse nicht wesentlich ändert (z. B. von 12 m² Büro auf 25 m² Grossraumbüro)

      - die Funktion nicht wesentlich ändert (z. B. von Büro auf Sitzungszimmer)

      - und die Ausrichtung nicht wechselt (z. B. von Süd- auf Ostausrichtung)


      Nicht für die Signaletik verwenden — Signaletik-Raumnummern ändern sich häufig und gehören in SignageRoomNumber.'
    fr: 'Numéro technique de local unique pour la planification. Il doit rester inchangé tant que :

      - la surface du local ne change pas substantiellement (p. ex. de 12 m² bureau à 25 m² bureau paysager)

      - la fonction ne change pas substantiellement (p. ex. de bureau à salle de réunion)

      - et l''orientation ne change pas (p. ex. du sud à l''est)


      Ne pas utiliser pour la signalétique — les numéros de signalétique changent souvent et appartiennent à SignageRoomNumber.'
    it: 'Numero tecnico del locale univoco per la pianificazione. Deve restare invariato finché:

      - la superficie del locale non cambia sostanzialmente (es. da 12 m² ufficio a 25 m² open space)

      - la funzione non cambia sostanzialmente (es. da ufficio a sala riunioni)

      - e l''orientamento non cambia (es. da sud a est)


      Non usare per la segnaletica — i numeri di segnaletica cambiano spesso e appartengono a SignageRoomNumber.'
    en: 'Unique technical room number for planning. It should stay stable as long as:

      - the room size does not change substantially (e.g. from 12 m² office to 25 m² open-plan office)

      - the function does not change substantially (e.g. from office to meeting room)

      - and the orientation does not change (e.g. from south to east facing)


      Do not use for signage — signage room numbers change often and belong in SignageRoomNumber.'
