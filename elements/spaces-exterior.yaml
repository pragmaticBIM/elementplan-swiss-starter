- name: FloorCovering
  pset: Pset_SpaceCoveringRequirements
  definition:
    de: 'Aussenbodenfläche für die frühe Planung – nur als Raumeigenschaft, ohne modelliertes Covering.

      Blattbezeichnung (z. B. `Kies`) bei bekanntem Belag; sonst die Elternklasse

      (z. B. `Versiegelt`, `Teildurchlässig`, `Durchlässig`).


      **Zulässige Werte**

      - Siehe Werteliste [Abstrakte Aussenbodenflächen](https://schema.pragmaticbim.ch/classification/outdoor-floor-surface.html).'
    fr: 'Surface de sol extérieur pour la planification en phase initiale – uniquement comme propriété de l''espace, sans covering modélisé.

      Désignation feuille (p. ex. `Gravel`) si le revêtement est connu ; sinon la classe parente

      (p. ex. `Sealed`, `Partially permeable`, `Permeable`).


      **Valeurs admises**

      - Voir la liste de valeurs [Abstract outdoor floor surfaces](https://schema.pragmaticbim.ch/classification/outdoor-floor-surface.html).'
    it: 'Superficie di pavimento esterna per la pianificazione in fase iniziale – solo come proprietà dello spazio, senza covering modellato.

      Denominazione foglia (p. es. `Gravel`) se il rivestimento è noto; altrimenti la classe genitore

      (p. es. `Sealed`, `Partially permeable`, `Permeable`).


      **Valori ammessi**

      - Vedere l''elenco valori [Abstract outdoor floor surfaces](https://schema.pragmaticbim.ch/classification/outdoor-floor-surface.html).'
    en: 'Outdoor floor surface for early planning – as a space property only, without a modelled covering.

      Leaf name (e.g. `Gravel`) when the surface material is known; otherwise the parent class

      (e.g. `Sealed`, `Partially permeable`, `Permeable`).


      **Allowed values**

      - See the [Abstract outdoor floor surfaces](https://schema.pragmaticbim.ch/classification/outdoor-floor-surface.html) value list.'
