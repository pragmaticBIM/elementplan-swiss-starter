- name: PredefinedType
  pset: null
  definition:
    de: 'Kennzeichnet das Objekt als Raum.


      **Zulässige Werte**

      - `SPACE` — Raum


      **Hinweis**

      - Die ebenfalls möglichen Werte `INTERNAL` und `EXTERNAL` vermischen Raumtyp und Lage und sind seit IFC4.3_ADD2 als veraltet gekennzeichnet. Daher wird empfohlen, bereits jetzt `SPACE` zu verwenden
      und innen beziehungsweise aussen über IsExternal abzubilden.'
    fr: 'Indique que l''objet est un espace.


      **Valeurs admises**

      - `SPACE` — espace


      **Remarque**

      - Les valeurs également possibles `INTERNAL` et `EXTERNAL` confondent le type d''espace et sa situation et sont signalées comme obsolètes depuis IFC4.3_ADD2. Il est donc recommandé d''utiliser dès
      maintenant `SPACE` et d''indiquer le caractère intérieur ou extérieur au moyen de IsExternal.'
    it: 'Indica che l''oggetto è uno spazio.


      **Valori ammessi**

      - `SPACE` — spazio


      **Nota**

      - I valori anch''essi possibili `INTERNAL` ed `EXTERNAL` confondono il tipo di spazio con la sua posizione e sono contrassegnati come obsoleti a partire da IFC4.3_ADD2. Si raccomanda pertanto di utilizzare
      fin d''ora `SPACE` e di indicare se lo spazio è interno o esterno mediante IsExternal.'
    en: 'Marks the object as a space.


      **Allowed values**

      - `SPACE` — space


      **Note**

      - The also permitted values `INTERNAL` and `EXTERNAL` conflate space type and location and have been deprecated since IFC4.3_ADD2. Therefore, use `SPACE` now and specify interior or exterior status
      using IsExternal.'
