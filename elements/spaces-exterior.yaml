id: pragmaticbim:element/spaces-exterior
code: SPACE-EXT
sort_order: 20
status: active
name:
  de: Aussenräume
  fr: Espaces extérieurs
  it: Spazi esterni
  en: Exterior spaces
definition:
  de: |
    Aussenräume wie Balkone, Terrassen und bearbeitete Umgebung (IfcSpace, PredefinedType EXTERNAL).

    **Modellierung**
    - Als Volumen ausserhalb des Gebäudes modellieren.
    - Balkone und Terrassen dem jeweiligen Geschoss zuweisen.
    - Raumname in LongName, optionale Raumnummer in Name.
  fr: |
    Espaces extérieurs tels que balcons, terrasses et abords aménagés (IfcSpace, PredefinedType EXTERNAL).

    **Modélisation**
    - Modéliser comme volume à l'extérieur du bâtiment.
    - Attribuer balcons et terrasses à l'étage concerné.
    - Nom du local dans LongName, numéro facultatif dans Name.
  it: |
    Spazi esterni come balconi, terrazze e aree esterne sistemate (IfcSpace, PredefinedType EXTERNAL).

    **Modellazione**
    - Modellare come volume all'esterno dell'edificio.
    - Attribuire balconi e terrazze al piano corrispondente.
    - Nome del locale in LongName, numero facoltativo in Name.
  en: |
    Exterior spaces such as balconies, terraces, and treated surroundings (IfcSpace, PredefinedType EXTERNAL).

    **Modelling**
    - Model as a volume outside the building.
    - Assign balconies and terraces to the matching storey.
    - Room name in LongName, optional room number in Name.
needed_in_domain:
- pragmaticbim:domain/architecture
- pragmaticbim:domain/mep
entity_ifc2x3: IfcSpace
entity_ifc4: IfcSpace
entity_ifc4_3: IfcSpace
picture_link: null
model_link: null
applicability: entity_ifc4=IfcSpace AND PredefinedType=EXTERNAL AND Pset_SpaceCommon.IsExternal=TRUE
attributes:
- name: PredefinedType
  pset: null
  definition:
    de: Kennzeichnet den Raum als Aussenraum (EXTERNAL).
    fr: Identifie l'espace comme extérieur (EXTERNAL).
    it: Identifica lo spazio come esterno (EXTERNAL).
    en: Marks the space as exterior (EXTERNAL).
  datatype: IfcLabel
  allowed_values: pragmaticbim:value/predefinedtype-space-external
  needed_in_phases: ['31', '32', '33']
  ifc_versions: [ifc4, ifc4x3]
  needed_for_workflows:
  - pragmaticbim:workflow/des-element-based-cost
  - pragmaticbim:workflow/des-building-performance-simulation
  - pragmaticbim:workflow/qas-coordination
  is_applicability: true
  status: active
  sort_order: 1
- name: LongName
  pset: null
  definition:
    de: Raumname bzw. Raumtyp. Pflicht für abstractBIM-Mengen und Simulation.
    fr: Nom ou type de local. Obligatoire pour les quantités abstractBIM et la simulation.
    it: Nome o tipo di locale. Obbligatorio per quantità abstractBIM e simulazione.
    en: Room name or room type. Required for abstractBIM quantities and simulation.
  datatype: IfcLabel
  needed_in_phases: ['31', '32', '33']
  ifc_versions: [ifc4, ifc4x3]
  needed_for_workflows:
  - pragmaticbim:workflow/des-element-based-cost
  - pragmaticbim:workflow/des-building-performance-simulation
  is_applicability: false
  status: active
  sort_order: 2
- name: Name
  pset: null
  definition:
    de: Optionale Raumnummer gemäss Projektnummerierung.
    fr: Numéro de local facultatif selon la numérotation du projet.
    it: Numero locale facoltativo secondo la numerazione di progetto.
    en: Optional room number according to the project numbering scheme.
  datatype: IfcIdentifier
  needed_in_phases: ['31', '32', '33']
  ifc_versions: [ifc4, ifc4x3]
  needed_for_workflows:
  - pragmaticbim:workflow/des-element-based-cost
  - pragmaticbim:workflow/des-building-performance-simulation
  is_applicability: false
  status: active
  sort_order: 3
- name: Reference
  pset: Pset_SpaceCommon
  definition:
