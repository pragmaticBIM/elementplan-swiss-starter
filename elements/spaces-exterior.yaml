- name: VibrationRequirements
  pset: ePset_SpaceRequirement
  definition:
    de: 'Vereinbarte Schwingungsanforderungen Soll für die Nutzungsvereinbarung nach ISO-Schwingungskriterien und Vibration Criterion (VC) nach IEST.


      **Zulässige Werte**

      - `ISO Workshop` — 800 µm/s (32''000 µin/s): Werkstätten, grobe Fertigungsbereiche, Maschinenschutzzonen

      - `ISO Office` — 400 µm/s (16''000 µin/s): Büroräume, Kontrollräume, allgemeine Verwaltungsbereiche

      - `ISO Residential (Night)` — 200 µm/s (8''000 µin/s): Wohnbereiche (Nacht), leichte PC-Arbeitsplätze, Mikroskope <40×

      - `ISO Operating Theatre (OT)` — 100 µm/s (4''000 µin/s): Basislinie (Base Curve): Operationssäle, allgemeine Labore, Mikroskope bis 100×

      - `VC-A` — Vibration Criterion A nach IEST

      - `VC-B` — Vibration Criterion B nach IEST

      - `VC-C` — Vibration Criterion C nach IEST

      - `VC-D` — Vibration Criterion D nach IEST

      - `VC-E` — Vibration Criterion E nach IEST'
    fr: 'Exigences vibratoires cibles convenues pour la convention d''utilisation selon les critères vibratoires ISO et le Vibration Criterion (VC) selon IEST.


      **Valeurs admises**

      - `ISO Workshop` — 800 µm/s (32''000 µin/s) : ateliers, zones de fabrication grossière, zones de protection des machines

      - `ISO Office` — 400 µm/s (16''000 µin/s) : bureaux, salles de contrôle, locaux administratifs généraux

      - `ISO Residential (Night)` — 200 µm/s (8''000 µin/s) : locaux d''habitation (nuit), postes de travail PC légers, microscopes <40×

      - `ISO Operating Theatre (OT)` — 100 µm/s (4''000 µin/s) : courbe de base (Base Curve) : salles d''opération, laboratoires généraux, microscopes jusqu''à 100×

      - `VC-A` — Vibration Criterion A selon IEST

      - `VC-B` — Vibration Criterion B selon IEST

      - `VC-C` — Vibration Criterion C selon IEST

      - `VC-D` — Vibration Criterion D selon IEST

      - `VC-E` — Vibration Criterion E selon IEST'
    it: 'Requisiti di vibrazione obiettivo concordati per la convenzione d''uso secondo i criteri di vibrazione ISO e il Vibration Criterion (VC) secondo IEST.


      **Valori ammessi**

      - `ISO Workshop` — 800 µm/s (32''000 µin/s): officine, aree di produzione grezza, zone di protezione macchine

      - `ISO Office` — 400 µm/s (16''000 µin/s): uffici, sale di controllo, aree amministrative generali

      - `ISO Residential (Night)` — 200 µm/s (8''000 µin/s): aree residenziali (notte), postazioni PC leggere, microscopi <40×

      - `ISO Operating Theatre (OT)` — 100 µm/s (4''000 µin/s): curva di base (Base Curve): sale operatorie, laboratori generali, microscopi fino a 100×

      - `VC-A` — Vibration Criterion A secondo IEST

      - `VC-B` — Vibration Criterion B secondo IEST

      - `VC-C` — Vibration Criterion C secondo IEST

      - `VC-D` — Vibration Criterion D secondo IEST

      - `VC-E` — Vibration Criterion E secondo IEST'
    en: 'Agreed target vibration requirements for the usage agreement according to ISO vibration criteria and Vibration Criterion (VC) per IEST.


      **Allowed values**

      - `ISO Workshop` — 800 µm/s (32''000 µin/s): workshops, coarse manufacturing areas, machine protection zones

      - `ISO Office` — 400 µm/s (16''000 µin/s): offices, control rooms, general administrative areas

      - `ISO Residential (Night)` — 200 µm/s (8''000 µin/s): residential areas (night), light PC workplaces, microscopes <40×

      - `ISO Operating Theatre (OT)` — 100 µm/s (4''000 µin/s): baseline (Base Curve): operating theatres, general laboratories, microscopes up to 100×

      - `VC-A` — Vibration Criterion A per IEST

      - `VC-B` — Vibration Criterion B per IEST

      - `VC-C` — Vibration Criterion C per IEST

      - `VC-D` — Vibration Criterion D per IEST

      - `VC-E` — Vibration Criterion E per IEST'
