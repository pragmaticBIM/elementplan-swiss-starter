- name: Reference
  pset: Pset_SpaceCommon
  definition:
    de: 'Flächenklasse des Aussenraums nach SIA 416 oder SIA D0165.


      **Quelle**

      - SIA 416: https://schema.pragmaticbim.ch/classification/mapping-room-activity-to-sia416.html

      - SIA D0165: https://schema.pragmaticbim.ch/classification/mapping-room-activity-to-d0165.html


      **Zulässige Werte**

      - Siehe Werteliste Raumreferenz Aussenraum SIA 416 / D0165 — z. B. `AGF`, `AVF`, `BUF`, `UUF` (SIA 416) oder `BUF-10`, `AVF`, `AFF`, `ANF` (D0165).'
    fr: 'Classe de surface de l''espace extérieur selon SIA 416 ou SIA D0165.


      **Source**

      - SIA 416 : https://schema.pragmaticbim.ch/classification/mapping-room-activity-to-sia416.html

      - SIA D0165 : https://schema.pragmaticbim.ch/classification/mapping-room-activity-to-d0165.html


      **Valeurs admises**

      - Voir la liste de valeurs Référence de local extérieur SIA 416 / D0165 — p. ex. `AGF`, `AVF`, `BUF`, `UUF` (SIA 416) ou `BUF-10`, `AVF`, `AFF`, `ANF` (D0165).'
    it: 'Classe di superficie dello spazio esterno secondo SIA 416 o SIA D0165.


      **Fonte**

      - SIA 416: https://schema.pragmaticbim.ch/classification/mapping-room-activity-to-sia416.html

      - SIA D0165: https://schema.pragmaticbim.ch/classification/mapping-room-activity-to-d0165.html


      **Valori ammessi**

      - Vedere l''elenco valori Riferimento locale esterno SIA 416 / D0165 — p. es. `AGF`, `AVF`, `BUF`, `UUF` (SIA 416) o `BUF-10`, `AVF`, `AFF`, `ANF` (D0165).'
    en: 'Area class of the exterior space according to SIA 416 or SIA D0165.


      **Source**

      - SIA 416: https://schema.pragmaticbim.ch/classification/mapping-room-activity-to-sia416.html

      - SIA D0165: https://schema.pragmaticbim.ch/classification/mapping-room-activity-to-d0165.html


      **Allowed values**

      - See value list Space reference exterior SIA 416 / D0165 — e.g. `AGF`, `AVF`, `BUF`, `UUF` (SIA 416) or `BUF-10`, `AVF`, `AFF`, `ANF` (D0165).'
