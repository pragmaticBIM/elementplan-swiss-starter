      **Remarque**

      - Les espaces d''une unité d''usage peuvent aussi être regroupés au moyen d''une `IfcZone`.'
    it: 'Riferimento stabile dell''unità d''uso a cui appartiene lo spazio esterno, per esempio appartamento, unità per uffici o unità commerciale.


      **Nota**

      - In alternativa, gli spazi di un''unità d''uso possono essere raggruppati mediante una `IfcZone`.'
    en: 'Stable reference of the usage unit to which the exterior space belongs, for example an apartment, office unit, or commercial unit.


      **Note**

      - Alternatively, the spaces of a usage unit can be grouped using `IfcZone`.'
