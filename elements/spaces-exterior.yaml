id: pragmaticbim:element/spaces-exterior
code: SPACE-EXT
sort_order: 12
status: active
name:
  de: Aussenräume
  fr: Espaces extérieurs
  it: Spazi esterni
  en: Exterior spaces
definition:
  de: 'Macht nutzbare Aussenflächen für Flächennachweise, Nutzungsplanung und die Abstimmung von Gebäude und Umgebung auswertbar.


    **Beschreibung**

    - Aussenräume wie Balkone, Terrassen und bearbeitete Umgebung.

    - Raumnutzung wird über LongName geführt; Name kann die Raumnummer tragen.


    **Modellierungshinweis**

    - Als Volumen ausserhalb des Gebäudes modellieren – von der Aussenkante des Gebäudes bis zur Grundstücksgrenze bzw. Grenze des Bearbeitungsperimeters.

    - Balkone und Terrassen dem jeweiligen Geschoss zuweisen.

    - Empfehlung: Aussenräume nur 1 m hoch modellieren, um Innen- und Aussenräume in der Ansicht schnell zu unterscheiden.

    - Werden diese Konventionen zur Benennung und Höhe der Räume konsequent eingehalten, lässt sich die Zuweisung von `TRUE` für IsExternal einfach automatisieren. Dadurch werden Fehlerpotenzial und Aufwand
    weiter reduziert.'
  fr: 'Rend les surfaces extérieures utilisables exploitables pour les justificatifs de surfaces, la planification des usages et la coordination entre bâtiment et abords.


    **Description**

    - Espaces extérieurs tels que balcons, terrasses et abords aménagés.

    - L''usage du local est saisi dans LongName ; Name peut contenir le numéro de local.


    **Directives de modélisation**

    - Modéliser comme volume à l''extérieur du bâtiment – de la face extérieure du bâtiment jusqu''à la limite parcellaire ou à la limite du périmètre d''intervention.

    - Attribuer balcons et terrasses à l''étage concerné.

    - Recommandation : modéliser les espaces extérieurs sur 1 m de hauteur seulement, pour les distinguer visuellement des espaces intérieurs.

    - Si ces conventions de désignation des locaux et de hauteur sont appliquées systématiquement, l''attribution de `TRUE` à IsExternal peut être automatisée facilement. Le risque d''erreur et le travail
    nécessaire sont ainsi encore réduits.'
  it: 'Rende valutabili le superfici esterne utilizzabili per le verifiche delle superfici, la pianificazione degli usi e il coordinamento tra edificio e sistemazioni esterne.


    **Descrizione**

    - Spazi esterni come balconi, terrazze e aree esterne sistemate.

    - L''uso del locale è indicato in LongName; Name può riportare il numero del locale.


    **Direttive di modellazione**

    - Modellare come volume all''esterno dell''edificio – dal filo esterno dell''edificio fino al confine della particella o al limite del perimetro d''intervento.

    - Attribuire balconi e terrazze al piano corrispondente.

    - Raccomandazione: modellare gli spazi esterni con altezza di soli 1 m, per distinguerli visivamente dagli spazi interni.

    - Se queste convenzioni per la denominazione e l''altezza dei locali vengono applicate sistematicamente, l''assegnazione di `TRUE` a IsExternal può essere automatizzata facilmente. In questo modo si
    riducono ulteriormente il rischio di errori e l''onere.'
  en: 'Makes usable exterior areas measurable for area verification, use planning, and coordination between the building and its surroundings.


    **Description**

    - Exterior spaces such as balconies, terraces, and treated surroundings.

    - Room use is carried in LongName; Name may carry the room number.


    **Modelling guidelines**

    - Model as a volume outside the building – from the building''s outer face to the property boundary or the boundary of the project area.

    - Assign balconies and terraces to the matching storey.

    - Best practice: model exterior spaces only 1 m high to visually distinguish them from interior spaces quickly.

    - If these room-naming and height conventions are followed consistently, assigning `TRUE` to IsExternal can be automated easily. This further reduces the potential for errors and the effort required.'
