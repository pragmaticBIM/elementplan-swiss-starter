    fr: Référence de l'espace extérieur pour la coordination.
    it: Riferimento dello spazio esterno per il coordinamento.
    en: Exterior space reference used for coordination.
  datatype: IfcIdentifier
  needed_in_phases: ['31', '32', '33']
  ifc_versions: [ifc4, ifc4x3]
