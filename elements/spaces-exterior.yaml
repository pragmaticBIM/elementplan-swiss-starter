  definition:
    de: 'Stabile Referenz der Nutzungseinheit, zu welcher der Aussenraum gehört, zum Beispiel Wohnung, Büro- oder Gewerbeeinheit.


      **Hinweis**

      - Alternativ können die Räume einer Nutzungseinheit über `IfcZone` gruppiert werden.'
