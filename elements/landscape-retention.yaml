name:
  de: Retentionsvolumen
  fr: Volume de rétention
  it: Volume di ritenzione
  en: Retention volume
definition:
  de: 'Macht Retentionsvolumen den Einzugsflächen zuordenbar und die Bemessung gegen Starkregen nachvollziehbar.


    **Beschreibung**

    - Speichervolumen für Regenwasser im Aussenraum (Mulde, unterirdischer Speicher, absenkbare Fläche).

    - Dient dem Schwammstadtnachweis und der Zuordnung zu den angeschlossenen Aussenraumflächen.


    **Modellierungshinweis**

    - Als vereinfachtes Speichervolumen modellieren; Bemessungsereignis und Einzugsbezug führen.

    - Keine Detailgeometrie von Armaturen, Filtern oder Notüberläufen modellieren.'
  fr: 'Rend le volume de rétention attribuable aux bassins versants et le dimensionnement contre les fortes pluies traçable.


    **Description**

    - Volume de stockage des eaux pluviales dans l''espace extérieur (noue, stockage souterrain, surface abaissable).

    - Sert au justificatif ville-éponge et à l''attribution aux surfaces extérieures raccordées.


    **Directives de modélisation**

    - Modéliser comme volume de stockage simplifié; saisir l''événement de dimensionnement et le rattachement au bassin versant.

    - Ne pas modéliser la géométrie détaillée des accessoires, des filtres ni des trop-pleins de sécurité.'
  it: 'Rende il volume di ritenzione assegnabile ai bacini di raccolta e il dimensionamento contro le piogge intense tracciabile.


    **Descrizione**

    - Volume di accumulo dell''acqua piovana nello spazio esterno (depressione, serbatoio sotterraneo, superficie abbassabile).

    - Serve alla verifica città spugna e all''assegnazione alle superfici esterne collegate.


    **Direttive di modellazione**

    - Modellare come volume di accumulo semplificato; gestire l''evento di dimensionamento e il riferimento al bacino.

    - Non modellare la geometria dettagliata di armature, filtri o sfioratori di emergenza.'
  en: 'Makes retention volume assignable to catchments and the sizing against heavy rain traceable.


    **Description**

    - Storage volume for rainwater in the outdoor area (swale, underground storage, surface designed to flood).

    - Used for sponge-city proof and assignment to the connected outdoor surfaces.


    **Modelling guidelines**

    - Model as a simplified storage volume; carry the design event and catchment reference.

    - Do not model detailed geometry of fittings, filters, or emergency overflows.'
