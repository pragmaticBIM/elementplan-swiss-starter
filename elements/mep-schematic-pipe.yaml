attributes:
- name: Reference
  pset: Pset_PipeSegmentTypeCommon
  definition:
    de: 'Medium der schematischen Rohrleitung.


      **Zulässige Werte**

      - `HZ` — Heizung

      - `VL-H` — Vorlauf Heizung

      - `RL-H` — Rücklauf Heizung

      - `KZ` — Kälte

      - `VL-K` — Vorlauf Kälte

      - `RL-K` — Rücklauf Kälte

      - `TW` — Trinkwasser

      - `FW` — Frischwasser

      - `AW` — Abwasser (sanitär)

      - `WW` — Abwasser (alternative Kennung)

      - `ENT` — Entwässerung (Gebäudeentwässerung)'
    fr: 'Fluide de la canalisation schématique.


      **Valeurs admises**

      - `HZ` — chauffage

      - `VL-H` — départ chauffage

      - `RL-H` — retour chauffage

      - `KZ` — froid

      - `VL-K` — départ froid

      - `RL-K` — retour froid

      - `TW` — eau potable

      - `FW` — eau fraîche

      - `AW` — eaux usées (sanitaires)

      - `WW` — eaux usées (autre code)

      - `ENT` — évacuation du bâtiment'
    it: 'Mezzo della condotta schematica.


      **Valori ammessi**

      - `HZ` — riscaldamento

      - `VL-H` — mandata riscaldamento

      - `RL-H` — ritorno riscaldamento

      - `KZ` — freddo

      - `VL-K` — mandata freddo

      - `RL-K` — ritorno freddo

      - `TW` — acqua potabile

      - `FW` — acqua fredda

      - `AW` — acque reflue (sanitarie)

      - `WW` — acque reflue (codice alternativo)

      - `ENT` — drenaggio (edificio)'
    en: 'Medium of the schematic pipe.


      **Allowed values**

      - `HZ` — heating

      - `VL-H` — heating flow (supply)

      - `RL-H` — heating return

      - `KZ` — cooling

      - `VL-K` — cooling flow (supply)

      - `RL-K` — cooling return

      - `TW` — drinking water

      - `FW` — fresh water

      - `AW` — wastewater (sanitary)

      - `WW` — wastewater (alternate code)

      - `ENT` — drainage (building)'
