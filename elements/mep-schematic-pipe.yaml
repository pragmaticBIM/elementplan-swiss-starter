      - `KZ` — Kälte

      - `VL-K` — Vorlauf Kälte

      - `RL-K` — Rücklauf Kälte

      - `TW` — Trinkwasser

      - `FW` — Frischwasser

      - `AW` — Abwasser (sanitär)

      - `WW` — Abwasser (alternative Kennung)

      - `ENT` — Entwässerung (Gebäudeentwässerung)

      - `FL` — Fallleitung (Regenfallleitung)'
    fr: 'Fluide de la canalisation schématique.


      **Valeurs admises**

      - `HZ` — chauffage

      - `VL-H` — départ chauffage

      - `RL-H` — retour chauffage

      - `KZ` — froid

      - `VL-K` — départ froid

      - `RL-K` — retour froid

      - `TW` — eau potable

      - `FW` — eau froide

      - `AW` — eaux usées (sanitaires)

      - `WW` — eaux usées (code alternatif)

      - `ENT` — drainage (évacuation du bâtiment)

      - `FL` — descente pluviale'
    it: 'Mezzo della condotta schematica.


      **Valori ammessi**

      - `HZ` — riscaldamento

      - `VL-H` — mandata riscaldamento

      - `RL-H` — ritorno riscaldamento

      - `KZ` — freddo

      - `VL-K` — mandata freddo

      - `RL-K` — ritorno freddo

      - `TW` — acqua potabile

      - `FW` — acqua fredda

      - `AW` — acque reflue (sanitarie)

      - `WW` — acque reflue (codice alternativo)

      - `ENT` — drenaggio (edificio)

      - `FL` — pluviale (discendente)'
    en: 'Medium of the schematic pipe.


      **Allowed values**

      - `HZ` — heating

      - `VL-H` — heating flow (supply)

      - `RL-H` — heating return

      - `KZ` — cooling

      - `VL-K` — cooling flow (supply)

      - `RL-K` — cooling return

      - `TW` — drinking water

      - `FW` — fresh water

      - `AW` — wastewater (sanitary)

      - `WW` — wastewater (alternate code)

      - `ENT` — drainage (building)

      - `FL` — downpipe (rainwater)'
