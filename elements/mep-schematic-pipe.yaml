id: pragmaticbim:element/mep-schematic-pipe
code: MEP-SCH-PIPE
sort_order: 60
status: active
name:
  de: Rohrleitung (schematisch)
  fr: Canalisation (schématique)
  it: Condotta (schematica)
  en: Pipe (schematic)
definition:
  de: 'Reserviert in der frühen Phase die Haupttrassen der Rohrnetze und reduziert spätere Kollisionen.


    **Beschreibung**

    - Vereinfachtes Segment oder Volumen für Hauptführungen (Heizung, Kälte, Frischwasser, Abwasser u. a.).

    - Dient der Machbarkeits- und Kollisionsprüfung, nicht der Ausführungsplanung.


    **Modellierungshinweis**

    - Als Volumen oder vereinfachtes Segment modellieren; Querschnitt gemäss Grobkonzept.

    - Medium über Reference setzen (z. B. HZ, KZ, TW, AW, ENT).

    - Nur im Vorprojekt verwenden. Ab dem Bauprojekt ist die Fallleitung ein eigenes Element mit Reference `FL`.

    - Keine Armaturen, Regelventile oder Anschlussdetails modellieren.'
  fr: 'Réserve en phase initiale les tracés principaux des réseaux et réduit les collisions ultérieures.


    **Description**

    - Segment ou volume simplifié pour les tracés principaux (chauffage, froid, eau fraîche, eaux usées, etc.).

    - Sert à vérifier la faisabilité et les collisions, pas à planifier l’exécution.


    **Directives de modélisation**

    - Le modéliser en volume ou en segment simplifié ; section selon l’esquisse.

    - Renseigner le fluide dans Reference (p. ex. HZ, KZ, TW, AW, ENT).

    - Ne l’utiliser qu’à l’avant-projet. Dès le projet de construction, la descente est un élément à part, avec Reference `FL`.

    - Ne pas modéliser les accessoires, les vannes de régulation ni les détails de raccordement.'
  it: 'Riserva già nella fase iniziale i tracciati principali delle reti di condotte e riduce le interferenze successive.


    **Descrizione**

    - Segmento o volume semplificato per percorsi principali (riscaldamento, freddo, acqua, scarichi, ecc.).

    - Serve per fattibilità e collisioni, non per l''esecuzione.


    **Direttive di modellazione**

    - Modellare come volume o segmento semplificato; sezione secondo il concetto di massima.

    - Impostare il fluido in Reference (p. es. HZ, KZ, TW, AW, ENT).

    - Usare solo nell''avamprogetto. Dal progetto di costruzione il pluviale è un componente distinto con Reference `FL`.

    - Non modellare armature, valvole o dettagli di collegamento.'
  en: 'Reserves main pipework routes in the initial phase and reduces later clashes.


    **Description**

    - Simplified segment or volume for main routes (heating, cooling, water, wastewater, etc.).

    - Used for feasibility and clash checking, not for execution planning.


    **Modelling guidelines**

    - Model as a volume or simplified segment; cross-section according to the sketch concept.

    - Set the medium in Reference (e.g. HZ, KZ, TW, AW, ENT).

    - Use only in preliminary design. From the construction project onward, the downpipe is a separate element with Reference `FL`.

    - Do not model fittings, control valves, or connection details.'
