id: pragmaticbim:element/mep-schematic-pipe
code: MEP-SCH-PIPE
sort_order: 60
status: active
name:
  de: Rohrleitung (schematisch)
  fr: Canalisation (schématique)
  it: Condotta (schematica)
  en: Pipe (schematic)
definition:
  de: 'Schematische Rohrleitung für die frühe Koordination — Medium in Reference.


    **Beschreibung**

    - Vereinfachtes Segment oder Volumen für Hauptführungen (Heizung, Kälte, Frischwasser, Abwasser u. a.).

    - Dient der Machbarkeits- und Kollisionsprüfung, nicht der Ausführungsplanung.


    **Modellierungsrichtlinie**

    - Als Volumen oder vereinfachtes Segment modellieren; Querschnitt gemäss Grobkonzept.

    - Medium über Reference setzen (z. B. HZ, KZ, TW, AW, FL).

    - Keine Armaturen, Regelventile oder Anschlussdetails modellieren.'
  fr: 'Canalisation schématique pour la coordination précoce — médium dans Reference.


    **Description**

    - Segment ou volume simplifié pour tracés principaux (chauffage, froid, eau, eaux usées, etc.).

    - Sert à la faisabilité et aux collisions, pas à l''exécution.


    **Directives de modélisation**

    - Modéliser comme volume ou segment simplifié; section selon le concept grossier.

    - Indiquer le médium dans Reference (p. ex. HZ, KZ, TW, AW, FL).

    - Ne pas modéliser armatures, vannes ou raccords de détail.'
  it: 'Condotta schematica per il coordinamento precoce — mezzo in Reference.


    **Descrizione**

    - Segmento o volume semplificato per percorsi principali (riscaldamento, freddo, acqua, scarichi, ecc.).

    - Serve per fattibilità e collisioni, non per l''esecuzione.


    **Direttive di modellazione**

    - Modellare come volume o segmento semplificato; sezione secondo il concept grossolano.

    - Impostare il mezzo in Reference (p. es. HZ, KZ, TW, AW, FL).

    - Non modellare armature, valvole o dettagli di collegamento.'
  en: 'Schematic pipe for early coordination — medium in Reference.


    **Description**

    - Simplified segment or volume for main routes (heating, cooling, water, wastewater, etc.).

    - Used for feasibility and clash checking, not for execution planning.


    **Modelling guidelines**

    - Model as a volume or simplified segment; cross-section according to the sketch concept.

    - Set the medium in Reference (e.g. HZ, KZ, TW, AW, FL).

    - Do not model fittings, control valves, or connection details.'
