id: pragmaticbim:element/architecture-detail-reference
code: ARC-DET-REF
sort_order: 71
status: active
name:
  de: Detailverweis
  fr: Renvoi de détail
  it: Riferimento al dettaglio
  en: Detail reference
definition:
  de: 'Macht räumlich prüfbar, wo Standarddetails gelten, und deckt fehlende oder widersprüchliche Detailzuordnungen früh auf.


    **Beschreibung**

    - Räumliche Gültigkeitszone für ein Standarddetail aus dem Detailkatalog.

    - Ermöglicht die Erkennung von Planungslücken und fehlenden Detailzuordnungen im Modell.


    **Modellierungshinweis**

    - Als vereinfachtes Volumen modellieren; Umfang gemäss Gültigkeitsbereich des Standarddetails.

    - Dem zugehörigen Geschoss zuweisen.

    - Keine Ausführungsgeometrie oder Schichtaufbauten modellieren.'
  fr: 'Permet de vérifier spatialement où les détails types s''appliquent et révèle tôt les attributions manquantes ou contradictoires.


    **Description**

    - Zone spatiale de validité pour un détail type du catalogue.

    - Permet de repérer les lacunes de planification et les affectations manquantes dans le modèle.


    **Directives de modélisation**

    - Modéliser comme volume simplifié ; étendue selon la zone de validité du détail type.

    - Rattacher à l''étage concerné.

    - Ne pas modéliser géométrie d''exécution ni compositions de couches.'
  it: 'Consente di verificare nello spazio dove si applicano i dettagli standard e rileva tempestivamente assegnazioni mancanti o contraddittorie.


    **Descrizione**

    - Zona spaziale di validità per un dettaglio standard del catalogo.

    - Consente di individuare lacune di pianificazione e assegnazioni mancanti nel modello.


    **Direttive di modellazione**

    - Modellare come volume semplificato; estensione secondo l''ambito di validità del dettaglio standard.

    - Assegnare al piano corrispondente.

    - Non modellare geometria esecutiva o composizioni stratificate.'
  en: 'Makes it spatially verifiable where standard details apply and reveals missing or conflicting detail assignments early.


    **Description**

    - Spatial validity zone for a standard detail from the detail catalogue.

    - Enables detection of planning gaps and missing detail assignments in the model.


    **Modelling guidelines**

    - Model as a simplified volume; extent according to the standard detail''s validity area.

    - Assign to the matching storey.

    - Do not model execution geometry or layer build-ups.'
