- name: ElementStatus
  pset: ePset_ElementStatus
  definition:
    de: 'Status der Geländeoberfläche zur Trennung von Bestand und projektiertem Terrain. Der Humusabtrag gehört nicht hierher.


      **Zulässige Werte**

      - `NEW` — projektiertes Terrain

      - `EXISTING` — Bestand

      - `DEMOLISH` — entfallende Fläche

      - `TEMPORARY` — temporäres Terrain'
    fr: 'Statut de la surface de terrain pour distinguer l''existant et le terrain projeté. Le déblai d''humus n''y figure pas.


      **Valeurs admises**

      - `NEW` — terrain projeté

      - `EXISTING` — existant

      - `DEMOLISH` — surface supprimée

      - `TEMPORARY` — terrain provisoire'
    it: 'Stato della superficie del terreno per distinguere l''esistente e il terreno di progetto. Lo scavo dell''humus non vi rientra.


      **Valori ammessi**

      - `NEW` — terreno di progetto

      - `EXISTING` — esistente

      - `DEMOLISH` — superficie eliminata

      - `TEMPORARY` — terreno provvisorio'
    en: 'Terrain-surface status distinguishing existing and designed terrain. Humus stripping does not belong here.


      **Allowed values**

      - `NEW` — designed terrain

      - `EXISTING` — existing

      - `DEMOLISH` — surface to remove

      - `TEMPORARY` — temporary terrain'
