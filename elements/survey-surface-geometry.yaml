id: pragmaticbim:element/survey-surface-geometry
code: SURVEY-SURFACE
sort_order: 60
status: active
name:
  de: Oberflächengeometrie
  fr: Géométrie de surface
  it: Geometria di superficie
  en: Surface geometry
definition:
  de: 'Stellt Bestand und projektiertes Gelände bereit, damit Anschlüsse ans Gebäude und Erdmassen abgestimmt geplant werden können.


    **Beschreibung**

    - Geländeform mit Lage und Höhe im Bezugsrahmen LV95, als Bestand oder als Projekt.

    - Grundlage für den Abgleich mit der Punktwolke und für die Prüfung der Gebäudeanschlüsse.


    **Modellierungshinweis**

    - Bestandsfläche gemäss Geometerlieferung, projektierte Fläche gemäss Landschaftsplanung; dem Planungsperimeter zuweisen.

    - Beide als getrennte Oberflächen führen. Den Humusabtrag nicht auf der Fläche abbilden.

    - Lage und Höhe in LV95; Bestand mit der Punktwolke abstimmen.'
  fr: 'Fournit le terrain existant et le terrain projeté afin de planifier de manière coordonnée les raccordements au bâtiment et les mouvements de terre.


    **Description**

    - Forme du terrain avec position et altitude dans le référentiel LV95, en existant ou en projet.

    - Base pour le calage sur le nuage de points et le contrôle des raccordements au bâtiment.


    **Directives de modélisation**

    - Surface existante selon la livraison du géomètre, surface projetée selon l''aménagement paysager ; rattacher au périmètre de planification.

    - Tenir les deux comme surfaces distinctes. Ne pas représenter le déblai d''humus sur la surface.

    - Position et altitude en LV95 ; caler l''existant sur le nuage de points.'
  it: 'Fornisce il terreno esistente e quello di progetto per pianificare in modo coordinato i raccordi con l''edificio e i movimenti di terra.


    **Descrizione**

    - Forma del terreno con posizione e quota nel sistema di riferimento LV95, come esistente o come progetto.

    - Base per l''allineamento alla nuvola di punti e per la verifica dei raccordi con l''edificio.


    **Direttive di modellazione**

    - Superficie esistente secondo la consegna del geometra, superficie di progetto secondo la progettazione del paesaggio; assegnare al perimetro di pianificazione.

    - Tenere entrambe come superfici distinte. Non rappresentare lo scavo dell''humus sulla superficie.

    - Posizione e quota in LV95; allineare l''esistente alla nuvola di punti.'
  en: 'Provides existing and designed terrain so that connections to the building and earth quantities can be planned in coordination.


    **Description**

    - Terrain form with position and height in the LV95 reference frame, as existing or as design.

    - Basis for point-cloud alignment and for checking connections to the building.


    **Modelling guidelines**

    - Existing surface according to the surveyor delivery, designed surface according to landscape design; assign to the planning perimeter.

    - Keep both as separate surfaces. Do not show humus stripping on the surface.

    - Position and height in LV95; align the existing surface with the point cloud.'
