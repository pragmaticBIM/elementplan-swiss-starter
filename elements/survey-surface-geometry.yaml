id: pragmaticbim:element/survey-surface-geometry
code: SURVEY-SURFACE
sort_order: 6
status: active
name:
  de: Oberflächengeometrie
  fr: Géométrie de surface
  it: Geometria di superficie
  en: Surface geometry
definition:
  de: 'Geländeoberfläche als modellierte Oberflächengeometrie — dokumentiertes Geländemodell im gemeinsamen Bezugsrahmen.


    **Beschreibung**

    - Aufgenommene Geländeform mit Lage und Höhe im Bezugsrahmen LV95.

    - Grundlage für Abgleich mit Punktwolke und für Planungsentscheide zu Abbruch, Neubau oder Umbau.


    **Modellierungsrichtlinie**

    - Als Oberflächengeometrie gemäss Geometerlieferung modellieren; dem Planungsperimeter zuweisen.

    - Lage und Höhe in LV95; mit der Punktwolke abstimmen.'
  fr: 'Surface de terrain modélisée comme géométrie de surface — modèle de terrain documenté dans le référentiel commun.


    **Description**

    - Forme du terrain relevée avec position et altitude dans le référentiel LV95.

    - Base pour le calage sur le nuage de points et les décisions de démolition, reconstruction ou transformation.


    **Directives de modélisation**

    - Modéliser comme géométrie de surface selon la livraison du géomètre ; rattacher au périmètre de planification.

    - Position et altitude en LV95 ; caler sur le nuage de points.'
  it: 'Superficie del terreno modellata come geometria di superficie — modello del terreno documentato nel riferimento comune.


    **Descrizione**

    - Forma del terreno rilevata con posizione e quota nel sistema di riferimento LV95.

    - Base per l''allineamento alla nuvola di punti e per le decisioni su demolizione, ricostruzione o trasformazione.


    **Direttive di modellazione**

    - Modellare come geometria di superficie secondo la consegna del geometra; assegnare al perimetro di pianificazione.

    - Posizione e quota in LV95; allineare alla nuvola di punti.'
  en: 'Terrain surface as modelled surface geometry — documented terrain model in the shared reference frame.


    **Description**

    - Surveyed terrain form with position and height in the LV95 reference frame.

    - Basis for point-cloud alignment and decisions on demolition, new build, or conversion.


    **Modelling guidelines**

    - Model as surface geometry according to the surveyor delivery; assign to the planning perimeter.

    - Position and height in LV95; align with the point cloud.'
