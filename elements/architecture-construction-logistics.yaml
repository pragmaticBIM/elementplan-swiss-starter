name:
  de: Baustelleneinrichtungsobjekt
  fr: Objet d'installation de chantier
  it: Oggetto di installazione di cantiere
  en: Site setup object
definition:
  de: 'Macht Platzbedarf und zeitliche Abfolge der Baustellenlogistik früh abstimmbar und verhindert Konflikte während der Bauausführung.


    **Beschreibung**

    - Volumen, das ein Element der Baustelleneinrichtung abbildet (z. B. Kran, Container, Reifenwaschanlage).

    - Dient der Abstimmung der Logistikplanung mit Behörden und Unternehmen sowie dem Nachführen über die Bauphasen – nicht der Ausführungsdetailierung der Geräte.


    **Modellierungshinweis**

    - Als vereinfachten Proxy-Körper modellieren; Grundriss und Höhe gemäss benötigtem Platzbedarf inkl. Rampengefälle und Freiräumen.

    - Dem Planungsperimeter bzw. zugehörigen Geschoss zuweisen; ObjectType = Baustelleneinricht.

    - Name = Art der Einrichtung aus der Auswahlliste.

    - LogisticsPhase = nummerierte Logistikphase (1, 2, 3, …); keine Datums- oder Monatsangaben.

    - Keine Geräte, Fahrzeuge oder Ausbau innerhalb des Volumens detaillieren.'
  fr: 'Permet de coordonner tôt l''emprise et le déroulement de la logistique de chantier et évite les conflits pendant l''exécution.


    **Description**

    - Volume représentant un élément de l''installation de chantier (p. ex. grue, container, lave-roues).

    - Sert à coordonner la planification logistique avec autorités et entreprises et à la tenir à jour sur les phases de construction – pas au détail d''exécution des engins.


    **Directives de modélisation**

    - Modéliser comme corps proxy simplifié ; emprise et hauteur selon l''espace requis, y compris pentes de rampes et dégagements.

    - Rattacher au périmètre de planification ou à l''étage concerné ; ObjectType = Installation de chantier.

    - Name = nature de l''installation selon la liste de choix.

    - LogisticsPhase = phase logistique numérotée (1, 2, 3, …) ; pas de dates ni de mois.

    - Ne pas détailler engins, véhicules ou finitions à l''intérieur du volume.'
  it: 'Consente di coordinare tempestivamente gli ingombri e la sequenza della logistica di cantiere ed evita conflitti durante l’esecuzione.


    **Descrizione**

    - Volume che rappresenta un elemento dell''installazione di cantiere (p. es. gru, container, lavaruote).

    - Serve al coordinamento della pianificazione logistica con autorità e imprese e all''aggiornamento sulle fasi di costruzione – non al dettaglio esecutivo delle attrezzature.


    **Direttive di modellazione**

    - Modellare come corpo proxy semplificato; impronta e altezza secondo lo spazio necessario, comprese pendenze di rampe e spazi liberi.

    - Assegnare al perimetro di pianificazione o al piano corrispondente; ObjectType = Installazione di cantiere.

    - Name = tipo dell''installazione secondo l''elenco di scelta.

    - LogisticsPhase = fase logistica numerata (1, 2, 3, …); nessuna data o mese.

    - Non dettagliare attrezzature, veicoli o finiture all''interno del volume.'
  en: 'Makes the space requirements and sequence of site logistics alignable early and prevents conflicts during construction.


    **Description**

    - Volume representing a site-setup element (e.g. crane, container, wheel wash).

    - Used to align logistics planning with authorities and contractors and to keep it current across construction phases – not for detailing the equipment.


    **Modelling guidelines**

    - Model as a simplified proxy body; footprint and height according to required space including ramp slopes and clearances.

    - Assign to the planning perimeter or matching storey; ObjectType = Site setup.

    - Name = kind of installation from the value list.

    - LogisticsPhase = numbered logistics phase (1, 2, 3, …); no dates or months.

    - Do not detail equipment, vehicles, or finishes inside the volume.'
