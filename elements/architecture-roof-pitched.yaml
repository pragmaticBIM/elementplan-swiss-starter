id: pragmaticbim:element/architecture-roof-pitched
code: ARC-ROOF-PITCH
sort_order: 54
status: active
name:
  de: Steildach (Grob)
  fr: Toiture inclinée (Approximatif)
  it: Tetto inclinato (Indicativo)
  en: Pitched roof (Rough)
definition:
  de: 'Grobe Dimensionen gemäss Tragwerksplanung für Steildächer in Projektierung und Bewilligungsverfahren.


    **Beschreibung**

    - Grob dimensionierte Steildachgeometrie gemäss Tragwerks- und Hüllkonzept.

    - Dient der Koordination zwischen Architektur und Tragwerksplanung, nicht der Ausführungsplanung.


    **Modellierungsrichtlinie**

    - Als vereinfachtes Volumen oder Dachfläche modellieren; Neigung gemäss Grobkonzept.

    - Keine Dachaufbauten, Eindeckungen oder Detailanschlüsse modellieren.

    - Früh: Konzept über Skizzen als Tragwerksskizze im ARC-Modell; Sperrzonen vom Tragwerksplaner prüfen.

    - Später: Dieselben Bauteile mit Reference auch im Tragwerksmodell abstimmen.

    - IfcMaterial verwenden, das der tatsächlichen Materialklasse entspricht.'
  fr: 'Dimensions approximatives selon la conception structurale pour toitures inclinées en phases de projet et de procédure d''autorisation.


    **Description**

    - Géométrie de toiture inclinée dimensionnée grossièrement selon le concept porteur et enveloppe.

    - Sert à la coordination entre architecture et ingénierie structurelle, pas à l''exécution.


    **Directives de modélisation**

    - Modéliser comme volume simplifié ou surface de toiture ; pente selon le concept d''ensemble.

    - Ne pas modéliser superstructures, couverture ou raccords de détail.

    - Tôt : concept par croquis comme esquisse porteuse dans le modèle d''architecture ; vérifier les zones d''exclusion de l''ingénieur structure.

    - Plus tard : harmoniser les mêmes éléments avec Reference dans le modèle structurel.

    - Utiliser un IfcMaterial correspondant à la classe de matériau réelle.'
  it: 'Dimensioni indicative secondo la progettazione strutturale per tetti inclinati nelle fasi di progettazione e procedura di autorizzazione.


    **Descrizione**

    - Geometria di tetto inclinato dimensionata grossolanamente secondo il concept strutturale e dell''involucro.

    - Serve per il coordinamento tra architettura e ingegneria strutturale, non per l''esecuzione.


    **Direttive di modellazione**

    - Modellare come volume semplificato o superficie di copertura; inclinazione secondo il concetto di massima.

    - Non modellare sovrastrutture, manto di copertura o giunti di dettaglio.

    - Presto: concept tramite schizzi come schizzo strutturale nel modello di architettura; verificare le zone di esclusione dell''ingegnere strutturista.

    - Più tardi: allineare gli stessi elementi con Reference anche nel modello strutturale.

    - Usare un IfcMaterial corrispondente alla classe di materiale effettiva.'
  en: 'Rough dimensions according to structural engineering for pitched roofs in design development and permitting stages.


    **Description**

    - Coarsely dimensioned pitched roof geometry according to the structural and envelope concept.

    - Used for coordination between architecture and structural engineering, not for execution planning.


    **Modelling guidelines**

    - Model as a simplified volume or roof surface; pitch according to the sketch concept.

    - Do not model roof build-ups, cladding, or detail connections.

    - Early: concept via sketches as structural sketch in the architecture model; verify exclusion zones from the structural engineer.

    - Later: align the same components with Reference in the structural model as well.

    - Use an IfcMaterial that corresponds to the actual material class.'
