id: pragmaticbim:element/architecture-roof-pitched
code: ARC-ROOF-PITCH
sort_order: 30
status: active
name:
  de: Steildach (Grob)
  fr: Toiture inclinée (Approximatif)
  it: Tetto inclinato (Indicativo)
  en: Pitched roof (Rough)
definition:
  de: 'Macht Dachform und Tragkonzept früh räumlich prüfbar und unterstützt belastbare Bewilligungs- und Koordinationsentscheide.


    **Beschreibung**

    - Grob dimensionierte Steildachgeometrie gemäss Tragwerks- und Hüllkonzept.

    - Dient der Koordination zwischen Architektur und Tragwerksplanung, nicht der Ausführungsplanung.


    **Modellierungshinweis**

    - Als vereinfachtes Volumen oder Dachfläche modellieren; Neigung gemäss Grobkonzept.

    - Keine Dachaufbauten, Eindeckungen oder Detailanschlüsse modellieren.

    - In der Architekturkonzeption die Abmessungen der konzeptionellen Tragwerksbauteile mit dem Tragwerksplaner abstimmen und im Architekturmodell übernehmen.

    - Geeignetes Material im Autorensystem verwenden und exportieren.'
  fr: 'Permet de vérifier tôt dans l''espace la forme de la toiture et le concept porteur et étaye des décisions fiables pour l''autorisation et la coordination.


    **Description**

    - Géométrie de toiture inclinée dimensionnée grossièrement selon le concept porteur et enveloppe.

    - Sert à la coordination entre architecture et ingénierie structurelle, pas à l''exécution.


    **Directives de modélisation**

    - Modéliser comme volume simplifié ou surface de toiture ; pente selon le concept d''ensemble.

    - Ne pas modéliser superstructures, couverture ou raccords de détail.

    - Lors de la conception architecturale, coordonner avec l''ingénieur civil les dimensions des éléments porteurs conceptuels et les reprendre dans le modèle d''architecture.

    - Utiliser et exporter le matériau approprié depuis le logiciel auteur.'
  it: 'Consente di verificare tempestivamente nello spazio la forma della copertura e il concetto strutturale e supporta decisioni affidabili per l’autorizzazione e il coordinamento.


    **Descrizione**

    - Geometria di tetto inclinato dimensionata grossolanamente secondo il concept strutturale e dell''involucro.

    - Serve per il coordinamento tra architettura e ingegneria strutturale, non per l''esecuzione.


    **Direttive di modellazione**

    - Modellare come volume semplificato o superficie di copertura; inclinazione secondo il concetto di massima.

    - Non modellare sovrastrutture, manto di copertura o giunti di dettaglio.

    - Durante la concezione architettonica, coordinare con l''ingegnere strutturista le dimensioni degli elementi strutturali concettuali e recepirle nel modello architettonico.

    - Usare ed esportare il materiale appropriato dal software di modellazione.'
  en: 'Makes the roof form and structural concept spatially verifiable early on and supports reliable permitting and coordination decisions.


    **Description**

    - Coarsely dimensioned pitched roof geometry according to the structural and envelope concept.

    - Used for coordination between architecture and structural engineering, not for execution planning.


    **Modelling guidelines**

    - Model as a simplified volume or roof surface; pitch according to the sketch concept.

    - Do not model roof build-ups, cladding, or detail connections.

    - During conceptual architectural design, coordinate the dimensions of conceptual structural components with the structural engineer and adopt them in the architecture model.

    - Use and export the appropriate material from the authoring system.'
