- name: Connection
  pset: ePset_Circularity
  definition:
    de: 'Art der Verbindung für die Demontierbarkeit (Madaster).


      **Zulässige Werte**

      - `DryConnection` — trockene Verbindung

      - `AddedConnection` — Verbindung mit Zusatzteilen

      - `DirectConnection` — direkte integrale Verbindung

      - `SoftChemicalConnection` — weiche chemische Verbindung

      - `HardChemicalConnection` — harte chemische Verbindung'
    fr: 'Type de connexion pour la démontabilité (Madaster).


      **Valeurs admises**

      - `DryConnection` — connexion sèche

      - `AddedConnection` — connexion avec éléments ajoutés

      - `DirectConnection` — connexion intégrale directe

      - `SoftChemicalConnection` — liaison chimique souple

      - `HardChemicalConnection` — liaison chimique dure'
    it: 'Tipo di connessione per la smontabilità (Madaster).


      **Valori ammessi**

      - `DryConnection` — connessione a secco

      - `AddedConnection` — connessione con elementi aggiunti

      - `DirectConnection` — connessione integrale diretta

      - `SoftChemicalConnection` — connessione chimica morbida

      - `HardChemicalConnection` — connessione chimica dura'
    en: 'Connection type for detachability (Madaster).


      **Allowed values**

      - `DryConnection` — dry connection

      - `AddedConnection` — connection using added parts

      - `DirectConnection` — direct integral connection

      - `SoftChemicalConnection` — soft chemical connection

      - `HardChemicalConnection` — hard chemical connection'
