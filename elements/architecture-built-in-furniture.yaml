id: pragmaticbim:element/architecture-built-in-furniture
code: ARC-FURN-BUILTIN
sort_order: 55
status: active
name:
  de: Einbaumöbel / Küche (Grob)
  fr: Mobilier intégré / cuisine (Sommaire)
  it: Arredo fisso / cucina (Indicativo)
  en: Built-in furniture / kitchen (Rough)
definition:
  de: 'Zeigt früh, wie viel Platz Küche und Einbauschränke brauchen und wo die Anschlüsse sitzen. Werk- und Montageplanung können Masse und Anschlüsse daran prüfen.


    **Beschreibung**

    - Fest eingebaute Möbel und Küchenblöcke in Innenräumen.

    - Dienen als Blackbox für Lage, Abmessungen, Zugänglichkeit und Schnittstellen – nicht als detailliertes Küchen- oder Fabrikationsmodell.


    **Modellierungshinweis**

    - Hochschränke, Unterschränke, Oberschränke und Arbeitsplatten als getrennte vereinfachte Körper mit realen Aussenabmessungen modellieren.

    - Blöcke eindeutig bezeichnen und dem zugehörigen Geschoss zuweisen.

    - Keine Herstellerprodukte, Beschläge, Leitungen oder inneren Möbelaufbauten modellieren.'
  fr: 'Montre tôt combien de place exigent la cuisine et les armoires intégrées, et où se situent les raccordements. Les plans d''atelier et de montage peuvent y vérifier cotes et raccordements.


    **Description**

    - Mobilier fixe et blocs de cuisine dans les locaux intérieurs.

    - Servent de boîte noire pour la position, les dimensions, l''accessibilité et les interfaces – pas de maquette détaillée de cuisine ou de fabrication.


    **Directives de modélisation**

    - Modéliser séparément les armoires hautes, meubles bas, meubles muraux et plans de travail sous forme de corps simplifiés aux dimensions hors tout réelles.

    - Désigner clairement les blocs et les rattacher à l''étage concerné.

    - Ne pas modéliser les produits fabricant, ferrures, réseaux ou aménagements intérieurs des meubles.'
  it: 'Mostra tempestivamente quanto spazio richiedono cucina e armadi a incasso e dove si trovano i collegamenti. I piani d''officina e di montaggio possono verificarvi misure e collegamenti.


    **Descrizione**

    - Arredi fissi e blocchi cucina negli spazi interni.

    - Fungono da black box per posizione, dimensioni, accessibilità e interfacce – non da modello dettagliato della cucina o di fabbricazione.


    **Direttive di modellazione**

    - Modellare separatamente colonne, basi, pensili e piani di lavoro come corpi semplificati con dimensioni d''ingombro reali.

    - Denominare chiaramente i blocchi e assegnarli al piano corrispondente.

    - Non modellare prodotti del fabbricante, ferramenta, impianti o allestimenti interni dei mobili.'
  en: 'Shows early how much space the kitchen and built-in cabinets need and where the connections sit. Shop and installation design can check dimensions and connections against this.


    **Description**

    - Permanently installed furniture and kitchen blocks in interior spaces.

    - Used as a black box for location, dimensions, accessibility, and interfaces – not as a detailed kitchen or fabrication model.


    **Modelling guidelines**

    - Model tall units, base units, wall units, and worktops as separate simplified bodies with real overall dimensions.

    - Name blocks unambiguously and assign them to the matching storey.

    - Do not model manufacturer products, fittings, services, or internal furniture construction.'
