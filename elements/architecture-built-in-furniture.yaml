- name: AwardInterface
  pset: ePset_Cost
  definition:
    de: 'Vergabepaket des Einbaumöbels – damit Schnittstellen zwischen Unternehmerlosen sichtbar werden.


      **Zulässige Werte**

      - Siehe Werteliste Vergabepaket. Das vorliegende Schweizer Datenpaket verwendet dreistellige BKP-Codes, z. B. `211`, `221`, `244`.'
    fr: 'Lot d’adjudication du mobilier intégré – il permet de rendre visibles les interfaces entre les lots confiés aux entreprises.


      **Valeurs admises**

      - Voir la liste de valeurs Lot d’adjudication. Le présent paquet de données suisse utilise des codes BKP à trois chiffres, p. ex. `211`, `221`, `244`.'
    it: 'Lotto d’appalto dell’arredo fisso – rende visibili le interfacce tra i lotti assegnati alle imprese.


      **Valori ammessi**

      - Vedere l’elenco di valori Lotto d’appalto. Il presente pacchetto di dati svizzero utilizza codici BKP a tre cifre, ad es. `211`, `221`, `244`.'
    en: 'Procurement package of the built-in furniture – making interfaces between contractor packages visible.


      **Allowed values**

      - See the Procurement package value list. This Swiss data package uses three-digit BKP codes, e.g. `211`, `221`, `244`.'
