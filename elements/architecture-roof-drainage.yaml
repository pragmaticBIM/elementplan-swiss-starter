name:
  de: Gefälledämmung
  fr: Isolation à pente
  it: Isolamento a pendenza
  en: Tapered insulation
definition:
  de: 'Gefälledämmung auf Flachdach und Balkon als modellierte Schicht mit Gefälle.


    **Beschreibung**

    - Dämmschicht im Dach- oder Balkonaufbau, die das Gefälle zur Entwässerung bildet.

    - Dient der Koordination von Gefälle, Ablaufpositionen und Anschluss an Fallleitungen.


    **Modellierungsrichtlinie**

    - Als eigene Schicht auf Flachdach und Balkon modellieren; Gefälle erfassen.

    - Entwässerungspunkte aus dem Gefälleverlauf ableiten; Balkon nicht vergessen.

    - Keine Ausführungsdetails wie Gullytypen oder Einzeldämmplatten modellieren.'
  fr: 'Isolation à pente sur toiture plate et balcon comme couche modélisée avec pente.


    **Description**

    - Couche isolante dans le complexe de toiture ou de balcon qui forme la pente d''évacuation.

    - Sert à coordonner pente, positions de collecte et raccord aux descentes.


    **Directives de modélisation**

    - Modéliser comme couche distincte sur toiture plate et balcon ; saisir la pente.

    - Déduire les points d''évacuation du tracé de pente ; ne pas oublier le balcon.

    - Ne pas modéliser les détails d''exécution comme types de siphons ou panneaux isolants individuels.'
  it: 'Isolamento a pendenza su tetto piano e balcone come strato modellato con pendenza.


    **Descrizione**

    - Strato isolante nella stratigrafia di copertura o balcone che forma la pendenza di drenaggio.

    - Serve a coordinare pendenza, posizioni di scarico e collegamento ai pluviali.


    **Direttive di modellazione**

    - Modellare come strato autonomo su tetto piano e balcone; registrare la pendenza.

    - Derivare i punti di scarico dal tracciato di pendenza; non dimenticare il balcone.

    - Non modellare dettagli esecutivi come tipi di scarico o pannelli isolanti singoli.'
  en: 'Tapered insulation on flat roof and balcony as a modelled layer with falls.


    **Description**

    - Insulation layer in the roof or balcony build-up that forms the fall for drainage.

    - Used to coordinate falls, outlet positions, and connection to downpipes.


    **Modelling guidelines**

    - Model as a separate layer on flat roof and balcony; capture falls.

    - Derive drainage points from the fall layout; do not forget the balcony.

    - Do not model execution details such as gully types or individual insulation boards.'
