attributes:
- name: PredefinedType
  pset: null
  definition:
    de: 'Art des Geräts bzw. Terminals.


      **Zulässige Werte**

      - `NETWORKAPPLIANCE` — Netzwerkgerät / Switch

      - `ROUTER` — Router

      - `NETWORKHUB` — Hub / Patch

      - `COMPUTER` — Server / Computer

      - `ANTENNA` — Antenne / WLAN-AP

      - `GATEWAY` — Gateway

      - `MODEM` — Modem

      - `USERDEFINED` — benutzerdefiniert'
    fr: 'Type d''appareil ou de terminal.


      **Valeurs admises**

      - `NETWORKAPPLIANCE` — appareil réseau / switch

      - `ROUTER` — routeur

      - `NETWORKHUB` — hub / patch

      - `COMPUTER` — serveur / ordinateur

      - `ANTENNA` — antenne / AP WiFi

      - `GATEWAY` — passerelle

      - `MODEM` — modem

      - `USERDEFINED` — défini par l''utilisateur'
    it: 'Tipo di apparecchio o terminale.


      **Valori ammessi**

      - `NETWORKAPPLIANCE` — apparecchio di rete / switch

      - `ROUTER` — router

      - `NETWORKHUB` — hub / patch

      - `COMPUTER` — server / computer

      - `ANTENNA` — antenna / AP WiFi

      - `GATEWAY` — gateway

      - `MODEM` — modem

      - `USERDEFINED` — definito dall''utente'
    en: 'Kind of equipment or terminal.


      **Allowed values**

      - `NETWORKAPPLIANCE` — network appliance / switch

      - `ROUTER` — router

      - `NETWORKHUB` — network hub

      - `COMPUTER` — computer / server

      - `ANTENNA` — antenna / WiFi AP

      - `GATEWAY` — gateway

      - `MODEM` — modem

      - `USERDEFINED` — user-defined'
