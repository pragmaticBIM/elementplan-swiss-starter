id: pragmaticbim:element/mep-communications-appliance
code: MEP-COMMS
sort_order: 94
status: active
name:
  de: Kommunikationsgerät
  fr: Appareil de communication
  it: Apparecchio di comunicazione
  en: Communications appliance
definition:
  de: '**Beschreibung**

    - Gerät der Informations- und Kommunikationstechnik.

    - Netzwerk-Switch; Patchpanel; Server; WLAN-AP; Datendose.


    **Modellierungsrichtlinie**

    - Als Geräteobjekt mit Abmessungen und Lage modellieren.

    - Dem zugehörigen Geschoss und dem System zuweisen.'
  fr: '**Description**

    - Appareil des technologies de l''information et de la communication.

    - Switch; patch panel; serveur; WiFi AP; prise data.


    **Directives de modélisation**

    - Modéliser comme appareil avec dimensions et position.

    - Rattacher à l''étage et à la zone technique ou d''usage.'
  it: '**Descrizione**

    - Apparecchio delle tecnologie dell''informazione e della comunicazione.

    - Switch; patch panel; server; WiFi AP; presa dati.


    **Direttive di modellazione**

    - Modellare come apparecchio con dimensioni e posizione.

    - Assegnare al piano e alla zona tecnica o d''uso.'
  en: '**Description**

    - Information and communication technology appliance.

    - Network switch; patch panel; server; WiFi AP; data outlet.


    **Modelling guidelines**

    - Model as an equipment object with size and location.

    - Assign to the matching storey and technical or use zone.'
needed_in_domain:
- pragmaticbim:domain/mep
