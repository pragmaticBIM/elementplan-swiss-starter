id: pragmaticbim:element/opening-void
code: STR-OPENING-VOID
sort_order: 58
status: active
name:
  de: Durchbruch / Aussparung (Tragwerk)
  fr: Percement / réservation (structure)
  it: Foro / riserva (struttura)
  en: Opening / recess (structural)
definition:
  de: 'Überführt freigegebene Aussparungen verbindlich ins Tragwerksmodell, damit Kollisionen vermieden und Durchführungen ausführbar geplant werden können.


    **Beschreibung**

    - Öffnung in tragender Wand, Decke oder anderem Tragwerksbauteil für TGA-Durchführungen und bauliche Aussparungen.

    - Massgebend für Koordination, Freigabe und Ausführung; ersetzt die TGA-Aussparungsanforderung nach Freigabe.


    **Modellierungshinweis**

    - Als Öffnungselement modellieren und dem durchbrochenen Tragwerksbauteil zuordnen; Abmessungen und Lage gemäss freigegebener Forderung.

    - Durchbruch durchgehend als OPENING, einseitige oder nicht durchgehende Aussparung als RECESS.

    - Name und Reference mit der TGA-Aussparungsanforderung abstimmen; geschossweise und bauteilbezogen eindeutig benennen.'
  fr: 'Intègre de manière contraignante les réservations validées dans la maquette de structure afin d''éviter les collisions et de garantir la faisabilité des traversées.


    **Description**

    - Ouverture dans un mur porteur, une dalle ou un autre composant structurel pour traversées CVC et réservations constructives.

    - Déterminante pour la coordination, la validation et l''exécution ; remplace l''exigence CVC après validation.


    **Directives de modélisation**

    - Modéliser comme élément d''ouverture et le rattacher au composant structurel traversé ; dimensions et position selon l''exigence validée.

    - Percement traversant en OPENING, réservation unilatérale ou non traversante en RECESS.

    - Harmoniser Name et Reference avec l''exigence CVC ; nommer de façon univoque par étage et par élément.'
  it: 'Integra in modo vincolante le riserve approvate nel modello strutturale per evitare collisioni e garantire la realizzabilità degli attraversamenti.


    **Descrizione**

    - Apertura in parete portante, solaio o altro componente strutturale per attraversamenti impianti e riserve costruttive.

    - Determinante per coordinamento, approvazione ed esecuzione; sostituisce la richiesta impianti dopo l''approvazione.


    **Direttive di modellazione**

    - Modellare come elemento di apertura e assegnarlo al componente strutturale attraversato; dimensioni e posizione secondo la richiesta approvata.

    - Foro passante come OPENING, riserva unilaterale o non passante come RECESS.

    - Allineare Name e Reference con la richiesta impianti; nominare in modo univoco per piano e per componente.'
  en: 'Transfers approved voids into the structural model as binding information so that clashes are avoided and penetrations can be built as planned.


    **Description**

    - Void in a load-bearing wall, slab, or other structural component for MEP penetrations and construction recesses.

    - Governing for coordination, approval, and execution; replaces the MEP void request after approval.


    **Modelling guidelines**

    - Model as an opening element and assign it to the voided structural host; dimensions and location according to the approved request.

    - Through opening as OPENING; one-sided or non-through recess as RECESS.

    - Align Name and Reference with the MEP void request; name uniquely by storey and host component.'
