- name: IsFireStoppingRequired
  pset: ePset_FireStopping
  definition:
    de: 'Kennzeichnet, ob der Durchbruch mit einem Brandschott geschlossen werden muss.


      **Zulässige Werte**

      - `TRUE` — Brandschott erforderlich

      - `FALSE` — kein Brandschott erforderlich'
    fr: 'Indique si la percée doit être obturée par un dispositif coupe-feu.


      **Valeurs admises**

      - `TRUE` — dispositif coupe-feu requis

      - `FALSE` — aucun dispositif coupe-feu requis'
    it: 'Indica se l''apertura deve essere chiusa con un sistema tagliafuoco.


      **Valori ammessi**

      - `TRUE` — sistema tagliafuoco necessario

      - `FALSE` — nessun sistema tagliafuoco necessario'
    en: 'Marks whether the penetration has to be closed with a firestop.


      **Allowed values**

      - `TRUE` — firestop required

      - `FALSE` — no firestop required'
