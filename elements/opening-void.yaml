  definition:
    de: 'Geforderte Feuerwiderstandsklasse des Brandschotts gemäss Brandschutzkonzept.


      **Zulässige Werte**

      - `EI 30` — Raumabschluss und Wärmedämmung 30 min

      - `EI 60` — Raumabschluss und Wärmedämmung 60 min

      - `EI 90` — Raumabschluss und Wärmedämmung 90 min'
    fr: 'Classe de résistance au feu exigée du dispositif coupe-feu selon le concept de protection incendie.


      **Valeurs admises**

      - `EI 30` — étanchéité et isolation thermique 30 min

      - `EI 60` — étanchéité et isolation thermique 60 min

      - `EI 90` — étanchéité et isolation thermique 90 min'
    it: 'Classe di resistenza al fuoco richiesta per il sistema tagliafuoco secondo il concetto di protezione antincendio.


      **Valori ammessi**

      - `EI 30` — tenuta e isolamento termico 30 min

      - `EI 60` — tenuta e isolamento termico 60 min

      - `EI 90` — tenuta e isolamento termico 90 min'
    en: 'Fire resistance class required of the firestop under the fire protection concept.


      **Allowed values**

      - `EI 30` — integrity and insulation 30 min

      - `EI 60` — integrity and insulation 60 min

      - `EI 90` — integrity and insulation 90 min'
