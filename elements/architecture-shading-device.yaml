    de: 'Art des Sonnenschutzes.


      **Zulässige Werte**

      - `JALOUSIE` — Aussenlamelle / Raffstore

      - `SHUTTER` — Fensterladen

      - `AWNING` — Markise

      - `USERDEFINED` — benutzerdefinierter Sonnenschutz

      - `NOTDEFINED` — nicht näher bestimmter Sonnenschutz'
    fr: 'Type de protection solaire.


      **Valeurs admises**

      - `JALOUSIE` — lame externe / store à lamelles

      - `SHUTTER` — volet

      - `AWNING` — store banne

      - `USERDEFINED` — protection solaire définie par l''utilisateur

      - `NOTDEFINED` — protection solaire non précisée'
    it: 'Tipo di protezione solare.


      **Valori ammessi**

      - `JALOUSIE` — lamella esterna / frangisole

      - `SHUTTER` — persiana

      - `AWNING` — tenda da sole

      - `USERDEFINED` — protezione solare definita dall''utente

      - `NOTDEFINED` — protezione solare non specificata'
    en: 'Type of sun protection.


      **Allowed values**

      - `JALOUSIE` — external slats / venetian blind

      - `SHUTTER` — shutter

      - `AWNING` — awning

      - `USERDEFINED` — user-defined sun protection

      - `NOTDEFINED` — unspecified sun protection'
