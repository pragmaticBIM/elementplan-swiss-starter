id: pragmaticbim:element/architecture-shading-device
code: ARC-SHADING
sort_order: 45
status: active
name:
  de: Sonnenschutz
  fr: Protection solaire
  it: Protezione solare
  en: Shading device
definition:
  de: 'Macht aussenliegenden Sonnenschutz im Modell sichtbar, damit Lage, Typ und Beschattung für Fassadenplanung und thermische Simulation festgehalten sind.


    **Beschreibung**

    - Aussenliegende Geräte wie Lamellen, Raffstore, Markisen oder Läden vor oder über Fenstern.

    - Dient der räumlichen Abstimmung an der Fassade und als zusätzlicher Kontext für den Heizwärmenachweis, nicht der Werkstattplanung.


    **Modellierungshinweis**

    - Als vereinfachtes aussenliegendes Volumen modellieren (Lamellen, Raffstore, Markise, Läden).

    - Antriebe, Führungsschienen und Stofffalten nicht ausmodellieren.

    - Geschossweise platzieren und der Fassade oder dem zugehörigen Fenster zuordnen.'
  fr: 'Rend visible dans la maquette la protection solaire extérieure, afin de figer l''emplacement, le type et l''ombrage pour l''étude de façade et la simulation thermique.


    **Description**

    - Dispositifs extérieurs tels que lames, stores à lamelles, stores bannes ou volets devant ou au-dessus des fenêtres.

    - Sert à la coordination spatiale en façade et comme contexte supplémentaire pour le justificatif des besoins de chaleur, et non à l''étude d''atelier.


    **Directives de modélisation**

    - Modéliser un volume extérieur simplifié (lames, store à lamelles, store banne, volets).

    - Ne pas modéliser les motorisations, rails de guidage ni plis du tissu.

    - Placer par étage et rattacher à la façade ou à la fenêtre concernée.'
  it: 'Rende visibile nel modello la protezione solare esterna, così da fissare posizione, tipo e ombreggiamento per la progettazione di facciata e la simulazione termica.


    **Descrizione**

    - Dispositivi esterni come lamelle, frangisole, tende da sole o persiane davanti o sopra le finestre.

    - Serve al coordinamento spaziale in facciata e come contesto aggiuntivo per la verifica del fabbisogno termico, non alla progettazione di officina.


    **Direttive di modellazione**

    - Modellare un volume esterno semplificato (lamelle, frangisole, tenda da sole, persiane).

    - Non modellare motori, guide né pieghe del tessuto.

    - Posizionare piano per piano e assegnare alla facciata o alla finestra di appartenenza.'
  en: 'Makes external sun protection visible in the model so location, type, and shading are recorded for facade planning and thermal simulation.


    **Description**

    - External devices such as slats, external blinds, awnings, or shutters in front of or above windows.

    - Supports spatial coordination on the facade and provides additional context for heating-demand verification; it is not intended for shop drawings.


    **Modelling guidelines**

    - Model as a simplified external volume (slats, external blind, awning, shutters).

    - Do not model motors, guide rails, or fabric folds.

    - Place storey-wise and assign to the facade or the host window.'
