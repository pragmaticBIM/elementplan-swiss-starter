id: pragmaticbim:element/spaces-gross-volume
code: SPACE-GROSS
sort_order: 10
status: active
name:
  de: Bruttovolumen
  fr: Volumes bruts
  it: Volumi lordi
  en: Gross volumes
definition:
  de: 'Liefert eine konsistente Grundlage für Massenstudien, Flächen- und Volumenauswertungen sowie städtebauliche Entscheide.


    **Beschreibung**

    - Bruttoraumvolumen je Geschoss als durchgängig modellierte Volumen bis zur Aussenkante Fassade.

    - Die Norm sieht vor, dass das Bruttovolumen bis zur Aussenkante der Dämmschicht und nicht zur Aussenkante einer hinterlüfteten Fassade geht; da es oft um städtebauliche Fluchten und Abstandsflächen
    geht, empfehlen wir die Abweichung von der Norm.

    - Nutzungseinheiten wie Wohnungen, Einheiten oder Allgemeinflächen werden über LongName gemäss Programm bezeichnet.


    **Modellierungshinweis**

    - Mit dem Raumwerkzeug als Volumen modellieren, geschossweise; horizontal bis zur Aussenkante Fassade; PredefinedType = `GFA`, in IFC2x3 ObjectType = `Bruttovolumen`.

    - Untergeschoss von Unterkante Bodenplatte bis Oberkante Fertigboden.

    - Obergeschosse von Oberkante Fertigboden bis Oberkante nächster Fertigboden bzw. Dach.

    - Optional nach Wohnungen, Einheiten oder Allgemeinflächen trennen; keine Überlappungen oder Doppelungen.'
  fr: 'Fournit une base cohérente pour les études volumétriques, les évaluations de surfaces et de volumes ainsi que les décisions urbanistiques.


    **Description**

    - Volumes bruts par étage modélisés comme volumes continus jusqu''au bord extérieur de la façade.

    - La norme prévoit que le volume brut s''étende jusqu''au bord extérieur de l''isolation et non jusqu''au bord extérieur d''une façade ventilée ; comme il s''agit souvent de lignes de façade urbanistiques
    et de zones de recul, nous recommandons de s''écarter de la norme.

    - Les parts de programme comme logements, unités ou espaces communs sont portées par LongName selon le programme.


    **Directives de modélisation**

    - Modéliser comme volume avec l''outil local, étage par étage ; horizontalement jusqu''au bord extérieur de la façade ; PredefinedType = `GFA`, dans IFC2x3 ObjectType = `Volume brut`.

    - Sous-sol : de la face inférieure de la dalle de fondation au dessus du sol fini.

    - Étages supérieurs : du dessus du sol fini au dessus du sol fini suivant ou à la toiture.

    - Séparer facultativement par logements, unités ou espaces communs ; pas de chevauchement ni de duplication.'
  it: 'Fornisce una base coerente per gli studi volumetrici, le valutazioni di superfici e volumi e le decisioni urbanistiche.


    **Descrizione**

    - Volumi lordi per piano modellati come volumi continui fino al bordo esterno della facciata.

    - La norma prevede che il volume lordo arrivi fino al bordo esterno dello strato isolante e non al bordo esterno di una facciata ventilata; poiché spesso contano le linee di facciata urbanistica e le
    distanze, raccomandiamo di discostarsi dalla norma.

    - Quote di programma come alloggi, unità o spazi comuni sono indicate in LongName secondo il programma.


    **Direttive di modellazione**

    - Modellare come volume con lo strumento locale, piano per piano; orizzontalmente fino al bordo esterno della facciata; PredefinedType = `GFA`, in IFC2x3 ObjectType = `Volume lordo`.

    - Sotterraneo: dal bordo inferiore della soletta di fondazione al bordo superiore del pavimento finito.

    - Piani superiori: dal bordo superiore del pavimento finito al bordo superiore del pavimento finito successivo o alla copertura.

    - Separare facoltativamente per alloggi, unità o spazi comuni; nessuna sovrapposizione o duplicazione.'
  en: 'Provides a consistent basis for massing studies, area and volume evaluations, and urban design decisions.


    **Description**

    - Gross room volumes per storey modelled as continuous volumes to the outer edge of the facade.

    - The standard requires gross volume to extend to the outer edge of the insulation layer, not the outer edge of a ventilated facade; as urban alignment lines and setback areas are often decisive, we
    recommend deviating from the standard.

    - Programme shares such as flats, units, or public space are carried in LongName according to the brief.


    **Modelling guidelines**

    - Model as a volume with the space tool, storey by storey; horizontally to the outer edge of the facade; PredefinedType = `GFA`, in IFC2x3 ObjectType = `Gross volume`.

    - Basement from underside of base slab to top of finished floor.

    - Upper storeys from top of finished floor to top of next finished floor or roof.

    - Optionally separate by flats, units, or public space; no overlaps or duplicates.'
