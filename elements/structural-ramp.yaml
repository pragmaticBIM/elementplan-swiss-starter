id: pragmaticbim:element/structural-ramp
code: STR-RAMP
sort_order: 77
status: active
name:
  de: Rampe detailiert
  fr: Rampe détaillée
  it: Rampa dettagliata
  en: Ramp detailed
definition:
  de: 'Tragwerkselement für Rampen im Tragwerksmodell.


    **Beschreibung**

    - Ausführungsgenaue Geometrie gemäss Tragwerksplanung.

    - Massgebendes Fachmodell für Ausführungsplanung, Mengenermittlung und Koordination.


    **Modellierungsrichtlinie**

    - Mit korrekter Steigung so modellieren, wie gebaut wird.

    - Zuordnung zu Geschoss und Tragwerksteil einhalten.

    - IfcMaterial verwenden, das der tatsächlichen Materialklasse entspricht.'
  fr: 'Élément porteur pour rampes dans le modèle structurel.


    **Description**

    - Géométrie d''exécution selon le plan structurel.

    - Maquette fédérée de référence pour l''exécution, les quantités et la coordination.


    **Directives de modélisation**

    - Modéliser avec la pente correcte telle qu''elle sera construite.

    - Respecter l''attribution à l''étage et à la partie porteuse.

    - Utiliser un IfcMaterial correspondant à la classe de matériau réelle.'
  it: 'Elemento strutturale per rampe nel modello strutturale.


    **Descrizione**

    - Geometria esecutiva secondo la pianificazione strutturale.

    - Modello federato di riferimento per esecuzione, quantità e coordinamento.


    **Direttive di modellazione**

    - Modellare con la pendenza corretta come sarà costruito.

    - Rispettare l''assegnazione a piano e parte strutturale.

    - Usare un IfcMaterial corrispondente alla classe di materiale effettiva.'
  en: 'Structural element for ramps in the structural model.


    **Description**

    - Execution-accurate geometry according to the structural design.

    - Authoritative federated model for execution planning, quantities, and coordination.


    **Modelling guidelines**

    - Model with the correct slope as it will be built.

    - Maintain assignment to storey and structural part.

    - Use an IfcMaterial that corresponds to the actual material class.'
