name:
  de: Luftraum
  fr: Volumes d'air
  it: Volumi d'aria
  en: Air spaces
definition:
  de: 'Nicht nutzbare Lufträume geschossweise modellieren — zur Abzugsmenge bei der Geschossflächenermittlung und als Referenzraum für die Gebäudetechnik.


    **Beschreibung**

    - Lufträume wie Atrien, Treppenaugen, mehrgeschossige Räume oder sonstige nicht nutzbare Volumen innerhalb des Geschossvolumens.

    - Werden vom Geschossvolumen abgezogen, um die anrechenbare Geschossfläche bzw. das Nutzvolumen zu ermitteln.

    - Bieten den Gebäudetechnikern einen Referenzraum.


    **Modellierungsrichtlinie**

    - Jeden grösseren Hohlraum im Gebäude mit einem Luftraum füllen — z. B. Atrium, Treppenauge, mehrgeschossige Räume, Luftraum über dem obersten Treppenlauf.

    - Mit dem Raumwerkzeug als Volumen modellieren, geschossweise.

    - Unterkante = Oberkante des darunter liegenden Raumvolumens; Oberkante = Unterkante Rohdecke bzw. Abschluss des Geschossvolumens.

    - Dem zugehörigen Geschoss zuweisen; keine Überlappungen mit nutzbaren Räumen oder Doppelungen.'
  fr: 'Modéliser les volumes d''air non utilisables étage par étage — comme quantité à déduire pour déterminer la surface de plancher et comme espace de référence pour la technique du bâtiment.


    **Description**

    - Volumes d''air tels qu''atriums, cages d''escalier ouvertes, locaux multi-étages ou autres volumes non utilisables dans le volume d''étage.

    - Se déduisent du volume d''étage pour obtenir la surface de plancher comptable ou le volume utile.

    - Servent d''espace de référence aux ingénieurs en technique du bâtiment.


    **Directives de modélisation**

    - Remplir chaque cavité importante du bâtiment avec un volume d''air — p. ex. atrium, cage d''escalier ouverte, locaux multi-étages, volume d''air au-dessus de la dernière volée d''escalier.

    - Modéliser comme volume avec l''outil local, étage par étage.

    - Face inférieure = dessus du volume de local sous-jacent ; face supérieure = dessous du plafond brut ou limite du volume d''étage.

    - Rattacher à l''étage concerné ; pas de chevauchement avec locaux utilisables ni de duplication.'
  it: 'Modellare i volumi d''aria non utilizzabili piano per piano — come quantità da detrarre per determinare la superficie di piano e come spazio di riferimento per la tecnica dell''edificio.


    **Descrizione**

    - Volumi d''aria come atrii, occhi di scala, locali multipiano o altri volumi non utilizzabili all''interno del volume di piano.

    - Si detraggono dal volume di piano per ottenere la superficie di piano computabile o il volume utile.

    - Offrono agli impiantisti uno spazio di riferimento.


    **Direttive di modellazione**

    - Riempire ogni cavità significativa dell''edificio con un volume d''aria — p. es. atrio, occhio di scala, locali multipiano, volume d''aria sopra l''ultima rampa di scale.

    - Modellare come volume con lo strumento locale, piano per piano.

    - Bordo inferiore = bordo superiore del volume di locale sottostante; bordo superiore = bordo inferiore del solaio grezzo o limite del volume di piano.

    - Assegnare al piano corrispondente; nessuna sovrapposizione con locali utilizzabili né duplicazione.'
  en: 'Model non-occupiable air spaces storey by storey — as deduction quantities when determining floor area and as a reference space for building services.


    **Description**

    - Air spaces such as atriums, stair voids, multi-storey rooms, or other non-occupiable volumes within the storey volume.

    - Deducted from storey volume to obtain countable floor area or usable volume.

    - Provide a reference space for building services engineers.


    **Modelling guidelines**

    - Fill every larger cavity in the building with an air space — e.g. atrium, stair void, multi-storey rooms, air space above the uppermost stair flight.

    - Model as a volume with the space tool, storey by storey.

    - Bottom = top of the space volume below; top = underside of the raw slab or boundary of the storey volume.

    - Assign to the matching storey; no overlaps with usable spaces or duplicates.'
