id: pragmaticbim:element/mep-unitary-equipment
code: MEP-UNITARY
sort_order: 93
status: active
name:
  de: Kompaktgerät / Monoblock
  fr: Équipement unitaire / monobloc
  it: Apparecchio unitario / monoblocco
  en: Unitary equipment / monoblock
definition:
  de: '**Beschreibung**

    - Kompaktes Heiz-, Kühl- oder Lüftungsgerät als Einheit.

    - Lüftungsgerät; Wärmepumpe; Gebläsekonvektor Heizen; Gebläsekonvektor Kühlen.


    **Modellierungsrichtlinie**

    - Als Geräteobjekt mit Abmessungen und Lage modellieren.

    - Dem zugehörigen Geschoss und dem System zuweisen.'
  fr: '**Description**

    - Appareil compact de chauffage, refroidissement ou ventilation.

    - Centrale de traitement d''air; pompe à chaleur; ventilo-convecteur chauffage; refroidissement.


    **Directives de modélisation**

    - Modéliser comme appareil avec dimensions et position.

    - Rattacher à l''étage et à la zone technique ou d''usage.'
  it: '**Descrizione**

    - Apparecchio compatto di riscaldamento, raffreddamento o ventilazione.

    - UTA; pompa di calore; fan coil riscaldamento; raffreddamento.


    **Direttive di modellazione**

    - Modellare come apparecchio con dimensioni e posizione.

    - Assegnare al piano e alla zona tecnica o d''uso.'
  en: '**Description**

    - Compact heating, cooling, or ventilation unit.

    - AHU; heat pump; heating fan coil; cooling fan coil.


    **Modelling guidelines**

    - Model as an equipment object with size and location.

    - Assign to the matching storey and technical or use zone.'
