attributes:
- name: PredefinedType
  pset: null
  definition:
    de: 'Art des Geräts bzw. Terminals.


      **Zulässige Werte**

      - `AIRHANDLER` — Lüftungsgerät / RLT

      - `AIRCONDITIONINGUNIT` — Klimagerät / Gebläsekonvektor

      - `SPLITSYSTEM` — Split-System

      - `ROOFTOPUNIT` — Dachgerät

      - `DEHUMIDIFIER` — Entfeuchter

      - `USERDEFINED` — benutzerdefiniert (z. B. Wärmepumpe)'
    fr: 'Type d''appareil ou de terminal.


      **Valeurs admises**

      - `AIRHANDLER` — centrale de traitement d''air

      - `AIRCONDITIONINGUNIT` — unité de climatisation / ventilo-convecteur

      - `SPLITSYSTEM` — système split

      - `ROOFTOPUNIT` — unité de toiture

      - `DEHUMIDIFIER` — déshumidificateur

      - `USERDEFINED` — défini par l''utilisateur (p. ex. pompe à chaleur)'
    it: 'Tipo di apparecchio o terminale.


      **Valori ammessi**

      - `AIRHANDLER` — UTA

      - `AIRCONDITIONINGUNIT` — unità climatizzazione / fan coil

      - `SPLITSYSTEM` — sistema split

      - `ROOFTOPUNIT` — unità da tetto

      - `DEHUMIDIFIER` — deumidificatore

      - `USERDEFINED` — definito dall''utente (p. es. pompa di calore)'
    en: 'Kind of equipment or terminal.


      **Allowed values**

      - `AIRHANDLER` — air handler

      - `AIRCONDITIONINGUNIT` — air conditioning unit / fan coil

      - `SPLITSYSTEM` — split system

      - `ROOFTOPUNIT` — rooftop unit

      - `DEHUMIDIFIER` — dehumidifier

      - `USERDEFINED` — user-defined (e.g. heat pump)'
