name:
  de: Türen
  fr: Portes
  it: Porte
  en: Doors
definition:
  de: 'Begehbare Öffnungen in der Gebäudehülle und zwischen Räumen.


    **Beschreibung**

    - Türen, Tore und Revisionsöffnungen.


    **Modellierungsrichtlinie**

    - Glasflächen mit transparentem Material.

    - IfcMaterial verwenden, das der tatsächlichen Materialklasse entspricht.'
  fr: 'Ouvertures praticables dans l''enveloppe et entre locaux.


    **Description**

    - Portes, portails et trappes.


    **Directives de modélisation**

    - Surfaces vitrées avec un matériau transparent.

    - Utiliser un IfcMaterial correspondant à la classe de matériau réelle.'
  it: 'Aperture percorribili nell''involucro e tra i locali.


    **Descrizione**

    - Porte, portoni e aperture di ispezione.


    **Direttive di modellazione**

    - Superfici vetrate con materiale trasparente.

    - Usare un IfcMaterial corrispondente alla classe di materiale effettiva.'
  en: 'Walk-through openings in the building envelope and between rooms.


    **Description**

    - Doors, gates, and inspection openings.


    **Modelling guidelines**

    - Glazed areas with a transparent material.

    - Use an IfcMaterial that corresponds to the actual material class.'
