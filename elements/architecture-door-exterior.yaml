- name: HazardType
  pset: ePset_HazardousMaterial
  definition:
    de: 'Schadstoffart gemäss Gutachten am betroffenen Bestandsbauteil.


      **Zulässige Werte**

      - `Asbestos` — Asbest

      - `PCB` — PCB

      - `PAH` — PAK

      - `PCP` — PCP

      - `Lead` — Blei

      - `None` — kein Schadstoff

      - `Unknown` — unbekannt / nicht untersucht'
    fr: 'Type de polluant selon l''expertise sur l''élément existant concerné.


      **Valeurs admises**

      - `Asbestos` — amiante

      - `PCB` — PCB

      - `PAH` — HAP

      - `PCP` — PCP

      - `Lead` — plomb

      - `None` — aucun polluant

      - `Unknown` — inconnu / non investigué'
    it: 'Tipo di inquinante secondo la perizia sul componente esistente interessato.


      **Valori ammessi**

      - `Asbestos` — amianto

      - `PCB` — PCB

      - `PAH` — IPA

      - `PCP` — PCP

      - `Lead` — piombo

      - `None` — nessun inquinante

      - `Unknown` — sconosciuto / non indagato'
    en: 'Type of hazardous material found by survey on the affected existing component.


      **Allowed values**

      - `Asbestos` — asbestos

      - `PCB` — PCB

      - `PAH` — PAH

      - `PCP` — PCP

      - `Lead` — lead

      - `None` — no hazardous material

      - `Unknown` — unknown / not investigated'
