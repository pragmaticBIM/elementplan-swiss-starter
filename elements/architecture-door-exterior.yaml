- name: OperationType
  pset: null
  definition:
    de: 'Öffnungsart und -richtung der Tür.


      **Zulässige Werte**

      - `SINGLE_SWING_LEFT` — Einflügelig, Anschlag links

      - `SINGLE_SWING_RIGHT` — Einflügelig, Anschlag rechts

      - `DOUBLE_DOOR_SINGLE_SWING` — Doppeltür, gleiche Drehrichtung

      - `DOUBLE_DOOR_SINGLE_SWING_OPPOSITE_LEFT` — Doppeltür, gegengleich, Anschlag links

      - `DOUBLE_DOOR_SINGLE_SWING_OPPOSITE_RIGHT` — Doppeltür, gegengleich, Anschlag rechts

      - `DOUBLE_SWING_LEFT` — Pendeltür, Anschlag links

      - `DOUBLE_SWING_RIGHT` — Pendeltür, Anschlag rechts

      - `DOUBLE_DOOR_DOUBLE_SWING` — Doppelte Pendeltür

      - `SLIDING_TO_LEFT` — Schiebetür nach links

      - `SLIDING_TO_RIGHT` — Schiebetür nach rechts

      - `DOUBLE_DOOR_SLIDING` — Doppeltür schiebend

      - `FOLDING_TO_LEFT` — Falttür nach links

      - `FOLDING_TO_RIGHT` — Falttür nach rechts

      - `DOUBLE_DOOR_FOLDING` — Doppeltür faltend

      - `REVOLVING` — Drehtür

      - `ROLLINGUP` — Rolltor

      - `SWING_FIXED_LEFT` — Drehflügel fest, links

      - `SWING_FIXED_RIGHT` — Drehflügel fest, rechts

      - `USERDEFINED` — Benutzerdefiniert

      - `NOTDEFINED` — Nicht definiert'
    fr: 'Type et sens d''ouverture de la porte.


      **Valeurs admises**

      - `SINGLE_SWING_LEFT` — simple battant, paumelles à gauche

      - `SINGLE_SWING_RIGHT` — simple battant, paumelles à droite

      - `DOUBLE_DOOR_SINGLE_SWING` — double porte, même sens

      - `DOUBLE_DOOR_SINGLE_SWING_OPPOSITE_LEFT` — double porte, sens opposés, gauche

      - `DOUBLE_DOOR_SINGLE_SWING_OPPOSITE_RIGHT` — double porte, sens opposés, droite

      - `DOUBLE_SWING_LEFT` — porte battante, gauche

      - `DOUBLE_SWING_RIGHT` — porte battante, droite

      - `DOUBLE_DOOR_DOUBLE_SWING` — double porte battante

      - `SLIDING_TO_LEFT` — coulissante vers la gauche

      - `SLIDING_TO_RIGHT` — coulissante vers la droite

      - `DOUBLE_DOOR_SLIDING` — double porte coulissante

      - `FOLDING_TO_LEFT` — pliante vers la gauche

      - `FOLDING_TO_RIGHT` — pliante vers la droite

      - `DOUBLE_DOOR_FOLDING` — double porte pliante

      - `REVOLVING` — porte tournante

      - `ROLLINGUP` — porte à enroulement

      - `SWING_FIXED_LEFT` — battant fixe, gauche

      - `SWING_FIXED_RIGHT` — battant fixe, droite

      - `USERDEFINED` — défini par l''utilisateur

      - `NOTDEFINED` — non défini'
    it: 'Tipo e senso di apertura della porta.


      **Valori ammessi**

      - `SINGLE_SWING_LEFT` — anta singola, cerniere a sinistra

      - `SINGLE_SWING_RIGHT` — anta singola, cerniere a destra

      - `DOUBLE_DOOR_SINGLE_SWING` — porta doppia, stesso senso

      - `DOUBLE_DOOR_SINGLE_SWING_OPPOSITE_LEFT` — porta doppia, sensi opposti, sinistra

      - `DOUBLE_DOOR_SINGLE_SWING_OPPOSITE_RIGHT` — porta doppia, sensi opposti, destra

      - `DOUBLE_SWING_LEFT` — porta a bilico, sinistra

      - `DOUBLE_SWING_RIGHT` — porta a bilico, destra

      - `DOUBLE_DOOR_DOUBLE_SWING` — porta doppia a bilico

      - `SLIDING_TO_LEFT` — scorrevole a sinistra

      - `SLIDING_TO_RIGHT` — scorrevole a destra

      - `DOUBLE_DOOR_SLIDING` — porta doppia scorrevole

      - `FOLDING_TO_LEFT` — a libro a sinistra

      - `FOLDING_TO_RIGHT` — a libro a destra

      - `DOUBLE_DOOR_FOLDING` — porta doppia a libro

      - `REVOLVING` — porta girevole

      - `ROLLINGUP` — serranda

      - `SWING_FIXED_LEFT` — anta fissa, sinistra

      - `SWING_FIXED_RIGHT` — anta fissa, destra

      - `USERDEFINED` — definito dall''utente

      - `NOTDEFINED` — non definito'
    en: 'Door opening type and direction.


      **Allowed values**

      - `SINGLE_SWING_LEFT` — single swing, hinge left

      - `SINGLE_SWING_RIGHT` — single swing, hinge right

      - `DOUBLE_DOOR_SINGLE_SWING` — double door, same swing

      - `DOUBLE_DOOR_SINGLE_SWING_OPPOSITE_LEFT` — double door, opposite swing, left

      - `DOUBLE_DOOR_SINGLE_SWING_OPPOSITE_RIGHT` — double door, opposite swing, right

      - `DOUBLE_SWING_LEFT` — double swing, left

      - `DOUBLE_SWING_RIGHT` — double swing, right

      - `DOUBLE_DOOR_DOUBLE_SWING` — double door, double swing

      - `SLIDING_TO_LEFT` — sliding to left

      - `SLIDING_TO_RIGHT` — sliding to right

      - `DOUBLE_DOOR_SLIDING` — double sliding door

      - `FOLDING_TO_LEFT` — folding to left

      - `FOLDING_TO_RIGHT` — folding to right

      - `DOUBLE_DOOR_FOLDING` — double folding door

      - `REVOLVING` — revolving

      - `ROLLINGUP` — rolling shutter

      - `SWING_FIXED_LEFT` — swing fixed left

      - `SWING_FIXED_RIGHT` — swing fixed right

      - `USERDEFINED` — user-defined

      - `NOTDEFINED` — not defined'
