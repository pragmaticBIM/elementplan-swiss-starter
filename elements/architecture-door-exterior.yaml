id: pragmaticbim:element/architecture-door-exterior
code: ARC-DOOR-EXT
sort_order: 41
status: active
name:
  de: Aussentür
  fr: Porte extérieure
  it: Porta esterna
  en: Exterior door
definition:
  de: 'Sichert funktionsfähige Gebäudezugänge und schafft die Grundlage für Fluchtweg-, Fassaden- und Bauphysikplanung.


    **Beschreibung**

    - Aussentüren, Tore und Revisionsöffnungen zur Aussenluft.

    - Grundlage für Fassadenplanung, Bauphysik (U-Wert) und Ausschreibung.


    **Modellierungshinweis**

    - IsExternal=TRUE setzen.

    - Glasflächen mit transparentem Material.

    - Geeignetes Material im Autorensystem verwenden und exportieren.'
  fr: 'Garantit des accès fonctionnels au bâtiment et fournit la base pour l''étude des voies d''évacuation, de la façade et de la physique du bâtiment.


    **Description**

    - Portes extérieures, portails et trappes donnant sur l''extérieur.

    - Base pour la planification de façade, la physique du bâtiment (valeur U) et l''adjudication.


    **Directives de modélisation**

    - Définir IsExternal=TRUE.

    - Surfaces vitrées avec un matériau transparent.

    - Utiliser et exporter le matériau approprié depuis le logiciel auteur.'
  it: 'Garantisce accessi funzionali all’edificio e fornisce la base per la progettazione delle vie di fuga, della facciata e della fisica della costruzione.


    **Descrizione**

    - Porte esterne, portoni e aperture di ispezione verso l''esterno.

    - Base per pianificazione di facciata, fisica della costruzione (valore U) e appalto.


    **Direttive di modellazione**

    - Impostare IsExternal=TRUE.

    - Superfici vetrate con materiale trasparente.

    - Usare ed esportare il materiale appropriato dal software di modellazione.'
  en: 'Ensures functional building access and provides the basis for escape-route, facade, and building-physics design.


    **Description**

    - Exterior doors, gates, and inspection openings to the outside.

    - Basis for facade planning, building physics (U-value), and tendering.


    **Modelling guidelines**

    - Set IsExternal=TRUE.

    - Glazed areas with a transparent material.

    - Use and export the appropriate material from the authoring system.'
