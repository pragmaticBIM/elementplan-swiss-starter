id: pragmaticbim:element/structural-wall
code: STR-WALL
sort_order: 72
status: active
name:
  de: Wand detailiert
  fr: Mur détaillé
  it: Parete dettagliata
  en: Wall detailed
definition:
  de: 'Ermöglicht die verlässliche Abstimmung von Lastabtragung, Öffnungen und Anschlüssen bis zur Ausführung.


    **Beschreibung**

    - Ausführungsgenaue Geometrie gemäss Tragwerksplanung.

    - Massgebendes Fachmodell für Ausführungsplanung, Bestellung und Koordination.


    **Modellierungshinweis**

    - Geschossweise und so modellieren, wie gebaut wird.

    - Bauteilgrenzen und Zuordnung zu Geschoss und Tragwerksteil einhalten.

    - Geeignetes Material im Autorensystem verwenden und exportieren.'
  fr: 'Permet de coordonner de manière fiable la descente de charges, les ouvertures et les raccords jusqu''à l''exécution.


    **Description**

    - Géométrie d''exécution selon le plan structurel.

    - Maquette fédérée de référence pour l''exécution, la commande et la coordination.


    **Directives de modélisation**

    - Modéliser étage par étage et tel qu''il sera construit.

    - Respecter les limites de composants et l''attribution à l''étage et à la partie porteuse.

    - Utiliser et exporter le matériau approprié depuis le logiciel auteur.'
  it: 'Consente di coordinare in modo affidabile la trasmissione dei carichi, le aperture e i raccordi fino all''esecuzione.


    **Descrizione**

    - Geometria esecutiva secondo la pianificazione strutturale.

    - Modello federato di riferimento per esecuzione, ordine e coordinamento.


    **Direttive di modellazione**

    - Modellare piano per piano e come sarà costruito.

    - Rispettare i confini dei componenti e l''assegnazione a piano e parte strutturale.

    - Usare ed esportare il materiale appropriato dal software di modellazione.'
  en: 'Enables reliable coordination of load transfer, openings, and connections through to execution.


    **Description**

    - Execution-accurate geometry according to the structural design.

    - Authoritative federated model for execution planning, ordering, and coordination.


    **Modelling guidelines**

    - Model storey by storey and as it will be built.

    - Maintain component boundaries and assignment to storey and structural part.

    - Use and export the appropriate material from the authoring system.'
