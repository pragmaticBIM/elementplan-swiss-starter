definition:
  de: |
    Gebäude als logische Gliederungsebene (IfcBuilding). Dem Areal zugeordnet.

    **Modellierung**
    - Mindestens ein IfcBuilding pro Datei.
    - Mehrere Gebäude auf demselben Areal als eigene IfcBuilding führen.
  fr: |
    Bâtiment comme niveau logique (IfcBuilding). Rattaché au site.

    **Modélisation**
    - Au moins un IfcBuilding par fichier.
    - Plusieurs bâtiments sur le même site comme IfcBuilding distincts.
  it: |
    Edificio come livello logico (IfcBuilding). Collegato al sito.

    **Modellazione**
    - Almeno un IfcBuilding per file.
    - Più edifici sullo stesso sito come IfcBuilding distinti.
  en: |
    Building as a logical breakdown level (IfcBuilding). Assigned to the site.

    **Modelling**
    - At least one IfcBuilding per file.
    - Several buildings on the same site as separate IfcBuilding instances.
