name:
  de: Gebäude
  fr: Bâtiment
  it: Edificio
  en: Building
definition:
  de: '**Beschreibung**

    - Gebäude als logische Gliederungsebene.

    - Dem Planungsperimeter zugeordnet.


    **Modellierungsrichtlinie**

    - Mindestens ein Gebäude pro Datei.

    - Mehrere Gebäude auf demselben Areal als eigene Gebäude führen. Oft macht es Sinn, diese in einzelne Modelldateien aufzuteilen.'
  fr: '**Description**

    - Bâtiment comme niveau logique de découpage.

    - Rattaché au périmètre de planification.


    **Directives de modélisation**

    - Au moins un bâtiment par fichier.

    - Plusieurs bâtiments sur le même site comme bâtiments distincts. Il est souvent judicieux de les répartir dans des fichiers de modèle séparés.'
  it: '**Descrizione**

    - Edificio come livello logico di suddivisione.

    - Collegato al perimetro di pianificazione.


    **Direttive di modellazione**

    - Almeno un edificio per file.

    - Più edifici sullo stesso sito come edifici distinti. Spesso ha senso suddividerli in singoli file di modello.'
  en: '**Description**

    - Building as a logical breakdown level.

    - Assigned to the planning perimeter.


    **Modelling guidelines**

    - At least one building per file.

    - Several buildings on the same site as separate buildings. It often makes sense to split them into separate model files.'
