id: pragmaticbim:element/building
code: BUILDING
sort_order: 3
status: active
name:
  de: Gebäude
  fr: Bâtiment
  it: Edificio
  en: Building
definition:
  de: 'Gliedert das Bauvorhaben in eindeutig zuordenbare Baukörper, damit Fachmodelle, Geschosse und Auswertungen gebäudeweise koordiniert werden können.


    **Beschreibung**

    - Gebäude als logische Gliederungsebene.

    - Dem Planungsperimeter zugeordnet.


    **Modellierungshinweis**

    - Mehrere Gebäude können als eigenständige Gebäude in einer Datei geführt werden; häufig empfiehlt sich jedoch die Aufteilung auf separate Modelldateien.'
  fr: 'Structure le projet de construction en volumes bâtis clairement identifiables afin de coordonner les maquettes métiers, les étages et les évaluations par bâtiment.


    **Description**

    - Bâtiment comme niveau logique de découpage.

    - Rattaché au périmètre de planification.


    **Directives de modélisation**

    - Plusieurs bâtiments peuvent être saisis comme bâtiments distincts dans un même fichier ; il est toutefois souvent recommandé de les répartir dans des fichiers de modèle séparés.'
  it: 'Suddivide il progetto di costruzione in corpi di fabbrica chiaramente identificabili per coordinare modelli disciplinari, piani e valutazioni per edificio.


    **Descrizione**

    - Edificio come livello logico di suddivisione.

    - Collegato al perimetro di pianificazione.


    **Direttive di modellazione**

    - Più edifici possono essere gestiti come edifici distinti in un unico file; spesso è tuttavia consigliabile suddividerli in file di modello separati.'
  en: 'Structures the construction project into clearly identifiable building volumes so that discipline models, storeys, and evaluations can be coordinated by building.


    **Description**

    - Building as a logical breakdown level.

    - Assigned to the planning perimeter.


    **Modelling guidelines**

    - Multiple buildings may be represented as separate buildings in one file; however, splitting them into separate model files is often recommended.'
