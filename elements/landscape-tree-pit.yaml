name:
  de: Baumgrube
  fr: Fosse de plantation
  it: Fossa di piantumazione
  en: Tree pit
definition:
  de: 'Macht das Wurzelraumvolumen je Baumstandort prüfbar, bevor die Pflanzung als gesichert gilt.


    **Beschreibung**

    - Unverdichtetes Substratvolumen der Baumgrube am geplanten oder bestehenden Baumstandort.

    - Dient dem Schwammstadt- und Baumstandortnachweis und der Verknüpfung mit dem Baum (LAN-TREE).


    **Modellierungshinweis**

    - Als vereinfachtes Volumen der Baumgrube modellieren und dem zugehörigen Baumstandort zuweisen.

    - Nettovolumen als massgebendes Wurzelraumvolumen führen; keine Feinwurzeln oder Substratschichten modellieren.'
  fr: 'Rend vérifiable le volume racinaire de chaque emplacement d''arbre avant de considérer la plantation comme assurée.


    **Description**

    - Volume de substrat non compacté de la fosse de plantation à l''emplacement d''arbre projeté ou existant.

    - Sert au justificatif ville-éponge et d''emplacement d''arbre ainsi qu''au lien avec l''arbre (LAN-TREE).


    **Directives de modélisation**

    - Modéliser comme volume simplifié de la fosse et le rattacher à l''emplacement d''arbre concerné.

    - Saisir le volume net comme volume racinaire déterminant ; ne pas modéliser de racines fines ni de couches de substrat.'
  it: 'Rende verificabile il volume radicale per ogni posizione d''albero prima di considerare la piantumazione come assicurata.


    **Descrizione**

    - Volume di substrato non compattato della fossa di piantumazione nella posizione d''albero prevista o esistente.

    - Serve alla verifica città spugna e di posizione d''albero nonché al collegamento con l''albero (LAN-TREE).


    **Direttive di modellazione**

    - Modellare come volume semplificato della fossa e assegnarlo alla posizione d''albero corrispondente.

    - Gestire il volume netto come volume radicale determinante; non modellare radici fini né strati di substrato.'
  en: 'Makes the root volume per tree location verifiable before planting is treated as secured.


    **Description**

    - Uncompacted substrate volume of the tree pit at the planned or existing tree location.

    - Used for sponge-city and tree-location proof and for linking to the tree (LAN-TREE).


    **Modelling guidelines**

    - Model as a simplified tree-pit volume and assign it to the related tree location.

    - Carry net volume as the authoritative root volume; do not model fine roots or substrate layers.'
