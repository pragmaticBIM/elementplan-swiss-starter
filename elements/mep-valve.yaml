    de: 'Anlagenkennzeichnung (AKS) gemäss Bauherrenstandard.


      Fehlt ein projektspezifischer Standard, Vorschlag: `{Gebäude}-{Geschoss}-{Gewerk}-{Anlagenart}-{nnn}` (z. B. `B01-02-H-RLT-003`).'
    fr: 'Identification d''installation (AKS) selon le standard du maître d''ouvrage.


      Si aucun standard de projet n''existe, proposition : `{Bâtiment}-{Étage}-{Corps de métier}-{Type d''installation}-{nnn}` (p. ex. `B01-02-H-RLT-003`).'
    it: 'Identificazione impianto (AKS) secondo lo standard del committente.


      Se manca uno standard di progetto, proposta: `{Edificio}-{Piano}-{Disciplina}-{Tipo impianto}-{nnn}` (p. es. `B01-02-H-RLT-003`).'
    en: 'Plant identification (AKS) according to the client standard.


      If no project-specific standard exists, suggestion: `{Building}-{Storey}-{Trade}-{Plant type}-{nnn}` (e.g. `B01-02-H-RLT-003`).'
