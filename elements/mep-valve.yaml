id: pragmaticbim:element/mep-valve
code: MEP-VALVE
sort_order: 107
status: active
name:
  de: Ventil / Heizkreisverteiler
  fr: Vanne / collecteur
  it: Valvola / collettore
  en: Valve / manifold
definition:
  de: '**Beschreibung**

    - Verteiler oder Ventil in der Heizungsverteilung.

    - Fussbodenheizungs-Heizkreisverteiler.


    **Modellierungsrichtlinie**

    - Als Geräteobjekt mit Abmessungen und Lage modellieren.

    - Dem zugehörigen Geschoss und dem System zuweisen.'
  fr: '**Description**

    - Collecteur ou vanne dans la distribution de chauffage.

    - Collecteur plancher chauffant.


    **Directives de modélisation**

    - Modéliser comme appareil avec dimensions et position.

    - Rattacher à l''étage et à la zone technique ou d''usage.'
  it: '**Descrizione**

    - Collettore o valvola nella distribuzione del riscaldamento.

    - Collettore riscaldamento a pavimento.


    **Direttive di modellazione**

    - Modellare come apparecchio con dimensioni e posizione.

    - Assegnare al piano e alla zona tecnica o d''uso.'
  en: '**Description**

    - Manifold or valve in the heating distribution.

    - Underfloor heating manifold.


    **Modelling guidelines**

    - Model as an equipment object with size and location.

    - Assign to the matching storey and technical or use zone.'
