attributes:
- name: PredefinedType
  pset: null
  definition:
    de: 'Art des Geräts bzw. Terminals.


      **Zulässige Werte**

      - `MIXING` — Mischventil / Verteiler

      - `DIVERTING` — Umschaltventil

      - `ISOLATING` — Absperrventil

      - `REGULATING` — Regulierventil

      - `SAFETYCUTOFF` — Sicherheitsabsperrung

      - `STEAMTRAP` — Kondensatableiter

      - `GASCOCK` — Gashahn

      - `DRAWOFFCOCK` — Entnahmehahn

      - `USERDEFINED` — benutzerdefiniert'
    fr: 'Type d''appareil ou de terminal.


      **Valeurs admises**

      - `MIXING` — vanne mélangeuse / collecteur

      - `DIVERTING` — vanne de dérivation

      - `ISOLATING` — vanne d''isolement

      - `REGULATING` — vanne de régulation

      - `SAFETYCUTOFF` — coupure de sécurité

      - `STEAMTRAP` — purgeur

      - `GASCOCK` — robinet gaz

      - `DRAWOFFCOCK` — robinet de puisage

      - `USERDEFINED` — défini par l''utilisateur'
    it: 'Tipo di apparecchio o terminale.


      **Valori ammessi**

      - `MIXING` — valvola miscelatrice / collettore

      - `DIVERTING` — valvola di deviazione

      - `ISOLATING` — valvola di intercettazione

      - `REGULATING` — valvola di regolazione

      - `SAFETYCUTOFF` — intercettazione di sicurezza

      - `STEAMTRAP` — scaricatore di condensa

      - `GASCOCK` — rubinetto gas

      - `DRAWOFFCOCK` — rubinetto di prelievo

      - `USERDEFINED` — definito dall''utente'
    en: 'Kind of equipment or terminal.


      **Allowed values**

      - `MIXING` — mixing / manifold

      - `DIVERTING` — diverting

      - `ISOLATING` — isolating

      - `REGULATING` — regulating

      - `SAFETYCUTOFF` — safety cutoff

      - `STEAMTRAP` — steam trap

      - `GASCOCK` — gas cock

      - `DRAWOFFCOCK` — draw-off cock

      - `USERDEFINED` — user-defined'
