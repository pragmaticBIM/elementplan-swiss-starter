id: pragmaticbim:element/structural-exclusion-zone
code: STR-EXCL-ZONE
sort_order: 57
status: active
name:
  de: Sperrzone
  fr: Zone d'exclusion
  it: Zona di esclusione
  en: Exclusion zone
definition:
  de: 'Hält benötigte Tragwerksbereiche frei und verhindert kostspielige Kollisionen mit Architektur und Gebäudetechnik.


    **Beschreibung**

    - Volumen, in dem Architektur und Gebäudetechnik nichts platzieren dürfen (z. B. Stützenachse, Trägerzone, Aussparungsreserve).

    - Vom Tragwerksplaner als verbindliche Planungsgrenze geliefert, nicht vom Architekten modelliert.


    **Modellierungshinweis**

    - Als vereinfachten Proxy-Körper modellieren; Abmessungen gemäss Tragwerksplanung.

    - Dem zugehörigen Geschoss zuweisen.

    - Keine Bewehrung, Ausführungsdetails oder tragende Bauteile modellieren.'
  fr: 'Réserve les volumes nécessaires à la structure et évite des collisions coûteuses avec l''architecture et les techniques du bâtiment.


    **Description**

    - Volume dans lequel l''architecture et les techniques du bâtiment ne peuvent rien placer (p. ex. axe de poteau, zone de poutre, réserve de réservation).

    - Fournie par l''ingénieur structure comme limite de planification contraignante, non modélisée par l''architecte.


    **Directives de modélisation**

    - Modéliser comme corps proxy simplifié ; dimensions selon la planification structurelle.

    - Rattacher à l''étage concerné.

    - Ne pas modéliser armatures, détails d''exécution ou éléments porteurs.'
  it: 'Mantiene liberi i volumi necessari alla struttura ed evita costose interferenze con l''architettura e gli impianti.


    **Descrizione**

    - Volume in cui architettura e impianti non possono collocare nulla (p. es. asse di colonna, zona di trave, riserva di foro).

    - Consegnata dall''ingegnere strutturista come limite vincolante di pianificazione, non modellata dall''architetto.


    **Direttive di modellazione**

    - Modellare come corpo proxy semplificato; dimensioni secondo la pianificazione strutturale.

    - Assegnare al piano corrispondente.

    - Non modellare armature, dettagli esecutivi o elementi portanti.'
  en: 'Keeps required structural volumes clear and prevents costly clashes with architecture and building services.


    **Description**

    - Volume where architecture and building services must not place anything (for example column axis, beam zone, opening reserve).

    - Delivered by the structural engineer as a binding planning boundary, not modelled by the architect.


    **Modelling guidelines**

    - Model as a simplified proxy body; dimensions according to the structural design.

    - Assign to the matching storey.

    - Do not model reinforcement, execution details, or load-bearing components.'
