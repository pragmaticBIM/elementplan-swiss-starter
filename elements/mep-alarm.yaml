attributes:
- name: PredefinedType
  pset: null
  definition:
    de: 'Art des Geräts bzw. Terminals.


      **Zulässige Werte**

      - `BREAKGLASSBUTTON` — Druckknopfmelder

      - `MANUALPULLBOX` — Handmelder

      - `BELL` — Glocke

      - `SIREN` — Sirene

      - `LIGHT` — Blitzleuchte

      - `WHISTLE` — Signalhorn

      - `USERDEFINED` — benutzerdefiniert (z. B. Rauchmelder)'
    fr: 'Type d''appareil ou de terminal.


      **Valeurs admises**

      - `BREAKGLASSBUTTON` — bouton brise-glace

      - `MANUALPULLBOX` — boîtier manuel

      - `BELL` — cloche

      - `SIREN` — sirène

      - `LIGHT` — feu flash

      - `WHISTLE` — sifflet

      - `USERDEFINED` — défini par l''utilisateur'
    it: 'Tipo di apparecchio o terminale.


      **Valori ammessi**

      - `BREAKGLASSBUTTON` — pulsante antincendio

      - `MANUALPULLBOX` — pulsante manuale

      - `BELL` — campana

      - `SIREN` — sirena

      - `LIGHT` — luce flash

      - `WHISTLE` — fischio

      - `USERDEFINED` — definito dall''utente'
    en: 'Kind of equipment or terminal.


      **Allowed values**

      - `BREAKGLASSBUTTON` — break glass button

      - `MANUALPULLBOX` — manual pull box

      - `BELL` — bell

      - `SIREN` — siren

      - `LIGHT` — light

      - `WHISTLE` — whistle

      - `USERDEFINED` — user-defined (e.g. smoke detector)'
