- name: Reference
  pset: Pset_SpaceCommon
  definition:
    de: 'Flächenklasse des Raums nach SIA 416 oder SIA D0165.


      **Quelle**

      - SIA 416: https://schema.pragmaticbim.ch/classification/mapping-room-activity-to-sia416.html

      - SIA D0165: https://schema.pragmaticbim.ch/classification/mapping-room-activity-to-d0165.html


      **Zulässige Werte**

      - Siehe Werteliste Raumreferenz Innenraum SIA 416 / D0165 — z. B. `HNF`, `NNF`, `VF` (SIA 416) oder `HNF-1`, `NNF-7`, `VF-9` (D0165).'
    fr: 'Classe de surface du local selon SIA 416 ou SIA D0165.


      **Source**

      - SIA 416 : https://schema.pragmaticbim.ch/classification/mapping-room-activity-to-sia416.html

      - SIA D0165 : https://schema.pragmaticbim.ch/classification/mapping-room-activity-to-d0165.html


      **Valeurs admises**

      - Voir la liste de valeurs Référence de local intérieur SIA 416 / D0165 — p. ex. `HNF`, `NNF`, `VF` (SIA 416) ou `HNF-1`, `NNF-7`, `VF-9` (D0165).'
    it: 'Classe di superficie del locale secondo SIA 416 o SIA D0165.


      **Fonte**

      - SIA 416: https://schema.pragmaticbim.ch/classification/mapping-room-activity-to-sia416.html

      - SIA D0165: https://schema.pragmaticbim.ch/classification/mapping-room-activity-to-d0165.html


      **Valori ammessi**

      - Vedere l''elenco valori Riferimento locale interno SIA 416 / D0165 — p. es. `HNF`, `NNF`, `VF` (SIA 416) o `HNF-1`, `NNF-7`, `VF-9` (D0165).'
    en: 'Area class of the space according to SIA 416 or SIA D0165.


      **Source**

      - SIA 416: https://schema.pragmaticbim.ch/classification/mapping-room-activity-to-sia416.html

      - SIA D0165: https://schema.pragmaticbim.ch/classification/mapping-room-activity-to-d0165.html


      **Allowed values**

      - See value list Space reference interior SIA 416 / D0165 — e.g. `HNF`, `NNF`, `VF` (SIA 416) or `HNF-1`, `NNF-7`, `VF-9` (D0165).'
