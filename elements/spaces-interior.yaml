id: pragmaticbim:element/spaces-interior
code: SPACE-INT
sort_order: 10
status: active
name:
  de: Innenräume
  fr: Espaces intérieurs
  it: Spazi interni
  en: Interior spaces
definition:
  de: 'Geschlossene, begehbare Raumvolumen innerhalb des Gebäudes.


    **Beschreibung**

    - Nutzbare Innenräume als durchgängig modellierte Volumen.

    - Raumnutzung wird über LongName geführt; Name kann die Raumnummer tragen.


    **Modellierungsrichtlinie**

    - Mit dem Raumwerkzeug als Volumen modellieren, geschossweise.

    - Von Oberkante Fertigboden bis Unterkante tragende Decke — nicht Abhangdecke. Nur so kann der Raum von anderen Gewerken weiterverwendet werden.

    - Keine Überlappungen oder Doppelungen.'
  fr: 'Volumes de locaux clos et accessibles à l''intérieur du bâtiment.


    **Description**

    - Locaux intérieurs utilisables modélisés comme volumes continus.

    - L''usage du local est porté par LongName; Name peut porter le numéro de local.


    **Directives de modélisation**

    - Modéliser comme volume avec l''outil local, étage par étage.

    - Du dessus du sol fini au dessous du plafond porteur — pas de plafond suspendu. Seulement ainsi le local peut être réutilisé par les autres corps de métier.

    - Pas de chevauchement ni de duplication.'
  it: 'Volumi di locali chiusi e percorribili all''interno dell''edificio.


    **Descrizione**

    - Locali interni utilizzabili modellati come volumi continui.

    - L''uso del locale è indicato in LongName; Name può riportare il numero del locale.


    **Direttive di modellazione**

    - Modellare come volume con lo strumento locale, piano per piano.

    - Dal bordo superiore del pavimento finito al bordo inferiore del solaio portante — non controsoffitto. Solo così il locale può essere riutilizzato dalle altre discipline.

    - Nessuna sovrapposizione o duplicazione.'
  en: 'Enclosed, walkable room volumes within the building.


    **Description**

    - Usable interior spaces modelled as continuous volumes.

    - Room use is carried in LongName; Name may carry the room number.


    **Modelling guidelines**

    - Model as a volume with the space tool, storey by storey.

    - From top of finished floor to underside of the structural ceiling — not a suspended ceiling. Only then can the space be reused by other trades.

    - No overlaps or duplicates.'
