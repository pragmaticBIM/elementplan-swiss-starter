id: pragmaticbim:element/spaces-interior
code: SPACE-INT
sort_order: 11
status: active
name:
  de: Innenräume
  fr: Espaces intérieurs
  it: Spazi interni
  en: Interior spaces
definition:
  de: 'Verknüpft Raumprogramm, Flächennachweise und Fachplanung, damit Nutzung, Dimensionierung und technische Anforderungen raumweise koordiniert werden können.


    **Beschreibung**

    - Nutzbare Innenräume als durchgängig modellierte Volumen.

    - Raumnutzung wird über LongName geführt; Name kann die Raumnummer tragen.


    **Modellierungshinweis**

    - Mit dem Raumwerkzeug als Volumen modellieren, geschossweise.

    - Von Oberkante Fertigboden bis Unterkante tragende Decke – nicht Abhangdecke. Nur so können andere Gewerke den Raum weiterverwenden, z. B. um Gebäudetechnik einem Raum zuzuordnen.

    - Keine Überlappungen oder Doppelungen.

    - Jeden Hohlraum im Gebäude mit einem Raumobjekt ausfüllen.

    - Für Mietflächen- oder Energiebezugsflächenberechnungen eine von drei Vorgehensweisen wählen und vorgängig abstimmen: ein separates, nur für die Auswertung bestimmtes Wegwerfmodell mit den erforderlichen
    Raumdefinitionen erstellen; die Berechnung mit geeigneten Faktoren anpassen; oder die verbleibende Ungenauigkeit bewusst in Kauf nehmen.


    **Diskussionsimpuls**

    - Für die Fachplanung wäre ein Raumvolumen von Oberkante Rohdecke bis Unterkante der darüberliegenden tragenden Decke vorteilhaft. Dadurch könnten auch Installationen im Bodenaufbau eindeutig dem Raum
    zugeordnet werden. Viele Autorensysteme unterstützen diese Modellierung jedoch nicht zuverlässig; sie wird deshalb hier nicht allgemein empfohlen. `FinishFloorHeight` beziehungsweise `FloorCoveringThickness`
    könnten die Höhendifferenz ergänzend dokumentieren.'
  fr: 'Relie le programme des locaux, les justificatifs de surfaces et les études spécialisées afin de coordonner par local l''usage, le dimensionnement et les exigences techniques.


    **Description**

    - Locaux intérieurs utilisables modélisés comme volumes continus.

    - L''usage du local est saisi dans LongName ; Name peut contenir le numéro de local.


    **Directives de modélisation**

    - Modéliser comme volume avec l''outil local, étage par étage.

    - Du dessus du sol fini au dessous du plafond porteur – pas de plafond suspendu. Les autres corps de métier peuvent ainsi réutiliser le local, par exemple pour y affecter les équipements techniques.

    - Pas de chevauchement ni de duplication.

    - Remplir chaque cavité du bâtiment avec un objet local.

    - Pour les calculs de surfaces locatives ou de surfaces de référence énergétique, choisir l''une des trois méthodes suivantes et la convenir au préalable : créer une maquette temporaire séparée, réservée
    à l''évaluation, avec les définitions de locaux requises ; adapter le calcul à l''aide de facteurs appropriés ; ou accepter consciemment l''imprécision restante.


    **Piste de réflexion**

    - Pour les études spécialisées, il serait avantageux de définir le volume du local depuis le dessus de la dalle brute jusqu''à la sous-face de la dalle porteuse supérieure. Les installations situées
    dans le complexe de sol pourraient ainsi être attribuées sans ambiguïté au local. De nombreux logiciels de modélisation ne gèrent toutefois pas cette méthode de manière fiable ; elle n''est donc pas
    recommandée ici de manière générale. `FinishFloorHeight` ou `FloorCoveringThickness` pourraient documenter en complément la différence de niveau.'
  it: 'Collega il programma dei locali, le verifiche delle superfici e la progettazione specialistica per coordinare per locale uso, dimensionamento e requisiti tecnici.


    **Descrizione**

    - Locali interni utilizzabili modellati come volumi continui.

    - L''uso del locale è indicato in LongName; Name può riportare il numero del locale.


    **Direttive di modellazione**

    - Modellare come volume con lo strumento locale, piano per piano.

    - Dal bordo superiore del pavimento finito al bordo inferiore del solaio portante – non controsoffitto. In questo modo le altre discipline possono riutilizzare il locale, ad esempio per associarvi gli
    impianti.

    - Nessuna sovrapposizione o duplicazione.

    - Riempire ogni cavità dell''edificio con un oggetto spazio.

    - Per il calcolo delle superfici locative o delle superfici di riferimento energetico, scegliere una delle tre modalità seguenti e concordarla in anticipo: creare un modello temporaneo separato, destinato
    esclusivamente alla valutazione, con le definizioni degli spazi richieste; adeguare il calcolo mediante fattori appropriati; oppure accettare consapevolmente l''imprecisione residua.


    **Spunto di discussione**

    - Per la progettazione specialistica sarebbe vantaggioso definire il volume del locale dal bordo superiore della soletta grezza all''intradosso della soletta portante sovrastante. In questo modo anche
    gli impianti nel pacchetto di pavimento potrebbero essere associati in modo univoco al locale. Molti software di authoring, tuttavia, non supportano questa modalità in modo affidabile; pertanto non
    viene qui raccomandata in generale. `FinishFloorHeight` oppure `FloorCoveringThickness` potrebbero documentare in modo complementare il dislivello.'
  en: 'Links the room programme, area verification, and discipline planning so that use, sizing, and technical requirements can be coordinated for each space.


    **Description**

    - Usable interior spaces modelled as continuous volumes.

    - Room use is carried in LongName; Name may carry the room number.


    **Modelling guidelines**

    - Model as a volume with the space tool, storey by storey.

    - From top of finished floor to underside of the structural ceiling – not a suspended ceiling. This allows other trades to reuse the space, for example to assign building services to it.

    - No overlaps or duplicates.

    - Fill every void in the building with a space object.

    - For rental-area or energy-reference-area calculations, choose and agree one of three approaches in advance: create a separate disposable model used only for the evaluation, with the required space
    definitions; adjust the calculation using suitable factors; or knowingly accept the remaining inaccuracy.


    **Discussion point**

    - For discipline planning, defining the space volume from the top of the structural floor slab to the underside of the structural slab above would be beneficial. This would allow installations within
    the floor build-up to be assigned unambiguously to the space. However, many authoring tools do not support this approach reliably, so it is not generally recommended here. `FinishFloorHeight` or `FloorCoveringThickness`
    could additionally document the level difference.'
