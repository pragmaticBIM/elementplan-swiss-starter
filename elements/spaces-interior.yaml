- name: UsageUnitReference
  pset: ePset_Space
  definition:
    de: 'Stabile Referenz der Nutzungseinheit, zu welcher der Raum gehört, zum Beispiel Wohnung, Büro- oder Gewerbeeinheit. Sie sollte möglichst algorithmisch anhand der geometrischen Lage des Raums im
      zugehörigen Bruttovolumen befüllt werden.


      **Hinweis**

      - Alternativ können die Räume einer Nutzungseinheit über `IfcZone` gruppiert werden.'
    fr: 'Référence stable de l''unité d''usage à laquelle appartient le local, par exemple logement, unité de bureaux ou surface commerciale. Elle devrait si possible être renseignée au moyen d''un algorithme
      fondé sur la position géométrique du local dans le volume brut correspondant.


      **Remarque**

      - Les locaux d''une unité d''usage peuvent aussi être regroupés au moyen d''une `IfcZone`.'
    it: 'Riferimento stabile dell''unità d''uso a cui appartiene il locale, per esempio appartamento, unità per uffici o unità commerciale. Dovrebbe essere compilato, se possibile, mediante un algoritmo
      basato sulla posizione geometrica del locale nel rispettivo volume lordo.


      **Nota**

      - In alternativa, i locali di un''unità d''uso possono essere raggruppati mediante una `IfcZone`.'
    en: 'Stable reference of the usage unit to which the space belongs, for example an apartment, office unit, or commercial unit. It should where possible be populated using an algorithm based on the space''s
      geometric position within the corresponding gross volume.


      **Note**

      - Alternatively, the spaces of a usage unit can be grouped using `IfcZone`.'
  datatype: IfcIdentifier
  needed_in_phases:
  - '11'
  - '21'
  - '22'
  - '31'
  - '32'
  - '33'
  - '41'
  - '51'
