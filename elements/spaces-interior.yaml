- name: Reference
  pset: Pset_SpaceCommon
  definition:
    de: 'Flächenklasse des Raums nach SIA 416 oder SIA D0165.


      **Zulässige Werte**

      - Siehe Werteliste [Raumreferenz Innenraum SIA 416 / D0165](https://schema.pragmaticbim.ch/classification/mapping-room-activity-to-sia416.html) – z. B. `HNF`, `NNF`, `VF` (SIA 416) oder `HNF-1`, `NNF-7`,
      `VF-9` (D0165).'
    fr: 'Classe de surface du local selon SIA 416 ou SIA D0165.


      **Valeurs admises**

      - Voir la liste de valeurs [Référence de local intérieur SIA 416 / D0165](https://schema.pragmaticbim.ch/classification/mapping-room-activity-to-sia416.html) – p. ex. `HNF`, `NNF`, `VF` (SIA 416)
      ou `HNF-1`, `NNF-7`, `VF-9` (D0165).'
    it: 'Classe di superficie del locale secondo SIA 416 o SIA D0165.


      **Valori ammessi**

      - Vedere l''elenco valori [Riferimento locale interno SIA 416 / D0165](https://schema.pragmaticbim.ch/classification/mapping-room-activity-to-sia416.html) – p. es. `HNF`, `NNF`, `VF` (SIA 416) o `HNF-1`,
      `NNF-7`, `VF-9` (D0165).'
    en: 'Area class of the space according to SIA 416 or SIA D0165.


      **Allowed values**

      - See the [Space reference interior SIA 416 / D0165](https://schema.pragmaticbim.ch/classification/mapping-room-activity-to-sia416.html) value list, e.g. `HNF`, `NNF`, `VF` (SIA 416) or `HNF-1`, `NNF-7`,
      `VF-9` (D0165).'
