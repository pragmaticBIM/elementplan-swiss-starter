- name: FinishCeilingHeight
  pset: Qto_SpaceBaseQuantities
  definition:
    de: 'Abhangdeckenhöhe — lichte Höhe von Oberkante Fertigboden bis Unterkante Abhangdecke.


      **Hinweis**

      - Bei ungleichmässiger Abhangdecke den ungünstigsten Fall für die Nutzung wählen: die tiefste Unterkante (geringste lichte Höhe).'
    fr: 'Hauteur sous plafond suspendu — hauteur libre du dessus du sol fini à l''intrados du plafond suspendu.


      **Remarque**

      - En cas de plafond suspendu irrégulier, retenir le cas le plus défavorable pour l''usage : l''intrados le plus bas (hauteur libre minimale).'
    it: 'Altezza del controsoffitto — altezza libera dal bordo superiore del pavimento finito all''intradosso del controsoffitto.


      **Nota**

      - Con controsoffitto irregolare, scegliere il caso peggiore per l''uso: l''intradosso più basso (altezza libera minima).'
    en: 'Suspended ceiling height — clear height from top of finished floor to underside of the suspended ceiling.


      **Note**

      - For an uneven suspended ceiling, pick the worst case for use: the deepest underside (smallest clear height).'
  datatype: IfcLengthMeasure
  unit: m
