id: pragmaticbim:element/spaces-interior
code: SPACE-INT
sort_order: 10
status: active
name:
  de: Innenräume
  fr: Espaces intérieurs
  it: Spazi interni
  en: Interior spaces
definition:
  de: |
    Innenräume als Volumen (IfcSpace, PredefinedType INTERNAL).

    **Modellierung**
    - Mit dem Raumwerkzeug als Volumen modellieren, geschossweise.
    - Von Oberkante Fertigboden bis Unterkante tragende Decke.
    - Keine Überlappungen oder Doppelungen.
    - Raumname in LongName, optionale Raumnummer in Name.
  fr: |
    Espaces intérieurs comme volumes (IfcSpace, PredefinedType INTERNAL).

    **Modélisation**
    - Modéliser comme volume avec l'outil local, étage par étage.
    - Du dessus du sol fini au dessous du plafond porteur.
    - Pas de chevauchement ni de duplication.
    - Nom du local dans LongName, numéro facultatif dans Name.
  it: |
    Spazi interni come volumi (IfcSpace, PredefinedType INTERNAL).

    **Modellazione**
    - Modellare come volume con lo strumento locale, piano per piano.
    - Dal bordo superiore del pavimento finito al bordo inferiore del solaio portante.
    - Nessuna sovrapposizione o duplicazione.
    - Nome del locale in LongName, numero facoltativo in Name.
  en: |
    Interior spaces as volumes (IfcSpace, PredefinedType INTERNAL).

    **Modelling**
    - Model as a volume with the space tool, storey by storey.
    - From top of finished floor to underside of the structural ceiling.
    - No overlaps or duplicates.
    - Room name in LongName, optional room number in Name.
needed_in_domain:
  - pragmaticbim:domain/architecture
  - pragmaticbim:domain/mep
entity_ifc2x3: IfcSpace
entity_ifc4: IfcSpace
entity_ifc4_3: IfcSpace
picture_link: null
model_link: null
