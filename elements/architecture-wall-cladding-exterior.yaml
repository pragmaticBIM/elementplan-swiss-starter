- name: RemovalCategory
  pset: ePset_HazardousMaterial
  definition:
    de: 'Sanierungsdringlichkeit / Handlungsbedarf gemäss Gutachten.


      **Zulässige Werte**

      - `Immediate` — sofortige Sanierung nötig

      - `PriorToDemolition` — Sanierung vor Abbruch/Umbau

      - `InSitu` — kann im Bestand verbleiben, Überwachung

      - `None` — kein Handlungsbedarf'
    fr: 'Urgence d''assainissement / besoin d''action selon l''expertise.


      **Valeurs admises**

      - `Immediate` — assainissement immédiat nécessaire

      - `PriorToDemolition` — assainissement avant démolition/transformation

      - `InSitu` — peut rester en place, surveillance

      - `None` — aucune action requise'
    it: 'Urgenza di bonifica / necessità di intervento secondo la perizia.


      **Valori ammessi**

      - `Immediate` — bonifica immediata necessaria

      - `PriorToDemolition` — bonifica prima di demolizione/trasformazione

      - `InSitu` — può restare in opera, sorveglianza

      - `None` — nessun intervento richiesto'
    en: 'Remediation urgency and action required, as determined by the survey.


      **Allowed values**

      - `Immediate` — remediate immediately

      - `PriorToDemolition` — remediate before demolition or alteration

      - `InSitu` — may remain in place, under monitoring

