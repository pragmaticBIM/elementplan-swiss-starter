- name: Accessibility
  pset: ePset_Circularity
  definition:
    de: 'Zugänglichkeit der Verbindung ohne Zerstörung von Bauteil oder Umgebung (Madaster).


      **Zulässige Werte**

      - `Accessible` — frei zugänglich ohne Zusatzmassnahmen

      - `PartialNoDamage` — zugänglich mit Massnahmen ohne Schaden

      - `PartialWithRepairableDamage` — zugänglich mit vollständig reparierbarem Schaden

      - `PartialWithDamage` — zugänglich mit teilweise reparierbarem Schaden

      - `NotAccessible` — nicht zugänglich, irreparabler Schaden'
    fr: 'Accessibilité de la connexion sans destruction de l''élément ou de l''entourage (Madaster).


      **Valeurs admises**

      - `Accessible` — librement accessible sans actions supplémentaires

      - `PartialNoDamage` — accessible avec actions sans dommage

      - `PartialWithRepairableDamage` — accessible avec dommage entièrement réparable

      - `PartialWithDamage` — accessible avec dommage partiellement réparable

      - `NotAccessible` — non accessible, dommage irréparable'
    it: 'Accessibilità della connessione senza distruggere il componente o l''intorno (Madaster).


      **Valori ammessi**

      - `Accessible` — liberamente accessibile senza azioni aggiuntive

      - `PartialNoDamage` — accessibile con azioni senza danno

      - `PartialWithRepairableDamage` — accessibile con danno interamente riparabile

      - `PartialWithDamage` — accessibile con danno parzialmente riparabile

      - `NotAccessible` — non accessibile, danno irreparabile'
    en: 'Accessibility of the connection without destroying the component or surroundings (Madaster).


      **Allowed values**

      - `Accessible` — freely accessible without additional actions

      - `PartialNoDamage` — accessible with actions that cause no damage

      - `PartialWithRepairableDamage` — accessible with fully repairable damage

      - `PartialWithDamage` — accessible with partially repairable damage

      - `NotAccessible` — not accessible; irreparable damage'
