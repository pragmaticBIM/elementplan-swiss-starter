      - `PCB` — PCB

      - `PAH` — IPA

      - `PCP` — PCP

      - `Lead` — piombo

      - `None` — nessun inquinante

      - `Unknown` — sconosciuto / non indagato'
    en: 'Type of hazardous material found by survey on the affected existing component.


      **Allowed values**

      - `Asbestos` — asbestos

      - `PCB` — PCB

      - `PAH` — PAH

      - `PCP` — PCP

      - `Lead` — lead

      - `None` — no hazardous material

