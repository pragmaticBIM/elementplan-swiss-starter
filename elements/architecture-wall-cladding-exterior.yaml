id: pragmaticbim:element/architecture-wall-cladding-exterior
code: ARC-WALL-CLAD-EXT
sort_order: 52
status: active
name:
  de: Fassadenbekleidung
  fr: Revêtement de façade
  it: Rivestimento di facciata
  en: Facade cladding
definition:
  de: 'Ermöglicht eine getrennte Planung und Mengenermittlung der Fassadenoberfläche und verbessert die Abstimmung mit Anschlüssen und Öffnungen.


    **Beschreibung**

    - Aussenliegende Bekleidungsschicht mit definierter Qualität gemäss Bauteilkatalog.

    - Eigenständige Schicht, getrennt von der tragenden Aussenwand.


    **Modellierungshinweis**

    - Modellieren wenn Mehrschichtbauteil nicht unterstützt wird oder höhere Komplexität erforderlich ist.

    - Als eigene Schicht modellieren; an Bauteil- und Geschossgrenzen teilen.

    - Bekleidungsqualität über Reference erfassen.

    - Geeignetes Material im Autorensystem verwenden und exportieren.'
  fr: 'Permet d''étudier et de quantifier séparément la surface de façade et améliore la coordination avec les raccords et les ouvertures.


    **Description**

    - Couche de revêtement extérieure avec qualité définie selon le catalogue de composants.

    - Couche distincte, séparée du mur extérieur porteur.


    **Directives de modélisation**

    - Modéliser lorsque le composant multicouche n''est pas supporté ou que la complexité exige une couche séparée.

    - Modéliser comme couche distincte ; diviser aux limites de composants et d''étages.

    - Saisir la qualité de revêtement via Reference.

    - Utiliser et exporter le matériau approprié depuis le logiciel auteur.'
  it: 'Consente di progettare e quantificare separatamente la superficie di facciata e migliora il coordinamento con raccordi e aperture.


    **Descrizione**

    - Strato di rivestimento esterno con qualità definita secondo il catalogo componenti.

    - Strato autonomo, separato dalla parete esterna portante.


    **Direttive di modellazione**

    - Modellare quando il componente multistrato non è supportato o la complessità richiede uno strato separato.

    - Modellare come strato autonomo; suddividere ai confini di componenti e piani.

    - Registrare la qualità del rivestimento tramite Reference.

    - Usare ed esportare il materiale appropriato dal software di modellazione.'
  en: 'Enables separate design and quantity take-off of the facade surface and improves coordination with connections and openings.


    **Description**

    - Exterior cladding layer with defined quality according to the component catalogue.

    - Separate layer, distinct from the load-bearing exterior wall.


    **Modelling guidelines**

    - Model when multi-layer components are not supported or higher complexity requires a separate layer.

    - Model as a separate layer; split at component and storey boundaries.

    - Capture cladding quality via Reference.

    - Use and export the appropriate material from the authoring system.'
