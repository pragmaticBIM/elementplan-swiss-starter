- name: HazardType
  pset: ePset_HazardousMaterial
  definition:
    de: 'Schadstoffart gemäss Gutachten am betroffenen Bestandsbauteil.


      **Zulässige Werte**

      - `Asbestos` — Asbest

      - `PCB` — PCB

      - `PAH` — PAK

      - `PCP` — PCP

      - `Lead` — Blei

      - `None` — kein Schadstoff

      - `Unknown` — unbekannt / nicht untersucht'
    fr: 'Type de polluant selon l''expertise sur l''élément existant concerné.


      **Valeurs admises**

      - `Asbestos` — amiante

      - `PCB` — PCB

      - `PAH` — HAP

