name:
  de: Koordinationszone
  fr: Zone de coordination
  it: Zona di coordinamento
  en: Coordination zone
definition:
  de: 'Geplantes Koordinationsvolumen mit Zuordnung zum Koordinationsmeeting.


    **Beschreibung**

    - Volumen, das den räumlichen Scope eines Koordinationsmeetings abgrenzt — kein Raumobjekt und kein Bauwerksteil.

    - Dient der Planung der Koordination (welches Volumen in welchem Meeting), nicht der Kollisionsprüfung selbst.


    **Modellierungsrichtlinie**

    - Als vereinfachten Proxy-Körper modellieren; Abmessungen gemäss geplantem Koordinationsbereich.

    - Dem zugehörigen Geschoss zuweisen; ObjectType = Koordinationszone.

    - Name = Bezeichnung des Koordinationsmeetings; keine Bauteile, Leitungen oder Ausbau innerhalb des Volumens modellieren.'
  fr: 'Volume de coordination planifié rattaché à la réunion de coordination.


    **Description**

    - Volume qui délimite le périmètre spatial d''une réunion de coordination — pas un objet local ni un élément de construction.

    - Sert à planifier la coordination (quel volume dans quelle réunion), pas à la détection de collisions elle-même.


    **Directives de modélisation**

    - Modéliser comme corps proxy simplifié ; dimensions selon le périmètre de coordination prévu.

    - Rattacher à l''étage concerné ; ObjectType = Koordinationszone.

    - Name = désignation de la réunion de coordination ; ne pas modéliser composants, réseaux ou finitions à l''intérieur du volume.'
  it: 'Volume di coordinamento pianificato assegnato alla riunione di coordinamento.


    **Descrizione**

    - Volume che delimita l''ambito spaziale di una riunione di coordinamento — non un oggetto locale né un elemento costruttivo.

    - Serve a pianificare il coordinamento (quale volume in quale riunione), non alla verifica di collisioni stessa.


    **Direttive di modellazione**

    - Modellare come corpo proxy semplificato; dimensioni secondo l''ambito di coordinamento previsto.

    - Assegnare al piano corrispondente; ObjectType = Koordinationszone.

    - Name = denominazione della riunione di coordinamento; non modellare componenti, reti o finiture all''interno del volume.'
  en: 'Planned coordination volume assigned to a coordination meeting.


    **Description**

    - Volume that bounds the spatial scope of a coordination meeting — not a space object and not a building component.

    - Used to plan coordination (which volume in which meeting), not for clash detection itself.


    **Modelling guidelines**

    - Model as a simplified proxy body; dimensions according to the planned coordination extent.

    - Assign to the matching storey; ObjectType = Koordinationszone.

    - Name = coordination meeting designation; do not model components, services, or finishes inside the volume.'
