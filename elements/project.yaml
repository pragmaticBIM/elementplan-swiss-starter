- name: Phase
  pset: null
  definition:
    de: 'Bezeichnung der Teilphase gemäss SIA 112.


      **Zulässige Werte**

      - `11` — Strategische Planung

      - `21` — Vorstudien

      - `22` — Vorstudien Verfahren

      - `31` — Vorprojekt

      - `32` — Bauprojekt

      - `33` — Bewilligungsverfahren

      - `41` — Ausschreibung

      - `51` — Ausführungsplanung

      - `52` — Ausführung

      - `53` — Inbetriebnahme

      - `61` — Betrieb

      - `62` — Überwachung'
    fr: 'Désignation de la phase partielle selon SIA 112.


      **Valeurs admises**

      - `11` — Planification stratégique

      - `21` — Études préliminaires

      - `22` — Études préliminaires, procédure

      - `31` — Avant-projet

      - `32` — Projet de construction

      - `33` — Procédure d''autorisation

      - `41` — Appel d''offres

      - `51` — Planification d''exécution

      - `52` — Exécution

      - `53` — Mise en service

      - `61` — Exploitation

      - `62` — Surveillance'
    it: 'Denominazione della sottofase secondo SIA 112.


      **Valori ammessi**

      - `11` — Pianificazione strategica

      - `21` — Studi preliminari

      - `22` — Studi preliminari, procedura

      - `31` — Avamprogetto

      - `32` — Progetto di costruzione

      - `33` — Procedura di autorizzazione

      - `41` — Gara

      - `51` — Pianificazione esecutiva

      - `52` — Esecuzione

      - `53` — Messa in servizio

      - `61` — Esercizio

      - `62` — Sorveglianza'
    en: 'Designation of the sub-phase according to SIA 112.


      **Allowed values**

      - `11` — Strategic planning

      - `21` — Preliminary studies

      - `22` — Preliminary studies, procedure

      - `31` — Preliminary design

      - `32` — Construction project

      - `33` — Permit procedure

      - `41` — Tender

      - `51` — Execution planning

      - `52` — Construction

      - `53` — Commissioning

      - `61` — Operation

      - `62` — Monitoring'
