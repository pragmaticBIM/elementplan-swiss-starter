definition:
  de: |
    Wurzel der räumlichen Struktur (IfcProject). Muss in jeder IFC-Datei vorhanden sein.

    **Modellierung**
    - Genau ein IfcProject pro Datei.
    - Name gemäss Projektbezeichnung pflegen.
  fr: |
    Racine de la structure spatiale (IfcProject). Obligatoire dans chaque fichier IFC.

    **Modélisation**
    - Exactement un IfcProject par fichier.
    - Renseigner Name selon la désignation du projet.
  it: |
    Radice della struttura spaziale (IfcProject). Obbligatorio in ogni file IFC.

    **Modellazione**
    - Esattamente un IfcProject per file.
    - Compilare Name secondo la denominazione di progetto.
  en: |
    Root of the spatial structure (IfcProject). Required in every IFC file.

    **Modelling**
    - Exactly one IfcProject per file.
    - Populate Name according to the project designation.
