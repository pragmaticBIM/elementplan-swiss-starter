id: pragmaticbim:element/project
code: PROJECT
sort_order: 1
status: active
name:
  de: Projekt
  fr: Projet
  it: Progetto
  en: Project
definition:
  de: 'Schafft den gemeinsamen organisatorischen Bezugsrahmen, damit Fachmodelle und ihre Inhalte eindeutig demselben Bauvorhaben zugeordnet werden können.


    **Beschreibung**

    - Wurzel der räumlichen Struktur; fasst alle Planungsinhalte einer IFC-Datei zusammen.

    - Muss in jeder IFC-Datei vorhanden sein.


    **Modellierungshinweis**

    - Genau ein Projekt pro IFC-Datei.

    - Name gemäss Projektbezeichnung pflegen.'
  fr: 'Établit le cadre organisationnel commun afin que les maquettes métiers et leur contenu puissent être rattachés sans ambiguïté au même projet de construction.


    **Description**

    - Racine de la structure spatiale; regroupe l''ensemble du contenu de planification d''un fichier IFC.

    - Obligatoire dans chaque fichier IFC.


    **Directives de modélisation**

    - Exactement un projet par fichier IFC.

    - Renseigner Name selon la désignation du projet.'
  it: 'Crea il quadro organizzativo comune affinché i modelli disciplinari e i loro contenuti possano essere attribuiti in modo univoco allo stesso progetto di costruzione.


    **Descrizione**

    - Radice della struttura spaziale; riunisce tutti i contenuti di pianificazione di un file IFC.

    - Obbligatorio in ogni file IFC.


    **Direttive di modellazione**

    - Esattamente un progetto per file IFC.

    - Compilare Name secondo la denominazione di progetto.'
  en: 'Establishes the shared organizational frame of reference so that discipline models and their content can be assigned unambiguously to the same construction project.


    **Description**

    - Root of the spatial structure; groups all planning content of an IFC file.

    - Required in every IFC file.


    **Modelling guidelines**

    - Exactly one project per IFC file.

    - Populate Name according to the project designation.'
