id: pragmaticbim:element/mep-schematic-tray
code: MEP-SCH-TRAY
sort_order: 62
status: active
name:
  de: Trasse (schematisch)
  fr: Chemin de câbles (schématique)
  it: Canalina (schematica)
  en: Cable tray (schematic)
definition:
  de: 'Schematische Elektrotrasse für die frühe Koordination — Medium in Reference.


    **Beschreibung**

    - Vereinfachtes Segment oder Volumen für Haupttrassen und Steigzonen.

    - Dient der Machbarkeits- und Kollisionsprüfung, nicht der Ausführungsplanung.


    **Modellierungsrichtlinie**

    - Als Volumen oder vereinfachtes Segment modellieren; Querschnitt gemäss Grobkonzept.

    - Medium über Reference setzen (z. B. EL).

    - Keine Kabel, Detailarmaturen oder Schächte modellieren.'
  fr: 'Chemin de câbles schématique pour la coordination précoce — médium dans Reference.


    **Description**

    - Segment ou volume simplifié pour tracés principaux et cages.

    - Sert à la faisabilité et aux collisions, pas à l''exécution.


    **Directives de modélisation**

    - Modéliser comme volume ou segment simplifié; section selon le concept grossier.

    - Indiquer le médium dans Reference (p. ex. EL).

    - Ne pas modéliser câbles, armatures de détail ou fourreaux.'
  it: 'Canalina schematica per il coordinamento precoce — mezzo in Reference.


    **Descrizione**

    - Segmento o volume semplificato per percorsi principali e vani.

    - Serve per fattibilità e collisioni, non per l''esecuzione.


    **Direttive di modellazione**

    - Modellare come volume o segmento semplificato; sezione secondo il concept grossolano.

    - Impostare il mezzo in Reference (p. es. EL).

    - Non modellare cavi, armature di dettaglio o canaline secondarie.'
  en: 'Schematic cable tray for early coordination — medium in Reference.


    **Description**

    - Simplified segment or volume for main trays and risers.

    - Used for feasibility and clash checking, not for execution planning.


    **Modelling guidelines**

    - Model as a volume or simplified segment; cross-section according to the sketch concept.

    - Set the medium in Reference (e.g. EL).

    - Do not model cables, detailed fittings, or secondary conduits.'
