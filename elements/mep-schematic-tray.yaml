id: pragmaticbim:element/mep-schematic-tray
code: MEP-SCH-TRAY
sort_order: 62
status: active
name:
  de: Trasse (schematisch)
  fr: Chemin de câbles (schématique)
  it: Canalina (schematica)
  en: Cable tray (schematic)
definition:
  de: 'Reserviert in der frühen Phase die Haupttrassen der Elektroanlagen und reduziert spätere Kollisionen.


    **Beschreibung**

    - Vereinfachtes Segment oder Volumen für Haupttrassen und Steigzonen.

    - Dient der Machbarkeits- und Kollisionsprüfung, nicht der Ausführungsplanung.


    **Modellierungshinweis**

    - Als Volumen oder vereinfachtes Segment modellieren; Querschnitt gemäss Grobkonzept.

    - Medium über Reference setzen (z. B. EL).

    - Keine Kabel, Detailarmaturen oder Schächte modellieren.'
  fr: 'Réserve en phase initiale les tracés principaux des installations électriques et réduit les collisions ultérieures.


    **Description**

    - Segment ou volume simplifié pour les tracés principaux et les gaines techniques.

    - Sert à vérifier la faisabilité et les collisions, pas à planifier l’exécution.


    **Directives de modélisation**

    - Le modéliser en volume ou en segment simplifié ; section selon l’esquisse.

    - Renseigner le fluide dans Reference (p. ex. EL).

    - Ne pas modéliser les câbles, les accessoires de détail ni les gaines.'
  it: 'Riserva già nella fase iniziale i tracciati principali degli impianti elettrici e riduce le interferenze successive.


    **Descrizione**

    - Segmento o volume semplificato per percorsi principali e vani.

    - Serve per fattibilità e collisioni, non per l''esecuzione.


    **Direttive di modellazione**

    - Modellare come volume o segmento semplificato; sezione secondo il concetto di massima.

    - Impostare il fluido in Reference (p. es. EL).

    - Non modellare cavi, armature di dettaglio o canaline secondarie.'
  en: 'Reserves main electrical routes in the initial phase and reduces later clashes.


    **Description**

    - Simplified segment or volume for main trays and risers.

    - Used for feasibility and clash checking, not for execution planning.


    **Modelling guidelines**

    - Model as a volume or simplified segment; cross-section according to the sketch concept.

    - Set the medium in Reference (e.g. EL).

    - Do not model cables, detailed fittings, or secondary conduits.'
