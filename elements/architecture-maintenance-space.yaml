id: pragmaticbim:element/architecture-maintenance-space
code: ARCH-MAINT-SPACE
sort_order: 64
status: active
name:
  de: Wartungsraum
  fr: Local de maintenance
  it: Locale di manutenzione
  en: Maintenance space
definition:
  de: 'Freizuhaltender Wartungsraum für den Kollisionsnachweis.


    **Beschreibung**

    - Volumen, das für Zugang und Arbeiten an Anlagen freigehalten werden muss — kein Raumobjekt.

    - Dient der Koordination und dem Nachweis, nicht der Raumplanung oder Ausführungsdetailierung.


    **Modellierungsrichtlinie**

    - Als vereinfachten Proxy-Körper modellieren; Abmessungen gemäss benötigtem Freiraum.

    - Dem zugehörigen Geschoss zuweisen; ObjectType = Wartungsraum.

    - Keine Geräte, Leitungen oder Ausbau innerhalb des Volumens modellieren.'
  fr: 'Local de maintenance à maintenir libre pour la preuve de collision.


    **Description**

    - Volume à réserver pour l''accès et les travaux sur les installations — pas un objet local.

    - Sert à la coordination et à la preuve, pas à la planification spatiale ni au détail d''exécution.


    **Directives de modélisation**

    - Modéliser comme corps proxy simplifié ; dimensions selon le dégagement requis.

    - Rattacher à l''étage concerné ; ObjectType = Wartungsraum.

    - Ne pas modéliser appareils, réseaux ou finitions à l''intérieur du volume.'
  it: 'Locale di manutenzione da mantenere libero per la prova di collisione.


    **Descrizione**

    - Volume da riservare per accesso e lavori sugli impianti — non un oggetto locale.

    - Serve al coordinamento e alla prova, non alla pianificazione spaziale o al dettaglio esecutivo.


    **Direttive di modellazione**

    - Modellare come corpo proxy semplificato; dimensioni secondo lo spazio libero necessario.

    - Assegnare al piano corrispondente; ObjectType = Wartungsraum.

    - Non modellare apparecchi, reti o finiture all''interno del volume.'
  en: 'Clear maintenance space for clash verification.


    **Description**

    - Volume that must remain clear for access and work on plant — not a space object.

    - Used for coordination and verification, not for room planning or execution detailing.


    **Modelling guidelines**

    - Model as a simplified proxy body; dimensions according to the required clearance.

    - Assign to the matching storey; ObjectType = Wartungsraum.

    - Do not model equipment, services, or finishes inside the volume.'
