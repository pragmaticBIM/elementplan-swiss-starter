id: pragmaticbim:element/architecture-opening-void
code: ARC-OPENING-VOID
sort_order: 42
status: active
name:
  de: Durchbruch / Aussparung (Architektur)
  fr: Percement / réservation (architecture)
  it: Foro / riserva (architettura)
  en: Opening / recess (architecture)
definition:
  de: 'Sichert benötigte Leitungs- und Einbauwege und verhindert ungeklärte Durchdringungen zwischen Architektur, Tragwerk und Gebäudetechnik.


    **Beschreibung**

    - Öffnung in Wand, Decke oder anderem Architekturbauteil für Leitungen, Geräte oder bauliche Anforderungen.

    - Verbindlich für Bauteile, die nur im Architekturmodell geführt werden (nichttragende Innenwände, architektonisches Mauerwerk).

    - In Betonbauteilen nur informativ im Architekturmodell; verbindliche Führung über TGA-Aussparungsanforderung und Tragwerksöffnung.


    **Modellierungshinweis**

    - Als Öffnungselement modellieren und dem durchbrochenen Architekturbauteil zuordnen.

    - Durchbruch durchgehend als OPENING, einseitige oder nicht durchgehende Aussparung als RECESS.

    - Geschossweise und bauteilbezogen eindeutig benennen; Durchbrüche im Tragwerk nicht hier, sondern über TGA-Aussparungsanforderung und Tragwerksöffnung führen.'
  fr: 'Garantit les passages nécessaires aux réseaux et aux équipements et évite les percements non coordonnés entre architecture, structure et techniques du bâtiment.


    **Description**

    - Ouverture dans un mur, une dalle ou un autre composant architectural pour réseaux, appareils ou exigences constructives.

    - Contraignante pour les composants portés uniquement dans le modèle d''architecture (cloisons intérieures non porteuses, maçonnerie architecturale).

    - Dans les éléments en béton, uniquement à titre informatif dans le modèle d''architecture ; saisie contraignante via exigence CVC et ouverture structurelle.


    **Directives de modélisation**

    - Modéliser comme élément d''ouverture et le rattacher au composant architectural traversé.

    - Percement traversant en OPENING, réservation unilatérale ou non traversante en RECESS.

    - Nommer de façon univoque par étage et par élément ; saisir les percements dans la structure non pas ici, mais via l''exigence de réservation CVC et l''ouverture de structure.'
  it: 'Garantisce i passaggi necessari per reti e installazioni ed evita attraversamenti non coordinati tra architettura, struttura e impianti.


    **Descrizione**

    - Apertura in parete, solaio o altro componente architettonico per reti, apparecchi o requisiti costruttivi.

    - Vincolante per componenti gestiti solo nel modello di architettura (pareti interne non portanti, muratura architettonica).

    - Negli elementi in calcestruzzo solo a titolo informativo nel modello di architettura; gestione vincolante tramite richiesta impianti e apertura strutturale.


    **Direttive di modellazione**

    - Modellare come elemento di apertura e assegnarlo al componente architettonico attraversato.

    - Foro passante come OPENING, riserva unilaterale o non passante come RECESS.

    - Nominare in modo univoco per piano e per componente; non gestire qui i fori strutturali – tramite richiesta impianti e apertura strutturale.'
  en: 'Secures the required routes for services and installations and prevents uncoordinated penetrations between architecture, structure, and building services.


    **Description**

    - Void in a wall, slab, or other architectural component for services, equipment, or construction requirements.

    - Binding for components carried only in the architecture model (non-load-bearing interior walls, architectural masonry).

    - In concrete components, informative only in the architecture model; binding delivery via the MEP void request and the structural opening.


    **Modelling guidelines**

    - Model as an opening element and assign it to the voided architectural host.

    - Through opening as OPENING; one-sided or non-through recess as RECESS.

    - Name uniquely by storey and host component; do not carry structural penetrations here – use the MEP void request and the structural opening.'
