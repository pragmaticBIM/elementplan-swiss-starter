id: pragmaticbim:element/structural-edge-strip
code: STR-EDGE-STRIP
sort_order: 79
status: active
name:
  de: Randstreifen
  fr: Bande de rive
  it: Fascia di bordo
  en: Edge strip
definition:
  de: 'Schalungsrandstreifen im Schal- und Bewehrungsmodell der Tragwerksplanung.


    **Beschreibung**

    - Seitlicher Schalungsabschluss entlang Decken und anderen Betonbauteilen (verlorene oder dauerhafte Randschalung).

    - Randabschluss-Typ (z. B. Einreihig, Stellplatte, Schalenstein) für Ausführung und NPK 211.5.


    **Modellierungsrichtlinie**

    - Als vereinfachtes Volumen oder Linienbauteil entlang der Randlinie mit ObjectType `Randstreifen` modellieren.'
  fr: 'Bande de rive de coffrage dans le modèle de coffrage et d''armatures de l''ingénierie structurelle.


    **Description**

    - Terminaison de coffrage latérale le long des dalles et autres éléments en béton (coffrage de rive perdu ou permanent).

    - Type de terminaison de rive (p. ex. Einreihig, Stellplatte, Schalenstein) pour l''exécution et NPK 211.5.


    **Directives de modélisation**

    - Modéliser comme volume simplifié ou élément linéaire le long de la ligne de rive avec ObjectType `Randstreifen`.'
  it: 'Fascia di bordo di cassero nel modello di cassero e armatura dell''ingegneria strutturale.


    **Descrizione**

    - Terminazione laterale di cassero lungo solette e altri elementi in calcestruzzo (cassero di bordo a perdere o permanente).

    - Tipo di terminazione di bordo (es. Einreihig, Stellplatte, Schalenstein) per esecuzione e NPK 211.5.


    **Direttive di modellazione**

    - Modellare come volume semplificato o elemento lineare lungo la linea di bordo con ObjectType `Randstreifen`.'
  en: 'Formwork edge strip in the structural formwork and reinforcement model.


    **Description**

    - Lateral formwork termination along slabs and other concrete components (lost or permanent edge formwork).

    - Edge-termination type (e.g. Einreihig, Stellplatte, Schalenstein) for execution and NPK 211.5.


    **Modelling guidelines**

    - Model as a simplified volume or linear element along the edge line with ObjectType `Randstreifen`.'
