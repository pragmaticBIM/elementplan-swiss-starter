- name: Randabschluss
  pset: 211.5_Beton_und_Stahlbetonarbeiten
  definition:
    de: 'Ausführung des Schalungsrandabschlusses.


      **Zulässige Werte**

      - `Einreihig` — einreihige Ausführung

      - `Zweireihig` — zweireihige Ausführung

      - `Stellplatte` — Stellplatte

      - `Stellplatte mit Wasserstein` — Stellplatte mit Wasserstein

      - `Randstein` — Randstein

      - `Schalenstein` — Schalenstein'
    fr: 'Exécution de la terminaison de rive de coffrage.


      **Valeurs admises**

      - `Einreihig` — exécution sur une rangée

      - `Zweireihig` — exécution sur deux rangées

      - `Stellplatte` — dalle de rive

      - `Stellplatte mit Wasserstein` — dalle de rive avec pierre à eau

      - `Randstein` — bordure

      - `Schalenstein` — pierre de coque'
    it: 'Esecuzione della terminazione di bordo di cassero.


      **Valori ammessi**

      - `Einreihig` — esecuzione a una fila

      - `Zweireihig` — esecuzione a due file

      - `Stellplatte` — piastra di bordo

      - `Stellplatte mit Wasserstein` — piastra di bordo con pietra scolo

      - `Randstein` — cordolo

      - `Schalenstein` — pietra a scocca'
    en: 'Formwork edge-termination execution.


      **Allowed values**

      - `Einreihig` — single-row execution

      - `Zweireihig` — double-row execution

      - `Stellplatte` — edge plate

      - `Stellplatte mit Wasserstein` — edge plate with waterstone

      - `Randstein` — edge stone

      - `Schalenstein` — shell block'
