id: pragmaticbim:element/mep-downpipe
code: MEP-DOWNPIPE
sort_order: 67
status: active
name:
  de: Fallleitung
  fr: Descente
  it: Pluviale
  en: Downpipe
definition:
  de: 'Sichert die Dach- und Balkonentwässerung, indem Leitungsweg, Anschlüsse und Deckendurchdringungen abgestimmt werden.


    **Beschreibung**

    - Vertikale Entwässerungsleitung von Flachdach und Balkonen.

    - Dient der Koordination in Steigzonen und an Durchführungen.


    **Modellierungshinweis**

    - Von Entwässerungspunkten auf Dach und Balkon bis zur Abwassersammelleitung führen.

    - Reference auf `FL` setzen. Ab dem Bauprojekt verwenden.

    - Balkon-Fallleitungen gesondert modellieren und zuordnen.

    - Keine Armaturen, Schächte oder Anschlussdetails modellieren.'
  fr: 'Permet d’évacuer les toitures et les balcons en coordonnant le tracé, les raccordements et les traversées de dalle.


    **Description**

    - Canalisation verticale d’évacuation depuis la toiture plate et les balcons.

    - Sert à coordonner les gaines techniques et les traversées.


    **Directives de modélisation**

    - La tracer depuis les points d’évacuation en toiture et sur les balcons jusqu’au collecteur.

    - Renseigner Reference avec `FL`. L’employer dès le projet de construction.

    - Modéliser à part les descentes de balcon et les attribuer.

    - Ne pas modéliser les accessoires, les regards ni les détails de raccordement.'
  it: 'Garantisce lo smaltimento delle acque di tetti e balconi coordinando il tracciato, gli allacciamenti e gli attraversamenti delle solette.


    **Descrizione**

    - Condotta verticale di drenaggio da tetto piano e balconi.

    - Serve al coordinamento in vani e agli attraversamenti.


    **Direttive di modellazione**

    - Condurre dai punti di scarico su tetto e balcone fino al collettore di acque reflue.

    - Impostare Reference su `FL`. Usare dal progetto di costruzione.

    - Modellare separatamente i pluviali dei balconi e identificarli.

    - Non modellare armature, pozzetti o dettagli di collegamento.'
  en: 'Secures roof and balcony drainage by coordinating routes, connections, and slab penetrations.


    **Description**

    - Vertical drainage pipe from flat roof and balconies.

    - Used for coordination in risers and at penetrations.


    **Modelling guidelines**

    - Route from drainage points on roof and balcony to the wastewater collector.

    - Set Reference to `FL`. Use from the construction project onward.

    - Model balcony downpipes separately and identify them.

    - Do not model fittings, manholes, or connection details.'
