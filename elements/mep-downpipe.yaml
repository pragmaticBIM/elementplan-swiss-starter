id: pragmaticbim:element/mep-downpipe
code: MEP-DOWNPIPE
sort_order: 67
status: active
name:
  de: Fallleitung
  fr: Descente
  it: Pluviale
  en: Downpipe
definition:
  de: 'Fallleitung von Dach- und Balkonentwässerung bis zur Sammelleitung.


    **Beschreibung**

    - Vertikale Entwässerungsleitung von Flachdach und Balkonen.

    - Dient der Koordination in Steigzonen und an Durchführungen.


    **Modellierungsrichtlinie**

    - Von Entwässerungspunkten auf Dach und Balkon bis zur Abwassersammelleitung führen.

    - Balkon-Fallleitungen gesondert modellieren und zuordnen.

    - Keine Armaturen, Schächte oder Anschlussdetails modellieren.'
  fr: 'Descente depuis le drainage de toiture et de balcons jusqu''au collecteur principal.


    **Description**

    - Canalisation verticale d''évacuation depuis toiture plate et balcons.

    - Sert à la coordination dans les cages et aux traversées.


    **Directives de modélisation**

    - Mener des points d''évacuation sur toiture et balcon jusqu''au collecteur d''eaux usées.

    - Modéliser séparément les descentes de balcons et les identifier.

    - Ne pas modéliser armatures, regards ou raccords de détail.'
  it: 'Pluviale dal drenaggio di tetto e balconi fino al collettore principale.


    **Descrizione**

    - Condotta verticale di drenaggio da tetto piano e balconi.

    - Serve al coordinamento in vani e agli attraversamenti.


    **Direttive di modellazione**

    - Condurre dai punti di scarico su tetto e balcone fino al collettore di acque reflue.

    - Modellare separatamente i pluviali dei balconi e identificarli.

    - Non modellare armature, pozzetti o dettagli di collegamento.'
  en: 'Downpipe from roof and balcony drainage to the main collector.


    **Description**

    - Vertical drainage pipe from flat roof and balconies.

    - Used for coordination in risers and at penetrations.


    **Modelling guidelines**

    - Route from drainage points on roof and balcony to the wastewater collector.

    - Model balcony downpipes separately and identify them.

    - Do not model fittings, manholes, or connection details.'
