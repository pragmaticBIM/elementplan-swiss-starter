id: pragmaticbim:element/mep-schematic-duct
code: MEP-SCH-DUCT
sort_order: 61
status: active
name:
  de: Luftleitung (schematisch)
  fr: Conduit d'air (schématique)
  it: Canale aria (schematico)
  en: Duct (schematic)
definition:
  de: 'Schematische Luftleitung für die frühe Koordination — Medium in Reference.


    **Beschreibung**

    - Vereinfachtes Segment oder Volumen für Hauptkanalführungen (Zu-/Abluft u. a.).

    - Dient der Machbarkeits- und Kollisionsprüfung, nicht der Ausführungsplanung.


    **Modellierungsrichtlinie**

    - Als Volumen oder vereinfachtes Segment modellieren; Querschnitt gemäss Grobkonzept.

    - Medium über Reference setzen (z. B. ZU, AB).

    - Keine Armaturen, Brandschutzklappen oder Anschlussdetails modellieren.'
  fr: 'Conduit d''air schématique pour la coordination précoce — médium dans Reference.


    **Description**

    - Segment ou volume simplifié pour tracés principaux (soufflage / reprise, etc.).

    - Sert à la faisabilité et aux collisions, pas à l''exécution.


    **Directives de modélisation**

    - Modéliser comme volume ou segment simplifié; section selon le concept grossier.

    - Indiquer le médium dans Reference (p. ex. ZU, AB).

    - Ne pas modéliser armatures, clapets coupe-feu ou raccords de détail.'
  it: 'Canale aria schematico per il coordinamento precoce — mezzo in Reference.


    **Descrizione**

    - Segmento o volume semplificato per percorsi principali (immissione / ripresa, ecc.).

    - Serve per fattibilità e collisioni, non per l''esecuzione.


    **Direttive di modellazione**

    - Modellare come volume o segmento semplificato; sezione secondo il concept grossolano.

    - Impostare il mezzo in Reference (p. es. ZU, AB).

    - Non modellare armature, serrande tagliafuoco o dettagli di collegamento.'
  en: 'Schematic duct for early coordination — medium in Reference.


    **Description**

    - Simplified segment or volume for main duct routes (supply / extract, etc.).

    - Used for feasibility and clash checking, not for execution planning.


    **Modelling guidelines**

    - Model as a volume or simplified segment; cross-section according to the sketch concept.

    - Set the medium in Reference (e.g. ZU, AB).

    - Do not model fittings, fire dampers, or connection details.'
