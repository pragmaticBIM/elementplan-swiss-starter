id: pragmaticbim:element/architecture-footing
code: ARC-FOOTING
sort_order: 26
status: active
name:
  de: Fundament (Grob)
  fr: Fondation (Approximatif)
  it: Fondazione (Indicativo)
  en: Footing (Rough)
definition:
  de: 'Macht Platzbedarf und Lage der Lastabtragung in den Baugrund früh prüfbar und verhindert Konflikte mit Untergeschoss, Leitungen und Baugrube.


    **Beschreibung**

    - Grob dimensionierte Fundamentgeometrie gemäss Tragwerkskonzept.

    - Dient der Koordination zwischen Architektur und Tragwerksplanung, nicht der Ausführungsplanung.


    **Modellierungshinweis**

    - Als vereinfachtes Volumen mit den abgestimmten Abmessungen modellieren.

    - An Bauteilgrenzen, bei Stärkenänderungen und am Übergang zwischen innen und aussen teilen.

    - Keine Bewehrung, Gründungsdetails oder Schichtaufbauten modellieren.

    - In der Architekturkonzeption die Abmessungen der konzeptionellen Tragwerksbauteile mit dem Tragwerksplaner abstimmen und im Architekturmodell übernehmen.

    - Geeignetes Material im Autorensystem verwenden und exportieren.'
  fr: 'Permet de vérifier tôt l''emprise et la position de la transmission des charges au terrain et évite les conflits avec le sous-sol, les conduites et la fouille.


    **Description**

    - Géométrie de fondation dimensionnée grossièrement selon le concept structurel.

    - Sert à la coordination entre architecture et ingénierie structurelle, pas à l''exécution.


    **Directives de modélisation**

    - Modéliser comme volume simplifié avec les dimensions convenues.

    - Diviser aux limites de composants.

    - Ne pas modéliser armatures, détails de fondation ou couches.

    - Lors de la conception architecturale, coordonner avec l''ingénieur civil les dimensions des éléments porteurs conceptuels et les reprendre dans le modèle d''architecture.

    - Utiliser et exporter le matériau approprié depuis le logiciel auteur.'
  it: 'Consente di verificare tempestivamente l’ingombro e la posizione della trasmissione dei carichi al terreno ed evita conflitti con il piano interrato, le condotte e lo scavo.


    **Descrizione**

    - Geometria di fondazione dimensionata grossolanamente secondo il concept strutturale.

    - Serve per il coordinamento tra architettura e ingegneria strutturale, non per l''esecuzione.


    **Direttive di modellazione**

    - Modellare come volume semplificato con le dimensioni concordate.

    - Suddividere ai confini dei componenti.

    - Non modellare armature, dettagli di fondazione o stratigrafie.

    - Durante la concezione architettonica, coordinare con l''ingegnere strutturista le dimensioni degli elementi strutturali concettuali e recepirle nel modello architettonico.

    - Usare ed esportare il materiale appropriato dal software di modellazione.'
  en: 'Makes the space and location required to transfer loads into the ground verifiable early and prevents conflicts with basements, services, and excavation.


    **Description**

    - Coarsely dimensioned footing geometry according to the structural concept.

    - Used for coordination between architecture and structural engineering, not for execution planning.


    **Modelling guidelines**

    - Model as a simplified volume using the coordinated dimensions.

    - Split at component boundaries.

    - Do not model reinforcement, foundation details, or layer build-ups.

    - During conceptual architectural design, coordinate the dimensions of conceptual structural components with the structural engineer and adopt them in the architecture model.

    - Use and export the appropriate material from the authoring system.'
