      **Valori ammessi**

      - Vedere l''elenco valori [Classe di prodotto](https://schema.pragmaticbim.ch/classification/foundation-product.html).'
    en: 'Product class for cost and tender assignment. It may be assigned manually; for consistent tender data, it should preferably be derived from component properties through deterministic automation
