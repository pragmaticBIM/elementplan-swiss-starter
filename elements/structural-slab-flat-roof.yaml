id: pragmaticbim:element/structural-slab-flat-roof
code: STR-SLAB-ROOF
sort_order: 75
status: active
name:
  de: Flachdach detailiert
  fr: Toiture plate détaillée
  it: Tetto piano dettagliato
  en: Flat roof detailed
definition:
  de: 'Tragwerkselement für Flachdächer im Tragwerksmodell.


    **Beschreibung**

    - Ausführungsgenaue Geometrie gemäss Tragwerksplanung.

    - Massgebendes Fachmodell für Ausführungsplanung, Mengenermittlung und Koordination.


    **Modellierungsrichtlinie**

    - So modellieren, wie gebaut wird; an Bauteilgrenzen teilen.

    - Zuordnung zu Dach und Tragwerksteil einhalten.

    - IfcMaterial verwenden, das der tatsächlichen Materialklasse entspricht.'
  fr: 'Élément porteur pour toitures plates dans le modèle structurel.


    **Description**

    - Géométrie d''exécution selon le plan structurel.

    - Maquette fédérée de référence pour l''exécution, les quantités et la coordination.


    **Directives de modélisation**

    - Modéliser tel qu''il sera construit ; diviser aux limites de composants.

    - Respecter l''attribution à la toiture et à la partie porteuse.

    - Utiliser un IfcMaterial correspondant à la classe de matériau réelle.'
  it: 'Elemento strutturale per tetti piani nel modello strutturale.


    **Descrizione**

    - Geometria esecutiva secondo la pianificazione strutturale.

    - Modello federato di riferimento per esecuzione, quantità e coordinamento.


    **Direttive di modellazione**

    - Modellare come sarà costruito; suddividere ai confini dei componenti.

    - Rispettare l''assegnazione a copertura e parte strutturale.

    - Usare un IfcMaterial corrispondente alla classe di materiale effettiva.'
  en: 'Structural element for flat roofs in the structural model.


    **Description**

    - Execution-accurate geometry according to the structural design.

    - Authoritative federated model for execution planning, quantities, and coordination.


    **Modelling guidelines**

    - Model as it will be built; split at component boundaries.

    - Maintain assignment to roof and structural part.

    - Use an IfcMaterial that corresponds to the actual material class.'
