id: pragmaticbim:element/architecture-beam
code: ARC-BEAM
sort_order: 56
status: active
name:
  de: Unterzug / Überzug (Grob)
  fr: Poutre / solive (Approximatif)
  it: Trave / travetto (Indicativo)
  en: Beam / girder (Rough)
definition:
  de: 'Grobe Dimensionen gemäss Tragwerksplanung für Träger, Unterzüge und Überzüge in Projektierung und Bewilligungsverfahren.


    **Beschreibung**

    - Grob dimensionierte Trägergeometrie gemäss Tragwerkskonzept.

    - Dient der Koordination zwischen Architektur und Tragwerksplanung, nicht der Ausführungsplanung.


    **Modellierungsrichtlinie**

    - Als vereinfachtes Volumen modellieren; Abmessungen gemäss Tragwerksentwurf.

    - Keine Bewehrung, Einbauteile oder Anschlussdetails modellieren.

    - Früh: Konzept über Skizzen als Tragwerksskizze im ARC-Modell; Sperrzonen vom Tragwerksplaner prüfen.

    - Später: Dieselben Bauteile mit Reference auch im Tragwerksmodell abstimmen.

    - IfcMaterial verwenden, das der tatsächlichen Materialklasse entspricht.'
  fr: 'Dimensions approximatives selon la conception structurale pour poutres et solives en phases de projet et de procédure d''autorisation.


    **Description**

    - Géométrie de poutre dimensionnée grossièrement selon le concept structurel.

    - Sert à la coordination entre architecture et ingénierie structurelle, pas à l''exécution.


    **Directives de modélisation**

    - Modéliser comme volume simplifié ; dimensions selon l''esquisse structurelle.

    - Ne pas modéliser armatures, inserts ou raccords de détail.

    - Tôt : concept par croquis comme esquisse porteuse dans le modèle d''architecture ; vérifier les zones d''exclusion de l''ingénieur structure.

    - Plus tard : harmoniser les mêmes éléments avec Reference dans le modèle structurel.

    - Utiliser un IfcMaterial correspondant à la classe de matériau réelle.'
  it: 'Dimensioni indicative secondo la progettazione strutturale per travi e travetti nelle fasi di progettazione e procedura di autorizzazione.


    **Descrizione**

    - Geometria di trave dimensionata grossolanamente secondo il concept strutturale.

    - Serve per il coordinamento tra architettura e ingegneria strutturale, non per l''esecuzione.


    **Direttive di modellazione**

    - Modellare come volume semplificato; dimensioni secondo lo schizzo strutturale.

    - Non modellare armature, inserti o giunti di dettaglio.

    - Presto: concept tramite schizzi come schizzo strutturale nel modello di architettura; verificare le zone di esclusione dell''ingegnere strutturista.

    - Più tardi: allineare gli stessi elementi con Reference anche nel modello strutturale.

    - Usare un IfcMaterial corrispondente alla classe di materiale effettiva.'
  en: 'Rough dimensions according to structural engineering for beams and girders in design development and permitting stages.


    **Description**

    - Coarsely dimensioned beam geometry according to the structural concept.

    - Used for coordination between architecture and structural engineering, not for execution planning.


    **Modelling guidelines**

    - Model as a simplified volume; dimensions according to the structural sketch.

    - Do not model reinforcement, inserts, or detail connections.

    - Early: concept via sketches as structural sketch in the architecture model; verify exclusion zones from the structural engineer.

    - Later: align the same components with Reference in the structural model as well.

    - Use an IfcMaterial that corresponds to the actual material class.'
