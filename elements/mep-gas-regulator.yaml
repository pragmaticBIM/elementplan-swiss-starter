    de: 'Art des Geräts bzw. Terminals.


      **Zulässige Werte**

      - `GASMETER` — Gaszähler / Regler

      - `ENERGYMETER` — Energiezähler

      - `WATERMETER` — Wasserzähler

      - `OILMETER` — Ölzähler'
    fr: 'Type d''appareil ou de terminal.


      **Valeurs admises**

      - `GASMETER` — compteur/régulateur gaz

      - `ENERGYMETER` — compteur d''énergie

      - `WATERMETER` — compteur d''eau

      - `OILMETER` — compteur d''huile'
    it: 'Tipo di apparecchio o terminale.


      **Valori ammessi**

      - `GASMETER` — contatore/regolatore gas

      - `ENERGYMETER` — contatore energia

      - `WATERMETER` — contatore acqua

      - `OILMETER` — contatore olio'
    en: 'Kind of equipment or terminal.


      **Allowed values**

      - `GASMETER` — gas meter

      - `ENERGYMETER` — energy meter

      - `WATERMETER` — water meter

      - `OILMETER` — oil meter'
