id: pragmaticbim:element/mep-gas-regulator
code: MEP-GAS-REG
sort_order: 89
status: active
name:
  de: Gasdruckregler
  fr: Régulateur de gaz
  it: Regolatore gas
  en: Gas pressure regulator
definition:
  de: '**Beschreibung**

    - Station zur Druckregelung oder Messung von Gas.

    - Gasdruckregel- oder Messstation.


    **Modellierungsrichtlinie**

    - Als Geräteobjekt mit Abmessungen und Lage modellieren.

    - Dem zugehörigen Geschoss und dem System zuweisen.'
  fr: '**Description**

    - Station de régulation ou de mesure de gaz.

    - Station de régulation/mesure gaz.


    **Directives de modélisation**

    - Modéliser comme appareil avec dimensions et position.

    - Rattacher à l''étage et à la zone technique ou d''usage.'
  it: '**Descrizione**

    - Stazione di regolazione o misura del gas.

    - Stazione regolazione/misura gas.


    **Direttive di modellazione**

    - Modellare come apparecchio con dimensioni e posizione.

    - Assegnare al piano e alla zona tecnica o d''uso.'
  en: '**Description**

    - Station for gas pressure regulation or metering.

    - Gas pressure regulation or metering station.


    **Modelling guidelines**

    - Model as an equipment object with size and location.

    - Assign to the matching storey and technical or use zone.'
