- name: ProductClass
  pset: ePset_Cost
  definition:
    de: 'Produktklasse für Kosten- und Ausschreibungszuordnung. Die Zuordnung kann manuell erfolgen; für konsistente Ausschreibungsdaten sollte sie regelbasiert automatisiert oder KI-unterstützt aus den
      Bauteileigenschaften abgeleitet werden.


      **Zulässige Werte**

      - Siehe Werteliste [Produktklasse](https://schema.pragmaticbim.ch/classification/railing-product.html).'
    fr: 'Classe de produit pour le rattachement aux coûts et à l''appel d''offres. L''attribution peut être manuelle ; pour garantir des données d''appel d''offres cohérentes, elle devrait être déduite
      des propriétés de l''élément par des règles automatisées ou avec l''aide de l''IA.


      **Valeurs admises**

      - Voir la liste de valeurs [Classe de produit](https://schema.pragmaticbim.ch/classification/railing-product.html).'
    it: 'Classe di prodotto per l''attribuzione a costi e gara. L''attribuzione può essere manuale; per garantire dati di gara coerenti, dovrebbe essere ricavata dalle proprietà del componente mediante
      regole automatizzate o con il supporto dell''IA.


      **Valori ammessi**

      - Vedere l''elenco valori [Classe di prodotto](https://schema.pragmaticbim.ch/classification/railing-product.html).'
    en: 'Product class for cost and tender assignment. It may be assigned manually; for consistent tender data, it should preferably be derived from component properties through deterministic automation
      or AI-assisted mapping.


      **Allowed values**

      - See the [Product class](https://schema.pragmaticbim.ch/classification/railing-product.html) value list.'
  datatype: IfcLabel
