id: pragmaticbim:element/architecture-railing
code: ARC-RAILING
sort_order: 33
status: active
name:
  de: Absturzsicherung / Geländer
  fr: Protection contre les chutes / garde-corps
  it: Protezione anticaduta / parapetto
  en: Fall protection / railing
definition:
  de: 'Vereinfachte Geometrie für die räumliche Planung und Beurteilung von permanenten und temporären Absturzsicherungen.


    **Beschreibung**

    - Geländer und andere lineare Absturzsicherungen an Decken-, Balkon-, Dach-, Podest- und Treppenkanten.

    - Dient der Festlegung von Lage und Abmessungen sowie der Visualisierung von Optionen und Zwischenbauzuständen, nicht der konstruktiven Detailplanung.


    **Modellierungshinweis**

    - Als vereinfachtes lineares Volumen mit abgestimmter Lage, Länge und Höhe modellieren.

    - Temporäre Absturzsicherungen mit dem Status `TEMPORARY` kennzeichnen und dem betreffenden Geschoss zuordnen.

    - Pfosten, Füllungen, Anschlüsse und Befestigungen nicht ausmodellieren; dafür bleiben Detail-, Werkstatt- oder Montagepläne beziehungsweise ein Unternehmermodell führend.'
  fr: 'Géométrie simplifiée pour l''étude spatiale et l''évaluation des protections permanentes et temporaires contre les chutes.


    **Description**

    - Garde-corps et autres protections linéaires contre les chutes aux bords de dalles, balcons, toitures, paliers et escaliers.

    - Sert à définir l''emplacement et les dimensions ainsi qu''à visualiser des variantes et des états intermédiaires, et non à étudier les détails constructifs.


    **Directives de modélisation**

    - Modéliser un volume linéaire simplifié avec emplacement, longueur et hauteur convenus.

    - Identifier les protections temporaires avec le statut `TEMPORARY` et les rattacher à l''étage concerné.

    - Ne pas modéliser les montants, remplissages, raccords et fixations; les plans de détail, d''atelier ou de montage, ou la maquette de l''entrepreneur, restent déterminants à cet effet.'
  it: 'Geometria semplificata per la progettazione spaziale e la valutazione delle protezioni anticaduta permanenti e temporanee.


    **Descrizione**

    - Parapetti e altre protezioni anticaduta lineari lungo i bordi di solai, balconi, coperture, pianerottoli e scale.

    - Serve a definire posizione e dimensioni e a visualizzare varianti e stati intermedi, non alla progettazione dei dettagli costruttivi.


    **Direttive di modellazione**

    - Modellare un volume lineare semplificato con posizione, lunghezza e altezza concordate.

    - Contrassegnare le protezioni temporanee con lo stato `TEMPORARY` e assegnarle al piano interessato.

    - Non modellare montanti, tamponamenti, raccordi e fissaggi; a tale scopo restano determinanti i piani di dettaglio, d''officina o di montaggio oppure il modello dell''impresa.'
  en: 'Simplified geometry for spatial planning and assessment of permanent and temporary fall protection.


    **Description**

    - Railings and other linear fall protection at slab, balcony, roof, landing, and stair edges.

    - Defines location and dimensions and visualizes options and intermediate states; it is not intended for construction detailing.


    **Modelling guidelines**

    - Model as a simplified linear volume with coordinated location, length, and height.

    - Mark temporary fall protection with status `TEMPORARY` and assign it to the relevant storey.

    - Do not model posts, infill, connections, or fixings; detail, shop, or installation drawings, or a contractor model, remain authoritative for these.'
