- name: PredefinedType
  pset: null
  definition:
    de: 'Art der Absturzsicherung.


      **Zulässige Werte**

      - `BALUSTRADE` — Geländer an Decken-, Balkon- oder Dachkanten

      - `GUARDRAIL` — Absturzsicherung an Treppen, Rampen oder Podesten

      - `HANDRAIL` — Handlauf

      - `USERDEFINED` — benutzerdefinierte Absturzsicherung

      - `NOTDEFINED` — nicht näher bestimmte Absturzsicherung'
    fr: 'Type de protection contre les chutes.


      **Valeurs admises**

      - `BALUSTRADE` — garde-corps au bord d''une dalle, d''un balcon ou d''une toiture

      - `GUARDRAIL` — protection contre les chutes le long d''un escalier, d''une rampe ou d''un palier

      - `HANDRAIL` — main courante

      - `USERDEFINED` — protection contre les chutes définie par l''utilisateur

      - `NOTDEFINED` — protection contre les chutes non précisée'
    it: 'Tipo di protezione anticaduta.


      **Valori ammessi**

      - `BALUSTRADE` — parapetto lungo il bordo di un solaio, balcone o copertura

      - `GUARDRAIL` — protezione anticaduta lungo scale, rampe o pianerottoli

      - `HANDRAIL` — corrimano

      - `USERDEFINED` — protezione anticaduta definita dall''utente

      - `NOTDEFINED` — protezione anticaduta non specificata'
    en: 'Type of fall protection.


      **Allowed values**

      - `BALUSTRADE` — railing at a slab, balcony, or roof edge

      - `GUARDRAIL` — fall protection along a stair, ramp, or landing

      - `HANDRAIL` — handrail

      - `USERDEFINED` — user-defined fall protection

      - `NOTDEFINED` — unspecified fall protection'
  datatype: IfcLabel
