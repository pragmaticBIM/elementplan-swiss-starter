name:
  de: Nichttragende Innenwand
  fr: Cloison intérieure non porteuse
  it: Parete interna non portante
  en: Non-load-bearing interior wall
definition:
  de: 'Nichttragende Innenwand zur Raumtrennung — Grundlage für Brandschutz- und Schallschutzangaben.


    **Beschreibung**

    - Nichttragende Trennwand zwischen Innenräumen.

    - Dient der Koordination, Brandschutz- und Schallschutznachweisen sowie der Bauteilkennzeichnung.


    **Modellierungsrichtlinie**

    - Geschossweise modellieren; an Bauteil- und Geschossgrenzen teilen.

    - IsExternal=FALSE und LoadBearing=FALSE setzen.

    - IfcMaterial verwenden, das der tatsächlichen Materialklasse entspricht.'
  fr: 'Cloison intérieure non porteuse pour la séparation des locaux — base pour les indications de protection incendie et acoustique.


    **Description**

    - Cloison non porteuse entre locaux intérieurs.

    - Sert à la coordination, aux justifications incendie et acoustique et au marquage des composants.


    **Directives de modélisation**

    - Modéliser par étage ; diviser aux limites de composants et d''étages.

    - Définir IsExternal=FALSE et LoadBearing=FALSE.

    - Utiliser un IfcMaterial correspondant à la classe de matériau réelle.'
  it: 'Parete interna non portante per la separazione dei locali — base per le indicazioni di protezione antincendio e acustica.


    **Descrizione**

    - Parete divisoria non portante tra locali interni.

    - Serve per coordinamento, verifiche antincendio e acustiche e marcatura dei componenti.


    **Direttive di modellazione**

    - Modellare per piano; suddividere ai confini di componenti e piani.

    - Impostare IsExternal=FALSE e LoadBearing=FALSE.

    - Usare un IfcMaterial corrispondente alla classe di materiale effettiva.'
  en: 'Non-load-bearing interior wall for room separation — basis for fire and acoustic performance data.


    **Description**

    - Non-load-bearing partition between interior spaces.

    - Used for coordination, fire and acoustic verification, and component identification.


    **Modelling guidelines**

    - Model storey by storey; split at component and storey boundaries.

    - Set IsExternal=FALSE and LoadBearing=FALSE.

    - Use an IfcMaterial that corresponds to the actual material class.'
