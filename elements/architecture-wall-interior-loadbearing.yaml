      - `Accessible` — frei zugänglich ohne Zusatzmassnahmen

      - `PartialNoDamage` — zugänglich mit Massnahmen ohne Schaden

      - `PartialWithRepairableDamage` — zugänglich mit vollständig reparierbarem Schaden

