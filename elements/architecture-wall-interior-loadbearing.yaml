id: pragmaticbim:element/architecture-wall-interior-loadbearing
code: ARC-WALL-INT-LB
sort_order: 28
status: active
name:
  de: Innenwand tragend
  fr: Mur intérieur porteur
  it: Parete interna portante
  en: Load-bearing interior wall
definition:
  de: 'Macht Lastabtragung und Raumabschluss früh gemeinsam prüfbar und schafft eine verlässliche Grundlage für Tragwerks-, Brand- und Schallschutzkoordination.


    **Beschreibung**

    - Tragende Wand zwischen Innenräumen gemäss Tragwerkskonzept.

    - Dient der Koordination mit der Tragwerksplanung, Brandschutz- und Schallschutznachweisen sowie der Bauteilkennzeichnung.


    **Modellierungshinweis**

    - Geschossweise modellieren; an Bauteil- und Geschossgrenzen teilen.

    - IsExternal=FALSE und LoadBearing=TRUE setzen.

    - In der Architekturkonzeption die Abmessungen der konzeptionellen Tragwerksbauteile mit dem Tragwerksplaner abstimmen und im Architekturmodell übernehmen.

    - Geeignetes Material im Autorensystem verwenden und exportieren.'
  fr: 'Permet de vérifier tôt conjointement la reprise des charges et la séparation des locaux et fournit une base fiable pour la coordination de la structure, de la protection incendie et de l''acoustique.


    **Description**

    - Mur porteur entre locaux intérieurs selon le concept structurel.

    - Sert à la coordination avec l''ingénierie structurelle, aux justifications incendie et acoustique et au marquage des composants.


    **Directives de modélisation**

    - Modéliser par étage ; diviser aux limites de composants et d''étages.

    - Définir IsExternal=FALSE et LoadBearing=TRUE.

    - Lors de la conception architecturale, coordonner avec l''ingénieur civil les dimensions des éléments porteurs conceptuels et les reprendre dans le modèle d''architecture.

    - Utiliser et exporter le matériau approprié depuis le logiciel auteur.'
  it: 'Consente di verificare tempestivamente insieme la trasmissione dei carichi e la separazione dei locali e offre una base affidabile per il coordinamento strutturale, antincendio e acustico.


    **Descrizione**

    - Parete portante tra locali interni secondo il concept strutturale.

    - Serve per il coordinamento con l''ingegneria strutturale, le verifiche antincendio e acustiche e la marcatura dei componenti.


    **Direttive di modellazione**

    - Modellare per piano; suddividere ai confini di componenti e piani.

    - Impostare IsExternal=FALSE e LoadBearing=TRUE.

    - Durante la concezione architettonica, coordinare con l''ingegnere strutturista le dimensioni degli elementi strutturali concettuali e recepirle nel modello architettonico.

    - Usare ed esportare il materiale appropriato dal software di modellazione.'
  en: 'Makes load transfer and space separation jointly verifiable early on and provides a reliable basis for structural, fire, and acoustic coordination.


    **Description**

    - Load-bearing wall between interior spaces according to the structural concept.

    - Used for coordination with structural engineering, fire and acoustic verification, and component identification.


    **Modelling guidelines**

    - Model storey by storey; split at component and storey boundaries.

    - Set IsExternal=FALSE and LoadBearing=TRUE.

    - During conceptual architectural design, coordinate the dimensions of conceptual structural components with the structural engineer and adopt them in the architecture model.

    - Use and export the appropriate material from the authoring system.'
