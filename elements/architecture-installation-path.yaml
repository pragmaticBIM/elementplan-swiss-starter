id: pragmaticbim:element/architecture-installation-path
code: ARC-INSTALL-PATH
sort_order: 72
status: active
name:
  de: Einbringweg
  fr: Voie d'apport
  it: Percorso di trasporto
  en: Installation access path
definition:
  de: 'Sichert, dass grosse Geräte ohne Kollisionen bis an ihren Einbauort transportiert werden können.


    **Beschreibung**

    - Volumen, das für den Transport und die Einbringung grosser Geräte oder Bauteile freigehalten werden muss.

    - Dient der Koordination und dem Nachweis, nicht der Ausführungsplanung einzelner Bauteile.


    **Modellierungshinweis**

    - Als vereinfachten Proxy-Körper modellieren; Abmessungen gemäss benötigtem Freiraum.

    - Dem zugehörigen Geschoss zuweisen; ObjectType = Einbringweg.

    - Keine Bauteile, Geräte oder Ausbau innerhalb des Volumens modellieren.'
  fr: 'Garantit que les grands équipements peuvent être acheminés jusqu''à leur lieu de montage sans collision.


    **Description**

    - Volume à réserver pour le transport et l''apport de grands appareils ou éléments.

    - Sert à la coordination et à la preuve, pas à l''exécution de composants individuels.


    **Directives de modélisation**

    - Modéliser comme corps proxy simplifié ; dimensions selon le dégagement requis.

    - Rattacher à l''étage concerné ; ObjectType = Einbringweg.

    - Ne pas modéliser éléments, appareils ou finitions à l''intérieur du volume.'
  it: 'Garantisce che le grandi apparecchiature possano essere trasportate fino al luogo di montaggio senza collisioni.


    **Descrizione**

    - Volume da riservare per il trasporto e l''introduzione di grandi apparecchi o componenti.

    - Serve al coordinamento e alla prova, non all''esecuzione di singoli componenti.


    **Direttive di modellazione**

    - Modellare come corpo proxy semplificato; dimensioni secondo lo spazio libero necessario.

    - Assegnare al piano corrispondente; ObjectType = Einbringweg.

    - Non modellare componenti, apparecchi o finiture all''interno del volume.'
  en: 'Ensures large equipment can be transported to its installation location without clashes.


    **Description**

    - Volume that must remain clear for transporting and bringing in large equipment or components.

    - Used for coordination and verification, not for detailing individual building elements.


    **Modelling guidelines**

    - Model as a simplified proxy body; dimensions according to the required clearance.

    - Assign to the matching storey; ObjectType = Einbringweg.

    - Do not model building elements, equipment, or finishes inside the volume.'
