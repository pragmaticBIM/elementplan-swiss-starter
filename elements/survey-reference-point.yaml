id: pragmaticbim:element/survey-reference-point
code: SURVEY-REF
sort_order: 5
status: active
name:
  de: Bezugspunkt
  fr: Point de référence
  it: Punto di riferimento
  en: Survey reference point
definition:
  de: 'Vermessungspunkt — verbindlicher Lage- und Höhenbezug für Planung und Ausführung.


    **Beschreibung**

    - Festpunkt bzw. Passpunkt mit Lage und Höhe im Bezugsrahmen LV95.

    - Mindestens drei Bezugspunkte bilden den gemeinsamen räumlichen Bezug aller Fachmodelle.


    **Modellierungsrichtlinie**

    - Als vereinfachten Punkt oder Marker modellieren; Position und Höhe gemäss Vermessung in LV95.

    - Dem Planungsperimeter zuweisen; Bezeichnung und Nummer gemäss Geometerlieferung.'
  fr: 'Point de levé — référence contraignante de position et d''altitude pour planification et réalisation.


    **Description**

    - Point fixe ou point de calage avec position et altitude dans le référentiel LV95.

    - Au moins trois points de référence constituent le référentiel spatial commun de toutes les maquettes métiers.


    **Directives de modélisation**

    - Modéliser comme point ou marqueur simplifié ; position et altitude selon le levé en LV95.

    - Rattacher au site ; désignation et numéro selon la livraison du géomètre.'
  it: 'Punto di rilievo — riferimento vincolante di posizione e quota per progettazione e costruzione.


    **Descrizione**

    - Punto fisso o di appoggio con posizione e quota nel sistema di riferimento LV95.

    - Almeno tre punti di riferimento costituiscono il riferimento spaziale comune di tutti i modelli disciplinari.


    **Direttive di modellazione**

    - Modellare come punto o marcatore semplificato; posizione e quota secondo il rilievo in LV95.

    - Assegnare al sito; designazione e numero secondo la consegna del geometra.'
  en: 'Survey point — binding position and height reference for planning and construction.


    **Description**

    - Control or tie point with position and height in the LV95 reference frame.

    - At least three reference points form the shared spatial reference for all discipline models.


    **Modelling guidelines**

    - Model as a simplified point or marker; position and height according to the survey in LV95.

    - Assign to the site; designation and number according to the surveyor delivery.'
