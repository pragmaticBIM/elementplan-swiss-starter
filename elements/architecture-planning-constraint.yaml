attributes:
- name: Name
  pset: null
  definition:
    de: 'Art der planungsrelevanten Rahmenbedingung.


      **Zulässige Werte**

      - `Flugschneise` — Hindernisbegrenzungsflächen / Anflugsektoren

      - `Überschwemmungsgebiet` — hochwassergefährdeter Bereich

      - `Eisenbahnkorridor` — Bahnbetriebs- und Schutzbereich

      - `Explosionsschutzgebiet` — Störfall- / Explosionsschutzperimeter

      - `Zone mit hoher Lärmbelastung` — lärmbelasteter Bereich gemäss Grundlage

      - `Grundwasserschutzzone` — Schutzzone S1–S3 o. ä.

      - `Gewässerraum` — gesetzlicher Gewässerraum / Abstand

      - `Freileitungskorridor` — Schutz- und Annäherungsbereich Freileitung

      - `Naturgefahrenzone` — weitere Naturgefahren (Hangrutsch, Steinschlag, Lawine u. a.)'
    fr: 'Nature de la condition-cadre pertinente pour la planification.


      **Valeurs admises**

      - `Couloir de vol` — surfaces de limitation d''obstacles / secteurs d''approche

      - `Zone inondable` — secteur exposé aux crues

      - `Corridor ferroviaire` — domaine d''exploitation et de protection ferroviaire

      - `Zone de protection contre les explosions` — périmètre accidents majeurs / explosions

      - `Zone à forte charge sonore` — secteur exposé au bruit selon la base

      - `Zone de protection des eaux souterraines` — zone de protection S1–S3 ou équivalent

      - `Espace réservé aux eaux` — espace réservé aux eaux / distance légale

      - `Corridor de ligne aérienne` — domaine de protection et d''approche d''une ligne aérienne

      - `Zone de dangers naturels` — autres dangers naturels (glissement, chute de pierres, avalanche, etc.)'
    it: 'Tipo di condizione quadro rilevante per la pianificazione.


      **Valori ammessi**

      - `Corridoio di volo` — superfici di limitazione degli ostacoli / settori di avvicinamento

      - `Zona alluvionale` — area esposta a piena

      - `Corridoio ferroviario` — ambito di esercizio e protezione ferroviaria

      - `Zona di protezione contro le esplosioni` — perimetro incidenti rilevanti / esplosioni

      - `Zona a elevato carico acustico` — area esposta al rumore secondo la base

      - `Zona di protezione delle acque sotterranee` — zona di protezione S1–S3 o equivalente

      - `Spazio riservato ai corsi d''acqua` — spazio riservato ai corsi d''acqua / distanza legale

      - `Corridoio di linea aerea` — ambito di protezione e avvicinamento di una linea aerea

      - `Zona di pericolo naturale` — altri pericoli naturali (frana, caduta massi, valanga, ecc.)'
    en: 'Kind of planning-relevant constraint.


      **Allowed values**

      - `Flight corridor` — obstacle limitation surfaces / approach sectors

      - `Flood zone` — area at risk of flooding

      - `Railway corridor` — railway operations and protection area

      - `Explosion protection zone` — major-accident / explosion protection perimeter

      - `High noise exposure zone` — noise-exposed area according to base data

      - `Groundwater protection zone` — protection zone S1–S3 or equivalent

      - `Watercourse space` — statutory watercourse space / setback

      - `Overhead line corridor` — protection and approach area of an overhead line

      - `Natural hazard zone` — other natural hazards (landslide, rockfall, avalanche, etc.)'
