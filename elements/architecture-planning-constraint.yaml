id: pragmaticbim:element/architecture-planning-constraint
code: ARC-CONSTRAINT
sort_order: 74
status: active
name:
  de: Rahmenbedingung
  fr: Condition-cadre
  it: Condizione quadro
  en: Planning constraint
definition:
  de: 'Macht externe Vorgaben früh räumlich prüfbar und unterstützt die Qualitätssicherung beim Abgleich des Entwurfs mit Schutz-, Gefahren- und Bewilligungsanforderungen.


    **Beschreibung**

    - Volumen, das eine verbindliche oder massgebende äussere Vorgabe abbildet (z. B. Flugschneise, Überschwemmungsgebiet, Eisenbahnkorridor).

    - Dient dem frühen Abgleich des Entwurfs mit Grundlagen und Gefahren-/Schutzräumen – nicht der rechtlichen Grenzfeststellung.


    **Modellierungshinweis**

    - Als vereinfachten Proxy-Körper modellieren; Grundriss und Höhe gemäss Grundlagen (Kataster, Fachstellen, Gutachten).

    - Dem Planungsperimeter bzw. zugehörigen Geschoss zuweisen; ObjectType = Rahmenbedingung.

    - Name = Art der Vorgabe aus der Auswahlliste.

    - Keine Gebäude, Gelände oder Ausbau innerhalb des Volumens modellieren.'
  fr: 'Rend les prescriptions externes vérifiables spatialement dès la phase initiale et facilite le contrôle qualité du projet au regard des exigences de protection, de danger et d''autorisation.


    **Description**

    - Volume représentant une prescription externe contraignante ou déterminante (p. ex. couloir de vol, zone inondable, corridor ferroviaire).

    - Sert à aligner tôt le projet avec les bases et les espaces de danger/protection – pas à fixer juridiquement les limites.


    **Directives de modélisation**

    - Modéliser comme corps proxy simplifié ; emprise et hauteur selon les bases (cadastre, services spécialisés, expertises).

    - Rattacher au périmètre de planification ou à l''étage concerné ; ObjectType = Condition-cadre.

    - Name = nature de la prescription selon la liste de choix.

    - Ne pas modéliser bâtiments, terrain ou finitions à l''intérieur du volume.'
  it: 'Rende le prescrizioni esterne verificabili spazialmente sin dalla fase iniziale e supporta il controllo qualità del progetto rispetto ai requisiti di protezione, pericolo e autorizzazione.


    **Descrizione**

    - Volume che rappresenta una prescrizione esterna vincolante o determinante (p. es. corridoio di volo, zona alluvionale, corridoio ferroviario).

    - Serve ad allineare presto il progetto con le basi e gli spazi di pericolo/protezione – non a fissare giuridicamente i confini.


    **Direttive di modellazione**

    - Modellare come corpo proxy semplificato; impronta e altezza secondo le basi (catasto, uffici specializzati, perizie).

    - Assegnare al perimetro di pianificazione o al piano corrispondente; ObjectType = Condizione quadro.

    - Name = tipo di prescrizione secondo l''elenco di scelta.

    - Non modellare edifici, terreno o finiture all''interno del volume.'
  en: 'Makes external requirements spatially verifiable from an early stage and supports quality assurance when checking the design against protection, hazard, and permitting requirements.


    **Description**

    - Volume representing a binding or governing external requirement (e.g. flight corridor, flood zone, railway corridor).

    - Used for early alignment of the design with base data and hazard/protection spaces – not for legal boundary determination.


    **Modelling guidelines**

    - Model as a simplified proxy body; footprint and height according to base data (cadastre, specialist authorities, reports).

    - Assign to the planning perimeter or matching storey; ObjectType = Planning constraint.

    - Name = kind of requirement from the value list.

    - Do not model buildings, terrain, or finishes inside the volume.'
