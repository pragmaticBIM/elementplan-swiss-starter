name:
  de: Baum
  fr: Arbre
  it: Albero
  en: Tree
definition:
  de: 'Macht Schutz-, Fäll- und Neupflanzungsentscheide räumlich prüfbar, damit Bauwerk und Aussenraumplanung den Baumbestand berücksichtigen.


    **Beschreibung**

    - Einzelner Baum im Planungsperimeter mit Krone, Stamm und Wurzelraum.

    - Dient dem Nachweis des zu erhaltenden Baumbestands und der Koordination mit Bauwerk und Aussenanlagen.


    **Modellierungshinweis**

    - Als vereinfachten Körper modellieren: Kugel für die Krone, Zylinder für den Stamm, Kugel für den Wurzelraum. Plausible Dimensionen mit dem Spezialisten abstimmen.

    - Keine Detailgeometrie von Ästen oder Blättern modellieren.'
  fr: 'Rend vérifiables dans l''espace les décisions de protection, d''abattage et de nouvelle plantation afin que le bâtiment et les aménagements extérieurs tiennent compte du patrimoine arboré.


    **Description**

    - Arbre individuel dans le périmètre de planification avec couronne, tronc et espace racinaire.

    - Sert à la preuve du peuplement arboré à conserver et à la coordination avec le bâtiment et les aménagements extérieurs.


    **Directives de modélisation**

    - Modéliser comme corps simplifié : sphère pour la couronne, cylindre pour le tronc, sphère pour l''espace racinaire. Convenir de dimensions plausibles avec le spécialiste.

    - Ne pas modéliser la géométrie détaillée des branches ou des feuilles.'
  it: 'Rende verificabili nello spazio le decisioni di protezione, abbattimento e nuova piantumazione affinché l''edificio e le sistemazioni esterne tengano conto del patrimonio arboreo.


    **Descrizione**

    - Singolo albero nel perimetro di pianificazione con chioma, tronco e spazio radicale.

    - Serve alla prova del patrimonio arboreo da conservare e al coordinamento con edificio e sistemazioni esterne.


    **Direttive di modellazione**

    - Modellare come corpo semplificato: sfera per la chioma, cilindro per il tronco, sfera per lo spazio radicale. Concordare dimensioni plausibili con lo specialista.

    - Non modellare la geometria dettagliata di rami o foglie.'
  en: 'Makes decisions on protection, removal, and new planting spatially verifiable so that the building and external works account for the tree inventory.


    **Description**

    - Individual tree in the planning perimeter with crown, trunk, and root zone.

    - Used to verify the tree stock to be preserved and to coordinate with the building and external works.


    **Modelling guidelines**

    - Model as a simplified body: sphere for the crown, cylinder for the trunk, sphere for the root zone. Agree plausible dimensions with the specialist.

    - Do not model detailed branch or leaf geometry.'
