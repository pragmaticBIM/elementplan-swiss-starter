id: pragmaticbim:element/landscape-humus
code: LAN-HUMUS
sort_order: 61
status: active
name:
  de: Humus
  fr: Humus
  it: Humus
  en: Humus
definition:
  de: 'Macht Humusmengen für die Kosten früh prüfbar, damit Abtrag, Neueinbau und Überschuss nicht erst bei der Vergabe auftauchen.


    **Beschreibung**

    - Humusschicht im Planungsperimeter, getrennt nach Bestand, Abtrag und Neueinbau.

    - Dient der Kostenbilanz. Das Zwischenlager ist ein Baustelleneinrichtungsobjekt.


    **Modellierungshinweis**

    - Als eine Schicht modellieren; nach Lage trennen.

    - Kein Haufwerk, kein Wegunterbau und keine Baugrube modellieren.'
  fr: 'Rend les quantités d''humus vérifiables tôt pour les coûts, afin que déblai, remise en place et excédent n''apparaissent pas seulement lors de l''adjudication.


    **Description**

    - Couche d''humus dans le périmètre de planification, séparée en existant, déblai et remise en place.

    - Sert au bilan des coûts. Le dépôt intermédiaire est un objet d''installation de chantier.


    **Directives de modélisation**

    - Modéliser comme une seule couche ; séparer selon la situation.

    - Ne pas modéliser de tas, de fondation de chemin ni de fouille.'
  it: 'Rende verificabili presto le quantità di humus per i costi, così che scavo, ripristino ed eccedenza non emergano solo in fase di gara.


    **Descrizione**

    - Strato di humus nel perimetro di pianificazione, distinto in esistente, scavo e ripristino.

    - Serve al bilancio dei costi. Il deposito intermedio è un oggetto di installazione di cantiere.


    **Direttive di modellazione**

    - Modellare come uno strato unico; separare secondo la situazione.

    - Non modellare cumuli, fondazione di percorsi né scavo di cantiere.'
  en: 'Makes humus quantities verifiable early for cost, so that stripping, reinstatement, and surplus do not appear only at tender.


    **Description**

    - Humus layer in the planning perimeter, split into existing, stripping, and reinstatement.

    - Used for the cost balance. The intermediate stockpile is a site-setup object.


    **Modelling guidelines**

    - Model as one layer; split by situation.

    - Do not model a heap, path subbase, or building excavation.'
