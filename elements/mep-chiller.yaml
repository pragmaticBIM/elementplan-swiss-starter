- name: PredefinedType
  pset: null
  definition:
    de: 'Art des Geräts bzw. Terminals.


      **Zulässige Werte**

      - `AIRCOOLED` — luftgekühlt

      - `WATERCOOLED` — wassergekühlt

      - `HEATRECOVERY` — mit Wärmerückgewinnung'
    fr: 'Type d''appareil ou de terminal.


      **Valeurs admises**

      - `AIRCOOLED` — refroidi à air

      - `WATERCOOLED` — refroidi à eau

      - `HEATRECOVERY` — avec récupération de chaleur'
    it: 'Tipo di apparecchio o terminale.


      **Valori ammessi**

      - `AIRCOOLED` — raffreddato ad aria

      - `WATERCOOLED` — raffreddato ad acqua

      - `HEATRECOVERY` — con recupero di calore'
    en: 'Kind of equipment or terminal.


      **Allowed values**

      - `AIRCOOLED` — air cooled

      - `WATERCOOLED` — water cooled

      - `HEATRECOVERY` — heat recovery'
