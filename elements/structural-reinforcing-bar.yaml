    fr: Numéro de liste d'acier au format étage-numéro d'étape-numéro séquentiel (0–9), p. ex. `U1-5-1`.
    it: Numero lista acciaio nel formato piano-numero tappa-numero progressivo (0–9), es. `U1-5-1`.
    en: Steel schedule number in the format storey-stage number-sequential digit (0–9), e.g. `U1-5-1`.
