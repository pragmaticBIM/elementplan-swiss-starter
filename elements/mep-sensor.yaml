    it: 'Tipo di apparecchio o terminale.


      **Valori ammessi**

      - `TEMPERATURESENSOR` — temperatura

      - `HUMIDITYSENSOR` — umidità

      - `CO2SENSOR` — CO2

      - `COSENSOR` — CO

