      - `PRESSURESENSOR` — Druck

      - `FLOWSENSOR` — Durchfluss

      - `CONTACTSENSOR` — Kontakt

      - `USERDEFINED` — benutzerdefiniert'
    fr: 'Type d''appareil ou de terminal.


      **Valeurs admises**

      - `TEMPERATURESENSOR` — température

