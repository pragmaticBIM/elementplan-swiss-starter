id: pragmaticbim:element/mep-sensor
code: MEP-SENSOR
sort_order: 109
status: active
name:
  de: Sensor
  fr: Capteur
  it: Sensore
  en: Sensor
definition:
  de: '**Beschreibung**

    - Messfühler für Gebäudeautomation oder Brandmeldung.

    - Gebäudeautomations-Sensor; Rauchmelder.


    **Modellierungsrichtlinie**

    - Als Geräteobjekt mit Abmessungen und Lage modellieren.

    - Dem zugehörigen Geschoss und dem System zuweisen.'
  fr: '**Description**

    - Capteur pour l''automatisation du bâtiment ou la détection incendie.

    - Capteur GTB; détecteur de fumée.


    **Directives de modélisation**

    - Modéliser comme appareil avec dimensions et position.

    - Rattacher à l''étage et à la zone technique ou d''usage.'
  it: '**Descrizione**

    - Sensore per automazione dell''edificio o rivelazione incendio.

    - Sensore automazione; rilevatore fumo.


    **Direttive di modellazione**

    - Modellare come apparecchio con dimensioni e posizione.

    - Assegnare al piano e alla zona tecnica o d''uso.'
  en: '**Description**

    - Sensor for building automation or fire detection.

    - BAS sensor; smoke detector.


    **Modelling guidelines**

    - Model as an equipment object with size and location.

    - Assign to the matching storey and technical or use zone.'
