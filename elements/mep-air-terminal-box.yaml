      **Valori ammessi**

      - Vedere l''elenco valori Lotto di aggiudicazione BKP — es. `211`, `221`, `244`.'
    en: 'Award package of the component by three-digit BKP code — so interfaces between contractor packages become visible.


      **Allowed values**

