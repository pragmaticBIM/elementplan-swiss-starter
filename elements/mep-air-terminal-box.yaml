- name: Status
  pset: Pset_AirTerminalBoxTypeCommon
  definition:
    de: 'Bauteilstatus für Koordination im Bestand.


      **Zulässige Werte**

      - `NEW` — Neubau

      - `EXISTING` — Bestand

      - `DEMOLISH` — Abbruch

      - `TEMPORARY` — Temporär'
    fr: 'Statut de l''élément pour la coordination dans l''existant.


      **Valeurs admises**

      - `NEW` — neuf

      - `EXISTING` — existant

      - `DEMOLISH` — à démolir

      - `TEMPORARY` — temporaire'
    it: 'Stato dell''elemento per il coordinamento sull''esistente.


      **Valori ammessi**

      - `NEW` — nuovo

      - `EXISTING` — esistente

      - `DEMOLISH` — da demolire

      - `TEMPORARY` — temporaneo'
    en: 'Element status for coordination on existing buildings.


      **Allowed values**

      - `NEW` — new

      - `EXISTING` — existing

      - `DEMOLISH` — to demolish

      - `TEMPORARY` — temporary'
