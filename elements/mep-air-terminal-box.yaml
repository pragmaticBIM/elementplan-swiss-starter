attributes:
- name: PredefinedType
  pset: null
  definition:
    de: 'Art des Geräts bzw. Terminals.


      **Zulässige Werte**

      - `CONSTANTFLOW` — Konstantvolumen

      - `VARIABLEFLOWPRESSUREDEPENDANT` — variabel, druckabhängig

      - `VARIABLEFLOWPRESSUREINDEPENDANT` — variabel, druckunabhängig'
    fr: 'Type d''appareil ou de terminal.


      **Valeurs admises**

      - `CONSTANTFLOW` — débit constant

      - `VARIABLEFLOWPRESSUREDEPENDANT` — débit variable dépendant pression

      - `VARIABLEFLOWPRESSUREINDEPENDANT` — débit variable indépendant pression'
    it: 'Tipo di apparecchio o terminale.


      **Valori ammessi**

      - `CONSTANTFLOW` — portata costante

      - `VARIABLEFLOWPRESSUREDEPENDANT` — portata variabile dipendente pressione

      - `VARIABLEFLOWPRESSUREINDEPENDANT` — portata variabile indipendente pressione'
    en: 'Kind of equipment or terminal.


      **Allowed values**

      - `CONSTANTFLOW` — constant flow

      - `VARIABLEFLOWPRESSUREDEPENDANT` — VAV pressure dependent

      - `VARIABLEFLOWPRESSUREINDEPENDANT` — VAV pressure independent'
  datatype: IfcLabel
  allowed_values: pragmaticbim:value/predefinedtype-air-terminal-box
  needed_in_phases:
