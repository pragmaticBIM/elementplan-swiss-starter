id: pragmaticbim:element/mep-air-terminal-box
code: MEP-AIR-BOX
sort_order: 98
status: active
name:
  de: Volumenstromregler
  fr: Boîte VAV / CAV
  it: Box VAV / CAV
  en: Air terminal box
definition:
  de: '**Beschreibung**

    - Geregeltes Luft-Endgerät in der Lüftungsverteilung.

    - Zu-/Abluft-Endgerät mit Regelung.


    **Modellierungsrichtlinie**

    - Als Geräteobjekt mit Abmessungen und Lage modellieren.

    - Dem zugehörigen Geschoss und dem System zuweisen.'
  fr: '**Description**

    - Terminal d''air régulé dans la distribution de ventilation.

    - Terminal d''air régulé.


    **Directives de modélisation**

    - Modéliser comme appareil avec dimensions et position.

    - Rattacher à l''étage et à la zone technique ou d''usage.'
  it: '**Descrizione**

    - Terminale aria regolato nella distribuzione di ventilazione.

    - Terminale aria regolato.


    **Direttive di modellazione**

    - Modellare come apparecchio con dimensioni e posizione.

    - Assegnare al piano e alla zona tecnica o d''uso.'
  en: '**Description**

    - Controlled air terminal in the ventilation distribution.

    - Controlled air terminal.


    **Modelling guidelines**

    - Model as an equipment object with size and location.

    - Assign to the matching storey and technical or use zone.'
needed_in_domain:
- pragmaticbim:domain/mep
