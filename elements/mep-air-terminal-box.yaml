      **Zulässige Werte**

      - `GAB` — Grundausbau (Bauherr / Vermieter)

      - `MAB_{Mietername}` — Mieterausbau, z. B. `MAB_Migros`'
    fr: 'Interface de coûts de l''élément — aménagement de base ou aménagement locataire.


      **Valeurs admises**

      - `GAB` — aménagement de base (maître d''ouvrage / bailleur)

      - `MAB_{nom du locataire}` — aménagement locataire, p. ex. `MAB_Migros`'
    it: 'Interfaccia di costo del componente — allestimento di base o allestimento locatario.


      **Valori ammessi**

      - `GAB` — allestimento di base (committente / locatore)

      - `MAB_{nome locatario}` — allestimento locatario, es. `MAB_Migros`'
    en: 'Cost interface of the component — base building or tenant fit-out.


      **Allowed values**

      - `GAB` — base building (client / landlord)

      - `MAB_{Mietername}` — tenant fit-out, e.g. `MAB_Migros`'
