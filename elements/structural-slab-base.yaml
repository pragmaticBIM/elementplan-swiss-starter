id: pragmaticbim:element/structural-slab-base
code: STR-SLAB-BASE
sort_order: 74
status: active
name:
  de: Bodenplatte detailiert
  fr: Dalle de fondation détaillée
  it: Soletta di fondazione dettagliata
  en: Base slab detailed
definition:
  de: 'Sichert die abgestimmte Planung von Lastabtragung, Abdichtung und Durchdringungen bis zur Ausführung.


    **Beschreibung**

    - Ausführungsgenaue Geometrie gemäss Tragwerksplanung.

    - Massgebendes Fachmodell für Ausführungsplanung, Mengenermittlung und Koordination.


    **Modellierungshinweis**

    - So modellieren, wie gebaut wird; an Bauteilgrenzen, bei Stärkenänderungen und am Übergang zwischen innen und aussen teilen.

    - Zuordnung zu Gründung und Tragwerksteil einhalten.

    - Geeignetes Material im Autorensystem verwenden und exportieren.'
  fr: 'Assure la coordination de la descente de charges, de l''étanchéité et des traversées jusqu''à l''exécution.


    **Description**

    - Géométrie d''exécution selon le plan structurel.

    - Maquette fédérée de référence pour l''exécution, les quantités et la coordination.


    **Directives de modélisation**

    - Modéliser tel qu''il sera construit ; diviser aux limites de composants.

    - Respecter l''attribution à la fondation et à la partie porteuse.

    - Utiliser et exporter le matériau approprié depuis le logiciel auteur.'
  it: 'Garantisce il coordinamento della trasmissione dei carichi, dell''impermeabilizzazione e degli attraversamenti fino all''esecuzione.


    **Descrizione**

    - Geometria esecutiva secondo la pianificazione strutturale.

    - Modello federato di riferimento per esecuzione, quantità e coordinamento.


    **Direttive di modellazione**

    - Modellare come sarà costruito; suddividere ai confini dei componenti.

    - Rispettare l''assegnazione a fondazione e parte strutturale.

    - Usare ed esportare il materiale appropriato dal software di modellazione.'
  en: 'Ensures coordinated planning of load transfer, waterproofing, and penetrations through to execution.


    **Description**

    - Execution-accurate geometry according to the structural design.

    - Authoritative federated model for execution planning, quantities, and coordination.


    **Modelling guidelines**

    - Model as it will be built; split at component boundaries.

    - Maintain assignment to foundation and structural part.

    - Use and export the appropriate material from the authoring system.'
