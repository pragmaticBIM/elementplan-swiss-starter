      - `P3` — béton de paroi moulée à sec (NPK K)

      - `P4` — béton de paroi moulée sous l''eau (NPK L)'
    it: 'Sorta di calcestruzzo secondo SN EN 206 per la gara NPK.


      **Valori ammessi**

      - `0` — sorta 0

      - `A` — NPK A (edilizia)

      - `B` — NPK B (edilizia)

      - `C` — NPK C (edilizia)

