name:
  de: Aussenwand
  fr: Mur extérieur
  it: Parete esterna
  en: Exterior wall
definition:
  de: 'Aussenwände bilden die Grundlage für Flächen- und Mengenermittlung, Bauphysik und Fassadenkoordination.


    **Beschreibung**

    - Tragende oder nichttragende Aussenwand mit vollständigem Fassadenaufbau.

    - Dient der Mengenermittlung, Bauphysik und Koordination der Gebäudehülle.


    **Modellierungshinweis**

    - In frühen Phasen und bei einfachen Fassaden als Mehrschichtbauteil mit vollständigem Aufbau modellieren.

    - Geschossweise modellieren; an Bauteil- und Geschossgrenzen teilen.

    - Bei höherer Komplexität oder Tool-Limitierung den Fassadenaufbau als separate Schicht modellieren.

    - Geeignetes Material im Autorensystem verwenden und exportieren.'
  fr: 'Les murs extérieurs servent de base au calcul des surfaces et des quantités, à la physique du bâtiment et à la coordination des façades.


    **Description**

    - Mur extérieur porteur ou non porteur avec complexe de façade complet.

    - Sert au métré, à la physique du bâtiment et à la coordination de l''enveloppe.


    **Directives de modélisation**

    - En phases initiales et pour façades simples, modéliser comme composant multicouche avec complexe complet.

    - Modéliser par étage ; diviser aux limites de composants et d''étages.

    - En cas de complexité accrue ou limite d''outil, modéliser le complexe de façade comme couche séparée.

    - Utiliser et exporter le matériau approprié depuis le logiciel auteur.'
  it: 'Le pareti esterne costituiscono la base per il calcolo delle superfici e delle quantità, la fisica della costruzione e il coordinamento delle facciate.


    **Descrizione**

    - Parete esterna portante o non portante con stratigrafia di facciata completa.

    - Serve per computo metrico, fisica edilizia e coordinamento dell''involucro.


    **Direttive di modellazione**

    - Nelle fasi iniziali e per facciate semplici, modellare come componente multistrato con stratigrafia completa.

    - Modellare per piano; suddividere ai confini di componenti e piani.

    - In caso di maggiore complessità o limiti dello strumento, modellare la stratigrafia di facciata come strato separato.

    - Usare ed esportare il materiale appropriato dal software di modellazione.'
  en: 'Exterior walls provide the basis for area and quantity take-off, building physics, and facade coordination.


    **Description**

    - Load-bearing or non-load-bearing exterior wall with full facade build-up.

    - Used for quantity take-off, building physics, and envelope coordination.


    **Modelling guidelines**

    - In early phases and for simple facades, model as a multi-layer component with full build-up.

    - Model storey by storey; split at component and storey boundaries.

    - When complexity increases or tool limits apply, model the facade build-up as a separate layer.

    - Use and export the appropriate material from the authoring system.'
