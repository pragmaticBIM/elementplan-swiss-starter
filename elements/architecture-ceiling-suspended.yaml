id: pragmaticbim:element/architecture-ceiling-suspended
code: ARC-CEILING
sort_order: 41
status: active
name:
  de: Abhangdecke
  fr: Plafond suspendu
  it: Controsoffitto
  en: Suspended ceiling
definition:
  de: 'Abhangdecke als modellierte Schicht für Deckenspiegelplanung und GT-Koordination.


    **Beschreibung**

    - Innen- und aussenliegende Abhangdecken mit definierter Unterkante.

    - Schliesst Revisionsöffnungen und Aussparungen für Gebäudetechnik ein.


    **Modellierungsrichtlinie**

    - Als eine Schicht mit finaler Oberfläche modellieren.

    - Dicke inkl. Unterkonstruktion modellieren — nicht nur die Gipskartonplatte (z. B. nicht 2 cm, sondern ca. 7 cm mit Unterkonstruktion).

    - Revisionsöffnungen als IfcDoor mit PredefinedType=TRAPDOOR in der Decke modellieren.

    - IfcMaterial verwenden, das der tatsächlichen Materialklasse entspricht.'
  fr: 'Plafond suspendu comme couche modélisée pour la planification miroir de plafond et la coordination GT.


    **Description**

    - Plafonds suspendus intérieurs et extérieurs avec intrados défini.

    - Inclut trappes et réservations pour le génie civil.


    **Directives de modélisation**

    - Modéliser comme couche unique avec finition.

    - Modéliser l''épaisseur y compris la sous-structure — pas seulement la plaque de plâtre (p. ex. pas 2 cm, mais environ 7 cm avec sous-structure).

    - Modéliser les trappes comme IfcDoor avec PredefinedType=TRAPDOOR dans le plafond.

    - Utiliser un IfcMaterial correspondant à la classe de matériau réelle.'
  it: 'Controsoffitto come strato modellato per la pianificazione specchio del soffitto e il coordinamento impianti.


    **Descrizione**

    - Controsoffitti interni ed esterni con intradosso definito.

    - Comprende botole e vani per impianti.


    **Direttive di modellazione**

    - Modellare come strato unico con finitura.

    - Modellare lo spessore inclusa la sottostruttura — non solo la lastra di cartongesso (es. non 2 cm, ma circa 7 cm con sottostruttura).

    - Modellare le botole come IfcDoor con PredefinedType=TRAPDOOR nel soffitto.

    - Usare un IfcMaterial corrispondente alla classe di materiale effettiva.'
  en: 'Suspended ceiling as a modelled layer for ceiling mirror planning and MEP coordination.


    **Description**

    - Interior and exterior suspended ceilings with a defined underside.

    - Includes access openings and reservations for building services.


    **Modelling guidelines**

    - Model as one layer with final surface.

    - Model thickness including the substructure — not only the gypsum board (e.g. not 2 cm, but about 7 cm with substructure).

    - Model access openings as IfcDoor with PredefinedType=TRAPDOOR in the ceiling.

    - Use an IfcMaterial that corresponds to the actual material class.'
