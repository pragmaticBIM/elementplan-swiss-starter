name:
  de: Bodenbelag Aussen
  fr: Revêtement de sol extérieur
  it: Pavimentazione esterna
  en: Exterior floor covering
definition:
  de: 'Macht Aussenbeläge in der Detailplanung prüfbar für Mengen, Fugen und Ausschreibung. Frühe Planung ohne modelliertes Covering: FloorCovering (AOF) am Aussenraum.


    **Beschreibung**

    - Modellierter Aussenbelag (Wege, Plätze, Terrassen, befestigte Flächen) gemäss Aussenbodenflächen-Klassifikation (AOF).

    - Ergänzt die Raumeigenschaft FloorCovering, sobald Aufbau und Fugen relevant werden.


    **Modellierungshinweis**

    - Als eine Schicht modellieren – nach Belagstyp trennen, nicht nach einzelnen Raumpolygonen.

    - IsExternal=TRUE setzen; Finish mit AOF-Bezeichnung führen (Blatt bei bekanntem Belag, sonst Elternklasse).

    - Keine Vegetation oder Retention hier modellieren – die gehören zu Landschaftselementen bzw. Raumeigenschaften.'
  fr: 'Rend vérifiables les revêtements extérieurs en planification de détail pour quantités, joints et appel d''offres. Planification initiale sans covering modélisé : FloorCovering (AOF) sur l''espace
    extérieur.


    **Description**

    - Revêtement extérieur modélisé (cheminements, places, terrasses, surfaces revêtues) selon la classification des surfaces de sol extérieures (AOF).

    - Complète la propriété d''espace FloorCovering dès que le complexe et les joints deviennent pertinents.


    **Directives de modélisation**

    - Modéliser comme une seule couche – séparer par type de revêtement, pas par polygones de locaux.

    - Fixer IsExternal=TRUE ; saisir Finish avec une désignation AOF (feuille si le revêtement est connu, sinon classe parente).

    - Ne pas modéliser ici la végétation ni la rétention – elles appartiennent aux éléments de paysage ou aux propriétés d''espace.'
  it: 'Rende verificabili le pavimentazioni esterne nella pianificazione di dettaglio per quantità, fughe e gara. Pianificazione iniziale senza covering modellato: FloorCovering (AOF) sullo spazio esterno.


    **Descrizione**

    - Pavimentazione esterna modellata (percorsi, piazze, terrazze, superfici rivestite) secondo la classificazione delle superfici di pavimento esterne (AOF).

    - Integra la proprietà di spazio FloorCovering quando stratigrafia e fughe diventano rilevanti.


    **Direttive di modellazione**

    - Modellare come uno strato unico – separare per tipo di pavimentazione, non per poligoni di locali.

    - Impostare IsExternal=TRUE; gestire Finish con denominazione AOF (foglia se il rivestimento è noto, altrimenti classe genitore).

    - Non modellare qui vegetazione o ritenzione – appartengono agli elementi di paesaggio o alle proprietà di spazio.'
  en: 'Makes exterior finishes verifiable in detail design for quantities, joints, and tendering. Early planning without a modelled covering: FloorCovering (AOF) on the exterior space.


    **Description**

    - Modelled outdoor surfacing (paths, plazas, terraces, paved areas) according to the outdoor floor surface classification (AOF).

    - Complements the space property FloorCovering once build-up and joints become relevant.


    **Modelling guidelines**

    - Model as one layer – split by finish type, not by individual space polygons.

    - Set IsExternal=TRUE; carry Finish with an AOF name (leaf when the surface is known, otherwise the parent class).

    - Do not model vegetation or retention here – those belong to landscape elements or space properties.'
