id: pragmaticbim:element/mep-provision-for-void
code: MEP-PROV-VOID
sort_order: 59
status: active
name:
  de: Aussparungsanforderung
  fr: Exigence de réservation
  it: Richiesta di riserva
  en: Provision for void
definition:
  de: 'Reserviert Durchbrüche rechtzeitig, damit Tragwerk und TGA ohne nachträgliche Kernbohrungen koordiniert werden können.


    **Beschreibung**

    - Volumen für Lage und lichte Abmessungen der gewünschten Öffnung in tragenden Bauteilen.

    - Dient der Koordination; wird erst nach Freigabe im Tragwerksmodell als verbindliche Öffnung umgesetzt.


    **Modellierungshinweis**

    - Als vereinfachten Proxy-Körper im TGA-Modell modellieren; Abmessungen = gewünschte lichte Öffnung inklusive Toleranz gemäss Projektvereinbarung.

    - Dem zugehörigen Geschoss zuweisen; kein tragendes Bauteil durchschneiden und keine Öffnung am Tragwerk selbst modellieren.

    - Name und Reference so setzen, dass die spätere Tragwerksöffnung eindeutig zugeordnet werden kann.'
  fr: 'Réserve les percements à temps afin de coordonner la structure porteuse et les techniques du bâtiment sans carottages ultérieurs.


    **Description**

    - Volume pour la position et les dimensions libres de l''ouverture souhaitée dans les composants porteurs.

    - Sert à la coordination; n''est mis en œuvre comme ouverture contraignante dans le modèle structurel qu''après validation.


    **Directives de modélisation**

    - Modéliser comme corps proxy simplifié dans le modèle CVC; dimensions = ouverture libre souhaitée y compris tolérance selon convention de projet.

    - Rattacher à l''étage concerné; ne pas découper de composant porteur ni modéliser d''ouverture sur la structure elle-même.

    - Définir Name et Reference de façon à pouvoir rattacher sans ambiguïté l''ouverture structurelle ultérieure.'
  it: 'Riserva tempestivamente le aperture per coordinare la struttura portante e gli impianti senza carotaggi successivi.


    **Descrizione**

    - Volume per posizione e dimensioni libere dell''apertura desiderata nei componenti portanti.

    - Serve al coordinamento; diventa apertura vincolante nel modello strutturale solo dopo l''approvazione.


    **Direttive di modellazione**

    - Modellare come corpo proxy semplificato nel modello impianti; dimensioni = apertura libera desiderata inclusa tolleranza secondo accordo di progetto.

    - Assegnare al piano corrispondente; non tagliare componenti portanti né modellare aperture sulla struttura stessa.

    - Impostare Name e Reference in modo da poter collegare in modo univoco la successiva apertura strutturale.'
  en: 'Reserves penetrations in time so structure and building services can be coordinated without later core drilling.


    **Description**

    - Volume for the location and clear dimensions of the desired void in load-bearing components.

    - Used for coordination; implemented as a binding opening in the structural model only after approval.


    **Modelling guidelines**

    - Model as a simplified proxy body in the MEP model; dimensions = desired clear opening including tolerance per project agreement.

    - Assign to the matching storey; do not cut a load-bearing component or model an opening on the structure itself.

    - Set Name and Reference so the later structural opening can be matched unambiguously.'
