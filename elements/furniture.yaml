name:
  de: Möbel
  fr: Mobilier
  it: Arredo
  en: Furniture
definition:
  de: 'Macht früh sichtbar, ob Räume mit der vorgesehenen Nutzung tatsächlich möblierbar und ausreichend dimensioniert sind.


    **Beschreibung**

    - Bewegliche oder fest eingebaute Möbelstücke in Innenräumen.

    - Dienen der Prüfung, ob Räume möblierbar bleiben, und der Lage- und Typenplanung – nicht der Produktkatalog- oder Ausführungsdetailierung.


    **Modellierungshinweis**

    - Als vereinfachten Körper mit realen Grundrissabmessungen und Höhe modellieren.

    - Dem zugehörigen Geschoss zuweisen.

    - Keine Herstellerprodukte, Leitungen oder Ausbau innerhalb des Möbelkörpers modellieren.'
  fr: 'Permet de vérifier tôt si les locaux peuvent réellement être meublés selon l''usage prévu et s''ils sont suffisamment dimensionnés.


    **Description**

    - Pièces de mobilier mobiles ou fixes dans les locaux intérieurs.

    - Servent à vérifier que les locaux restent meublables et à planifier position et type – pas au catalogue produits ni au détail d''exécution.


    **Directives de modélisation**

    - Modéliser comme corps simplifié avec dimensions en plan réelles et hauteur.

    - Rattacher à l''étage concerné.

    - Ne pas modéliser produits fabricant, réseaux ou finitions à l''intérieur du corps de mobilier.'
  it: 'Permette di verificare tempestivamente se i locali sono effettivamente arredabili secondo l''uso previsto e sufficientemente dimensionati.


    **Descrizione**

    - Pezzi di arredo mobili o fissi nei locali interni.

    - Servono a verificare che i locali restino arredabili e a pianificare posizione e tipo – non al catalogo prodotti né al dettaglio esecutivo.


    **Direttive di modellazione**

    - Modellare come corpo semplificato con dimensioni in pianta reali e altezza.

    - Assegnare al piano corrispondente.

    - Non modellare prodotti del produttore, reti o finiture all''interno del corpo d''arredo.'
  en: 'Reveals early whether spaces can actually be furnished for their intended use and are adequately sized.


    **Description**

    - Movable or built-in furniture pieces in interior rooms.

    - Used to check that rooms remain furnishable and to plan location and type – not product catalogues or execution detailing.


    **Modelling guidelines**

    - Model as a simplified body with real plan dimensions and height.

    - Assign to the matching storey.

    - Do not model manufacturer products, services, or finishes inside the furniture body.'
