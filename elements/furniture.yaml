- name: PredefinedType
  pset: null
  definition:
    de: 'Art des Möbels.


      **Zulässige Werte**

      - `CHAIR` — Stuhl

      - `TABLE` — Tisch

      - `DESK` — Schreibtisch

      - `BED` — Bett

      - `FILECABINET` — Aktenschrank

      - `SHELF` — Regal

      - `SOFA` — Sofa

      - `USERDEFINED` — benutzerdefiniert

      - `NOTDEFINED` — nicht definiert'
    fr: 'Type de mobilier.


      **Valeurs admises**

      - `CHAIR` — chaise

      - `TABLE` — table

      - `DESK` — bureau

      - `BED` — lit

      - `FILECABINET` — armoire à dossiers

      - `SHELF` — étagère

      - `SOFA` — canapé

      - `USERDEFINED` — défini par l''utilisateur

      - `NOTDEFINED` — non défini'
    it: 'Tipo di arredo.


      **Valori ammessi**

      - `CHAIR` — sedia

      - `TABLE` — tavolo

      - `DESK` — scrivania

      - `BED` — letto

      - `FILECABINET` — schedario

      - `SHELF` — scaffale

      - `SOFA` — divano

      - `USERDEFINED` — definito dall''utente

      - `NOTDEFINED` — non definito'
    en: 'Kind of furniture.


      **Allowed values**

      - `CHAIR` — chair

      - `TABLE` — table

      - `DESK` — desk

      - `BED` — bed

      - `FILECABINET` — file cabinet

      - `SHELF` — shelf

      - `SOFA` — sofa

      - `USERDEFINED` — user-defined

      - `NOTDEFINED` — not defined'
