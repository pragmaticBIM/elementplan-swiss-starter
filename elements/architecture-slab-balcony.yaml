id: pragmaticbim:element/architecture-slab-balcony
code: ARC-SLAB-BALCONY
sort_order: 22
status: active
name:
  de: Balkon (Grob)
  fr: Balcon (Approximatif)
  it: Balcone (Indicativo)
  en: Balcony (Rough)
definition:
  de: 'Ermöglicht die frühzeitige, koordinierte Prüfung von Aussenraum, Tragkonzept und Gebäudehülle und schafft eine verlässliche Grundlage für Bewilligungs- und Kostenentscheide.


    **Beschreibung**

    - Grob dimensionierte, aussenliegende Deckenplatte für Balkone und vergleichbare Aussengeschosse.

    - Dient der Koordination zwischen Architektur und Tragwerksplanung sowie der Kostenklassifizierung, nicht der Ausführungsplanung.


    **Modellierungshinweis**

    - Als vereinfachtes Volumen ohne Schichtaufbau modellieren; an Bauteilgrenzen und vom Innenbereich getrennt modellieren.

    - IsExternal=TRUE und PredefinedType=FLOOR setzen; dem jeweiligen Geschoss zuweisen.

    - Keine Geländer, Beläge, Entwässerungsdetails oder Bewehrung modellieren.

    - In der Architekturkonzeption die Abmessungen der konzeptionellen Tragwerksbauteile mit dem Tragwerksplaner abstimmen und im Architekturmodell übernehmen.

    - Geeignetes Material im Autorensystem verwenden und exportieren.'
  fr: 'Permet de vérifier tôt conjointement les espaces extérieurs, le concept porteur et l''enveloppe et étaye des décisions fiables pour l''autorisation et les coûts.


    **Description**

    - Dalle extérieure dimensionnée grossièrement pour balcons et planchers extérieurs comparables.

    - Sert à la coordination entre architecture et ingénierie structurelle ainsi qu''à la classification des coûts, pas à l''exécution.


    **Directives de modélisation**

    - Modéliser comme volume simplifié sans stratification ; diviser aux limites de composants et séparer de la zone intérieure.

    - Définir IsExternal=TRUE et PredefinedType=FLOOR ; attribuer à l''étage concerné.

    - Ne pas modéliser garde-corps, revêtements, détails de drainage ou armatures.

    - Lors de la conception architecturale, coordonner avec l''ingénieur civil les dimensions des éléments porteurs conceptuels et les reprendre dans le modèle d''architecture.

    - Utiliser et exporter le matériau approprié depuis le logiciel auteur.'
  it: 'Consente di verificare tempestivamente insieme gli spazi esterni, il concetto strutturale e l’involucro e supporta decisioni affidabili per l’autorizzazione e i costi.


    **Descrizione**

    - Soletta esterna dimensionata grossolanamente per balconi e solette esterne comparabili.

    - Serve per il coordinamento tra architettura e ingegneria strutturale nonché per la classificazione dei costi, non per l''esecuzione.


    **Direttive di modellazione**

    - Modellare come volume semplificato senza stratigrafia; suddividere ai confini dei componenti e separare dalla zona interna.

    - Impostare IsExternal=TRUE e PredefinedType=FLOOR; attribuire al piano corrispondente.

    - Non modellare parapetti, rivestimenti, dettagli di drenaggio o armature.

    - Durante la concezione architettonica, coordinare con l''ingegnere strutturista le dimensioni degli elementi strutturali concettuali e recepirle nel modello architettonico.

    - Usare ed esportare il materiale appropriato dal software di modellazione.'
  en: 'Makes exterior space, the structural concept, and the building envelope jointly verifiable early on and supports reliable permitting and cost decisions.


    **Description**

    - Coarsely dimensioned exterior floor slab for balconies and comparable exterior decks.

    - Used for coordination between architecture and structural engineering and for cost classification, not for execution planning.


    **Modelling guidelines**

    - Model as a simplified volume without layer build-up; split at component boundaries and separate from the interior.

    - Set IsExternal=TRUE and PredefinedType=FLOOR; assign to the matching storey.

    - Do not model railings, finishes, drainage details, or reinforcement.

    - During conceptual architectural design, coordinate the dimensions of conceptual structural components with the structural engineer and adopt them in the architecture model.

    - Use and export the appropriate material from the authoring system.'
