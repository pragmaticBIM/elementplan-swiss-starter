id: pragmaticbim:element/architecture-turning-radius
code: ARC-TURN-RAD
sort_order: 76
status: active
name:
  de: Wenderadius
  fr: Rayon de braquage
  it: Raggio di manovra
  en: Turning radius
definition:
  de: 'Weist nach, dass Fahrzeuge die vorgesehenen Zufahrten und Manöverflächen sicher nutzen können.


    **Beschreibung**

    - Volumen, das den erforderlichen Wenderadius bzw. die benötigte Manöverfläche abbildet.

    - Dient dem Nachweis gegenüber dem Verkehrsgutachten, nicht der Ausführungsdetailierung der Fahrbahn.


    **Modellierungshinweis**

    - Als vereinfachten Proxy-Körper modellieren; Abmessungen gemäss Verkehrsgutachten.

    - Dem zugehörigen Geschoss bzw. Aussenbereich zuweisen; ObjectType = Wenderadius.

    - Bei Einfahrten und Wendemöglichkeiten mit Gefälle unter Gebäuden die Höhen mit den wirklichen Abmessungen des LKW simulieren.

    - Keine Fahrzeuge, Markierungen oder Ausbau innerhalb des Volumens modellieren.'
  fr: 'Démontre que les véhicules peuvent utiliser en sécurité les accès et les aires de manœuvre prévus.


    **Description**

    - Volume représentant le rayon de braquage ou la surface de manœuvre requis.

    - Sert à la preuve par rapport à l''étude de trafic, pas au détail d''exécution de la chaussée.


    **Directives de modélisation**

    - Modéliser comme corps proxy simplifié ; dimensions selon l''étude de trafic.

    - Rattacher à l''étage ou à l''espace extérieur concerné ; ObjectType = Rayon de braquage.

    - Pour les accès et possibilités de demi-tour en pente sous des bâtiments, simuler en particulier les hauteurs avec les dimensions réelles du poids lourd.

    - Ne pas modéliser véhicules, marquages ou finitions à l''intérieur du volume.'
  it: 'Dimostra che i veicoli possono utilizzare in sicurezza gli accessi e le aree di manovra previsti.


    **Descrizione**

    - Volume che rappresenta il raggio di manovra o la superficie di manovra richiesta.

    - Serve alla prova rispetto allo studio del traffico, non al dettaglio esecutivo della carreggiata.


    **Direttive di modellazione**

    - Modellare come corpo proxy semplificato; dimensioni secondo lo studio del traffico.

    - Assegnare al piano o all''area esterna corrispondente; ObjectType = Raggio di manovra.

    - Per accessi e possibilità di manovra in pendenza sotto edifici, simulare in particolare le altezze con le dimensioni reali del veicolo pesante.

    - Non modellare veicoli, segnaletica o finiture all''interno del volume.'
  en: 'Demonstrates that vehicles can safely use the planned access routes and manoeuvring areas.


    **Description**

    - Volume representing the required turning radius or manoeuvring area.

    - Used for verification against the traffic study, not for detailing the carriageway.


    **Modelling guidelines**

    - Model as a simplified proxy body; dimensions according to the traffic study.

    - Assign to the matching storey or exterior area; ObjectType = Turning radius.

    - For ramped entrances and turning areas under buildings, simulate heights in particular with the real truck dimensions.

    - Do not model vehicles, markings, or finishes inside the volume.'
