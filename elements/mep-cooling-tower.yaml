id: pragmaticbim:element/mep-cooling-tower
code: MEP-COOL-TOWER
sort_order: 81
status: active
name:
  de: Kühlturm / Freecooler
  fr: Tour de refroidissement / freecooling
  it: Torre di raffreddamento / freecooling
  en: Cooling tower / free cooler
definition:
  de: '**Beschreibung**

    - Rückkühler für die Abwärme der Kälteanlage.

    - Trockenkühler, Kühlturm oder Freecooling.


    **Modellierungsrichtlinie**

    - Als Geräteobjekt mit Abmessungen und Lage modellieren.

    - Dem zugehörigen Geschoss und dem System zuweisen.'
  fr: '**Description**

    - Refroidisseur pour la dissipation de chaleur du groupe froid.

    - Refroidisseur sec, tour ou freecooling.


    **Directives de modélisation**

    - Modéliser comme appareil avec dimensions et position.

    - Rattacher à l''étage et à la zone technique ou d''usage.'
  it: '**Descrizione**

    - Refrigeratore per lo smaltimento del calore dell''impianto frigorifero.

    - Refrigeratore a secco, torre o freecooling.


    **Direttive di modellazione**

    - Modellare come apparecchio con dimensioni e posizione.

    - Assegnare al piano e alla zona tecnica o d''uso.'
  en: '**Description**

    - Heat rejection unit for the cooling plant.

    - Dry cooler, cooling tower, or free-cooling unit.


    **Modelling guidelines**

    - Model as an equipment object with size and location.

    - Assign to the matching storey and technical or use zone.'
