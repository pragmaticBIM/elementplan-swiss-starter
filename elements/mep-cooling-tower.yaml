    de: 'Art des Geräts bzw. Terminals.


      **Zulässige Werte**

      - `NATURALDRAFT` — Naturzug

      - `MECHANICALINDUCEDDRAFT` — mechanisch, Saugzug

      - `MECHANICALFORCEDDRAFT` — mechanisch, Druckzug'
    fr: 'Type d''appareil ou de terminal.


      **Valeurs admises**

      - `NATURALDRAFT` — tirage naturel

      - `MECHANICALINDUCEDDRAFT` — mécanique à tirage induit

      - `MECHANICALFORCEDDRAFT` — mécanique à tirage forcé'
    it: 'Tipo di apparecchio o terminale.


      **Valori ammessi**

      - `NATURALDRAFT` — tiro naturale

      - `MECHANICALINDUCEDDRAFT` — meccanico a tiro indotto

      - `MECHANICALFORCEDDRAFT` — meccanico a tiro forzato'
    en: 'Kind of equipment or terminal.


      **Allowed values**

      - `NATURALDRAFT` — natural draft

      - `MECHANICALINDUCEDDRAFT` — mechanical induced draft

      - `MECHANICALFORCEDDRAFT` — mechanical forced draft'
