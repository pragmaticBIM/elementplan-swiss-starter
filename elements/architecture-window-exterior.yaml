- name: FireRating
  pset: Pset_WindowCommon
  definition:
    de: 'Feuerwiderstandsklasse des nichttragenden Fensters gemäss Brandschutzkonzept – Raumabschluss und Wärmedämmung (EI), ohne Tragfähigkeit.


      **Zulässige Werte**

      - `EI 30` — Raumabschluss und Wärmedämmung 30 min

      - `EI 60` — Raumabschluss und Wärmedämmung 60 min

      - `EI 90` — Raumabschluss und Wärmedämmung 90 min'
    fr: 'Classe de résistance au feu de la fenêtre non porteuse selon le concept de protection incendie – étanchéité au feu et isolation thermique (EI), sans stabilité.


      **Valeurs admises**

      - `EI 30` — étanchéité au feu et isolation thermique 30 min

      - `EI 60` — étanchéité au feu et isolation thermique 60 min

      - `EI 90` — étanchéité au feu et isolation thermique 90 min'
    it: 'Classe di resistenza al fuoco della finestra non portante secondo il concetto antincendio – tenuta al fuoco e isolamento termico (EI), senza capacità portante.


      **Valori ammessi**

      - `EI 30` — tenuta al fuoco e isolamento termico 30 min

      - `EI 60` — tenuta al fuoco e isolamento termico 60 min

      - `EI 90` — tenuta al fuoco e isolamento termico 90 min'
    en: 'Fire resistance class of the non-load-bearing window according to the fire protection concept – integrity and insulation (EI), without load-bearing capacity.


      **Allowed values**

      - `EI 30` — integrity and insulation 30 min

      - `EI 60` — integrity and insulation 60 min

      - `EI 90` — integrity and insulation 90 min'
