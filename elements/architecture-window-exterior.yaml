id: pragmaticbim:element/architecture-window-exterior
code: ARC-WINDOW-EXT
sort_order: 40
status: active
name:
  de: Aussenfenster
  fr: Fenêtre extérieure
  it: Finestra esterna
  en: Exterior window
definition:
  de: 'Sichert Tageslicht, Lüftung und Sichtbezüge und schafft eine prüfbare Grundlage für Fassaden- und Bauphysikplanung.


    **Beschreibung**

    - Aussenfenster sowie Oberlichter in der Hülle.

    - Jedes Fenster ist einem Raum zugeordnet.

    - Grundlage für Fassadenplanung, Bauphysik (U-Wert) und Ausschreibung.


    **Modellierungshinweis**

    - IsExternal=TRUE setzen.

    - Glasanteil mit transparentem Material exportieren.

    - Jedes Fenster einem Raum zuordnen.'
  fr: 'Garantit l''éclairage naturel, la ventilation et les vues et fournit une base vérifiable pour l''étude de la façade et de la physique du bâtiment.


    **Description**

    - Fenêtres extérieures et lanterneaux dans l''enveloppe.

    - Chaque fenêtre est rattachée à un local.

    - Base pour la planification de façade, la physique du bâtiment (valeur U) et l''adjudication.


    **Directives de modélisation**

    - Définir IsExternal=TRUE.

    - Exporter le vitrage avec un matériau transparent.

    - Relier chaque fenêtre à un local.'
  it: 'Garantisce illuminazione naturale, ventilazione e visuali e fornisce una base verificabile per la progettazione della facciata e della fisica della costruzione.


    **Descrizione**

    - Finestre esterne e lucernari nell''involucro.

    - Ogni finestra è collegata a un locale.

    - Base per pianificazione di facciata, fisica della costruzione (valore U) e appalto.


    **Direttive di modellazione**

    - Impostare IsExternal=TRUE.

    - Esportare la parte vetrata con materiale trasparente.

    - Collegare ogni finestra a un locale.'
  en: 'Ensures daylight, ventilation, and views and provides a verifiable basis for facade and building-physics design.


    **Description**

    - Exterior windows and skylights in the envelope.

    - Each window is assigned to a space.

    - Basis for facade planning, building physics (U-value), and tendering.


    **Modelling guidelines**

    - Set IsExternal=TRUE.

    - Export glazing with a transparent material.

    - Relate each window to a space.'
