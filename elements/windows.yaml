id: pragmaticbim:element/windows
code: WINDOW
sort_order: 30
status: active
name:
  de: Fenster
  fr: Fenêtres
  it: Finestre
  en: Windows
definition:
  de: 'Licht- und Luftöffnungen in der Gebäudehülle und zwischen Räumen.


    **Beschreibung**

    - Innen- und Aussenfenster sowie Oberlichter.

    - Jedes Fenster ist einem Raum zugeordnet.


    **Modellierungsrichtlinie**

    - Glasanteil mit transparentem Material exportieren.

    - Jedes Fenster einem Raum zuordnen.

    - IfcMaterial verwenden, das der tatsächlichen Materialklasse entspricht.'
  fr: 'Ouvertures de jour et de ventilation dans l''enveloppe et entre locaux.


    **Description**

    - Fenêtres intérieures et extérieures ainsi que lanterneaux.

    - Chaque fenêtre est rattachée à un local.


    **Directives de modélisation**

    - Exporter le vitrage avec un matériau transparent.

    - Relier chaque fenêtre à un local.

    - Utiliser un IfcMaterial correspondant à la classe de matériau réelle.'
  it: 'Aperture di luce e ventilazione nell''involucro e tra i locali.


    **Descrizione**

    - Finestre interne ed esterne e lucernari.

    - Ogni finestra è collegata a un locale.


    **Direttive di modellazione**

    - Esportare la parte vetrata con materiale trasparente.

    - Collegare ogni finestra a un locale.

    - Usare un IfcMaterial corrispondente alla classe di materiale effettiva.'
  en: 'Daylight and ventilation openings in the building envelope and between rooms.


    **Description**

    - Interior and exterior windows and skylights.

    - Each window is assigned to a space.


    **Modelling guidelines**

    - Export glazing with a transparent material.

    - Relate each window to a space.

    - Use an IfcMaterial that corresponds to the actual material class.'
