- name: FireRating
  pset: Pset_WindowCommon
  definition:
    de: 'Feuerwiderstandsklasse des Fensters gemäss Brandschutzkonzept.


      **Zulässige Werte**

      - `R 30` — Tragfähigkeit 30 min

      - `R 60` — Tragfähigkeit 60 min

      - `R 90` — Tragfähigkeit 90 min

      - `EI 30` — Raumabschluss 30 min

      - `EI 60` — Raumabschluss 60 min

      - `EI 90` — Raumabschluss 90 min

      - `REI 30` — Tragfähigkeit und Raumabschluss 30 min

      - `REI 60` — Tragfähigkeit und Raumabschluss 60 min

      - `REI 90` — Tragfähigkeit und Raumabschluss 90 min'
    fr: 'Classe de résistance au feu de la fenêtre selon le concept de protection incendie.


      **Valeurs admises**

      - `R 30` — stabilité 30 min

      - `R 60` — stabilité 60 min

      - `R 90` — stabilité 90 min

      - `EI 30` — étanchéité au feu 30 min

      - `EI 60` — étanchéité au feu 60 min

      - `EI 90` — étanchéité au feu 90 min

      - `REI 30` — stabilité et étanchéité 30 min

      - `REI 60` — stabilité et étanchéité 60 min

      - `REI 90` — stabilité et étanchéité 90 min'
    it: 'Classe di resistenza al fuoco della finestra secondo il concetto antincendio.


      **Valori ammessi**

      - `R 30` — capacità portante 30 min

      - `R 60` — capacità portante 60 min

      - `R 90` — capacità portante 90 min

      - `EI 30` — compartimentazione 30 min

      - `EI 60` — compartimentazione 60 min

      - `EI 90` — compartimentazione 90 min

      - `REI 30` — portanza e compartimentazione 30 min

      - `REI 60` — portanza e compartimentazione 60 min

      - `REI 90` — portanza e compartimentazione 90 min'
    en: 'Fire resistance class of the window according to the fire protection concept.


      **Allowed values**

      - `R 30` — load-bearing 30 min

      - `R 60` — load-bearing 60 min

      - `R 90` — load-bearing 90 min

      - `EI 30` — integrity and insulation 30 min

      - `EI 60` — integrity and insulation 60 min

      - `EI 90` — integrity and insulation 90 min

      - `REI 30` — load-bearing, integrity and insulation 30 min

      - `REI 60` — load-bearing, integrity and insulation 60 min

      - `REI 90` — load-bearing, integrity and insulation 90 min'
