id: pragmaticbim:element/windows
code: WINDOW
sort_order: 30
status: active
name:
  de: Fenster
  fr: Fenêtres
  it: Finestre
  en: Windows
definition:
  de: |
    Alle Innen- und Aussenfenster sowie Oberlichter (IfcWindow).

    **Modellierung**
    - Glasanteil mit transparentem Material exportieren.
    - Jedes Fenster einem Raum zuordnen.
    - abstractBIM vereinfacht Öffnungen für Mengen und Simulation.
  fr: |
    Toutes les fenêtres intérieures et extérieures ainsi que les lanterneaux (IfcWindow).

    **Modélisation**
    - Exporter le vitrage avec un matériau transparent.
    - Relier chaque fenêtre à un local.
    - abstractBIM simplifie les ouvertures pour quantités et simulation.
  it: |
    Tutte le finestre interne ed esterne e i lucernari (IfcWindow).

    **Modellazione**
    - Esportare la parte vetrata con materiale trasparente.
    - Collegare ogni finestra a un locale.
    - abstractBIM semplifica le aperture per quantità e simulazione.
  en: |
    All interior and exterior windows and skylights (IfcWindow).

    **Modelling**
    - Export glazing with a transparent material.
    - Relate each window to a space.
    - abstractBIM simplifies openings for quantities and simulation.
needed_in_domain:
  - pragmaticbim:domain/architecture
entity_ifc2x3: IfcWindow
entity_ifc4: IfcWindow
entity_ifc4_3: IfcWindow
picture_link: null
model_link: null
