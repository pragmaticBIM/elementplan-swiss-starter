name:
  de: Entscheidungskörper
  fr: Volume de décision
  it: Volume decisionale
  en: Decision volume
definition:
  de: 'Macht räumlich prüfbar, wo ein Entscheid gilt und ob er noch offen, freigegeben oder abgelöst ist.


    **Beschreibung**

    - Räumlicher Gültigkeitsbereich eines Entscheids aus der fortlaufenden Entscheidungsliste.

    - Verknüpft Modell, Übersichtsplan, Visualisierung und weitere Entscheidungsgrundlagen über dieselbe Entscheidungsreferenz.


    **Modellierungshinweis**

    - Als vereinfachtes Volumen mit dem tatsächlichen räumlichen Gültigkeitsbereich modellieren und dem zugehörigen Geschoss zuweisen.

    - Eindeutige Entscheidungsreferenz und aktuellen Status führen; offene und freigegebene Körper unterscheidbar darstellen.

    - Keine Bauteilgeometrie, Materialschichten oder rein grafischen Ausschmückungen modellieren.'
  fr: 'Permet de vérifier spatialement où une décision s''applique et si elle est encore ouverte, validée ou remplacée.


    **Description**

    - Zone de validité spatiale d''une décision issue de la liste continue des décisions.

    - Relie la maquette, le plan synoptique, la visualisation et les autres bases de décision au moyen de la même référence de décision.


    **Directives de modélisation**

    - Modéliser un volume simplifié correspondant à la zone de validité réelle et le rattacher à l''étage concerné.

    - Saisir une référence de décision univoque et l''état actuel; représenter les volumes ouverts et validés de manière distincte.

    - Ne pas modéliser de géométrie constructive, de couches de matériaux ni d''éléments purement décoratifs.'
  it: 'Consente di verificare nello spazio dove si applica una decisione e se è ancora aperta, approvata o sostituita.


    **Descrizione**

    - Ambito di validità spaziale di una decisione contenuta nell''elenco continuo delle decisioni.

    - Collega modello, piano sinottico, visualizzazione e altre basi decisionali mediante lo stesso riferimento decisionale.


    **Direttive di modellazione**

    - Modellare come volume semplificato corrispondente all''effettivo ambito di validità e assegnarlo al piano pertinente.

    - Gestire un riferimento decisionale univoco e lo stato attuale; rappresentare in modo distinguibile i volumi aperti e quelli approvati.

    - Non modellare geometria costruttiva, strati di materiale o elementi puramente decorativi.'
  en: 'Makes it spatially verifiable where a decision applies and whether it is still open, approved, or superseded.


    **Description**

    - Spatial validity area of a decision from the continuously maintained decision list.

    - Links the model, overview plan, visualization, and other decision-making information through the same decision reference.


    **Modelling guidelines**

    - Model as a simplified volume matching the actual validity area and assign it to the relevant storey.

    - Maintain a unique decision reference and current status; display open and approved volumes distinctly.

    - Do not model construction geometry, material layers, or purely decorative content.'
