- name: EinspracheRisiko
  pset: Pset_UmgebungCommon
  definition:
    de: 'Einschätzung, wie wahrscheinlich Einwände von diesem Gebäude bzw. Grundstück kommen.


      **Zulässige Werte**

      - `HOCH` — Einwände wahrscheinlich

      - `MITTEL` — Einwände möglich

      - `TIEF` — Einwände unwahrscheinlich'
    fr: 'Estimation de la probabilité d''objections provenant de ce bâtiment ou de cette parcelle.


      **Valeurs admises**

      - `HOCH` — objections probables

      - `MITTEL` — objections possibles

      - `TIEF` — objections improbables'
    it: 'Stima della probabilità di obiezioni provenienti da questo edificio o fondo.


      **Valori ammessi**

      - `HOCH` — obiezioni probabili

      - `MITTEL` — obiezioni possibili

      - `TIEF` — obiezioni improbabili'
    en: 'Assessment of how likely objections from this building or plot are.


      **Allowed values**

      - `HOCH` — objections likely

      - `MITTEL` — objections possible

      - `TIEF` — objections unlikely'
