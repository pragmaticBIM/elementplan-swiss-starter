attributes:
- name: Name
  pset: null
  definition:
    de: 'Benennungsvorschlag: `FD` = Fundament; `U01` —`U99` = Untergeschosse; `EG`/`00` = Erdgeschoss; `01` —`99` = Obergeschosse; `{Geschoss}.Z` = Zwischengeschoss.


      **Zulässige Werte**

      - `FD` — Gründung/Fundament; als eigenes Geschoss modellieren

      - `U01` —`U99` — Untergeschoss; Nummer steigt nach unten (`U01` = 1. UG direkt unter dem EG)

      - `00` oder `EG` — Erdgeschoss

      - `01` —`99` — Obergeschoss; Nummer steigt nach oben

      - `Z00` oder `{Geschoss}.Z` — Zwischengeschoss (z. B. `01.Z` über Geschoss `01`)


      z. B. `FD`, `U01`, `EG`, `03`, `01.Z`'
    fr: 'Proposition de dénomination : `FD` = fondation ; `U01` —`U99` = sous-sols ; `EG`/`00` = rez-de-chaussée ; `01` —`99` = étages ; `{étage}.Z` = étage intermédiaire.


      **Valeurs admises**

      - `FD` — fondation ; modéliser comme étage distinct

      - `U01` —`U99` — sous-sol ; numéro croissant vers le bas (`U01` = 1er sous-sol directement sous le RDC)

      - `00` ou `EG` — rez-de-chaussée

      - `01` —`99` — étage ; numéro croissant vers le haut

      - `Z00` ou `{étage}.Z` — étage intermédiaire (p. ex. `01.Z` au-dessus de l''étage `01`)


      p. ex. `FD`, `U01`, `EG`, `03`, `01.Z`'
    it: 'Proposta di denominazione: `FD` = fondazione; `U01` —`U99` = seminterrati; `EG`/`00` = pianterreno; `01` —`99` = piani superiori; `{piano}.Z` = piano intermedio.


      **Valori ammessi**

      - `FD` — fondazione ; modellare come piano distinto

      - `U01` —`U99` — seminterrato ; numerazione crescente verso il basso (`U01` = 1° seminterrato direttamente sotto il PT)

      - `00` o `EG` — pianterreno

      - `01` —`99` — piano superiore ; numerazione crescente verso l''alto

      - `Z00` o `{piano}.Z` — piano intermedio (ad es. `01.Z` sopra il piano `01`)


      ad es. `FD`, `U01`, `EG`, `03`, `01.Z`'
    en: 'Naming proposal: `FD` = foundation; `U01` —`U99` = basements; `EG`/`00` = ground floor; `01` —`99` = upper floors; `{Storey}.Z` = mezzanine.


      **Allowed values**

      - `FD` — foundation; model as its own storey

      - `U01` —`U99` — basement; number increases downward (`U01` = 1st basement directly below ground floor)

      - `00` or `EG` — ground floor

      - `01` —`99` — upper floor; number increases upward

      - `Z00` or `{Storey}.Z` — mezzanine (e.g. `01.Z` above storey `01`)


      e.g. `FD`, `U01`, `EG`, `03`, `01.Z`'
