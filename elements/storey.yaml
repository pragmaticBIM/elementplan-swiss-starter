name:
  de: Geschoss
  fr: Étage
  it: Piano
  en: Storey
definition:
  de: 'Schafft den gemeinsamen vertikalen Ordnungsrahmen, damit Räume und Bauteile über alle Fachmodelle derselben Gebäudeebene zugeordnet werden können.


    **Beschreibung**

    - Horizontale Gebäudeebene: nutzbare Geschosse und Gründung/Fundament.

    - Dem Gebäude zugeordnet.


    **Modellierungshinweis**

    - Jede nutzbare Ebene als eigenes Geschoss.

    - Gründung/Fundament als eigenes Geschoss mit Name `FD`; Gründungsbauteile diesem Geschoss zuweisen.

    - Räume dem jeweiligen Geschoss zuweisen.

    - Name gemäss Klassifikation Geschosse, eindeutig je Gebäude.'
  fr: 'Établit le cadre commun de structuration verticale afin que les locaux et les éléments soient rattachés au même niveau de bâtiment dans toutes les maquettes métiers.


    **Description**

    - Niveau horizontal du bâtiment : étages utilisables et fondation.

    - Rattaché au bâtiment.


    **Directives de modélisation**

    - Chaque niveau utilisable comme étage distinct.

    - Fondation comme étage distinct avec le nom `FD` ; affecter les éléments de fondation à cet étage.

    - Relier les locaux à l''étage concerné.

    - Nom selon la classification des étages, unique par bâtiment.'
  it: 'Crea il quadro comune di organizzazione verticale affinché locali e componenti siano attribuiti allo stesso livello dell''edificio in tutti i modelli disciplinari.


    **Descrizione**

    - Livello orizzontale dell''edificio: piani utilizzabili e fondazione.

    - Collegato all''edificio.


    **Direttive di modellazione**

    - Ogni livello utilizzabile come piano distinto.

    - Fondazione come piano distinto con nome `FD`; assegnare gli elementi di fondazione a questo piano.

    - Assegnare i locali al piano corrispondente.

    - Nome secondo la classificazione dei piani, univoco per edificio.'
  en: 'Establishes the shared vertical structure so that spaces and components can be assigned to the same building level across all discipline models.


    **Description**

    - Horizontal building level: usable storeys and foundation.

    - Assigned to the building.


    **Modelling guidelines**

    - Each usable level as its own storey.

    - Foundation as its own storey named `FD`; assign foundation elements to this storey.

    - Assign spaces to the matching storey.

    - Name according to storey classification, unique per building.'
