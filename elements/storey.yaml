id: pragmaticbim:element/storey
code: STOREY
sort_order: 4
status: active
name:
  de: Geschoss
  fr: Étage
  it: Piano
  en: Storey
definition:
  de: '**Beschreibung**

    - Horizontale Gebäudeebene: nutzbare Geschosse und Gründung/Fundament.

    - Dem Gebäude zugeordnet.


    **Modellierungsrichtlinie**

    - Jede nutzbare Ebene als eigenes Geschoss.

    - Gründung/Fundament als eigenes Geschoss mit Name `FD` oder `GR`; Gründungsbauteile diesem Geschoss zuweisen.

    - Räume dem jeweiligen Geschoss zuweisen.

    - Name gemäss Klassifikation Geschosse, eindeutig je Gebäude.'
  fr: '**Description**

    - Niveau horizontal du bâtiment : étages utilisables et fondation.

    - Rattaché au bâtiment.


    **Directives de modélisation**

    - Chaque niveau utilisable comme étage distinct.

    - Fondation comme étage distinct avec le nom `FD` ou `GR` ; affecter les éléments de fondation à cet étage.

    - Relier les locaux à l''étage concerné.

    - Nom selon la classification des étages, unique par bâtiment.'
  it: '**Descrizione**

    - Livello orizzontale dell''edificio: piani utilizzabili e fondazione.

    - Collegato all''edificio.


    **Direttive di modellazione**

    - Ogni livello utilizzabile come piano distinto.

    - Fondazione come piano distinto con nome `FD` o `GR`; assegnare gli elementi di fondazione a questo piano.

    - Assegnare i locali al piano corrispondente.

    - Nome secondo la classificazione dei piani, univoco per edificio.'
  en: '**Description**

    - Horizontal building level: usable storeys and foundation.

    - Assigned to the building.


    **Modelling guidelines**

    - Each usable level as its own storey.

    - Foundation as its own storey named `FD` or `GR`; assign foundation elements to this storey.

    - Assign spaces to the matching storey.

    - Name according to storey classification, unique per building.'
needed_in_domain:
- pragmaticbim:domain/architecture
- pragmaticbim:domain/mep
- pragmaticbim:domain/structural
entity_ifc2x3: IfcBuildingStorey
entity_ifc4: IfcBuildingStorey
entity_ifc4_3: IfcBuildingStorey
picture_link: null
model_link: null
applicability: entity_ifc4=IfcBuildingStorey OR entity_ifc2x3=IfcBuildingStorey
attributes:
- name: Name
  pset: null
  definition:
    de: 'Eindeutiger Geschosscode gemäss Klassifikation Geschosse, einmalig je Gebäude.


      **Zulässige Werte**

      - `FD` oder `GR` — Gründung/Fundament; als eigenes Geschoss modellieren

      - `U01`–`U99` — Untergeschoss; Nummer steigt nach unten (`U01` = 1. UG direkt unter dem EG)

      - `00` oder `EG` — Erdgeschoss

      - `01`–`99` — Obergeschoss; Nummer steigt nach oben

      - `Z00` oder `{Geschoss}.Z` — Zwischengeschoss (z. B. `01.Z` über Geschoss `01`)


      z. B. `FD`, `U01`, `EG`, `03`, `01.Z`'
    fr: 'Code d''étage unique selon la classification des étages, une fois par bâtiment.


      **Valeurs admises**

      - `FD` ou `GR` — fondation ; modéliser comme étage distinct

      - `U01`–`U99` — sous-sol ; numéro croissant vers le bas (`U01` = 1er sous-sol directement sous le RDC)

      - `00` ou `EG` — rez-de-chaussée

      - `01`–`99` — étage ; numéro croissant vers le haut

      - `Z00` ou `{étage}.Z` — étage intermédiaire (p. ex. `01.Z` au-dessus de l''étage `01`)


      p. ex. `FD`, `U01`, `EG`, `03`, `01.Z`'
    it: 'Codice piano univoco secondo la classificazione dei piani, una volta per edificio.


      **Valori ammessi**

      - `FD` o `GR` — fondazione ; modellare come piano distinto

      - `U01`–`U99` — seminterrato ; numerazione crescente verso il basso (`U01` = 1° seminterrato direttamente sotto il PT)

      - `00` o `EG` — pianterreno

      - `01`–`99` — piano superiore ; numerazione crescente verso l''alto

      - `Z00` o `{piano}.Z` — piano intermedio (ad es. `01.Z` sopra il piano `01`)


      ad es. `FD`, `U01`, `EG`, `03`, `01.Z`'
    en: 'Unique storey code according to storey classification, once per building.


      **Allowed values**

      - `FD` or `GR` — foundation; model as its own storey

      - `U01`–`U99` — basement; number increases downward (`U01` = 1st basement directly below ground floor)

      - `00` or `EG` — ground floor

      - `01`–`99` — upper floor; number increases upward

      - `Z00` or `{storey}.Z` — mezzanine (e.g. `01.Z` above storey `01`)


      e.g. `FD`, `U01`, `EG`, `03`, `01.Z`'
  datatype: IfcLabel
