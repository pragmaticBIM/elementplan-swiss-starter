id: pragmaticbim:element/storey
code: STOREY
sort_order: 4
status: active
name:
  de: Geschoss
  fr: Étage
  it: Piano
  en: Storey
definition:
  de: |
    Nutzbare Ebene als Geschoss (IfcBuildingStorey). Dem Gebäude zugeordnet.

    **Modellierung**
    - Jede nutzbare Ebene als eigenes IfcBuildingStorey.
    - Räume dem jeweiligen Geschoss zuweisen.
    - Name eindeutig je Gebäude.
  fr: |
    Niveau utilisable comme étage (IfcBuildingStorey). Rattaché au bâtiment.

    **Modélisation**
    - Chaque niveau utilisable comme IfcBuildingStorey distinct.
    - Relier les locaux à l'étage concerné.
    - Name unique par bâtiment.
  it: |
    Livello utilizzabile come piano (IfcBuildingStorey). Collegato all'edificio.

    **Modellazione**
    - Ogni livello utilizzabile come IfcBuildingStorey distinto.
    - Assegnare i locali al piano corrispondente.
    - Name univoco per edificio.
  en: |
    Usable level as a storey (IfcBuildingStorey). Assigned to the building.

    **Modelling**
    - Each usable level as its own IfcBuildingStorey.
    - Assign spaces to the matching storey.
    - Unique Name per building.
needed_in_domain:
  - pragmaticbim:domain/architecture
  - pragmaticbim:domain/mep
entity_ifc2x3: IfcBuildingStorey
entity_ifc4: IfcBuildingStorey
entity_ifc4_3: IfcBuildingStorey
picture_link: null
