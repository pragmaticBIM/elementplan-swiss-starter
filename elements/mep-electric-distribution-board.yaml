      **Zulässige Werte**

      - Siehe Werteliste BKP-Planungspaket – z. B. `091`, `092`, `094`.'
    fr: 'Interface de planification de l''élément selon le BKP à trois chiffres – pour rendre visibles les responsabilités entre disciplines de planification.


      **Valeurs admises**

      - Voir la liste de valeurs Lot de planification BKP – p. ex. `091`, `092`, `094`.'
    it: 'Interfaccia di pianificazione del componente secondo il BKP a tre cifre – per rendere visibili le responsabilità tra discipline di pianificazione.


      **Valori ammessi**

      - Vedere l''elenco valori Lotto di pianificazione BKP – es. `091`, `092`, `094`.'
    en: 'Planning interface of the component as a three-digit BKP code, so responsibilities between design disciplines become visible.


      **Allowed values**

