  definition:
    de: 'Art des Geräts bzw. Terminals.


      **Zulässige Werte**

      - `SWITCHBOARD` — Hauptverteilung / Schaltanlage

      - `DISTRIBUTIONBOARD` — Unterverteilung

      - `CONSUMERUNIT` — Verbrauchereinheit

      - `MOTORCONTROLCENTRE` — Motor Control Center'
    fr: 'Type d''appareil ou de terminal.


      **Valeurs admises**

      - `SWITCHBOARD` — tableau principal

      - `DISTRIBUTIONBOARD` — sous-distribution

      - `CONSUMERUNIT` — unité consommateur

      - `MOTORCONTROLCENTRE` — centre de commande moteurs'
    it: 'Tipo di apparecchio o terminale.


      **Valori ammessi**

      - `SWITCHBOARD` — quadro principale

      - `DISTRIBUTIONBOARD` — sottoquadro

      - `CONSUMERUNIT` — unità utente

      - `MOTORCONTROLCENTRE` — centro comando motori'
    en: 'Kind of equipment or terminal.


      **Allowed values**

      - `SWITCHBOARD` — switchboard / main

      - `DISTRIBUTIONBOARD` — distribution board

      - `CONSUMERUNIT` — consumer unit

      - `MOTORCONTROLCENTRE` — motor control centre'
