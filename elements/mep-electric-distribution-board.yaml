      **Zulässige Werte**

      - `D01.04` — Installation Starkstrom

      - `D02.06` — Schaltgerätekombination'
    fr: 'Classification eBKP-H selon SN 506 511 – déductible à partir du type d''élément, du fluide et de BelowTerrain.


      **Valeurs admises**

      - `D01.04` — installation courant fort

      - `D02.06` — combiné d''appareillage'
    it: 'Classificazione eBKP-H secondo SN 506 511 – ricavabile da tipo di elemento, fluido e BelowTerrain.


      **Valori ammessi**

      - `D01.04` — installazione corrente forte

      - `D02.06` — combinazione di apparecchiature'
    en: 'eBKP-H classification according to SN 506 511 – derivable from element type, medium, and BelowTerrain.


