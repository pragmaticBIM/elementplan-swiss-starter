id: pragmaticbim:element/mep-electric-distribution-board
code: MEP-ELEC-DIST
sort_order: 83
status: active
name:
  de: Elektroverteilung
  fr: Tableau électrique
  it: Quadro elettrico
  en: Electrical distribution board
definition:
  de: 'Bildet die Verteilstruktur ab, damit Lasten, Zuleitungen, Aufstellflächen und Zugänglichkeit abgestimmt werden können.


    **Beschreibung**

    - Verteilschrank für die elektrische Energieverteilung.

    - Hauptverteilung.

    - Unterverteilung.


    **Modellierungshinweis**

    - Als Geräteobjekt mit Abmessungen und Lage modellieren.

    - Dem zugehörigen Geschoss und dem System zuweisen.'
  fr: 'Représente la structure de distribution afin de coordonner les charges, les alimentations, l’emprise et l’accessibilité.


    **Description**

    - Tableau de distribution électrique.

    - Tableau principal.

    - Sous-distribution.


    **Directives de modélisation**

    - Modéliser comme appareil avec dimensions et position.

    - Rattacher à l''étage et à la zone technique ou d''usage.'
  it: 'Rappresenta la struttura di distribuzione per coordinare i carichi, le alimentazioni, gli ingombri e l’accessibilità.


    **Descrizione**

    - Quadro di distribuzione elettrica.

    - Quadro principale.

    - Sottoquadro.


    **Direttive di modellazione**

    - Modellare come apparecchio con dimensioni e posizione.

    - Assegnare al piano e alla zona tecnica o d''uso.'
  en: 'Represents the distribution hierarchy so loads, feeders, plant space, and accessibility can be coordinated.


    **Description**

    - Switchboard for electrical power distribution.

    - Main board.

    - Sub-board.


    **Modelling guidelines**

    - Model as an equipment object with size and location.

    - Assign to the matching storey and technical or use zone.'
needed_in_domain:
- pragmaticbim:domain/mep
