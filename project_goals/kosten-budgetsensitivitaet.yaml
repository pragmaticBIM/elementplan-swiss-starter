    it: Medio
    en: Medium
  description:
    de: Elementbasierte Kostenermittlung mit abstractBIM-Mengen, automatisierte eBKP-H-Klassifizierung und Visualisierung der Planungsschnittstellen.
    fr: Calcul des coûts par élément à partir des quantités abstractBIM, classification eBKP-H automatisée et visualisation des interfaces de planification.
    it: Calcolo dei costi per elemento dalle quantità abstractBIM, classificazione eBKP-H automatica e visualizzazione delle interfacce di pianificazione.
    en: Element-based cost calculation from abstractBIM quantities, automated eBKP-H classification, and visualization of planning interfaces.
  status: active
  activated_workflows:
  - pragmaticbim:workflow/des-sia416-area-verification
  - pragmaticbim:workflow/des-urban-design-mass-study
  - pragmaticbim:workflow/des-abstractbim-element-based-cost
