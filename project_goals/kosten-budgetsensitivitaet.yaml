id: pragmaticbim:project-goal/kosten-budgetsensitivitaet
sort_order: 10
code: PG-01
name:
  de: Kosten-/Budgetsensitivität
  fr: Sensibilité coûts/budget
  it: Sensibilità costi/budget
  en: Cost/budget sensitivity
description:
  de: Steuert Mengen-, Kosten- und Ausschreibungstiefe über geordnete Ausprägungen.
  fr: Détermine la profondeur des quantités, coûts et appels d'offres selon des niveaux ordonnés.
  it: Determina la profondità di quantità, costi e gare secondo livelli ordinati.
  en: Controls quantity, cost and tendering depth via ordered levels.
picture_link: null
status: active
comment: 'Kickoff / Konfigurator: Goal × Level → Workflow (kumulativ).'
levels:
- id: pragmaticbim:project-goal-level/kosten-niedrig
  code: COST-01
  sort_order: 1
  name:
    de: Niedrig
    fr: Faible
    it: Basso
    en: Low
  description:
    de: Flächennachweis nach SIA 416 am Raummodell und städtebauliche Massenstudie mit Bruttovolumen.
    fr: Justificatif de surfaces selon SIA 416 sur le modèle de locaux et étude de masse urbanistique avec volumes bruts.
    it: Verifica delle superfici secondo SIA 416 sul modello dei locali e studio di massa urbanistica con volumi lordi.
    en: Area verification according to SIA 416 on the space model and urban design mass study with gross volumes.
  status: active
  activated_workflows:
  - pragmaticbim:workflow/des-sia416-area-verification
  - pragmaticbim:workflow/des-urban-design-mass-study
  comment: Full set at level niedrig (sort_order 1).
