    fr: Élevé
    it: Alto
    en: High
  description:
    de: Ausschreibung Beton- und Bodenbelagsarbeiten ab Modell sowie Visualisierung der Vergabe- und Kostenschnittstellen (Grundausbau/Mieterausbau).
    fr: Appel d'offres travaux en béton et de revêtements de sol à partir du modèle ainsi que visualisation des interfaces d'adjudication et de coûts (aménagement de base/aménagement locataire).
    it: Gara lavori in calcestruzzo e di pavimentazione dal modello nonché visualizzazione delle interfacce di aggiudicazione e di costo (allestimento di base/allestimento locatario).
