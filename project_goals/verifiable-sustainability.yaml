id: pragmaticbim:project-goal/verifiable-sustainability
sort_order: 60
group: ziele
code: PG-03
name:
  de: Nachweisbare Nachhaltigkeit
  fr: Durabilité vérifiable
  it: Sostenibilità verificabile
  en: Verifiable sustainability
tag:
  de: Nachhaltigkeit
  fr: Durabilité
  it: Sostenibilità
  en: Sustainability
description:
  de: |-
    Ziel ist, Energie-, Material- und Lebenszyklusziele direkt am aktuellen Planungsstand zu prüfen. Gebäudesimulation und Ökobilanz brauchen dafür dieselben Grundlagen wie Kosten und Planung. Leben sie in einem parallelen Datensatz, bewerten sie einen Entwurf, der längst weiterentwickelt wurde, und Nachweise müssen am Ende von Hand nachgeführt werden. Ohne durchgängige Datengrundlage wird die Prüfung zudem leicht zur Verhandlungssache statt zur Faktenfrage.
  fr: |-
    Cet objectif rend vérifiables les énoncés énergétiques et de cycle de vie sur le modèle. La simulation du bâtiment et l'écobilan ont besoin des mêmes bases géométriques et matérielles que les coûts et la planification; elles ne doivent pas vivre dans un jeu de données parallèle.

    Il aide à évaluer si les objectifs de durabilité peuvent être mesurés sur la planification réelle ou s'ils n'existent que comme intention.
  it: |-
    Questo obiettivo rende verificabili sul modello le affermazioni su energia e ciclo di vita. La simulazione dell'edificio e il bilancio ecologico richiedono le stesse basi geometriche e materiali di costi e progettazione; non devono vivere in un insieme di dati parallelo.

    Aiuta a valutare se gli obiettivi di sostenibilità possono essere misurati sulla progettazione effettiva o se esistono solo come intenzione.
  en: |-
    The aim is to check energy, material, and life-cycle targets directly against the current design status. Building simulation and life-cycle assessment need the same foundations as cost planning and design. If they live in a parallel dataset, they assess a design that has long since moved on, and the evidence has to be brought up to date by hand at the end.

    Without a continuous data basis, the check also slips easily from a question of fact into a matter of negotiation.
practice:
  de:
    title: Ökobilanz auf der Kostenberechnungstypisierung
    body: |-
      Statt für die Ökobilanz ein eigenes Berechnungsmodell aufzubauen, übernahm der Nachhaltigkeitsexperte die bestehende Kostenberechnungstypisierung und ergänzte sie um die Einheitswerte für Nachhaltigkeit. Mengen und Bauteiltypen mussten damit nicht ein zweites Mal erfasst werden; jede Änderung an der Kostenberechnung floss automatisch auch in die Ökobilanz ein.
    lesson: Gemeinsame Grundlagen optimieren den Gesamtaufwand. Getrennte Arbeitspakete optimieren die einzelne Honorarforderung.
  en:
    title: Life cycle assessment on the cost calculation typing
    body: |-
      Rather than building a separate calculation model for the life cycle assessment, the sustainability consultant took over the existing cost calculation typing and added the unit values for sustainability to it. Quantities and component types did not have to be captured a second time, and every change to the cost calculation fed straight through into the life cycle assessment.
    lesson: Shared foundations optimize the total effort. Separate work packages optimize the individual fee.
