id: pragmaticbim:project-goal/schedule-coordination
sort_order: 40
group: ziele
code: PG-05
name:
  de: Terminsicherheit
  fr: Délais et coordination
  it: Tempi e coordinamento
  en: Schedule & coordination
tag:
  de: Termin
  fr: Délais
  it: Tempi
  en: Schedule
description:
  de: |-
    Ziel ist nicht ein bestimmtes Datum, sondern ein Terminplan, der hält. Terminsicherheit entsteht durch rechtzeitige Koordination. Dazu gehören die räumliche Abstimmung zwischen Architektur, Tragwerk und Gebäudetechnik, verbindliche Aussparungen und Koordinationszonen sowie später ausführungsnahe Nachweise. Ohne diese Koordination werden Konflikte erst auf der Baustelle sichtbar, wo jede Lösung Zeit kostet.
  fr: |-
    Cet objectif concerne la coordination qui protège le délai. L'alignement spatial entre architecture, structure et techniques du bâtiment, les réservations contraignantes, les zones de coordination et plus tard les preuves proches de l'exécution empêchent que les conflits n'apparaissent que sur le chantier.

    Il aide à évaluer si le calendrier repose sur des interfaces clarifiées et une coordination vérifiable, ou sur l'espoir.
  it: |-
    Questo obiettivo riguarda il coordinamento che protegge i tempi. L'allineamento spaziale tra architettura, struttura e impianti, i fori vincolanti, le zone di coordinamento e in seguito le verifiche vicine all'esecuzione impediscono che i conflitti diventino visibili solo in cantiere.

    Aiuta a valutare se il programma poggia su interfacce chiarite e un coordinamento verificabile, o sulla speranza.
  en: |-
    The aim is not a particular date but a schedule that holds. Schedule certainty comes from coordinating in good time. That means spatial coordination between architecture, structural engineering, and building services, binding openings and coordination zones, and later construction-level verification.

    Without that coordination, conflicts surface only on site, where every solution costs time.
practice:
  de:
    title: Hochhaus ohne Gerüst
    body: |-
      Das Hochhaus wurde ohne Fassadengerüst erstellt. Das Betonieren der Kerne und parallel dazu das Einbringen der Fertigteildecken und der Fassadenelemente stellte hohe Anforderungen an Logistik und Bausicherheit. Mit 3D-Sequenzen liess sich die Abfolge mit den Beteiligten besprechen, und eine Lösung konnte einfach gemeinsam erarbeitet werden.
    lesson: Wo die Ausführung vom Üblichen abweicht, ist die Simulation keine Spielerei, sondern Risikomanagement.
  en:
    title: A high-rise without scaffolding
    body: |-
      The high-rise was built without facade scaffolding. Casting the cores while precast slabs and facade units went in alongside placed heavy demands on logistics and site safety. 3D sequences made it possible to talk the order of operations through with everyone involved, and a workable solution was found quickly.
    lesson: Where construction departs from the usual, simulation is not a gimmick. It is risk management.
status: active
comment: 'Kickoff / Konfigurator: Goal × Level → Workflow (kumulativ).'
