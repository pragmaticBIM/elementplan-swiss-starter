    it: Basso
    en: Low
  description:
    de: Tragwerksplanung ins Architekturmodell übernehmen und die abgestimmten Abmessungen der groben Tragwerksbauteile führen, solange noch kein detailliertes Tragwerksmodell vorliegt.
    fr: Reprendre la planification structurelle dans la maquette d'architecture et tenir les dimensions coordonnées des éléments porteurs grossiers, tant qu'une maquette structure détaillée n'existe pas encore.
    it: Integrare la pianificazione strutturale nel modello di architettura e tenere le dimensioni concordate dei componenti strutturali indicativi, finché non esiste ancora un modello strutturale dettagliato.
    en: Adopt structural design in the architecture model and keep the coordinated dimensions of the coarse structural components while no detailed structural model exists yet.
  status: active
