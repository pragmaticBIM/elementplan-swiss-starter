    fr: Coordination spatiale de l'architecture et des techniques du bâtiment, reprise contraignante des réservations CVC et de la maçonnerie du gros œuvre dans la maquette structurelle, planification des zones de coordination et des schémas CVC, ainsi que commande anticipée de l'ascenseur et de l'entreprise de construction bois.
