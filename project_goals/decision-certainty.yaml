id: pragmaticbim:project-goal/decision-certainty
sort_order: 45
group: ziele
code: PG-07
name:
  de: Entscheidungssicherheit
  fr: Sécurité décisionnelle
  it: Sicurezza decisionale
  en: Decision certainty
tag:
  de: Entscheidung
  fr: Décision
  it: Decisione
  en: Decision
description:
  de: |-
    Ziel ist, strategische und gestalterische Entscheide früh, vergleichbar und nachvollziehbar zu treffen. Strukturierte Nutzungs- und Volumengrundlagen, Variantenvergleiche, Visualisierungen und dokumentierte Freigaben zeigen die Folgen eines Entscheids, solange das Projekt noch veränderbar ist. Ohne diese Grundlagen werden Varianten nach Bauchgefühl beurteilt oder Festlegungen erst revidiert, wenn Planung, Vergabe oder Ausführung bereits darauf aufbauen.
  fr: |-
    L'objectif est de prendre suffisamment tôt des décisions stratégiques et conceptuelles qui soient comparables et traçables. Des bases structurées concernant l'usage et les volumes, des comparaisons de variantes, des visualisations et des validations documentées montrent les conséquences d'une décision tant que le projet peut encore être adapté. Sans ces bases, les variantes sont appréciées de manière intuitive ou les choix ne sont révisés que lorsque les études, l'adjudication ou l'exécution en dépendent déjà.
  it: |-
    L'obiettivo è prendere tempestivamente decisioni strategiche e progettuali confrontabili e tracciabili. Basi strutturate relative all'uso e ai volumi, confronti tra varianti, visualizzazioni e approvazioni documentate mostrano le conseguenze di una decisione finché il progetto può ancora essere modificato. Senza queste basi, le varianti vengono valutate in modo intuitivo oppure le scelte vengono riviste solo quando la progettazione, l'aggiudicazione o l'esecuzione dipendono già da esse.
  en: |-
    The aim is to make strategic and design decisions early, comparably, and traceably. Structured use and massing foundations, option comparisons, visualizations, and documented approvals show the consequences of a decision while the project can still be changed. Without these foundations, options are assessed by instinct or decisions are revised only after design, procurement, or construction already depends on them.
practice:
  de:
    title: Vorprojekt fürs Management verständlich gemacht
    body: |-
      Das Vorprojekt war sehr detailliert ausgearbeitet. Damit die Bauherrschaft und das Management trotzdem entscheiden konnten, verdichtete das Team die konzeptionellen Themen mit Screenshots und PowerPoint zu einem Foliensatz. Management erhielt damit eine Basis, die es verstand; die Planung gewann dadurch Freigaben und Stabilität, statt im Detail weiterzulaufen, ohne dass die Steuerung mitkam.
    lesson: Entscheide brauchen eine Sprache, die Steuerung versteht – sonst bleibt Detailplanung ohne Freigabe und ohne Stabilität.
  en:
    title: Making the preliminary design legible to management
    body: |-
      The preliminary design had been worked out in great detail. So that the client and their management could still decide, the team boiled the conceptual questions down to a slide deck built from screenshots. Management finally had something it could read and act on; the design work gained approvals and stability instead of running further into detail while the people steering the project fell behind.
    lesson: A decision needs to be put in language the people steering the project understand. Without that, detailed design continues without approval and without stability.
status: active
comment: 'Kickoff / Konfigurator: Goal × Level → Workflow (explizit, nicht kumulativ).'
