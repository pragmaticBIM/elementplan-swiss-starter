  sort_order: 1
  name:
    de: Gering
    fr: Faible
    it: Basso
    en: Low
  description:
    de: Nutzungs- und Funktionsannahmen strukturieren, ein verbindliches Raumprogramm bestellen und städtebauliche Volumenvarianten mit Kennzahlen vergleichen.
    fr: Structurer les hypothèses d'usage et de fonctionnement, commander un programme des locaux contraignant et comparer les variantes volumétriques urbaines au moyen d'indicateurs.
    it: Strutturare le ipotesi d'uso e funzionali, commissionare un programma degli spazi vincolante e confrontare le varianti volumetriche urbane mediante indicatori.
    en: Structure use and functional assumptions, commission a binding room programme, and compare urban massing options using key figures.
  status: active
