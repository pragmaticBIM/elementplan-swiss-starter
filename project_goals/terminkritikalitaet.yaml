  name:
    de: Mittel
    fr: Moyen
    it: Medio
    en: Medium
  description:
    de: Koordination Architektur–TGA in späteren Phasen inkl. Aussparungen im Tragwerk sowie Planung der Koordinationszonen.
    fr: Coordination architecture–CVC en phases avancées incl. réservations dans la structure ainsi que planification des zones de coordination.
    it: Coordinamento architettura–impianti in fasi avanzate incl. fori nella struttura nonché pianificazione delle zone di coordinamento.
    en: Architecture–MEP coordination in later phases including structural openings, plus coordination zone planning.
  status: active
  activated_workflows:
  - pragmaticbim:workflow/qas-arch-mep-coordination-openings
  - pragmaticbim:workflow/qas-coordination-zone-planning
  comment: Full set at level mittel (sort_order 2); includes lower levels.
- id: pragmaticbim:project-goal-level/termin-hoch
  code: SCH-03
  sort_order: 3
  name:
    de: Hoch
    fr: Élevé
    it: Alto
    en: High
  description:
    de: Vertiefte Koordination (früh, Tragwerk inkl. Sperrzonen-QS und Schalungsplan-Koordination, TGA-Detail), Nachweis Einbringwege und Wartungsräume, Baulogistik mit Raum-QR sowie Ausführung Bewehrung, Befestigung/Aufhängung, Bodenbelagsarbeiten und Bestellung Betonfertigteile ab Modell.
    fr: Coordination approfondie (en phase initiale, structure incl. contrôle zones d'exclusion et coordination type plan de coulage, détail CVC), preuve des voies d'apport et espaces de maintenance, logistique de chantier avec QR locaux ainsi qu'exécution armatures, fixation/suspension, revêtements de sol et commande d'éléments préfabriqués en béton à partir du modèle.
    it: Coordinamento approfondito (in fase iniziale, struttura incl. controllo zone di esclusione e coordinamento tipo piano di getto, dettaglio impianti), verifica vie di introduzione e spazi di manutenzione, logistica di cantiere con QR locali nonché esecuzione armature, fissaggio/sospensione, lavori di pavimentazione e ordine di elementi prefabbricati in calcestruzzo dal modello.
    en: Deeper coordination (early, structure incl. exclusion zone QS and formwork-plan coordination, MEP detail), verification of installation paths and maintenance spaces, fit-out logistics with room QR, plus reinforcement execution, fastening/suspension, flooring works, and precast concrete ordering from model.
  status: active
  activated_workflows:
