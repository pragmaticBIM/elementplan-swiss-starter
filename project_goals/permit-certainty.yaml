  description:
    de: Parkplatznachweis, Überprüfung der Vorgaben aus dem Verkehrsgutachten, Nachweise der Hindernisfreiheit nach SIA 500 und der natürlichen Belichtung, städtebauliche Beurteilung mit Augmented Reality, Nachbarschafts- und Stakeholderdialog, digitale Anwohnerinformation sowie Erstellung des Baugesuchs.
    fr: Justificatif de stationnement, contrôle des prescriptions de l'étude de trafic, justificatifs d'accessibilité selon la norme SIA 500 et d'éclairage naturel, appréciation urbanistique en réalité augmentée, dialogue de voisinage et avec les parties prenantes, information numérique aux riverains, ainsi qu'établissement de la demande d'autorisation.
