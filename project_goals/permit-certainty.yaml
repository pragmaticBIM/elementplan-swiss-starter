id: pragmaticbim:project-goal/permit-certainty
sort_order: 50
group: ziele
code: PG-09
name:
  de: Bewilligungssicherheit
  fr: Sécurité d'autorisation
  it: Sicurezza dell'autorizzazione
  en: Permit certainty
tag:
  de: Bewilligung
  fr: Autorisation
  it: Autorizzazione
  en: Permit
description:
  de: |-
    Ziel ist, dass Baugesuch und behördliche Nachweise ohne Überraschungen durchgehen. Vorgaben zu Parzellen, Verkehr, Parkierung, Hindernisfreiheit, Brandschutz und Baumbestand werden dafür früh im Modell sichtbar gemacht und laufend geprüft, ebenso die Nachweise für Fördermittel. Ohne diese Prüfungen zeigen sich Abweichungen erst im Bewilligungsverfahren, wo jede Korrektur Zeit kostet.
  fr: |-
    Cet objectif vise à ce que la demande d'autorisation et les justificatifs officiels passent sans surprise. Les prescriptions relatives aux parcelles, au trafic, au stationnement, à l'accessibilité, à la protection incendie et au patrimoine arboré sont rendues visibles tôt dans la maquette et contrôlées en continu, de même que les justificatifs de subventions.

    Sans ces contrôles, les écarts n'apparaissent qu'au cours de la procédure d'autorisation, où chaque correction coûte du temps.
  it: |-
    Questo obiettivo mira a far sì che la domanda di costruzione e le verifiche delle autorità passino senza sorprese. Le prescrizioni su particelle, traffico, posteggi, accessibilità, protezione antincendio e patrimonio arboreo vengono rese visibili presto nel modello e controllate in continuo, così come le verifiche per gli incentivi.

    Senza questi controlli, gli scostamenti emergono solo nella procedura di autorizzazione, dove ogni correzione costa tempo.
  en: |-
    The aim is that the building permit application and official evidence pass without surprises. Requirements for parcels, traffic, parking, accessibility, fire protection, and existing trees are made visible in the model early and checked continuously, as is the evidence for funding.

    Without these checks, deviations appear only during the permit procedure, where every correction costs time.
practice:
  de:
    title: Bewilligung vor dem Bauprojekt
    body: |-
      Bei einem Wohngebäude wurden das Baubewilligungsverfahren und mögliche Einsprachen als grösstes Terminrisiko erkannt. Um dieses Risiko gezielt zu steuern, kehrte das Projektteam die übliche Phasenreihenfolge um. Nach dem Vorprojekt wurde das Projekt stabilisiert und das Baugesuch eingereicht. Erst nachdem die Baubewilligung vorlag, stieg das Team in das Bauprojekt ein. Das Bauprojekt entsprach dadurch einer echten Arbeitsvorbereitung.
    lesson: Die Phasenreihenfolge sollte dem grössten Projektrisiko folgen, nicht unbesehen einem Standardschema.
  en:
    title: Permit first, design development second
    body: |-
      On a residential building, the permit procedure and the objections it might attract were identified as the single largest risk to the schedule. To manage that risk head-on, the project team reversed the usual order of phases. After the preliminary design the project was stabilized and the permit application was filed. Only once the permit was granted did the team start design development – which then amounted to genuine work preparation.
    lesson: The order of phases should follow the project's largest risk rather than a standard scheme applied without thinking.
status: active
comment: 'Kickoff / Konfigurator: Goal × Level → Workflow (explizit, nicht kumulativ).'
