id: pragmaticbim:project-goal/costs-quantities
sort_order: 30
group: ziele
code: PG-01
name:
  de: Kostensicherheit
  fr: Coûts et quantités
  it: Costi e quantità
  en: Costs & quantities
tag:
  de: Kosten
  fr: Coûts
  it: Costi
  en: Costs
description:
  de: |-
    Ziel ist nicht ein bestimmter Betrag, sondern eine verlässliche Kostenprognose. Sie beginnt mit nachvollziehbaren Mengen. Geprüft wird, ob Flächen und Volumen belastbar ermittelt, Bauteile einer Kostenstruktur zugeordnet und Vergabepakete eindeutig abgegrenzt werden können. Ohne diese Prüfung bleiben Kostenschätzungen Meinungen: Mengen stimmen nicht, Schnittstellen gehören niemandem, und Nachträge entstehen an den Übergängen zwischen Planung, Vergabe und Ausführung.
  fr: |-
    Cet objectif est pertinent lorsque quantités, coûts et adjudications doivent être déduits de manière contraignante à partir du modèle. Il rend visible si les surfaces et volumes sont traçables, si les éléments peuvent être classés pour la structure des coûts et si les lots d'appel d'offres ainsi que les interfaces de coûts entre aménagement de base et aménagement locataire sont clairs.

    Sans cette vérification, les estimations de coûts restent des opinions: les quantités ne correspondent pas, les interfaces n'appartiennent à personne, les avenants naissent aux passages entre planification, adjudication et réalisation.
  it: |-
    Questo obiettivo è rilevante quando quantità, costi e gare devono essere ricavati in modo vincolante dal modello. Rende visibile se superfici e volumi sono ricostruibili, se i componenti possono essere classificati per la struttura dei costi e se i lotti di gara nonché le interfacce di costo tra allestimento di base e allestimento locatario sono chiari.

    Senza questa verifica, le stime di costo restano opinioni: le quantità non coincidono, le interfacce non appartengono a nessuno, le varianti nascono ai passaggi tra progettazione, gara e esecuzione.
  en: |-
    The aim is not a particular figure but a cost forecast you can rely on. It starts with traceable quantities. The check establishes whether areas and volumes can be determined robustly, components can be assigned to a cost structure, and procurement packages can be delineated unambiguously.

    Without that check, cost estimates stay opinions: quantities do not add up, no one owns the interfaces, and change orders appear at the transitions between design, procurement, and construction.
practice:
  de:
    title: Mehrfamilienhaus in einer Woche zum TU-Angebot
    body: |-
      Für ein Mehrfamilienhaus lag ein Baubeschrieb vor, aber noch kein detailliertes Modell – und das Angebot eines Totalunternehmers brauchte belastbare Mengen. Statt Bauteile von Hand nachzumodellieren, übersetzte das Team den Baubeschrieb innerhalb einer Woche in rund 50 Regeln, etwa: Wände um das Treppenhaus in Beton, Wände um Badezimmer als Trockenbau 12,5 cm. Parallel entstand ein einfaches Raummodell. Daraus erzeugte abstractBIM ein Bauteilmodell und reicherte es regelbasiert mit den Eigenschaften aus dem Baubeschrieb an. Das Ergebnis waren alle Mengen für das TU-Angebot – in derselben Woche, in der die Regeln entstanden.

      Beim nächsten vergleichbaren Projekt greifen dieselben Regeln erneut. Was beim ersten Mal eine Woche kostete, läuft dann in Minuten: Raummodell liefern, Regeln anwenden, Mengen ausgeben.
    lesson: Der Aufwand steckt einmal in den Regeln, nicht in jedem Projekt erneut im Nachbauen. Regelbasiert wird aus einer einmaligen Übersetzung wiederholbare Angebotsarbeit.
  en:
    title: From building specification to a general contractor bid in a week
    body: |-
      An apartment building had a written building specification but no detailed model – and a general contractor bid needed reliable quantities. Rather than remodel every component by hand, the team turned the specification into some fifty rules within a week: walls around the stairwell in concrete, walls around bathrooms in 12.5 cm drywall, and so on. A simple space model was built alongside it. From that, abstractBIM generated a component model and enriched it rule by rule with the properties from the specification. The result was every quantity the general contractor bid needed – in the same week the rules were written.

      On the next comparable project the same rules run again. What took a week the first time then takes minutes: deliver the space model, apply the rules, export the quantities.
    lesson: The effort goes once into the rules, not into rebuilding every project by hand. With a rule-based approach, a one-off translation becomes repeatable bidding work.
