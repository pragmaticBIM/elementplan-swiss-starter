    de: Gering
    fr: Faible
    it: Basso
    en: Low
  description:
    de: Lagebezug und Gelände durch die Bauherrschaft beschaffen sowie fachlich und digital kompetente Planer beauftragen.
    fr: Acquérir le référentiel spatial et le terrain par le maître d'ouvrage et mandater des concepteurs compétents sur le plan technique et numérique.
    it: Acquisire il riferimento spaziale e il terreno da parte della committenza e incaricare progettisti competenti sul piano tecnico e digitale.
