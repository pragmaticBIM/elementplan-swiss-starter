id: pragmaticbim:project-goal/planning-certainty
sort_order: 55
group: ziele
code: PG-10
name:
  de: Planungssicherheit
  fr: Sécurité de planification
  it: Sicurezza della progettazione
  en: Design certainty
tag:
  de: Planung
  fr: Planification
  it: Pianificazione
  en: Design
description:
  de: |-
    Ziel ist eine Planung, die die Bedürfnisse der Bauherrschaft erfüllt, in sich stimmig und ausführungsreif ist. Designreviews, Nachweise zu Brand-, Schall- und Wärmeschutz, Absturzsicherungen und geprüfte Details machen die Qualität über alle Phasen wiederholbar prüfbar. Ohne diese Prüfungen zeigen sich Mängel erst bei der Ausschreibung, auf der Baustelle oder bei der Abnahme.
  fr: |-
    Cet objectif vise une planification cohérente et prête pour l'exécution. Les revues de conception, les justificatifs de protection incendie, acoustique et thermique, les sécurités antichute et les détails contrôlés rendent la qualité vérifiable de manière répétable à toutes les phases.

    Sans ces contrôles, les défauts n'apparaissent qu'à l'appel d'offres, sur le chantier ou à la réception.
  it: |-
    Questo obiettivo mira a una progettazione coerente e pronta per l'esecuzione. Revisioni di progetto, verifiche di protezione antincendio, acustica e termica, sicurezze anticaduta e dettagli controllati rendono la qualità verificabile in modo ripetibile in tutte le fasi.

    Senza questi controlli, i difetti emergono solo in gara, in cantiere o al collaudo.
  en: |-
    The aim is a design that meets the client's needs, is internally consistent, and is ready for construction. Design reviews, evidence of fire, acoustic, and thermal protection, fall protection, and checked details make quality repeatably verifiable across all phases.

    Without these checks, defects appear only at tender, on site, or at handover.
practice:
  de:
    title: Brandschutz per GUID-Liste
    body: |-
      Ein Brandschutzplaner sollte seine Anforderungen im Architekturmodell über GUID-Listen pflegen – bei jedem Upload erneut, während sich das Modell weiter änderte. Wände kamen und gingen; seine Einträge waren laufend zunichte.

      Für eine laufende Prüfung übersetzt er das freigegebene Konzept stattdessen in Regeln und ein fachliches Anforderungsmodell. Die Architektur übernimmt die Anforderungen; der Brandschutzplaner pflegt keine GUID-Liste im Architekturmodell.
    lesson: Ein fachliches Anforderungsmodell macht Brandschutzanforderungen automatisiert prüfbar, ohne dass der Brandschutzplaner laufend ein fremdes Architekturmodell nachführen muss.
  en:
    title: Fire protection by GUID list
    body: |-
      A fire protection engineer was required to maintain his requirements inside the architecture model through GUID lists – again with every upload, while the model kept changing. Walls came and went; his entries were wiped out as he went.

      For continuous checking he instead translates the approved concept into rules and a discipline requirements model. Architecture adopts the requirements; he maintains no GUID list inside the architecture model.
    lesson: A discipline requirements model makes fire protection requirements automatically verifiable without the fire protection engineer having to keep updating somebody else's architecture model.
status: active
comment: 'Kickoff / Konfigurator: Goal × Level → Workflow (explizit, nicht kumulativ).'
