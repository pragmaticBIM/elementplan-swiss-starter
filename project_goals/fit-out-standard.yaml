- id: pragmaticbim:project-goal-level/fit-out-elevated
  code: FIT-02
  sort_order: 2
  name:
    de: Gehoben
    fr: Élevé
    it: Elevato
    en: Elevated
  description:
    de: Erweiterte Planung auf Raumebene – schematische Grundrisse aus dem Raummodell, Türen, Fassade, Deckenspiegel, koordiniertes Leuchtenkonzept und Leuchtenplanung, Grundleitungen, Fussbodenheizung, koordinierte Sanitärobjekte und Vorsatzschalen, Nutzerfreigabe typisierter Steckdosen, räumliche Visualisierung von Entscheiden und ihren Auswirkungen, Grundlagen für die Möblierungsausschreibung, Nachweis der Möblierbarkeit und Nutzerabstimmung mit groben Skizzen für Spezialräume.
    fr: Planification étendue au niveau des locaux – plans d'étages schématiques à partir du modèle de locaux, portes, façade, plans de plafonds, concept et étude d'éclairage coordonnés, conduites enterrées, chauffage au sol, appareils sanitaires et contre-cloisons coordonnés, validation par les utilisateurs de types de prises, représentation spatiale des décisions et de leurs conséquences, bases pour l’appel d'offres du mobilier, contrôle de l’ameublement possible et coordination avec les utilisateurs au moyen d’esquisses sommaires pour les locaux spéciaux.
    it: Pianificazione estesa al livello dei locali – planimetrie schematiche dal modello dei locali, porte, facciata, piani dei soffitti, concetto e progettazione illuminotecnica coordinati, condotte interrate, riscaldamento a pavimento, apparecchi sanitari e contropareti coordinati, approvazione da parte degli utenti di tipi di prese, visualizzazione spaziale delle decisioni e delle loro conseguenze, basi per l’appalto degli arredi, verifica dell’arredabilità e coordinamento con gli utenti mediante schizzi sommari per i locali speciali.
    en: Extended room-level planning – schematic floor plans from the space model, doors, facade, reflected ceiling plans, coordinated lighting concept and fixture design, underground services, underfloor heating, coordinated sanitary fixtures and service linings, user approval of outlet types, spatial visualization of decisions and their impacts, basis for furniture tendering, furnishability verification, and user coordination using rough sketches for special-purpose rooms.
  status: active
