id: pragmaticbim:project-goal/fit-out-standard
sort_order: 5
group: rahmenbedingungen
code: PG-02
name:
  de: Nutzung & Ausbaustandard
  fr: Usage et standard d'aménagement
  it: Uso e standard di finitura
  en: Use & fit-out standard
tag:
  de: Ausbau
  fr: Aménagement
  it: Finiture
  en: Fit-out
description:
  de: |-
    Festgelegt wird, welche Nutzungen das Gebäude aufnimmt und welcher Ausbaustandard für welche Räume gilt. Diese Festlegung ist die Grundlage, um Räume entsprechend ihrer Nutzung zu planen und die vereinbarten Anforderungen nachvollziehbar zu prüfen. Ohne sie lassen sich Raumprogramm, Möblierbarkeit und Ausbau nicht gegen vereinbarte Anforderungen abgleichen; Abweichungen zeigen sich erst bei der Nutzerabstimmung oder im Betrieb.
  fr: |-
    Cet objectif détermine la profondeur de planification et de justification des locaux. Il va du programme des locaux structuré et de l'obtention des plans à partir du modèle jusqu'à l'agencement, les portes, la façade, les plans de plafonds et le mobilier, et jusqu'aux visualisations pour les conventions d'utilisation.

    Il aide à évaluer si un local n'est pas seulement dessiné, mais utilisable, meublable et aligné sur les prescriptions convenues pour les locaux spéciaux.
  it: |-
    Questo obiettivo determina la profondità con cui i locali sono pianificati e verificati. Va dal programma dei locali strutturato e dall'ottenimento dei disegni dal modello fino a layout, porte, facciata, piani dei soffitti e arredi, e fino alle visualizzazioni per le convenzioni d'uso.

    Aiuta a valutare se un locale non è solo disegnato, ma utilizzabile, arredabile e allineato alle prescrizioni convenute per i locali speciali.
  en: |-
    This framework condition determines which uses the building accommodates and which fit-out standard applies to which spaces. It is the basis for designing spaces to suit their use and for checking the agreed requirements traceably.

    Without it, the room programme, whether spaces can actually be furnished, and the fit-out cannot be reconciled against the agreed requirements; deviations surface only during user consultation or in operation.
status: active
comment: 'Kickoff / Konfigurator: Goal × Level → Workflow (kumulativ).'
