code: PG-04
name:
  de: Übergabefokus
  fr: Priorité à la remise
  it: Priorità alla consegna
  en: Handover focus
description:
  de: Steuert die Tiefe der FM-Datenübergabe an den Betreiber über geordnete Ausprägungen.
  fr: Détermine la profondeur de la livraison des données FM à l'exploitant selon des niveaux ordonnés.
  it: Determina la profondità della consegna dati FM al gestore secondo livelli ordinati.
  en: Controls depth of FM data handover to the operator via ordered levels.
