  - pragmaticbim:workflow/des-existing-structure-survey
  - pragmaticbim:workflow/des-existing-mep-survey
  - pragmaticbim:workflow/des-managing-existing-with-models
  comment: Full set at level Erhalt Gebäudetechnik (sort_order 3); includes lower levels.
