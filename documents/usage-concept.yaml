id: pragmaticbim:document/usage-concept
code: NZK
sort_order: 127
name:
  de: Nutzungskonzept
  fr: Concept d'utilisation
  it: Concetto d'uso
  en: Usage concept
definition:
  de: Nutzungskonzept mit priorisierten User Stories, prüfbaren Akzeptanzkriterien und Betriebsannahmen. Verbindliche Grundlage für Testplanung, Raumprogramm sowie Abnahme von Planung und Bau.
  fr: Concept d'utilisation avec récits utilisateurs priorisés, critères de réception vérifiables et hypothèses d'exploitation. Base contraignante pour l'étude test, le programme des locaux ainsi que la réception des études et de la réalisation.
  it: Concetto d'uso con storie utente priorizzate, criteri di accettazione verificabili e ipotesi operative. Base vincolante per lo studio di fattibilità, il programma dei locali nonché il collaudo di progettazione e costruzione.
  en: Usage concept with prioritized user stories, verifiable acceptance criteria, and operational assumptions. Binding basis for test planning, the room programme, and acceptance of design and construction.
description:
  de: |-
    - Nutzerrollen bzw. Nutzergruppen
    - User Stories in der Form «Als [Rolle] brauche ich [Fähigkeit], um [Ziel] zu erreichen»
    - Prüfbare Akzeptanzkriterien je User Story
    - Priorisierung der User Stories
    - Betriebsabläufe und erforderliche Funktionsbeziehungen bzw. Trennungen
    - Version und Freigabestand
  fr: |-
    - Rôles ou groupes d'usagers
    - Récits utilisateurs sous la forme « En tant que [rôle], j'ai besoin de [capacité] afin de [objectif] »
    - Critères de réception vérifiables par récit utilisateur
    - Priorisation des récits utilisateurs
    - Processus d'exploitation et relations ou séparations fonctionnelles requises
    - Version et état de validation
  it: |-
    - Ruoli o gruppi di utenti
    - Storie utente nella forma « Come [ruolo] ho bisogno di [capacità] per [obiettivo] »
    - Criteri di accettazione verificabili per ogni storia utente
    - Prioritizzazione delle storie utente
    - Processi operativi e relazioni o separazioni funzionali necessarie
    - Versione e stato di approvazione
  en: |-
    - User roles or user groups
    - User stories in the form "As a [role], I need [capability] so that I can [goal]"
    - Verifiable acceptance criteria per user story
    - Prioritization of the user stories
    - Operational processes and required functional relationships or separations
    - Version and approval status
