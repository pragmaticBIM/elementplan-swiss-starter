comment: >-
  Form nach Software-Engineering: User Stories («Als X brauche ich Y, um Z zu
  machen») mit Akzeptanzkriterien. Dient als Abnahmegrundlage für Planung und Bau,
  nicht als Raumliste – diese bleibt im Raumprogramm.
