id: pragmaticbim:document/environmental-impact-assessment
code: UVP
sort_order: 143
name:
  de: Umweltverträglichkeitsprüfung
  fr: Étude d'impact sur l'environnement
  it: Valutazione d'impatto ambientale
  en: Environmental impact assessment
definition:
  de: Umweltverträglichkeitsprüfung mit Auswirkungen des Vorhabens auf Umwelt und Umfeld. Grundlage für das Baugesuch und die Abstimmung mit der Bewilligungsbehörde.
  fr: Étude d'impact sur l'environnement avec les effets du projet sur l'environnement et le voisinage. Base pour la mise à l'enquête et l'alignement avec l'autorité.
  it: Valutazione d'impatto ambientale con gli effetti del progetto su ambiente e contesto. Base per la domanda edilizia e l'allineamento con l'autorità.
  en: Environmental impact assessment of the project's effects on the environment and surroundings. Basis for the building application and alignment with the authority.
description:
  de: |-
    - Auswirkungen des Vorhabens auf Umwelt und Umfeld
    - Untersuchte Schutzgüter
    - Massnahmen
    - Schlussfolgerungen für das Baugesuch
  fr: |-
    - Effets du projet sur l'environnement et le voisinage
    - Biens à protéger examinés
    - Mesures
    - Conclusions pour la mise à l'enquête
  it: |-
    - Effetti del progetto su ambiente e contesto
    - Beni protetti esaminati
    - Misure
    - Conclusioni per la domanda edilizia
  en: |-
    - Effects of the project on the environment and surroundings
    - Protected assets examined
    - Measures
    - Conclusions for the building application
