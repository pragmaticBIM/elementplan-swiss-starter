id: pragmaticbim:document/fire-protection-plan
code: BSP
sort_order: 105
name:
  de: Brandschutzplan
  fr: Plan de protection incendie
  it: Piano di protezione antincendio
  en: Fire protection plan
definition:
  de: Brandschutzplan mit Brandabschnitten, Fluchtwegen und Feuerwiderstand der massgebenden Bauteile. Dient der Abstimmung mit dem Brandschutzkonzept und den Bewilligungsunterlagen.
  fr: Plan de protection incendie avec compartiments, voies d'évacuation et résistance au feu des composants déterminants. Il sert à l'alignement avec le concept de protection incendie et les dossiers d'autorisation.
  it: Piano di protezione antincendio con compartimenti, vie di fuga e resistenza al fuoco dei componenti determinanti. Serve all'allineamento con il concetto antincendio e gli atti di autorizzazione.
  en: Fire protection plan with compartments, escape routes, and fire resistance of the governing components. It supports alignment with the fire concept and permit documents.
description:
  de: |-
    - Brandabschnitte
    - Fluchtwege
    - Feuerwiderstand der massgebenden Bauteile
    - Masse, Legende und Plankopf
    - Bezug zum Architekturstand
  fr: |-
    - Compartiments coupe-feu
    - Voies d'évacuation
    - Résistance au feu des éléments déterminants
    - Cotes, légende et cartouche
    - Référence à l'état architecture
  it: |-
    - Compartimenti antincendio
    - Vie di fuga
    - Resistenza al fuoco dei componenti determinanti
    - Quote, legenda e cartiglio
    - Riferimento allo stato architettura
  en: |-
    - Fire compartments
    - Escape routes
    - Fire resistance of the governing components
    - Dimensions, legend, and title block
    - Reference to the architecture status
