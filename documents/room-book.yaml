  fr: '{NumeroProjet}_PRO-RMB_{Libre}.{ext}'
  it: '{NumeroProgetto}_PRO-RMB_{Libero}.{ext}'
  en: '{ProjectNumber}_PRO-RMB_{FreeText}.{ext}'
