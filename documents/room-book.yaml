id: pragmaticbim:document/room-book
code: RMB
sort_order: 133
name:
  de: Raumbuch
  fr: Carnet des locaux
  it: Registro dei locali
  en: Room book
definition:
  de: Fortgeschriebener Datencontainer für Bestellraumtypen, Planungsraumtypen, Rauminstanzen und deren Anforderungen und Abweichungen über den Projektverlauf.
  fr: Conteneur de données tenu à jour pendant le projet pour les types de locaux commandés, les types de locaux de projet, les locaux individuels ainsi que leurs exigences et écarts.
  it: Contenitore di dati aggiornato durante il progetto per i tipi di locale ordinati, i tipi di locale di progetto, i singoli locali e i relativi requisiti e scostamenti.
  en: Continuously maintained data container for ordered room types, planning room types, room instances, and their requirements and deviations throughout the project.
description:
  de: |-
    - Planungsraumtypen mit eindeutiger Bezeichnung, den wiederkehrenden funktionalen, räumlichen und technischen Anforderungen sowie der Zuordnung zum Bestellraumtyp aus dem Raumprogramm
    - Jede Rauminstanz mit projektweit eindeutiger und stabiler technischer Raumnummer sowie Bezeichnung
    - Zuordnung jeder Rauminstanz zu einem Planungsraumtyp und den vereinbarten Gruppierungen
    - Abweichungen der Rauminstanz vom zugeordneten Planungsraumtyp mit Begründung und Freigabestatus
    - Je Raum wirksame Anforderungen und Kennwerte unter Berücksichtigung der Typvorgaben und Instanzabweichungen
    - Version und Freigabestand des Raumbuchs
  fr: |-
    - Types de locaux de projet avec désignation univoque, exigences fonctionnelles, spatiales et techniques récurrentes, et attribution au type commandé du programme des locaux
    - Chaque local avec numéro technique univoque et stable dans l'ensemble du projet ainsi que sa désignation
    - Attribution de chaque local à un type de projet et aux regroupements convenus
    - Écarts du local par rapport au type de projet attribué, avec justification et état de validation
    - Exigences et valeurs caractéristiques applicables à chaque local, compte tenu des prescriptions du type et des écarts propres au local
    - Version et état de validation du carnet des locaux
  it: |-
    - Tipi di locale di progetto con denominazione univoca, requisiti funzionali, spaziali e tecnici ricorrenti e assegnazione al tipo ordinato del programma dei locali
    - Ogni locale con numero tecnico univoco e stabile per l'intero progetto nonché relativa denominazione
    - Assegnazione di ogni locale a un tipo di progetto e ai raggruppamenti concordati
    - Scostamenti del locale rispetto al tipo di progetto assegnato, con motivazione e stato di approvazione
    - Requisiti e valori caratteristici applicabili a ogni locale, tenendo conto delle prescrizioni del tipo e degli scostamenti specifici
    - Versione e stato di approvazione del registro dei locali
  en: |-
    - Planning room types with an unambiguous name, recurring functional, spatial, and technical requirements, and assignment to the ordered room type from the room programme
    - Every room instance with a project-wide unique and stable technical room number and name
    - Assignment of every room instance to a planning room type and the agreed groupings
    - Deviations of a room instance from its assigned planning room type, including reason and approval status
    - Effective requirements and metrics for each room, accounting for type requirements and instance deviations
    - Version and approval status of the room book
file_name:
