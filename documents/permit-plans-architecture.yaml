  fr: '{NumeroProjet}_ARC-BGA_{Libre}.{ext}'
  it: '{NumeroProgetto}_ARC-BGA_{Libero}.{ext}'
  en: '{ProjectNumber}_ARC-BGA_{Free}.{ext}'
