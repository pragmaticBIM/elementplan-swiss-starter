comment: >-
  Proposed IFC4+ mapping: one IfcDoor occurrence per door, gate, or inspection
  opening; IfcDoor.PredefinedType=TRAPDOOR identifies an inspection opening.
  Identity and dimensions: IfcDoor.GlobalId, Name, OverallWidth, OverallHeight;
  type assignment via IfcRelDefinesByType to IfcDoorType, with OperationType on
  the type. General requirements: Pset_DoorCommon.Reference, IsExternal,
  FireRating, AcousticRating, ThermalTransmittance, SmokeStop, SelfClosing,
  SecurityRating, HandicapAccessible. Materials and build-up via
  IfcRelAssociatesMaterial; location and host via IfcRelContainedInSpatialStructure,
  IfcRelFillsElement, and IfcRelVoidsElement. Hardware or execution information
  without an IFC standard property should be linked as a document through
  IfcRelAssociatesDocument rather than assigned a misleading standard property.
