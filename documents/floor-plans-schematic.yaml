id: pragmaticbim:document/floor-plans-schematic
code: GRS
sort_order: 120
name:
  de: Grundrisse, schematisch
  fr: Plans des étages schématiques
  it: Planimetrie schematiche
  en: Floor plans, schematic
definition:
  de: Schematische Geschossgrundrisse in frühen Phasen, oft im Massstab 1:200 oder 1:100. Wird eine graue oder schwarze Fläche hinter die Räume gelegt, können Grundrisse erzeugt werden, ohne die Wände zu zeichnen.
  fr: Plans des étages schématiques en phase initiale, souvent à l'échelle 1:200 ou 1:100. Ils rendent lisibles découpage et desserte sans tenir les murs comme éléments – les joints entre volumes de locaux apparaissent comme des murs.
  it: Planimetrie schematiche di piano in fase iniziale, spesso in scala 1:200 o 1:100. Rendono leggibili suddivisione e distribuzione senza gestire le pareti come componenti – i giunti tra i volumi di locale appaiono come pareti.
  en: Schematic storey floor plans in early phases, often at scale 1:200 or 1:100. Placing a grey or black area behind the spaces allows floor plans to be produced without drawing the walls.
description:
  de: |-
    - Geschossgrundrisse der relevanten Geschosse
    - Räume und Raumbezeichnungen lesbar
    - Wandstärke als durchgehende Pochierung zwischen den Räumen
    - Erschliessung und Zuschnitt erkennbar
    - Nordpfeil, Massstab, Plankopf
  fr: |-
    - Plans des étages pertinents
    - Locaux et désignations des locaux lisibles
    - Épaisseur de mur comme pochage continu entre les locaux
    - Desserte et découpage reconnaissables
    - Nord, échelle, cartouche
  it: |-
    - Planimetrie dei piani pertinenti
    - Locali e denominazioni dei locali leggibili
    - Spessore di parete come campitura continua tra i locali
    - Distribuzione e suddivisione riconoscibili
    - Nord, scala, cartiglio
  en: |-
    - Storey plans of the relevant storeys
    - Rooms and room names readable
    - Wall thickness as continuous poche between the rooms
    - Circulation and subdivision recognizable
    - North arrow, scale, title block
