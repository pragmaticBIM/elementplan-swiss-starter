id: pragmaticbim:document/works-contracts
code: WVK
sort_order: 147
name:
  de: Werkverträge
  fr: Contrats d'entreprise
  it: Contratti d'appalto
  en: Works contracts
definition:
  de: Werkverträge mit Unternehmerinnen und Unternehmern.
  fr: Contrats d'entreprise avec les entrepreneurs.
  it: Contratti d'appalto con le imprese.
  en: Works contracts with contractors.
description:
  de: |-
    - Leistungsumfang der Unternehmerin oder des Unternehmers
    - Preis
    - Grundlage der Beauftragung
    - Vertragsklauseln
    - Klare Rangfolge weniger Vertragsbeilagen, mit Vorrang der Bauherrendokumente und ohne Widersprüche insbesondere zwischen Leistungsverzeichnis und besonderen Bestimmungen
    - Vertragsparteien und Datum
  fr: |-
    - Étendue des prestations de l'entrepreneur
    - Prix
    - Base du mandat
    - Clauses contractuelles
    - Ordre clair d'un nombre limité d'annexes contractuelles, avec priorité aux documents du maître d'ouvrage et sans contradiction notamment entre le devis descriptif et les conditions particulières
    - Parties contractantes et date
  it: |-
    - Estensione delle prestazioni dell'impresa
    - Prezzo
    - Base dell'incarico
    - Clausole contrattuali
    - Ordine chiaro di un numero limitato di allegati contrattuali, con priorità ai documenti del committente e senza contraddizioni in particolare tra elenco delle prestazioni e condizioni particolari
    - Parti contraenti e data
  en: |-
    - Contractor scope of works
    - Price
    - Basis of the award
    - Contract clauses
    - Clear precedence among a limited number of contract attachments, prioritizing client documents and avoiding contradictions, particularly between the bill of quantities and special conditions
    - Contracting parties and date
