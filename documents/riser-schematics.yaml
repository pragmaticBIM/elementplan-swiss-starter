  en: Riser schematics / shafts
definition:
  de: Strangschemata und Steigzonen der Gebäudetechnik. Stellen sicher, dass vertikale Verteilungen und Schächte vor der Ausführung formal abgesegnet sind.
  fr: Schémas de colonnes et gaines techniques des installations. Ils garantissent que les distributions verticales et les gaines sont formellement approuvées avant l'exécution.
  it: Schemi delle colonne montanti e dei cavedi impianti. Garantiscono che le distribuzioni verticali e i cavedi siano formalmente approvati prima dell'esecuzione.
  en: Riser schematics and shafts for building services. They ensure vertical distribution and shafts are formally approved before construction.
