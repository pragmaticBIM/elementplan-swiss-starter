id: pragmaticbim:document/usage-agreement-structural
code: NVT
sort_order: 132
name:
  de: Nutzungsvereinbarung Tragwerk
  fr: Convention d'utilisation structure
  it: Convenzione d'uso strutture
  en: Usage agreement structure
definition:
  de: Nutzungsvereinbarung Tragwerk nach SIA 260. Verknüpft vereinbarte Nutzungen, Lasten und Schwingungsanforderungen raumweise mit dem technischen Planungsstand der Tragwerksplanung.
  fr: Convention d'utilisation structure selon SIA 260. Elle relie usages, charges et exigences vibratoires convenus par local à l'état technique de la planification structurelle.
  it: Convenzione d'uso strutture secondo SIA 260. Collega usi, carichi e requisiti di vibrazione concordati per locale allo stato tecnico della pianificazione strutturale.
  en: Structural usage agreement according to SIA 260. It links agreed uses, loads, and vibration requirements per space to the technical planning status of the structure.
