name:
  de: Projekt-Handbuch / BAP
  fr: Manuel de projet / BAP
  it: Manuale di progetto / BAP
  en: Project handbook / BEP
definition:
  de: Projekt-Handbuch und BIM-Abwicklungsplan. Verknüpft die organisatorischen Meilensteine — Rollen, Prozesse, Lieferobjekte — direkt mit dem technischen Planungsstand.
  fr: Manuel de projet et plan d'exécution BIM. Il relie les jalons organisationnels — rôles, processus, livrables — à l'état technique de la planification.
  it: Manuale di progetto e piano di gestione BIM. Collega i traguardi organizzativi — ruoli, processi, oggetti di fornitura — direttamente allo stato tecnico della pianificazione.
  en: Project handbook and BIM execution plan. It links organisational milestones — roles, processes, deliverables — directly to the technical planning status.
