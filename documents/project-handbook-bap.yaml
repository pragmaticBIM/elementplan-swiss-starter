id: pragmaticbim:document/project-handbook-bap
code: BAP
sort_order: 131
name:
  de: Projekt-Handbuch / BEP
  fr: Manuel de projet / BEP
  it: Manuale di progetto / BEP
  en: Project handbook / BEP
definition:
  de: Projekt-Handbuch und BIM-Abwicklungsplan als lebendiges Führungs- und Arbeitsdokument. Es ist nicht als Vertragsbestandteil vorgesehen, sondern wird mit den im Projekt gewonnenen Erkenntnissen laufend weiterentwickelt.
  fr: Manuel de projet et plan d'exécution BIM conçus comme un document de pilotage et de travail évolutif. Il n'est pas destiné à faire partie intégrante du contrat, mais est développé en continu sur la base des enseignements tirés du projet.
  it: Manuale di progetto e piano di gestione BIM concepiti come documento di gestione e di lavoro in continua evoluzione. Non è destinato a essere parte integrante del contratto, ma viene sviluppato costantemente sulla base delle conoscenze acquisite nel corso del progetto.
  en: Project handbook and BIM execution plan as a living management and working document. It is not intended to form part of the contract but is continuously developed based on knowledge gained throughout the project.
description:
  de: |-
    - Rollen und Verantwortlichkeiten
    - Prozesse und Meilensteine
    - Lieferobjekte
    - Bezug zu Datenanforderungen
    - Teamvereinbarungen
    - Versions- und Änderungsstand sowie Hinweis auf die laufende Weiterentwicklung ausserhalb der Vertragsbestandteile
  fr: |-
    - Rôles et responsabilités
    - Processus et jalons
    - Livrables
    - Référence aux exigences de données
    - Accords d'équipe
    - État des versions et des modifications, avec mention de la mise à jour continue en dehors des pièces contractuelles
  it: |-
    - Ruoli e responsabilità
    - Processi e traguardi
    - Oggetti della fornitura
    - Riferimento ai requisiti di dati
    - Accordi di team
    - Stato delle versioni e delle modifiche, con indicazione dell'aggiornamento continuo al di fuori dei documenti contrattuali
  en: |-
    - Roles and responsibilities
    - Processes and milestones
    - Deliverables
    - Reference to data requirements
    - Team agreements
    - Version and change status, noting continuous development outside the contract documents
