name:
  de: Geländeaufnahme
  fr: Relève du terrain
  it: Rilievo del terreno
  en: Terrain survey
definition:
  de: Geländeaufnahme mit Lage- und Höhenbezug in LV95 sowie Passpunkten. Verbindliche räumliche Grundlage aller Fachmodelle; ergänzt durch das Bodengutachten.
  fr: Relève du terrain avec référentiel de position et d'altitude en LV95 et points de calage. Base spatiale contraignante de toutes les maquettes métiers ; complétée par le rapport géotechnique.
  it: Rilievo del terreno con riferimento di posizione e quota in LV95 e punti di appoggio. Base spaziale vincolante di tutti i modelli disciplinari; completata dalla relazione geotecnica.
  en: Terrain survey with position and height reference in LV95 and control points. Binding spatial basis for all discipline models; complemented by the geotechnical report.
