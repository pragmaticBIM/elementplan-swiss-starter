definition:
  de: Kostenvoranschlag und Kostenberechnung. Verknüpft die kaufmännischen Meilensteine direkt mit dem technischen Planungsstand und den modellbasierten Mengen.
  fr: Devis estimatif et calcul des coûts. Il relie les jalons commerciaux à l'état technique de la planification et aux quantités issues de la maquette.
  it: Preventivo e calcolo dei costi. Collega i traguardi commerciali direttamente allo stato tecnico della pianificazione e alle quantità dal modello.
  en: Cost estimate and cost calculation. It links commercial milestones directly to the technical planning status and model-based quantities.
