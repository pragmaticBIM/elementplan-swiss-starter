id: pragmaticbim:document/cost-estimate
code: KVA
sort_order: 123
name:
  de: Kostenvoranschlag
  fr: Devis estimatif
  it: Preventivo
  en: Cost estimate
definition:
  de: Der Kostenvoranschlag wird auf Basis des technischen Planungsstands und bauteilbezogener Mengen ermittelt. Die Kostengenauigkeit von ± 25 % beschreibt die Sicherheit der zugrunde liegenden Annahmen und keine zulässige Kostenabweichung; Reserven und Teuerung sind offen auszuweisen. Gebäudekennwerte dienen der Plausibilisierung der Gesamtkosten, nicht als alleinige Berechnungsgrundlage.
  fr: Le devis estimatif est établi d'après l'état technique de la planification et les quantités par élément. La précision des coûts de ± 25 % exprime le degré de fiabilité des hypothèses retenues et non un écart de coûts admissible ; les réserves et le renchérissement doivent être présentés séparément. Les valeurs de référence du bâtiment servent à vérifier la plausibilité du coût total, et non de base de calcul unique.
  it: Il preventivo è elaborato in base allo stato tecnico della progettazione e alle quantità per elemento. La precisione dei costi di ± 25 % esprime il grado di affidabilità delle ipotesi adottate e non uno scostamento dei costi ammissibile; le riserve e il rincaro devono essere indicati separatamente. I valori di riferimento dell'edificio servono a verificare la plausibilità del costo complessivo, non come unica base di calcolo.
  en: The cost estimate is based on the technical design status and element-based quantities. The cost accuracy of ± 25 % indicates the confidence in the underlying assumptions, not an allowable cost deviation; contingencies and escalation must be shown separately. Building metrics serve as a plausibility check on the total cost, not as the sole basis for calculation.
description:
  de: |-
    - Kostenstruktur nach Bauteilen
    - Bezug zum Planungsstand
    - Bauteilbezogene Mengen und Kostenansätze
    - Zugrunde liegende Annahmen und deren Aussagesicherheit
    - Separat ausgewiesene Reserven und Teuerung
    - Gebäudekennwerte zur Plausibilisierung der Gesamtkosten
  fr: |-
    - Structure des coûts par élément
    - Référence à l'état de planification
    - Quantités par élément et coûts unitaires
    - Hypothèses retenues et degré de fiabilité
    - Réserves et renchérissement présentés séparément
    - Valeurs de référence du bâtiment pour vérifier la plausibilité du coût total
  it: |-
    - Struttura dei costi per elemento
    - Riferimento allo stato di pianificazione
    - Quantità per elemento e costi unitari
    - Ipotesi adottate e grado di affidabilità
    - Riserve e rincaro indicati separatamente
    - Valori di riferimento dell'edificio per verificare la plausibilità del costo complessivo
  en: |-
    - Element-based cost structure
    - Reference to the design status
    - Element-based quantities and unit costs
    - Underlying assumptions and their level of confidence
    - Separately stated contingencies and escalation
    - Building metrics for a plausibility check on the total cost
