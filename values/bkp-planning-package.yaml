id: pragmaticbim:value/bkp-planning-package
code: BKP-PLANNING
name:
  de: BKP-Planungspaket
  fr: Lot de planification BKP
  it: Lotto di pianificazione BKP
  en: BKP planning package
description:
  de: Dreistellige BKP-Honorarcodes der Planungsdisziplinen für die Planungsschnittstelle (z. B. Architekt, Bauingenieur, HLK). Nicht die Unternehmerlose.
  fr: Codes BKP à trois chiffres des honoraires des disciplines de planification pour l'interface de planification (p. ex. architecte, ingénieur civil, CVC). Hors lots d'entreprise.
  it: Codici BKP a tre cifre degli onorari delle discipline di pianificazione per l'interfaccia di pianificazione (es. architetto, ingegnere civile, impianti). Esclusi i lotti d'impresa.
  en: Three-digit BKP fee codes for planning disciplines at the design interface (e.g. architect, structural engineer, HVAC). These are not contractor packages.
