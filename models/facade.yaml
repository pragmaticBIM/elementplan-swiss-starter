id: pragmaticbim:model/facade
code: FAS
sort_order: 13
name:
  de: Fassade
  fr: Façade
  it: Facciata
  en: Facade
definition:
  de: Aussenhülle und Fassadenaufbau — Bekleidung, Öffnungen und fassadenbezogene Schichten, getrennt vom übrigen Architekturmodell. Fachmodelle nach Status trennen (B Bestand, A Abbruch, N Neubau, T temporär). Die Trennung macht Modelle schnell lesbar und erlaubt, Neubau und Abbruch gezielt ein- und auszublenden.
  fr: Enveloppe extérieure et composition de façade — revêtements, ouvertures et couches liées à la façade, séparés du reste de la maquette d'architecture. Séparer les maquettes par statut (E existant, D démolition, N neuf, T temporaire). La séparation rend les maquettes rapidement lisibles et permet d'afficher ou de masquer ce qui est neuf et ce qui est retiré.
  it: Involucro esterno e stratigrafia di facciata — rivestimenti, aperture e strati legati alla facciata, distinti dal resto del modello di architettura. Separare i modelli per stato (E esistente, D demolizione, N nuovo, T temporaneo). La separazione rende i modelli rapidamente comprensibili e permette di visualizzare o nascondere ciò che è nuovo e ciò che viene rimosso.
  en: External envelope and facade build-up — cladding, openings, and facade-related layers, separate from the rest of the architecture deliverable. Split models by status (E existing, D demolish, N new, T temporary). The split makes models readable at a glance and lets you toggle what is new versus what is removed.
