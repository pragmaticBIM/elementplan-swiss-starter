id: pragmaticbim:model/steel-structure
code: STB
sort_order: 32
name:
  de: Stahlbau
  fr: Construction métallique
  it: Carpenteria metallica
  en: Steel
definition:
  de: Stahltragwerk — Träger, Stützen, Verbände und weitere tragende Stahlbauteile. Fachmodelle nach Status trennen (B Bestand, A Abbruch, N Neubau, T temporär). Die Trennung macht Modelle schnell lesbar und erlaubt, Neubau und Abbruch gezielt ein- und auszublenden.
  fr: Ouvrage métallique — poutres, poteaux, contreventements et autres éléments porteurs en acier. Séparer les maquettes par statut (E existant, D démolition, N neuf, T temporaire). La séparation rend les maquettes rapidement lisibles et permet d'afficher ou de masquer ce qui est neuf et ce qui est retiré.
  it: Struttura in acciaio — travi, colonne, controventi e altri elementi portanti in acciaio. Separare i modelli per stato (E esistente, D demolizione, N nuovo, T temporaneo). La separazione rende i modelli rapidamente comprensibili e permette di visualizzare o nascondere ciò che è nuovo e ciò che viene rimosso.
  en: Steel structure — beams, columns, bracing, and other load-bearing steel members. Split models by status (E existing, D demolish, N new, T temporary). The split makes models readable at a glance and lets you toggle what is new versus what is removed.
