id: pragmaticbim:model/landscape
code: LAN
sort_order: 14
name:
  de: Landschaft
  fr: Paysage
  it: Paesaggio
  en: Landscape
definition:
  de: Umgebungs- und Aussenraumgestaltung — Vegetation, Wege, Plätze und gestaltete Aussenanlagen. Fachmodelle nach Status trennen (B Bestand, A Abbruch, N Neubau, T temporär). Die Trennung macht Modelle schnell lesbar und erlaubt, Neubau und Abbruch gezielt ein- und auszublenden.
  fr: Aménagement des abords et des espaces extérieurs — végétation, cheminements, places et aménagements paysagers. Séparer les maquettes par statut (E existant, D démolition, N neuf, T temporaire). La séparation rend les maquettes rapidement lisibles et permet d'afficher ou de masquer ce qui est neuf et ce qui est retiré.
  it: Sistemazione degli spazi esterni — vegetazione, percorsi, piazze e opere a verde. Separare i modelli per stato (E esistente, D demolizione, N nuovo, T temporaneo). La separazione rende i modelli rapidamente comprensibili e permette di visualizzare o nascondere ciò che è nuovo e ciò che viene rimosso.
  en: Surroundings and outdoor-space design — vegetation, paths, plazas, and designed external works. Split models by status (E existing, D demolish, N new, T temporary). The split makes models readable at a glance and lets you toggle what is new versus what is removed.
