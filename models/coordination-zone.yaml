id: pragmaticbim:model/coordination-zone
code: KOZ
sort_order: 18
name:
  de: Koordinationszonen
  fr: Zones de coordination
  it: Zone di coordinamento
  en: Coordination zones
definition:
  de: "Geplante Koordinationsvolumen mit Zuordnung zu Koordinationsmeetings – welcher Bereich in welcher Besprechung abgestimmt wird, statt alles gegen alles. Fachmodelle nach Status trennen (B Bestand, A Abbruch, N Neubau, T temporär). Die Trennung macht Modelle schnell lesbar und erlaubt, Neubau und Abbruch gezielt ein- und auszublenden."
  fr: "Volumes de coordination planifiés rattachés aux réunions de coordination – quel secteur est traité dans quelle séance, au lieu de tout contre tout. Séparer les maquettes par statut (E existant, D démolition, N neuf, T temporaire). La séparation rend les maquettes rapidement lisibles et permet d'afficher ou de masquer ce qui est neuf et ce qui est retiré."
  it: "Volumi di coordinamento pianificati assegnati alle riunioni di coordinamento – quale ambito è trattato in quale riunione, invece di tutto contro tutto. Separare i modelli per stato (E esistente, D demolizione, N nuovo, T temporaneo). La separazione rende i modelli rapidamente comprensibili e permette di visualizzare o nascondere ciò che è nuovo e ciò che viene rimosso."
  en: "Planned coordination volumes assigned to coordination meetings – which area is coordinated in which meeting, instead of everything against everything. Split models by status (E existing, D demolish, N new, T temporary). The split makes models readable at a glance and lets you toggle what is new versus what is removed."
