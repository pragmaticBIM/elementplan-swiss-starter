id: pragmaticbim:model/furniture
code: MOB
sort_order: 16
name:
  de: Mobiliar
  fr: Mobilier
  it: Arredi
  en: Furniture
definition:
  de: Einrichtung und Möblierung für Nutzung, Visualisierung und Koordination — keine Laborspezialausstattung. Fachmodelle nach Status trennen (B Bestand, A Abbruch, N Neubau, T temporär). Die Trennung macht Modelle schnell lesbar und erlaubt, Neubau und Abbruch gezielt ein- und auszublenden.
  fr: Mobilier pour l'usage, la visualisation et la coordination — hors équipements de laboratoire. Séparer les maquettes par statut (E existant, D démolition, N neuf, T temporaire). La séparation rend les maquettes rapidement lisibles et permet d'afficher ou de masquer ce qui est neuf et ce qui est retiré.
  it: Arredi e mobilio per uso, visualizzazione e coordinamento — esclusa l'attrezzatura di laboratorio. Separare i modelli per stato (E esistente, D demolizione, N nuovo, T temporaneo). La separazione rende i modelli rapidamente comprensibili e permette di visualizzare o nascondere ciò che è nuovo e ciò che viene rimosso.
  en: Furnishings and furniture for use, visualisation, and coordination — not specialist laboratory equipment. Split models by status (E existing, D demolish, N new, T temporary). The split makes models readable at a glance and lets you toggle what is new versus what is removed.
