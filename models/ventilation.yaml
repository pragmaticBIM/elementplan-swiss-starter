id: pragmaticbim:model/ventilation
code: LUE
sort_order: 23
name:
  de: Lüftung
  fr: Ventilation
  it: Ventilazione
  en: Ventilation
definition:
  de: Lüftungsanlagen — Luftführung, Geräte und lufttechnische Verteilung. Fachmodelle nach Status trennen (B Bestand, A Abbruch, N Neubau, T temporär). Die Trennung macht Modelle schnell lesbar und erlaubt, Neubau und Abbruch gezielt ein- und auszublenden.
  fr: Installations de ventilation — réseaux d'air, appareils et distribution aéraulique. Séparer les maquettes par statut (E existant, D démolition, N neuf, T temporaire). La séparation rend les maquettes rapidement lisibles et permet d'afficher ou de masquer ce qui est neuf et ce qui est retiré.
  it: Impianti di ventilazione — condotte d'aria, apparecchi e distribuzione aeraulica. Separare i modelli per stato (E esistente, D demolizione, N nuovo, T temporaneo). La separazione rende i modelli rapidamente comprensibili e permette di visualizzare o nascondere ciò che è nuovo e ciò che viene rimosso.
  en: Ventilation systems — air routes, equipment, and air-side distribution. Split models by status (E existing, D demolish, N new, T temporary). The split makes models readable at a glance and lets you toggle what is new versus what is removed.
