id: pragmaticbim:model/surroundings
code: UMG
sort_order: 15
name:
  de: Umgebung
  fr: Contexte
  it: Contesto
  en: Surroundings
definition:
  de: Bestand, Nachbarbebauung und Terrain als räumlicher Kontext — nicht die gestaltete Landschaftsplanung. Fachmodelle nach Status trennen (B Bestand, A Abbruch, N Neubau, T temporär). Die Trennung macht Modelle schnell lesbar und erlaubt, Neubau und Abbruch gezielt ein- und auszublenden.
  fr: Existant, constructions voisines et terrain comme contexte spatial — distinct de l'aménagement paysager. Séparer les maquettes par statut (E existant, D démolition, N neuf, T temporaire). La séparation rend les maquettes rapidement lisibles et permet d'afficher ou de masquer ce qui est neuf et ce qui est retiré.
  it: Esistente, edificato limitrofo e terreno come contesto spaziale — distinto dalla progettazione paesaggistica. Separare i modelli per stato (E esistente, D demolizione, N nuovo, T temporaneo). La separazione rende i modelli rapidamente comprensibili e permette di visualizzare o nascondere ciò che è nuovo e ciò che viene rimosso.
  en: Existing stock, neighbouring buildings, and terrain as spatial context — not designed landscape works. Split models by status (E existing, D demolish, N new, T temporary). The split makes models readable at a glance and lets you toggle what is new versus what is removed.
file_name:
  de: '{Projektnummer}_{B|A|N|T}_ARX-UMG_{Freitext}.{ext}'
  fr: '{NumeroProjet}_{E|D|N|T}_ARC-UMG_{Libre}.{ext}'
  it: '{NumeroProgetto}_{E|D|N|T}_ARC-UMG_{Libero}.{ext}'
  en: '{ProjectNumber}_{E|D|N|T}_ARC-UMG_{Free}.{ext}'
status: active
