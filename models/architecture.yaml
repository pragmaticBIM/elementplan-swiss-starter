name:
  de: Architektur
  fr: Architecture
  it: Architettura
  en: Architecture
definition:
  de: "Gebäudearchitektur – Räume, Bauteile und Ausbau in einem Fachmodell, inklusive Nutzflächen und Raumvolumen für Flächennachweise. Fachmodelle nach Status trennen (B Bestand, A Abbruch, N Neubau, T temporär). Die Trennung macht Modelle schnell lesbar und erlaubt, Neubau und Abbruch gezielt ein- und auszublenden."
  fr: "Architecture du bâtiment – locaux, composants et aménagement dans une maquette, y compris surfaces utiles et volumes de locaux pour les justificatifs de surfaces. Séparer les maquettes par statut (E existant, D démolition, N neuf, T temporaire). La séparation rend les maquettes rapidement lisibles et permet d'afficher ou de masquer ce qui est neuf et ce qui est retiré."
  it: "Architettura dell'edificio – spazi, componenti e finiture in un modello, comprese superfici utili e volumi dei locali per le verifiche di superficie. Separare i modelli per stato (E esistente, D demolizione, N nuovo, T temporaneo). La separazione rende i modelli rapidamente comprensibili e permette di visualizzare o nascondere ciò che è nuovo e ciò che viene rimosso."
  en: "Building architecture – spaces, components, and fit-out in one deliverable, including usable areas and space volumes for area verification. Split models by status (E existing, D demolish, N new, T temporary). The split makes models readable at a glance and lets you toggle what is new versus what is removed."
