id: pragmaticbim:model/concrete-structure
code: BET
sort_order: 31
name:
  de: Betonbau
  fr: Béton armé
  it: Calcestruzzo
  en: Concrete
definition:
  de: Stahlbetontragwerk — Fundamente, Stützen, Wände, Decken und weitere tragende Betonbauteile. Fachmodelle nach Status trennen (B Bestand, A Abbruch, N Neubau, T temporär). Die Trennung macht Modelle schnell lesbar und erlaubt, Neubau und Abbruch gezielt ein- und auszublenden.
  fr: Ouvrage en béton armé — fondations, poteaux, murs, dalles et autres éléments porteurs en béton. Séparer les maquettes par statut (E existant, D démolition, N neuf, T temporaire). La séparation rend les maquettes rapidement lisibles et permet d'afficher ou de masquer ce qui est neuf et ce qui est retiré.
  it: Struttura in calcestruzzo armato — fondazioni, colonne, pareti, solette e altri elementi portanti in calcestruzzo. Separare i modelli per stato (E esistente, D demolizione, N nuovo, T temporaneo). La separazione rende i modelli rapidamente comprensibili e permette di visualizzare o nascondere ciò che è nuovo e ciò che viene rimosso.
  en: Reinforced-concrete structure — foundations, columns, walls, slabs, and other load-bearing concrete members. Split models by status (E existing, D demolish, N new, T temporary). The split makes models readable at a glance and lets you toggle what is new versus what is removed.
