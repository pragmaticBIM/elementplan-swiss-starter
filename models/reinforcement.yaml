id: pragmaticbim:model/reinforcement
code: BEW
sort_order: 34
name:
  de: Bewehrung
  fr: Armature
  it: Armatura
  en: Reinforcement
definition:
  de: Armierung für Ausführung — Stäbe, Lagen und Positionen gemäss Bewehrungsplanung, getrennt vom Betontragwerk. Fachmodelle nach Status trennen (B Bestand, A Abbruch, N Neubau, T temporär). Die Trennung macht Modelle schnell lesbar und erlaubt, Neubau und Abbruch gezielt ein- und auszublenden.
  fr: Armatures pour l'exécution — barres, nappes et positions selon le plan d'armature, distinctes de l'ouvrage en béton. Séparer les maquettes par statut (E existant, D démolition, N neuf, T temporaire). La séparation rend les maquettes rapidement lisibles et permet d'afficher ou de masquer ce qui est neuf et ce qui est retiré.
  it: Armatura per l'esecuzione — barre, strati e posizioni secondo il progetto delle armature, distinta dalla struttura in calcestruzzo. Separare i modelli per stato (E esistente, D demolizione, N nuovo, T temporaneo). La separazione rende i modelli rapidamente comprensibili e permette di visualizzare o nascondere ciò che è nuovo e ciò che viene rimosso.
  en: Reinforcement for execution — bars, layers, and positions according to the reinforcement design, separate from the concrete structure. Split models by status (E existing, D demolish, N new, T temporary). The split makes models readable at a glance and lets you toggle what is new versus what is removed.
