id: pragmaticbim:model/laboratory
code: LAB
sort_order: 17
name:
  de: Labor
  fr: Laboratoire
  it: Laboratorio
  en: Laboratory
definition:
  de: Laboreinrichtung und Speziallabor-Ausstattung — Geräte, Bänke und laborspezifische Einbauten. Fachmodelle nach Status trennen (B Bestand, A Abbruch, N Neubau, T temporär). Die Trennung macht Modelle schnell lesbar und erlaubt, Neubau und Abbruch gezielt ein- und auszublenden.
  fr: Équipements de laboratoire et aménagements spécialisés — appareils, paillasses et installations spécifiques. Séparer les maquettes par statut (E existant, D démolition, N neuf, T temporaire). La séparation rend les maquettes rapidement lisibles et permet d'afficher ou de masquer ce qui est neuf et ce qui est retiré.
  it: Attrezzature di laboratorio e allestimenti speciali — apparecchi, banchi e installazioni specifiche. Separare i modelli per stato (E esistente, D demolizione, N nuovo, T temporaneo). La separazione rende i modelli rapidamente comprensibili e permette di visualizzare o nascondere ciò che è nuovo e ciò che viene rimosso.
  en: Laboratory equipment and specialist lab fit-out — appliances, benches, and lab-specific installations. Split models by status (E existing, D demolish, N new, T temporary). The split makes models readable at a glance and lets you toggle what is new versus what is removed.
