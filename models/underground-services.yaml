id: pragmaticbim:model/underground-services
code: GRL
sort_order: 25
name:
  de: Grundleitung
  fr: Collecteurs
  it: Condotte interrate
  en: Underground services
definition:
  de: Grundleitungen und Kanalisation ausserhalb bzw. unter dem Gebäude — getrennt von der Sanitärinstallation. Fachmodelle nach Status trennen (B Bestand, A Abbruch, N Neubau, T temporär). Die Trennung macht Modelle schnell lesbar und erlaubt, Neubau und Abbruch gezielt ein- und auszublenden.
  fr: Collecteurs et canalisations enterrées hors ou sous le bâtiment — distincts des installations sanitaires. Séparer les maquettes par statut (E existant, D démolition, N neuf, T temporaire). La séparation rend les maquettes rapidement lisibles et permet d'afficher ou de masquer ce qui est neuf et ce qui est retiré.
  it: Condotte interrate e fognature fuori o sotto l'edificio — distinte dagli impianti sanitari. Separare i modelli per stato (E esistente, D demolizione, N nuovo, T temporaneo). La separazione rende i modelli rapidamente comprensibili e permette di visualizzare o nascondere ciò che è nuovo e ciò che viene rimosso.
  en: Underground drains and sewerage outside or under the building — separate from in-building plumbing. Split models by status (E existing, D demolish, N new, T temporary). The split makes models readable at a glance and lets you toggle what is new versus what is removed.
