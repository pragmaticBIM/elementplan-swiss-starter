id: pragmaticbim:model/earthworks
code: AUS
sort_order: 36
name:
  de: Aushub
  fr: Terrassement
  it: Scavi
  en: Earthworks
definition:
  de: Aushub und Erdbau — Abtrags- und Auffüllvolumen, getrennt von der Baugrubensicherung. Fachmodelle nach Status trennen (B Bestand, A Abbruch, N Neubau, T temporär). Die Trennung macht Modelle schnell lesbar und erlaubt, Neubau und Abbruch gezielt ein- und auszublenden.
  fr: Terrassement — volumes de déblai et de remblai, distincts du soutènement de fouille. Séparer les maquettes par statut (E existant, D démolition, N neuf, T temporaire). La séparation rend les maquettes rapidement lisibles et permet d'afficher ou de masquer ce qui est neuf et ce qui est retiré.
  it: Scavi e movimenti di terra — volumi di scavo e riporto, distinti dalle opere di sostegno. Separare i modelli per stato (E esistente, D demolizione, N nuovo, T temporaneo). La separazione rende i modelli rapidamente comprensibili e permette di visualizzare o nascondere ciò che è nuovo e ciò che viene rimosso.
  en: Excavation and earthworks — cut and fill volumes, separate from excavation-pit support. Split models by status (E existing, D demolish, N new, T temporary). The split makes models readable at a glance and lets you toggle what is new versus what is removed.
file_name:
