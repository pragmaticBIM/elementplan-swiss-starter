id: pragmaticbim:model/construction-logistics
code: BEL
sort_order: 19
name:
  de: Baustelleneinrichtung
  fr: Installation de chantier
  it: Installazione di cantiere
  en: Site setup
definition:
  de: "Baustelleneinrichtungsmodell mit Proxy-Volumen für Logistikphasen (Kran, Container, Lagerflächen u. a.) – ein Liefergegenstand je Logistikphase; der Dateiname enthält die Gültigkeit von–bis. Fachmodelle nach Status trennen (B Bestand, A Abbruch, N Neubau, T temporär). Die Trennung macht Modelle schnell lesbar und erlaubt, Neubau und Abbruch gezielt ein- und auszublenden."
  fr: "Maquette d'installation de chantier avec volumes proxy pour les phases logistiques (grue, container, surfaces de stockage, etc.) – un livrable par phase logistique ; le nom de fichier encode la validité du–au. Séparer les maquettes par statut (E existant, D démolition, N neuf, T temporaire). La séparation rend les maquettes rapidement lisibles et permet d'afficher ou de masquer ce qui est neuf et ce qui est retiré."
  it: "Modello di installazione di cantiere con volumi proxy per le fasi logistiche (gru, container, aree di stoccaggio, ecc.) – un risultato per fase logistica; il nome file contiene la validità da–a. Separare i modelli per stato (E esistente, D demolizione, N nuovo, T temporaneo). La separazione rende i modelli rapidamente comprensibili e permette di visualizzare o nascondere ciò che è nuovo e ciò che viene rimosso."
  en: "Site setup model with proxy volumes for logistics phases (crane, container, storage areas, etc.) – one deliverable per logistics phase; the filename encodes the validity from–to. Split models by status (E existing, D demolish, N new, T temporary). The split makes models readable at a glance and lets you toggle what is new versus what is removed."
